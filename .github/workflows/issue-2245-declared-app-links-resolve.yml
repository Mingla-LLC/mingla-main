name: issue-2245-declared-app-links-resolve
# issue #2245 [the app claims deep links it has no routes for].
#
# WHY THIS FILE EXISTS. #2245 shipped because a check asserted a path was
# DECLARED. The AASA was written "to match app.json intentFilters exactly" —
# checked against the other declaration file, never against the app — so four
# paths were claimed as verified Universal Links with nothing behind them.
#
# The repository already contained the check that should have caught it:
# `.github/scripts/strict-grep/__tests__/i-aasa-claims-match-native-routes.test.mjs`
# test (b), "every consumer-AASA claimed path is backed by a real expo-router
# route". It was green throughout, because it reads the host.usemingla.com AASA
# in `mingla-business/` and the dead claims lived in the APEX file in
# `mingla-marketing/`. That suite still runs (it is a `node --test` file under
# `.github/scripts/strict-grep/__tests__/`); this lane adds the one it could not
# do: EXECUTE the app's routing modules over every declared path and prove each
# lands on a destination that renders.
#
# NO JEST, SO NO BRACKET TRAP. The single invocation is `deno test` naming its
# file in full. (The trap: a jest pattern containing a bracketed route folder
# like `[eventId]` is read as a character class, matches nothing, and exits 0
# having run no tests — a green check carrying no information. `app-mobile/app/`
# is full of `[slug]` folders, so this was one careless pattern away.)
#
# Deno rather than node --test: `+native-intent.tsx` is TypeScript with a `.tsx`
# extension, which Node's type-stripping will not load. Same reason #2272 uses
# Deno for its native-intent lane.
#
# Path filters err BROAD over every layer that decides whether a declared path
# resolves — the two declaration files, the intent filters, the router entry
# point, the parser/executor, and the shell whose `switch (currentPage)` decides
# what actually renders. A revert of any of them must re-trigger this lane
# (the docs-only-CLOSE hazard).

on:
  pull_request:
    paths: &issue_2245_paths
      # The declarations themselves.
      - "mingla-marketing/public/.well-known/**"
      - "mingla-business/public/.well-known/**"
      - "app-mobile/app.json"
      # Every layer that decides where a declared path lands in the app.
      - "app-mobile/app/+native-intent.tsx"
      - "app-mobile/app/index.tsx"
      - "app-mobile/app/**"
      - "app-mobile/src/services/deepLinkService.ts"
      - "app-mobile/src/services/boardInviteService.ts"
      # This issue's suites, and the sibling suites that share the modules.
      - "scripts/issue-2245/**"
      - "app-mobile/src/services/__tests__/deepLinkRouting.orch1030.adversarial.test.ts"
      - "app-mobile/src/services/__tests__/orch-1080-sibling-routes-regression.test.ts"
      - ".github/workflows/issue-2245-declared-app-links-resolve.yml"
  push:
    branches: [main]
    paths: *issue_2245_paths
  workflow_dispatch:

permissions:
  contents: read

jobs:
  resolve:
    name: "#2245 every declared deep-link path resolves to a screen"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # THE ONE THAT MATTERS. Reads the claim list out of the apex AASA, the
      # host AASA and app.json's intent filters, then runs redirectSystemPath →
      # parseDeepLink → executeDeepLink over a concrete URL for each, and fails
      # on any that terminates somewhere the app cannot render. A claim with no
      # probe fails too, so a new claim cannot arrive unexercised. Its last test
      # is the non-vacuity control: an unbacked path MUST be reported dead by
      # the same code, or every assertion above is trivially true.
      - name: "#2245 declared app-link paths resolve"
        run: >-
          deno test --allow-read --no-check
          scripts/issue-2245/declared-app-links-resolve.deno.test.ts

      # The sibling suites that exercise the same parser/executor. Both existed
      # before #2245 and NEITHER was wired to any workflow or to
      # .github/ci-batch/MANIFEST.json — they have never run in CI. Wiring them
      # here is the #2245 fix for that: the ORCH-1030 suite is what pinned
      # `mingla://orders/abc → null`, the exact expectation this issue had to
      # move, and it would have moved silently.
      - name: "#2245 the deep-link parser/executor suites that were never wired to CI"
        run: >-
          deno test --allow-read --no-check
          app-mobile/src/services/__tests__/deepLinkRouting.orch1030.adversarial.test.ts
          app-mobile/src/services/__tests__/orch-1080-sibling-routes-regression.test.ts
