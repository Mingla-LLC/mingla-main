# Issue #1486 — the render suites that were excluded from the main run on the
# promise of a config no workflow invoked.
#
# `mingla-business/jest.config.cjs` excludes every `*.render.test.tsx` from the
# default suite, each exclusion commented with the config that "runs" it instead.
# 26 of those configs were invoked by nothing. This workflow is the other half of
# that sentence: it is where they actually run.
#
# ONE JOB ON PURPOSE. Sixteen suites at ~1-4s each is ~35s of jest; the cost of a
# GitHub job is checkout + `npm ci` + the render-dep install, roughly 3 minutes
# EACH. Sixteen jobs would have bought nothing and spent ~48 minutes per PR. The
# suites are also independent, so `if: always()` on every step means one red
# suite still reports the other fifteen instead of masking them behind a fail-fast.
#
# The standing rule (`.github/scripts/strict-grep/issue-1486-jest-config-invoked-by-workflow.mjs`,
# class A) is what stops this from rotting again: every non-helper jest config must
# be invoked by a workflow, and every "runs under X" hand-off in
# testPathIgnorePatterns must name a config CI actually runs. Adding a config
# without adding it here turns that gate red.
name: Issue #1486 Dormant Render Suites

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    # #2885 AC-4 — a pull request whose ONLY changed file is the machine-written
    # boot-payload baseline cannot affect this suite. Those recording PRs were
    # starting 53 jobs each, ~15/day (~51,000 job-min/month). `paths-ignore`
    # skips ONLY when nothing else changed: touch this file alongside anything
    # and this workflow runs exactly as it always did.
    paths-ignore:
      - "mingla-business/scripts/ci/bundle-baseline.json"
  workflow_dispatch:

concurrency:
  group: ci-issue-1486-dormant-render-suites-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-1486-dormant-render-suites:
    if: ${{ github.event.pull_request.draft != true }}
    name: "#1486 — dormant render suites (batched)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci

      # The RN-preset render configs mount real components through
      # react-test-renderer + @testing-library/react-native. Neither is a project
      # dependency (they are test-only and would bloat the app install), so they
      # are installed --no-save exactly as issue-874-business-analytics-tests.yml
      # already does. The web-render configs need react-native-web + react-dom,
      # which the app already depends on.
      #
      # BOTH VERSIONS ARE PINNED (#1834). `@testing-library/react-native` used to
      # be unpinned here, and an unpinned install of it is NOT deterministic
      # across environments: RTL v14 peer-depends on `test-renderer@^1`, whose
      # `react-reconciler@~0.33` peer-depends on `react@^19.2.0`, which this app's
      # pinned `react@19.1.0` does not satisfy. npm 10.8 (this runner) therefore
      # backtracks to 13.3.3, while npm >=10.9 (developer machines) overrides the
      # peer and installs 14.0.1 — a DIFFERENT renderer (`react-test-renderer` vs
      # `test-renderer`) with a different element tree. #1834's render suite was
      # written and proven against 14.0.1 locally and then failed all 12
      # assertions here on 13.3.3. Pinning to the version this job already
      # resolves keeps all 20 suites below on exactly the renderer they were
      # proven against and stops the tree drifting silently underneath them.
      # Bump this deliberately, with the suites re-run — never by deleting the pin.
      - name: Install render-only test dependencies
        run: npm install --no-save react-test-renderer@19.1.0 @testing-library/react-native@13.3.3

      # ---- gate first: a config added without a workflow fails here ---------
      - name: Jest-config-invoked-by-workflow gate self-test
        run: node ../.github/scripts/strict-grep/issue-1486-jest-config-invoked-by-workflow.mjs --self-test
      - name: Jest-config-invoked-by-workflow gate
        run: node ../.github/scripts/strict-grep/issue-1486-jest-config-invoked-by-workflow.mjs

      # ---- native (react-test-renderer + RTL) render proofs -----------------
      # ORCH-1118/1122 mount the REAL 2,260-line EditPublishedTripScreen. All
      # three were blocked by ONE stale line: their `jest.mock("../TripCreatorStep4Pricing")`
      # factory predates the screen's import of `makePackageKey`, so the mount threw
      # "makePackageKey is not a function". Nothing noticed for months, because
      # nothing ran them.
      - name: "ORCH-1118 — EditPublishedTripScreen Mapbox pickers + save gate"
        if: always()
        run: npx jest --config jest.orch1118.render.cjs --runInBand --ci
      - name: "ORCH-1122 — EditPublishedTripScreen cover dead-tap"
        if: always()
        run: npx jest --config jest.orch1122.render.cjs --runInBand --ci
      - name: "ORCH-1122 — CoverPickerSheet two-way close binding (adversarial)"
        if: always()
        run: npx jest --config jest.orch1122.adversarial.render.cjs --runInBand --ci
      - name: "#962 — pre-bank currency display render proof"
        if: always()
        run: npx jest --config jest.issue0962.render.cjs --runInBand --ci
      - name: "#962 R5 — KPI card hide render proof"
        if: always()
        run: npx jest --config jest.issue0962r5.render.cjs --runInBand --ci
      - name: "#1180 — BrandPayout adversarial render proof"
        if: always()
        run: npx jest --config jest.issue1180.render.cjs --runInBand --ci
      - name: "ORCH-1143 — LiveOfferingCard + upcoming de-dup render proofs"
        if: always()
        run: npx jest --config jest.orch1143.render.cjs --runInBand --ci
      - name: "ORCH-1147R2 — checkout selection all-in render proof"
        if: always()
        run: npx jest --config jest.orch1147r2.render.cjs --runInBand --ci
      - name: "ORCH-1152 — empty-cart currency crash render proof"
        if: always()
        run: npx jest --config jest.orch1152.render.cjs --runInBand --ci
      - name: "ORCH-1335 — RsvpStep5Setup chip-in bank banner render proof"
        if: always()
        run: npx jest --config jest.orch1335.render.cjs --runInBand --ci
      - name: "ORCH-1355 — RSVP wizard focus + toggle snapback render proofs"
        if: always()
        run: npx jest --config jest.orch1355.render.cjs --runInBand --ci
      - name: "#2737 — responsive reservation calendar happy render proof"
        if: always()
        run: npx jest --config jest.issue2737.render.cjs --runInBand --ci
      - name: "#2738 — public venue tab keyboard + semantic render proofs"
        if: always()
        run: npx jest --config jest.issue2738.render.cjs --runInBand --ci
      - name: "#2739 — public gallery thumbnail web control proofs"
        if: always()
        run: npx jest --config jest.issue2739.render.cjs --runInBand --ci
      - name: "#2774 — public hero content equivalence happy proofs"
        if: always()
        run: |
          npx jest --config jest.issue2774.render.cjs --runInBand --ci
          cd ../app-mobile
          npx jest --config jest.issue2774.render.cjs --runInBand --ci
      # ORCH-1331 guards the LIVE Nigeria partner Paystack onboarding form. Its
      # only other coverage (orch_1331_partner_paystack_ui.test.ts, 21 green) is a
      # SOURCE-TEXT pin — `expect(form).toContain('testID="…"')` — which proves the
      # string is in the file, not that the confirm-name state is reachable. This
      # is the only runtime proof of that state machine, on a money path.
      - name: "ORCH-1331 — NG partner Paystack onboarding state machine"
        if: always()
        run: npx jest --config jest.orch1331.render.cjs --runInBand --ci
      # #1834 guards the OTHER Nigerian bank form — the brand payout rail. The
      # account-number field sat under the keyboard + Done bar on both entry
      # routes because the screen owners wrapped it in a plain react-native
      # ScrollView. This suite mounts both screens and reads the scroll host
      # that actually owns the field off the mounted tree, so a revert of
      # either migration turns it red instead of passing on a source string.
      - name: "#1834 — NG brand bank field SmartScrollView host"
        if: always()
        run: npx jest --config jest.issue1834.render.cjs --runInBand --ci
      # #1863 guards the brand payments ROLE GATE on a money surface. An
      # under-privileged team member was shown balances, the tax tools, the
      # export and the Danger Zone "Disconnect Stripe" control, and the server
      # refused every call behind them with 403. This suite mounts the three
      # real ROUTE components (not the views — a view-only mount goes green with
      # all three routes unwrapped) and asserts, on the mounted tree, that a
      # denied role sees the explanation card and fires ZERO edge invocations
      # while an allowed role's surface is unchanged.
      - name: "#1863 — brand payments permission gate (routes, both rails)"
        if: always()
        run: npx jest --config jest.issue1863.render.cjs --runInBand --ci

      # #1890 [keyboard-clearance-overshoot] — Ari's composer is the second of the
      # four keyboard-compensating surfaces, and the only one whose lift was
      # blessed as correct by a source pin while overshooting by ~60 on glass.
      # This suite mounts the real AriChatScreen and reads the composer's
      # resolved paddingBottom off the mounted tree, so the arithmetic is proven
      # by execution rather than by the instrument that got it wrong.
      - name: "#1890 — Ari composer keyboard clearance"
        if: always()
        run: npx jest --config jest.issue1890.render.cjs --runInBand --ci
      - name: "#2726 — Restaurant Hub responsive system (native happy path)"
        if: always()
        run: npx jest --config jest.issue2726.render.cjs --runInBand --ci

      # ---- WEB render proofs -------------------------------------------------
      # react-test-renderer is structurally blind to react-native-web's atomic
      # classes, so these are the only suites in the repo that can catch a whole
      # class of buyer-web visual defect. Five of them were among the configs with
      # zero references anywhere in the repo.
      - name: "#1561 — venue first screen rendered CSS (web)"
        if: always()
        run: npx jest --config jest.issue1561.web.render.cjs --runInBand --ci
      - name: "ORCH-1190 — glass chrome full-width surface (web)"
        if: always()
        run: npx jest --config jest.orch1190.glasschrome.web.render.cjs --runInBand --ci
      - name: "ORCH-1190 R2 — BrandSwitch on-state colours (web)"
        if: always()
        run: npx jest --config jest.orch1190r2.web.render.cjs --runInBand --ci
      - name: "ORCH-1190 R2 — venue table card mobile width (web)"
        if: always()
        run: npx jest --config jest.orch1190r2.tablecard.web.render.cjs --runInBand --ci
      - name: "ORCH-1190 R2 — venue empty-state full width (web)"
        if: always()
        run: npx jest --config jest.orch1190r2.venuewidth.web.render.cjs --runInBand --ci
      - name: "ORCH-1190 R3 — venue empty-state full width, second wave (web)"
        if: always()
        run: npx jest --config jest.orch1190r3.venuewidth.web.render.cjs --runInBand --ci
      - name: "ORCH-1193 — sheet body scroll bounded (web)"
        if: always()
        run: npx jest --config jest.orch1193.sheetscroll.web.render.cjs --runInBand --ci
      - name: "ORCH-1211 — notification row web render safety"
        if: always()
        run: npx jest --config jest.orch1211.notifweb.render.cjs --runInBand --ci
      - name: "#2726 — Restaurant Hub responsive system (web happy path)"
        if: always()
        run: npx jest --config jest.issue2726.web.render.cjs --runInBand --ci
