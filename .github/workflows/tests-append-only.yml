name: Tests Append-Only

# This workflow now hosts ONE job: the main-health pregate ("Pre-merge: main is
# green", issue #2909), which refuses to certify a merge onto a red `main` and
# runs the Merge Certifier regression test.
#
# The test append-only gate this file was originally created for (ORCH-0840,
# job "Test files: append-only", plus its self-test and the ORCH-1383
# MANIFEST.json ratchet step) was RETIRED toward #3643 on 2026-10-26 by
# engineering and product (Taofeek and Seth): existing test files may now be
# edited or deleted in ordinary pull requests. The file path and `name:` are
# kept unchanged on purpose: scripts/ci/main-health.mjs and the #2909 wiring
# gate find the pregate by this workflow name, and the trigger below has no
# positive `paths:` filter, which the pregate relies on to start on every
# pull request.

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, Seth]
    # #2885 AC-4 — a pull request whose ONLY changed file is the machine-written
    # boot-payload baseline cannot affect this suite. Those recording PRs were
    # starting 53 jobs each, ~15/day (~51,000 job-min/month). `paths-ignore`
    # skips ONLY when nothing else changed: touch this file alongside anything
    # and this workflow runs exactly as it always did.
    paths-ignore:
      - "mingla-business/scripts/ci/bundle-baseline.json"
  push:
    branches: [Seth]

# ORCH-1383 — cancel a superseded PR run instead of letting it finish.
# Measured: 28 of 260 July strict-grep runs (10.8%) were superseded before finishing.
# The expression (not a bare `true`) is deliberate: cancelling a `push` to main would
# abandon the post-merge verification run for that commit. Guarding on pull_request
# recovers the PR-side waste while main runs always complete.
concurrency:
  group: ci-tests-append-only-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  # issue #2909 — the pre-merge gate learns to check `main`.
  #
  # On 2026-09-01 `main` was red for roughly two hours across three commits and
  # nobody found out. Three engineers merged onto it, one of them the
  # orchestrator immediately after an explicit approval, because the pre-merge
  # gate verified every check on the PULL REQUEST and never asked whether `main`
  # itself was healthy. A green PR on a red `main` is exactly what that gate
  # was built to certify, so it certified it.
  #
  # This job closes that. It lives in THIS workflow deliberately: this is the
  # only pull-request workflow with no positive `paths:` filter, so it starts on
  # every pull request. Hosting it in a paths-gated lane would reproduce the
  # class of hole it exists to close — a check that silently skips is worth what
  # a check that never existed is worth.
  #
  # It is a REPORTING check with the same strength every other gate here has:
  # it turns red, and the repository's own all-checks-green-before-merge rule
  # refuses the merge. It is in no ruleset, and putting it in one is out of
  # scope for #2909.
  #
  # `permissions:` is JOB-level on purpose. This workflow declares no
  # workflow-level `permissions:` key; keep it that way so any job added here
  # later does not silently inherit this job's token scope.
  main-health-pregate:
    # issue #2881 — every job of a draft-gated workflow carries the draft
    # condition, this one included. Opting out would leave one job running on
    # every draft push while the rest skip, which is the fan-out #2881 removed.
    # Safe here because this workflow already declares `ready_for_review` in its
    # trigger types, so the check re-fires and executes against the SHA that
    # actually merges rather than merging on a `skipped` conclusion.
    if: ${{ github.event.pull_request.draft != true }}
    name: "Pre-merge: main is green"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The fixture suite runs FIRST and needs no token: a snapshot reader whose
      # own logic is unproven can report a confident green it never measured.
      - name: "main-health self-test (regression guard)"
        run: node scripts/ci/main-health.mjs --self-test
      - name: "Merge Certifier state-totality regression"
        run: node --test scripts/ci/__tests__/issue-1865-merge-certifier.test.mjs
      - name: "Refuse to certify a merge onto a red main"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/main-health.mjs pregate
