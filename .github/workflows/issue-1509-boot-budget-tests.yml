name: "#1509: boot budget ratchet tests"

# Issue #1509 — regression cover for the boot-budget mechanism itself.
#
# The budget gate is the thing standing between a guest's first paint and
# whatever anyone eagerly imported this week. It was raised five times in four
# weeks because it was one hand-edited constant; #1509 replaced it with a
# machine-maintained baseline, a per-PR delta allowance, and a Seth-only product
# ceiling. This workflow keeps that mechanism honest.
#
# Two suites, deliberately attacking from different directions:
#   happy       — the mechanism does the right thing when used honestly, and a
#                 banked reduction really does tighten the next PR's allowance.
#   adversarial — the escape routes. Retired env overrides, hand-written
#                 baselines, a deleted baseline, an incompressible payload that
#                 is fine on raw bytes and terrible for the customer, plus a
#                 vacuity guard proving the gate can still fail at all.
#
# No `npm install` and no `expo export`: both suites drive the real scripts
# against synthetic export fixtures, so the whole thing runs in about a second.

on:
  pull_request:
    branches: [main]
    paths:
      - "mingla-business/scripts/ci/orch-1083-initial-bundle-budget.mjs"
      - "mingla-business/scripts/ci/bundle-budget-lib.mjs"
      - "mingla-business/scripts/ci/bundle-baseline-update.mjs"
      - "mingla-business/scripts/ci/bundle-baseline.json"
      - "mingla-business/scripts/ci/bundle-attribute.mjs"
      - "mingla-business/scripts/ci/__tests__/issue1509_*.mjs"
      - ".github/workflows/issue-1509-boot-budget-tests.yml"
      - ".github/workflows/bundle-baseline-ratchet.yml"
  push:
    branches: [main]
    paths:
      - "mingla-business/scripts/ci/**"
      - ".github/workflows/issue-1509-boot-budget-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boot-budget-tests:
    name: "#1509: boot budget ratchet tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Runs without an export, so a broken baseline or a dead check is caught
      # in seconds rather than at the end of the ten-minute web-build job.
      - name: Budget gate self-test
        working-directory: mingla-business
        run: node scripts/ci/orch-1083-initial-bundle-budget.mjs --self-test

      - name: Happy-path + adversarial suites
        working-directory: mingla-business
        run: |
          node --test \
            scripts/ci/__tests__/issue1509_boot_budget_ratchet.happy.test.mjs \
            scripts/ci/__tests__/issue1509_boot_budget_evasion.adversarial.test.mjs

      # The attribution tool answers issue #943 ("what is actually in the
      # 2.34 MB"). It is not wired into the export jobs — source maps roughly
      # double export time — so this at least proves it still parses and its
      # error path is honest rather than silently empty.
      - name: Attribution tool is runnable
        working-directory: mingla-business
        run: |
          set +e
          out=$(node scripts/ci/bundle-attribute.mjs --build /tmp/definitely-not-here 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ "$code" -eq 0 ]; then
            echo "bundle-attribute.mjs exited 0 on a missing build — it must fail loudly."
            exit 1
          fi
          echo "$out" | grep -q "No web export" || {
            echo "bundle-attribute.mjs did not explain the missing export."
            exit 1
          }
