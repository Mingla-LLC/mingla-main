name: Issue 2393 tester assertion and credential integrity

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/__tests__/issue_0873_guest_status_roster.test.sql"
      - "supabase/migrations/__tests__/issue_1821_accepted_email_sms_invites.test.sql"
      - "supabase/migrations/__tests__/orch_1270_tester_double_send.test.sql"
      - ".github/scripts/__tests__/issue-2393-valid-marketing-fixtures.test.mjs"
      - ".github/scripts/__tests__/issue-2393-assertion-credential.tester.test.mjs"
      - ".github/workflows/issue-2393-valid-marketing-test-fixtures.yml"
      - ".github/workflows/issue-2393-tester-assertion-credential.yml"
  pull_request:
    paths:
      - "supabase/migrations/__tests__/issue_0873_guest_status_roster.test.sql"
      - "supabase/migrations/__tests__/issue_1821_accepted_email_sms_invites.test.sql"
      - "supabase/migrations/__tests__/orch_1270_tester_double_send.test.sql"
      - ".github/scripts/__tests__/issue-2393-valid-marketing-fixtures.test.mjs"
      - ".github/scripts/__tests__/issue-2393-assertion-credential.tester.test.mjs"
      - ".github/workflows/issue-2393-valid-marketing-test-fixtures.yml"
      - ".github/workflows/issue-2393-tester-assertion-credential.yml"

permissions:
  contents: read

jobs:
  tester-integrity:
    name: "Issue 2393 independent assertion/credential guard"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: node --test .github/scripts/__tests__/issue-2393-assertion-credential.tester.test.mjs
