name: META-ORCH-1337 Social-Proof + Guest-List Tests

# META-ORCH-1337 [social-proof-guest-list] — CI registration of the META's
# regression suites (legs ORCH-1338 social-proof reads, ORCH-1339 momentum
# cross-entity + guest-privacy RPC, ORCH-1340 guest identity privacy /
# card-real-avatars, ORCH-1341 guest-list sheet, ORCH-1342 web see-who's-going
# funnel, plus the ORCH-1157 momentum suites REWRITTEN under
# [TEST-MOD-APPROVED ORCH-1340]).
#
# House pattern (per supabase-migrations-and-stripe-deno.yml): EXPLICIT file
# lists, never globs — a glob silently picks up unrelated pre-existing-red
# suites (the 5 known stale families: 1163-R3, 1157 round-8/9 T-7/T-8,
# 1150 T-10b/c, 1138 T5/E4 are deliberately NOT registered here) and a glob
# also silently DROPS a renamed suite. Every file below was verified GREEN on
# the registering branch before being listed.
#
# Path filters err BROAD (known hazard: a filter that misses a future edit
# silently skips the guard): they cover the guarded SOURCE trees, not just the
# test files — packages/offering-rendering (shared RSVP/social-proof bodies),
# app-mobile app/ + src/ (OneLink resolver/dispatcher, cold-seed service,
# guest-list sheet), mingla-business app/ + src/ (see-who's-going gate, funnel
# link builder, store-links SSOT), mingla-marketing/lib (the store-links SSOT
# byte-compare source), and supabase/migrations (the 1338/1339 SQL contracts).
#
# Pinning (COMMS-0087 lesson, binding): every tool is version-pinned —
# denoland/setup-deno@v1 pinned to deno 1.46.x (the repo-wide idiom), node 20,
# and jest resolved via `npm ci` from mingla-business/package-lock.json. No
# @latest, no unpinned installs.

on:
  push:
    branches: [Seth, main]
    paths:
      - "packages/offering-rendering/**"
      # issue #2468 — PublicVenueScreen (the venue page's maps target) lives in
      # brand-rendering, and the maps regression suites registered below guard
      # it. Path filters err BROAD here by house rule; a filter that misses a
      # future edit silently skips the guard.
      - "packages/brand-rendering/**"
      - "app-mobile/app/**"
      - "app-mobile/src/**"
      - "mingla-business/app/**"
      - "mingla-business/src/**"
      # issue #2508 — the shared offering-rendering barrel is jest-mocked here,
      # so a change to the mock can break every venue render suite this job
      # runs. Path filters err BROAD by this file's house rule.
      - "mingla-business/__manual_mocks__/**"
      - "mingla-marketing/lib/**"
      - "supabase/migrations/**"
      - ".github/workflows/meta-orch-1337-social-proof-tests.yml"
  pull_request:
    paths:
      - "packages/offering-rendering/**"
      # issue #2468 — PublicVenueScreen (the venue page's maps target) lives in
      # brand-rendering, and the maps regression suites registered below guard
      # it. Path filters err BROAD here by house rule; a filter that misses a
      # future edit silently skips the guard.
      - "packages/brand-rendering/**"
      - "app-mobile/app/**"
      - "app-mobile/src/**"
      - "mingla-business/app/**"
      - "mingla-business/src/**"
      # issue #2508 — the shared offering-rendering barrel is jest-mocked here,
      # so a change to the mock can break every venue render suite this job
      # runs. Path filters err BROAD by this file's house rule.
      - "mingla-business/__manual_mocks__/**"
      - "mingla-marketing/lib/**"
      - "supabase/migrations/**"
      - ".github/workflows/meta-orch-1337-social-proof-tests.yml"

# ORCH-1383 — cancel a superseded PR run instead of letting it finish.
# Measured: 28 of 260 July strict-grep runs (10.8%) were superseded before finishing.
# The expression (not a bare `true`) is deliberate: cancelling a `push` to main would
# abandon the post-merge verification run for that commit. Guarding on pull_request
# recovers the PR-side waste while main runs always complete.
concurrency:
  group: ci-meta-orch-1337-social-proof-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  meta-1337-deno-suites:
    name: "META-ORCH-1337: Deno suites — social-proof types/reads, momentum cross-entity, guest identity privacy, guest-privacy RPC, guest-list sheet, OneLink guest funnel (1338/1339/1340/1341/1342 + rewritten 1157)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - name: Run META-ORCH-1337 Deno suites
        env:
          # Inert defaults — these suites are source-contract tests (they read
          # SQL migration files + TS/TSX sources and assert structure); none
          # reaches a real Supabase instance. The defaults keep any env-var
          # presence guard in imported shared modules from throwing.
          SUPABASE_URL: "https://example-test.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key-not-real"
        run: |
          set -euo pipefail
          # EXPLICIT registry — verified GREEN on META-ORCH-1337-social-proof-guest-list
          # at registration (164 tests). Add new suites by appending a line; never glob.
          DENO_TEST_FILES=(
            # ORCH-1338 — SocialProofSummary / PeerGuestListPage typed contracts.
            packages/offering-rendering/__tests__/orch_1338_social_proof_types.test.ts
            # ORCH-1339 — momentum cross-entity (event/experience/trip) + tester adversarial.
            packages/offering-rendering/__tests__/orch_1339_momentum_cross_entity.test.ts
            packages/offering-rendering/__tests__/orch_1339_momentum_adversarial.test.ts
            # ORCH-1358 — momentum card top breathing room (marginTop:16 both twins).
            packages/offering-rendering/__tests__/orch_1358_card_spacing.test.ts
            # ORCH-1340 — guest identity privacy (card-real-avatars) + tester adversarial.
            packages/offering-rendering/__tests__/orch_1340_guest_identity_privacy.test.ts
            packages/offering-rendering/__tests__/orch_1340_guest_identity_privacy_adversarial.test.ts
            # ORCH-1157 — RSVP momentum, REWRITTEN for the cross-entity social-proof
            # direction under [TEST-MOD-APPROVED ORCH-1340] (supersedes the 1157 anon
            # invariant) + its adversarial sibling.
            packages/offering-rendering/__tests__/orch_1157_rsvp_momentum.test.ts
            packages/offering-rendering/__tests__/orch_1157_rsvp_momentum_adversarial.test.ts
            # ORCH-1338 — SQL contract: social-proof read fns (SECURITY DEFINER posture,
            # guard order, grants) + tester anti-scrape adversarial.
            supabase/migrations/__tests__/orch_1338_social_proof_reads.test.ts
            supabase/migrations/__tests__/orch_1338_social_proof_reads.antiScrape.adversarial.test.ts
            # ORCH-1339 — SQL contract: set_event_guest_privacy RPC (host gate, leaf-write
            # only, grants).
            supabase/migrations/__tests__/orch_1339_set_event_guest_privacy.test.ts
            # ORCH-1359 — SQL contract: identity-gated location on peer_list_event_guests
            # (named rows only, guard/whitelist preserved).
            supabase/migrations/__tests__/orch_1359_peer_guest_location.test.ts
            # ORCH-1359 — TESTER adversarial (mingla-tester): location is WELDED to
            # the identity gate (its CASE predicate === display_name's; isAnonymous
            # derives from the same predicate) so a private/blocked row can never
            # leak a city. Proven live on prod gqnoajqerqhnvulmnyvv 2026-07-11.
            supabase/migrations/__tests__/orch_1359_location_identity_weld.adversarial.test.ts
            # ORCH-1341 — consumer guest-list sheet (pinned header, no raw RN Modal) +
            # tester adversarial.
            app-mobile/src/components/__tests__/orch_1341_guest_list_sheet.test.ts
            app-mobile/src/components/__tests__/orch_1341_guest_list_sheet_adversarial.test.ts
            # ORCH-1359 — guest-row identity display: name-only + city + "Not on Mingla".
            app-mobile/src/components/__tests__/orch_1359_guest_sheet_identity.test.ts
            # ORCH-1359 (d) — tap-name → peer profile as a detail-local overlay (D-B).
            app-mobile/src/components/__tests__/orch_1359_guest_sheet_open_profile.test.ts
            # ORCH-1360 — guest-sheet friend-request lifecycle: confirm-before-add +
            # withdraw-a-sent-request + adversarial requestId targeting (multi-pending).
            app-mobile/src/components/__tests__/orch_1360_guest_sheet_friend_request_lifecycle.test.ts
            app-mobile/src/components/__tests__/orch_1360_friend_request_withdraw_targeting.adversarial.test.ts
            # ORCH-1342 — OneLink guest-funnel app side: cold /e/ seed landing, single
            # resolver parse, public event seed mapping.
            app-mobile/src/screens/Event/__tests__/orch_1342_cold_seed_landing.test.ts
            app-mobile/src/services/__tests__/oneLinkResolver.orch1342.test.ts
            app-mobile/src/services/__tests__/publicEventSeedService.orch1342.test.ts
            # issue #2468 [maps-deep-link-coordinates] + #2469
            # [explorer-venue-name-duplicated] — the maps deep-link regression
            # suites. Registered HERE, and not in a workflow of their own,
            # because #2148's CI registry pins `legacyOrigins` at exactly 199
            # and discovers origins from the filesystem: a new workflow file is
            # rejected as an unregistered origin, and registering it is rejected
            # as a 200th. Bumping that count means editing the governance
            # constant AND its append-only self-test, which is #2148's call, not
            # this issue's. This workflow already path-scopes every tree these
            # suites guard (offering-rendering, brand-rendering, app-mobile
            # src/+app/, mingla-business src/+app/) and already runs the
            # ORCH-1342 seed suite they build on.
            #
            # Named in FULL, one path per line — never a jest -t pattern or a
            # glob. A pattern containing a bracketed route segment matches ZERO
            # files and exits 0, which is the same unfalsifiable-gate class
            # these suites exist to close.
            packages/offering-rendering/__tests__/issue_2468_maps_deep_link.test.ts
            packages/offering-rendering/__tests__/issue_2468_maps_deep_link.tester_adversarial.test.ts
            app-mobile/src/services/__tests__/issue_2469_explorer_parsed_location.test.ts
            # issue #2508 [maps-app-chooser] — the "which map app?" chooser +
            # copy-address suite. Registered HERE for the SAME reason #2468 was
            # (see the note above): #2148's CI registry pins `legacyOrigins` at
            # exactly 199 and discovers origins from the filesystem, so a new
            # workflow file is rejected as an unregistered origin and
            # registering it is rejected as a 200th. This job already runs the
            # #2468 suites this one extends, and already path-scopes every tree
            # it guards. Named in FULL, one path per line — verified GREEN
            # (11 tests) on 2508-maps-chooser before registration.
            packages/offering-rendering/__tests__/issue_2508_maps_app_chooser.test.ts
          )
          for attempt in 1 2 3; do
            # issue #2469 — `publicEventSeedService.ts` (in DENO_TEST_FILES below)
            # now imports the SHARED venueName/address extractor from
            # packages/offering-rendering by relative path. Deno rejects a
            # subpath of a `file:` dependency and app-mobile's tsconfig forbids
            # `.ts` import extensions, so a relative extensionless specifier is
            # the only form all three of Deno, Metro and tsc accept — and Deno
            # needs this flag for it. The flag only RELAXES resolution; it
            # cannot break an import that already resolves.
            if deno test --allow-env --allow-net --allow-read --no-check --unstable-sloppy-imports "${DENO_TEST_FILES[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "META-ORCH-1337 Deno suites failed after 3 attempts (esm.sh flake?)"
              exit 1
            fi
            echo "META-ORCH-1337 Deno suites failed (attempt ${attempt}), retrying in 10s..."
            sleep 10
          done

      # issue #2468 — the privacy guard is the highest-severity line in the maps
      # change and the one a future edit is most likely to "simplify" away. This
      # asserts it independently of the suites above: present, AND still ahead of
      # the coordinate read, so a hidden-address event can never publish its
      # exact pin through a deep link.
      - name: "issue #2468: maps privacy guard is present and precedes the coordinate read"
        run: |
          set -euo pipefail
          src="packages/offering-rendering/mapsDeepLink.ts"
          test -f "$src" || { echo "issue-2468: $src is gone"; exit 1; }
          grep -q "if (params.addressHidden) return null;" "$src" || {
            echo "issue-2468 PRIVACY: the addressHidden guard is gone from $src."
            echo "A hidden-address event would publish its exact coordinate."
            exit 1
          }
          guard=$(grep -n "if (params.addressHidden) return null;" "$src" | head -1 | cut -d: -f1)
          geo=$(grep -n "normalizeMapsGeo(params.locationGeo)" "$src" | head -1 | cut -d: -f1)
          if [ -z "$geo" ] || [ "$guard" -ge "$geo" ]; then
            echo "issue-2468 PRIVACY: the guard (line ${guard}) must precede the"
            echo "locationGeo read (line ${geo:-<missing>}) in $src."
            exit 1
          fi
          echo "privacy guard line ${guard} precedes locationGeo read line ${geo}"

  meta-1337-business-jest-suites:
    name: "META-ORCH-1337: mingla-business jest suites — 1339 trip/experience guest privacy + 1342 see-who's-going gate, guest funnel link, download-CTA store-links SSOT"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
      # EXPLICIT registry — verified GREEN on META-ORCH-1337-social-proof-guest-list
      # at registration (63 tests). Add new suites by appending a path; never glob.
      - name: Run META-ORCH-1337 mingla-business jest suites
        run: >
          npx jest
          src/components/trip/__tests__/orch_1339_trip_guest_privacy.test.ts
          src/components/experience/__tests__/orch_1339_experience_guest_privacy.test.ts
          src/components/checkout/__tests__/orch_1342_download_cta_ssot.test.ts
          src/components/event/__tests__/orch_1342_see_whos_going_gate.test.tsx
          src/services/__tests__/orch_1342_guest_funnel_link.test.ts
          src/utils/__tests__/issue_2508_copy_address.test.ts
          src/components/event/__tests__/issue_2508_ended_offering_address.test.tsx
          --runInBand
