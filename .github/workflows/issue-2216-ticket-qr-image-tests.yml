name: issue-2216-ticket-qr-image
# #4063 supersedes the old public-QR contract while retaining this workflow's
# identity and manifest row: pass credentials exist only in signed-in Explorer.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths: &issue_2216_paths
      - "supabase/functions/_shared/ticketQrImage.ts"
      - "supabase/functions/_shared/qrcodeModule.d.ts"
      - "supabase/functions/_shared/ticketPdf.ts"
      - "supabase/functions/_shared/__tests__/ticketQrImage.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2216_*"
      - "supabase/functions/ticket-checkout-create/**"
      - "supabase/functions/ticket-checkout-confirm/**"
      - "supabase/functions/ticket-checkout-status/**"
      - "mingla-business/src/services/ticketCheckoutService.ts"
      - "mingla-business/src/components/checkout/CartContext.tsx"
      - "mingla-business/src/components/checkout/TicketQrCarousel.tsx"
      - "mingla-business/src/components/checkout/__tests__/issue_2216_*"
      - "mingla-business/src/hooks/useOrderRealtimeSubscription.ts"
      - "mingla-business/app/checkout/**"
      - "mingla-business/app/checkout-trip/**"
      - "mingla-business/app/checkout-experience/**"
      - ".github/scripts/strict-grep/i-2216-ticket-qr-server-rendered.mjs"
      - ".github/workflows/issue-2216-ticket-qr-image-tests.yml"
  push:
    branches: [main]
    paths: *issue_2216_paths
  workflow_dispatch:

concurrency:
  group: ci-issue-2216-ticket-qr-image-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-2216-edge-qr:
    if: ${{ github.event.pull_request.draft != true }}
    name: "#4063 Edge — public responses carry claims, not credentials"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: "#4063 public credential boundary tests"
        run: >-
          deno test --allow-env --allow-net --allow-read --no-check
          supabase/functions/_shared/__tests__/issue_2216_qr_image_never_silently_blank.test.ts
          supabase/functions/_shared/__tests__/ticketQrImage.test.ts
          supabase/functions/public-submit-rsvp/__tests__/issue_4063_w0_already_exists.implementor.happy.test.ts
          supabase/functions/rsvp-pass-fetch/__tests__/issue_1447_pass_boundary.tester_adversarial.test.ts
          supabase/functions/ticket-checkout-create/__tests__/issue_2136_free_checkout_contract.test.ts
          supabase/functions/ticket-checkout-create/__tests__/issue_2216_free_ticket_qr_image.test.ts
      - name: "#4063 changed edge functions type-check"
        run: |
          deno check supabase/functions/public-submit-rsvp/index.ts
          deno check supabase/functions/rsvp-pass-fetch/index.ts
          deno check supabase/functions/ticket-checkout-create/index.ts
          deno check supabase/functions/ticket-checkout-confirm/index.ts
          deno check supabase/functions/ticket-checkout-status/index.ts

  issue-2216-carousel:
    if: ${{ github.event.pull_request.draft != true }}
    name: "#4063 Client — public pages render claim-only confirmation"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install mingla-business deps
        working-directory: mingla-business
        run: npm ci
      - name: "#4063 public claim rendering contracts"
        working-directory: mingla-business
        run: >-
          npx jest --ci
          src/components/checkout/__tests__/issue_4063_static_claim_pages.test.ts
          src/components/checkout/__tests__/BuyerClaimCard.issue4063.test.tsx
          ../packages/offering-rendering/__tests__/issue_4063_rsvp_claim_popup.test.ts

  issue-2216-strict-grep:
    if: ${{ github.event.pull_request.draft != true }}
    name: "#4063 — i-4063-no-ticket-qr-off-explorer"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Self-test the #4063 gate
        run: node .github/scripts/strict-grep/i-2216-ticket-qr-server-rendered.mjs --self-test
      - name: Run the #4063 gate
        run: node .github/scripts/strict-grep/i-2216-ticket-qr-server-rendered.mjs
