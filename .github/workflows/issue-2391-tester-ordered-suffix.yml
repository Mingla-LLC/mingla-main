name: Issue #2391 tester ordered suffix integrity

on:
  pull_request:
    paths:
      - ".github/actions/migrated-postgres/**"
      - ".github/workflows/issue-2391-tester-ordered-suffix.yml"
  workflow_dispatch:

concurrency:
  group: ci-issue-2391-tester-ordered-suffix-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  ordered-suffix-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Corrupt applied manifests force full replay
        run: >-
          node --test
          .github/actions/migrated-postgres/__tests__/issue_2391_ordered_suffix_integrity.tester.test.mjs
