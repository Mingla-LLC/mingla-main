name: Issue #2391 tester ordered suffix integrity

on:
  pull_request:
    paths:
      - ".github/actions/migrated-postgres/**"
      - ".github/workflows/issue-2391-tester-ordered-suffix.yml"
  workflow_dispatch:

jobs:
  ordered-suffix-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Corrupt applied manifests force full replay
        run: >-
          node --test
          .github/actions/migrated-postgres/__tests__/issue_2391_ordered_suffix_integrity.tester.test.mjs
