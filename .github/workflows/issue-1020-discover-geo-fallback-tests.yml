# QUOTED name: an unquoted leading '#' would truncate the workflow name to "Issue".
name: "Issue 1020 discover geo-radius fallback"

# Explicit paths registry (NOT a glob). This repo has NO test auto-discovery —
# .test.sql / .test.ts run ONLY when a per-issue workflow names them, so the
# migration, ALL FOUR test files, the four edge-fn sources, and this workflow
# itself are enumerated so any touch of the #1020 surface re-gates the suite.
on:
  push:
    paths:
      - "supabase/migrations/20270117001020_issue_1020_discover_city_geo_fallback.sql"
      - "supabase/migrations/__tests__/issue_1020_discover_geo_fallback.test.sql"
      - "supabase/migrations/__tests__/issue_1020_discover_geo_fallback_adversarial_pg17.test.sql"
      - "supabase/functions/discover-merged-events/__tests__/issue_1020_geo_threading.test.ts"
      - "supabase/functions/discover-merged-events/__tests__/issue_1020_cache_key_geo.test.ts"
      - "supabase/functions/discover-merged-events/_business-query.ts"
      - "supabase/functions/discover-merged-events/_build-response.ts"
      - "supabase/functions/discover-merged-events/index.ts"
      - "supabase/functions/discover-merged-events/_cache.ts"
      - ".github/workflows/issue-1020-discover-geo-fallback-tests.yml"
      # #2148 — this suite now gets its database from a shared composite action;
      # without this path a change to that action would not re-run it.
      - ".github/actions/migrated-postgres/**"
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "supabase/migrations/20270117001020_issue_1020_discover_city_geo_fallback.sql"
      - "supabase/migrations/__tests__/issue_1020_discover_geo_fallback.test.sql"
      - "supabase/migrations/__tests__/issue_1020_discover_geo_fallback_adversarial_pg17.test.sql"
      - "supabase/functions/discover-merged-events/__tests__/issue_1020_geo_threading.test.ts"
      - "supabase/functions/discover-merged-events/__tests__/issue_1020_cache_key_geo.test.ts"
      - "supabase/functions/discover-merged-events/_business-query.ts"
      - "supabase/functions/discover-merged-events/_build-response.ts"
      - "supabase/functions/discover-merged-events/index.ts"
      - "supabase/functions/discover-merged-events/_cache.ts"
      - ".github/workflows/issue-1020-discover-geo-fallback-tests.yml"
      # #2148 — this suite now gets its database from a shared composite action;
      # without this path a change to that action would not re-run it.
      - ".github/actions/migrated-postgres/**"

concurrency:
  group: ci-issue-1020-discover-geo-fallback-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  # ---------------------------------------------------------------------------
  # PG17 proof — the REAL runtime proof that the public.-qualified geo predicate
  # resolves under SET search_path='' (supabase/postgres ships PostGIS in public).
  # Applies EVERY migration in sorted order, then runs BOTH .test.sql files:
  # the implementor happy-path and the tester adversarial.
  # ---------------------------------------------------------------------------
  issue-1020-pg17:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Issue 1020 geo-radius fallback proof (PG17)"
    runs-on: ubuntu-latest
    # #2148 — the `services:` block that used to live here is gone. A service
    # container is started by the runner BEFORE any step runs, so nothing can
    # place a pre-migrated data directory into it; owning the container from a
    # step is what makes the cached snapshot possible. It still listens on
    # localhost:5432 with the same password, so every step below is unchanged.
    steps:
      - uses: actions/checkout@v4
      # #2148 — replaces this job's postgres bring-up: a service container plus a
      # full replay of every migration (MEASURED ~75s boot + ~105s replay). The
      # shared action restores a cached snapshot of the already-migrated cluster
      # and applies only what landed since, falling back to a full replay on any
      # doubt. It verifies policy/trigger/index/RLS counts against the snapshot's
      # build-time manifest before any test runs.
      - name: PostgreSQL 17 with every migration applied
        uses: ./.github/actions/migrated-postgres
        with:
          # Pinned at the call site, not inherited from the action default, so this
          # workflow still states the database it certifies against.
          image: supabase/postgres:17.4.1.075
          password: ${{ format('issue-1020-ci-{0}', github.run_id) }}
      - name: Execute issue 1020 geo-fallback proof (implementor happy-path)
        env:
          PGPASSWORD: ${{ format('issue-1020-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1020_discover_geo_fallback.test.sql
      - name: Execute issue 1020 geo-fallback proof (tester adversarial)
        env:
          PGPASSWORD: ${{ format('issue-1020-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1020_discover_geo_fallback_adversarial_pg17.test.sql

  # ---------------------------------------------------------------------------
  # Deno proof — pinned to the CI-canonical 1.46.x. Runs BOTH .test.ts files:
  # the implementor edge-fn threading test and the tester cache-key sentinel.
  # ---------------------------------------------------------------------------
  issue-1020-deno:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Issue 1020 edge-fn threading + cache-key (Deno 1.46)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "1.46.x"
      - name: Run edge-fn threading + cache-key tests
        run: >-
          deno test --allow-read --allow-env
          supabase/functions/discover-merged-events/__tests__/issue_1020_geo_threading.test.ts
          supabase/functions/discover-merged-events/__tests__/issue_1020_cache_key_geo.test.ts
