# Issue #679 [follow-a-brand] — Follow a Brand v1 (Wave 0 of #876).
#
# WHY THIS WORKFLOW EXISTS — two dark-suite traps this closes (1503 pattern):
#
#  1. `mingla-business/jest.config.cjs` has `rootDir` = mingla-business, so
#     NOTHING under `packages/**/__tests__` is ever swept by the default suite.
#     The two ORCH-1155 brand-page suites ran in NO CI job at all (#679
#     investigation D-1 — including the old fabricated-Follow ban). This job
#     resurrects them into CI alongside the new #679 follow-gate suites.
#
#  2. The `brand_follows` migration's owner-only RLS / no-update / no-brand-read
#     contract (I-PROPOSED-679-FOLLOW-OWNER-ONLY-RLS) is pinned by a Deno
#     static test that would otherwise also be a dead letter.
#
# WHY THE SOURCE PATHS ARE IN THE TRIGGER (not only the test paths): a PR that
# REVERTS the fix touches the SOURCE file. If the trigger listed only test
# files, a revert PR would not run this gate and would merge GREEN-by-omission
# (the #1027 lesson).
#
# Invokes no `.mjs` under `.github/scripts/strict-grep/`, so MANIFEST.json
# totality and parity counters are untouched.
#
# NOT a required check — it reports, it does not gate.

name: Issue #679 Brand follow

on:
  push:
    branches: [main]
    paths:
      # ---- source (a revert here MUST run the gate) ----
      - "packages/brand-rendering/PublicBrandPage.tsx"
      - "packages/brand-rendering/types.ts"
      - "supabase/migrations/20270305000679_issue_679_brand_follows.sql"
      - "app-mobile/src/screens/ConsumerBrandProfileScreen.tsx"
      - "app-mobile/src/services/brandFollowsService.ts"
      - "app-mobile/src/hooks/useBrandFollow.ts"
      # ---- tests + harness ----
      - "packages/brand-rendering/__tests__/orch_1155_brand_redesign.test.tsx"
      - "packages/brand-rendering/__tests__/orch_1155_brand_redesign.adversarial.test.tsx"
      - "packages/brand-rendering/__tests__/issue_679_follow_gate.test.tsx"
      - "packages/brand-rendering/__tests__/issue_679_follow_gate.adversarial.render.test.tsx"
      - "supabase/migrations/__tests__/issue_679_brand_follows.test.ts"
      - "mingla-business/jest.issue679.cfg.cjs"
      - ".github/workflows/issue-679-brand-follow-tests.yml"
  pull_request:
    paths:
      - "packages/brand-rendering/PublicBrandPage.tsx"
      - "packages/brand-rendering/types.ts"
      - "supabase/migrations/20270305000679_issue_679_brand_follows.sql"
      - "app-mobile/src/screens/ConsumerBrandProfileScreen.tsx"
      - "app-mobile/src/services/brandFollowsService.ts"
      - "app-mobile/src/hooks/useBrandFollow.ts"
      - "packages/brand-rendering/__tests__/orch_1155_brand_redesign.test.tsx"
      - "packages/brand-rendering/__tests__/orch_1155_brand_redesign.adversarial.test.tsx"
      - "packages/brand-rendering/__tests__/issue_679_follow_gate.test.tsx"
      - "packages/brand-rendering/__tests__/issue_679_follow_gate.adversarial.render.test.tsx"
      - "supabase/migrations/__tests__/issue_679_brand_follows.test.ts"
      - "mingla-business/jest.issue679.cfg.cjs"
      - ".github/workflows/issue-679-brand-follow-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  brand-follow:
    name: Brand follow (1155 resurrection + follow gate + RLS pin)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json

      - name: Install Business dependencies
        run: npm ci

      # Both ORCH-1155 brand-page suites (resurrected — D-1) + the #679
      # follow-gate suites, through the web-resolved harness.
      - name: "Brand page suites — 1155 honesty guards + #679 follow gate"
        run: npx jest --config jest.issue679.cfg.cjs --runInBand

      # The brand_follows migration contract pin (owner-only RLS, no update
      # path, no brand-side read). House Deno pin, repo root.
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"

      - name: "brand_follows migration static pin (Deno)"
        working-directory: .
        run: >-
          deno test --allow-read
          supabase/migrations/__tests__/issue_679_brand_follows.test.ts
