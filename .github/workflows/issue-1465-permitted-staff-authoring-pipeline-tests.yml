# #2439 SHADOW-PARITY-TRIGGER — remove before cutover
name: Issue 1465 permitted staff authoring pipeline

on:
  pull_request:
    paths:
      - "supabase/functions/run-business-place-authoring-pipeline/**"
      - ".github/workflows/issue-1465-permitted-staff-authoring-pipeline-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/run-business-place-authoring-pipeline/**"
      - ".github/workflows/issue-1465-permitted-staff-authoring-pipeline-tests.yml"

jobs:
  permitted-staff-brand-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Executable authority and venue-binding proof
        run: >-
          deno test --allow-env --allow-net
          supabase/functions/run-business-place-authoring-pipeline/__tests__/issue_1465_permitted_staff_brand_gate.test.ts
      - name: Source contract
        run: |
          grep -q 'biz_brand_effective_rank' supabase/functions/run-business-place-authoring-pipeline/index.ts
          grep -q 'RANK_EVENT_MANAGER = 40' supabase/functions/run-business-place-authoring-pipeline/index.ts
          if grep -q 'brand.account_id !== userId' supabase/functions/run-business-place-authoring-pipeline/index.ts; then
            echo 'owner-only venue authoring gate returned' >&2
            exit 1
          fi
