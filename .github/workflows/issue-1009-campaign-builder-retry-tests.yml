# #2437 SHADOW-PARITY-TRIGGER — remove before cutover
name: ISSUE-1009 Campaign Builder Retry Tests

# ISSUE-1009 [campaign-builder partial-failure retry lockout] — explicit CI
# registration for both required, independent regression suites. The implementor
# happy-path suite exercises the real StepReview component through Vite and the
# parent completion wiring. The tester suite attacks boundary/negative-space
# cases from a separate angle. Neither test may become a dark local-only proof.

on:
  push:
    branches: [main]
    paths:
      - "mingla-admin/src/pages/CampaignBuilderPage.jsx"
      - "mingla-admin/src/components/campaign-builder/StepReview.jsx"
      - "mingla-admin/src/lib/adBuilder/createProgress.js"
      - "mingla-admin/src/__tests__/issue1009_retry_lockout.test.js"
      - "mingla-admin/src/__tests__/issue1009_retry_lockout.tester_adversarial.test.js"
      - ".github/workflows/issue-1009-campaign-builder-retry-tests.yml"
  pull_request:
    paths:
      - "mingla-admin/src/pages/CampaignBuilderPage.jsx"
      - "mingla-admin/src/components/campaign-builder/StepReview.jsx"
      - "mingla-admin/src/lib/adBuilder/createProgress.js"
      - "mingla-admin/src/__tests__/issue1009_retry_lockout.test.js"
      - "mingla-admin/src/__tests__/issue1009_retry_lockout.tester_adversarial.test.js"
      - ".github/workflows/issue-1009-campaign-builder-retry-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-1009-admin-node-test:
    name: "ISSUE-1009: campaign-builder partial-failure retry (admin node:test)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mingla-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-admin/package-lock.json
      - name: Install admin dependencies for the Vite component-runtime probe
        run: npm ci
      - name: Run ISSUE-1009 implementor and tester suites explicitly
        run: >
          node --test
          src/__tests__/issue1009_retry_lockout.test.js
          src/__tests__/issue1009_retry_lockout.tester_adversarial.test.js
