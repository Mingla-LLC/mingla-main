name: ISSUE-1348 iCloud Video Patch Tests

# Standalone gate for the #1348 A2 native fix (patch-package). Lives in its OWN
# workflow file — NOT a `.github/scripts/strict-grep/*.mjs` — so it needs no
# MANIFEST.json registration and cannot collide with in-flight strict-grep
# counters/parity (same isolation pattern the Framework Major Guard uses on
# purpose).
#
# Protective invariant (I-PROPOSED-1348-EXPO-PICKER-VIDEO-ICLOUD-NETWORK-ACCESS):
# expo-image-picker VIDEO writeData MUST set isNetworkAccessAllowed=true (#1348).
# `options: nil` defaults it false and iCloud-optimized ("Optimize iPhone
# Storage") videos fail PHPhotosErrorDomain 3164 (networkAccessRequired) at pick
# time — sealed by the device syslog: assetsd refuses the original vid-prim/org
# resource instantly (0.006s). The fix is a source patch, applied by
# patch-package via the `postinstall` hook on every `npm ci` (dev, CI, and the
# EAS install phase, BEFORE `pod install` copies the Swift into the Xcode
# project). This is a native Swift change — NOT OTA-able; it rides the next EAS
# build. This gate proves the patch is present + applies cleanly + patches the
# installed Swift at BOTH video writeData sites. Fails-on-revert: deleting the
# patch, removing `postinstall`/the devDep, or reverting the Swift each turns
# this gate red.

on:
  push:
    branches: [main, "1348-icloud-video-native-patch"]
    paths:
      - "mingla-business/patches/expo-image-picker+17.0.11.patch"
      - "mingla-business/package.json"
      - "mingla-business/package-lock.json"
      - ".github/workflows/issue-1348-icloud-video-patch-tests.yml"
  pull_request:
    paths:
      - "mingla-business/patches/expo-image-picker+17.0.11.patch"
      - "mingla-business/package.json"
      - "mingla-business/package-lock.json"
      - ".github/workflows/issue-1348-icloud-video-patch-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  icloud-video-patch:
    name: "issue-1348 iCloud video patch present + applied"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Step 1: `npm ci` itself proves `postinstall` -> patch-package applies.
      # GitHub Actions sets CI=true, so patch-package auto-enables --error-on-fail:
      # a silent unpatch (version drift, bad patch) makes this step exit non-zero.
      - name: Install mingla-business deps (runs postinstall -> patch-package)
        working-directory: mingla-business
        run: npm ci

      # Step 2: the committed patch file must exist.
      - name: Assert patch file present
        run: |
          FILE=mingla-business/patches/expo-image-picker+17.0.11.patch
          if [ ! -f "$FILE" ]; then
            echo "MISSING: $FILE — the #1348 iCloud video patch is not committed."
            exit 1
          fi
          echo "OK: $FILE present"

      # Step 3: package.json must wire the patch (postinstall script + devDep).
      - name: Assert package.json postinstall + patch-package devDependency
        run: |
          node -e "
            const p = require('./mingla-business/package.json');
            if (p.scripts?.postinstall !== 'patch-package') {
              console.error('FAIL: mingla-business/package.json scripts.postinstall must equal \"patch-package\", got:', p.scripts?.postinstall);
              process.exit(1);
            }
            if (!p.devDependencies?.['patch-package']) {
              console.error('FAIL: mingla-business/package.json devDependencies must include patch-package');
              process.exit(1);
            }
            console.log('OK: postinstall=\"patch-package\" and patch-package devDependency present (' + p.devDependencies['patch-package'] + ')');
          "

      # Step 4: the patch must apply with no fuzz against the pinned source.
      - name: Assert patch applies cleanly (--error-on-fail)
        working-directory: mingla-business
        run: npx patch-package --error-on-fail

      # Step 5: the INSTALLED Swift must carry the fix at BOTH video writeData
      # sites (handleVideo(mediaInfo:) + handleVideo(from:)) and neither may
      # still read `options: nil`. The LivePhoto path (photoResource/videoResource)
      # is intentionally out of scope for #1348 and is not asserted here.
      - name: Assert installed MediaHandler.swift is patched at both video sites
        run: |
          FILE=mingla-business/node_modules/expo-image-picker/ios/MediaHandler.swift
          if [ ! -f "$FILE" ]; then
            echo "FAIL: $FILE missing after install"
            exit 1
          fi
          net_count=$(grep -c 'isNetworkAccessAllowed = true' "$FILE" || true)
          if [ "$net_count" != "2" ]; then
            echo "FAIL: expected 2 'isNetworkAccessAllowed = true' (one per video writeData site), got $net_count"
            exit 1
          fi
          opt_count=$(grep -c 'options: resourceOptions' "$FILE" || true)
          if [ "$opt_count" != "2" ]; then
            echo "FAIL: expected 2 'options: resourceOptions' (both video writeData sites patched), got $opt_count"
            exit 1
          fi
          if grep -q 'writeData(for: resource, toFile: destinationUrl, options: nil)' "$FILE"; then
            echo "FAIL: a video writeData site still reads 'options: nil' — iCloud videos will fail PHPhotosErrorDomain 3164"
            exit 1
          fi
          echo "OK: both video writeData sites set isNetworkAccessAllowed=true (options: resourceOptions); no video site reads options: nil"
