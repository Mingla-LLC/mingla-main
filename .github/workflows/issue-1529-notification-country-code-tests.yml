# QUOTED name: an unquoted leading '#' would truncate the workflow name to "Issue".
name: "Issue #1529 notification country_code"

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20270211001529_issue_1529_notification_country_code.sql"
      - "supabase/migrations/__tests__/issue_1529_e164_parity.test.sql"
      - "supabase/migrations/__tests__/issue_1529_producer_catalog_audit.test.sql"
      - "supabase/migrations/__tests__/issue_1529_producer_country_code.test.sql"
      - "supabase/migrations/__tests__/issue_1529_policy_skip_not_failure.test.sql"
      - "supabase/migrations/__tests__/issue_1529_tester_adversarial.test.sql"
      - "supabase/functions/_shared/adapters/smsAdapter.issue1529.test.ts"
      - "supabase/functions/_shared/adapters/smsAdapter.issue1529.tester.adversarial.test.ts"
      - "supabase/functions/_shared/e164Country.ts"
      - "supabase/functions/_shared/e164Country.issue1529.test.ts"
      - "supabase/functions/_shared/adapters/smsAdapter.ts"
      - "supabase/functions/_shared/notifyV2.ts"
      - "supabase/functions/notify-dispatch/index.ts"
      - "supabase/functions/notify-outbox-drain/index.ts"
      - "supabase/functions/notify-outbox-drain/issue1529.sourceCountry.test.ts"
      - "supabase/functions/marketing-send/index.ts"
      - ".github/workflows/issue-1529-notification-country-code-tests.yml"
  pull_request:
    paths:
      - "supabase/migrations/20270211001529_issue_1529_notification_country_code.sql"
      - "supabase/migrations/__tests__/issue_1529_e164_parity.test.sql"
      - "supabase/migrations/__tests__/issue_1529_producer_catalog_audit.test.sql"
      - "supabase/migrations/__tests__/issue_1529_producer_country_code.test.sql"
      - "supabase/migrations/__tests__/issue_1529_policy_skip_not_failure.test.sql"
      - "supabase/migrations/__tests__/issue_1529_tester_adversarial.test.sql"
      - "supabase/functions/_shared/adapters/smsAdapter.issue1529.test.ts"
      - "supabase/functions/_shared/adapters/smsAdapter.issue1529.tester.adversarial.test.ts"
      - "supabase/functions/_shared/e164Country.ts"
      - "supabase/functions/_shared/e164Country.issue1529.test.ts"
      - "supabase/functions/_shared/adapters/smsAdapter.ts"
      - "supabase/functions/_shared/notifyV2.ts"
      - "supabase/functions/notify-dispatch/index.ts"
      - "supabase/functions/notify-outbox-drain/index.ts"
      - "supabase/functions/notify-outbox-drain/issue1529.sourceCountry.test.ts"
      - "supabase/functions/marketing-send/index.ts"
      - ".github/workflows/issue-1529-notification-country-code-tests.yml"

permissions:
  contents: read

concurrency:
  group: ci-issue-1529-notification-country-code-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  # -------------------------------------------------------------------------
  # Deno side: the shared derivation helper, its SQL-parity suite, the
  # source-refund drain behaviour, and — critically — the #1518 suites, which
  # must stay green UNMODIFIED. #1529 touches shared notification code, so
  # every smsAdapter contract is re-verified here rather than assumed.
  # -------------------------------------------------------------------------
  issue-1529-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - name: Type-check every function touched by #1529
        run: |
          deno check \
            supabase/functions/_shared/e164Country.ts \
            supabase/functions/_shared/adapters/smsAdapter.ts \
            supabase/functions/_shared/notifyV2.ts \
            supabase/functions/notify-dispatch/index.ts \
            supabase/functions/notify-outbox-drain/index.ts \
            supabase/functions/marketing-send/index.ts
      - name: Prove the derivation contract, adapter routing, and the refund-path skip
        run: |
          deno test --allow-env --allow-net --allow-read --no-check \
            supabase/functions/_shared/e164Country.issue1529.test.ts \
            supabase/functions/_shared/adapters/smsAdapter.issue1529.test.ts \
            supabase/functions/notify-outbox-drain/issue1529.sourceCountry.test.ts
      # TESTER ADVERSARIAL (T-6). Sweeps the routing PROPERTY rather than the
      # named examples, runs the hostile derivation fixtures against the SQL
      # twin's expectations, and attacks the money path with a stale country
      # label. Kept as its own step so a failure here is unambiguously the
      # adversarial contract and not the implementor's happy path.
      - name: Prove the routing invariants adversarially (tester T-6)
        run: |
          deno test --allow-env --allow-net --allow-read --no-check \
            supabase/functions/_shared/adapters/smsAdapter.issue1529.tester.adversarial.test.ts
      # #1518's channel contract is NOT relaxed by #1529. The routing INPUT
      # changed (destination number, not label); the NG channel, the Twilio
      # parameter shape, and the fail-closed contract are untouched.
      - name: Prove #1518's channel and fail-closed contracts still hold
        run: |
          deno test --allow-env --allow-net --allow-read --no-check \
            supabase/functions/_shared/adapters/smsAdapter.issue1518.test.ts \
            supabase/functions/_shared/adapters/smsAdapter.issue1518.adversarial.test.ts \
            supabase/functions/__tests__/orch_1161_notify_dispatch_v2.test.ts

  # -------------------------------------------------------------------------
  # SQL side: apply every migration into a real Supabase Postgres 17 and prove
  # the producers actually write the country, that the derivation helpers agree
  # with their TypeScript twin, and that the catalog-driven producer audit
  # cannot pass vacuously.
  # -------------------------------------------------------------------------
  postgres-17-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ format('issue-1529-ci-{0}', github.run_id) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PostgreSQL 17
        env:
          PGPASSWORD: ${{ format('issue-1529-ci-{0}', github.run_id) }}
        run: |
          for i in {1..90}; do
            if psql -h localhost -U postgres -d postgres -Atc \
              "SELECT to_regnamespace('vault') IS NOT NULL AND to_regrole('supabase_admin') IS NOT NULL" \
              2>/dev/null | grep -qx t; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      # -----------------------------------------------------------------------
      # #1529 P1-2 — PROVISION THE GoTrue-MANAGED auth.users COLUMNS.
      #
      # `auth.users` in this image is the pre-GoTrue stub: 21 columns and NO
      # `phone`. Production's is GoTrue-managed and HAS `phone`, which is why
      # `issue_1389_enqueue_stay_event` (it reads `user_row.phone`) works in
      # production and dies here. Without this step the Stay producer cannot be
      # exercised in CI AT ALL, and SC-2/SC-3 — the claim that Nigerian Stay
      # texts become deliverable and correctly labelled, the headline claim of
      # this whole issue — have zero executed proof anywhere.
      #
      # It cannot be done from the test: `postgres` is not a superuser in this
      # image, `auth.users` is owned by `supabase_auth_admin`, and all three
      # escape hatches are closed (ALTER → "must be owner"; SET ROLE →
      # "permission denied"; GRANT → "role memberships are reserved"). So it is
      # done here, from OUTSIDE the unprivileged connection, via the container's
      # own superuser over its local socket.
      #
      # The step VERIFIES the outcome through the same unprivileged connection
      # the tests use, and FAILS if the column is not visible. A silently
      # skipped provisioning step would put us straight back to an unexecutable
      # Nigeria-critical test, which is the defect being fixed.
      # -----------------------------------------------------------------------
      - name: Provision GoTrue-managed auth.users columns (privileged)
        env:
          PGPASSWORD: ${{ format('issue-1529-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          DDL="ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS phone text;"

          # `supabase_admin` is the image's bootstrap SUPERUSER and its password
          # is the same POSTGRES_PASSWORD this job already uses, so the DDL runs
          # over the ordinary TCP connection — no `docker exec`, no dependence
          # on `docker ps --filter ancestor`, and no dependence on an OS user
          # inside the container.
          #
          # TESTER NOTE (#1529): the original form of this step shelled into the
          # container and tried `psql -U supabase_admin` over the LOCAL SOCKET
          # with no password. That fails on the stock image — pg_hba grants
          # `trust` for local/127.0.0.1 but the connection still prompts
          # ("fe_sendauth: no password supplied"), and the one route that does
          # connect (`-U postgres`) is not the owner of auth.users, so its ALTER
          # is refused. All three routes failed, `provisioned` stayed 0, and the
          # step exited 1 BEFORE migrations were applied — which would have
          # aborted postgres-17-runtime at step 1 of 6 and made the five SQL
          # steps unreachable. Verified against supabase/postgres:17.4.1.075.
          psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "$DDL"

          # Verify through the UNPRIVILEGED connection the tests actually use.
          # This is the assertion that matters: provisioning the tests cannot
          # see is not provisioning.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc \
            "select 1 from information_schema.columns
              where table_schema='auth' and table_name='users'
                and column_name='phone'" | grep -qx 1
          echo "auth.users.phone is visible to the test connection"
      - name: Apply all migrations
        env:
          PGPASSWORD: ${{ format('issue-1529-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 \
            | sort -z \
            | while IFS= read -r -d '' migration; do
                psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
              done
      - name: Prove SQL and TypeScript derive the same country from the same fixtures
        env:
          PGPASSWORD: ${{ format('issue-1529-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1529_e164_parity.test.sql
      - name: Prove every notification_outbox producer decides a country
        env:
          PGPASSWORD: ${{ format('issue-1529-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1529_producer_catalog_audit.test.sql
      - name: Prove the producers actually write the country, by firing them
        env:
          PGPASSWORD: ${{ format('issue-1529-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1529_producer_country_code.test.sql
      - name: Prove a policy skip never escalates a refund to needs_review
        env:
          PGPASSWORD: ${{ format('issue-1529-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1529_policy_skip_not_failure.test.sql
      # TESTER ADVERSARIAL (T-6), SQL half. Completeness UNDER EXEMPTION (the
      # source-refund producer that legitimately derives its country at the
      # drain must EARN that exemption by being provably invisible to the
      # generic claim RPC), hostile derivation fixtures shared with the
      # TypeScript twin, idempotency-key invariance under the column addition,
      # and the two money-path negative controls the implementor's suite does
      # not carry (an ambiguous acceptance must STILL escalate; a policy skip
      # must not CLEAR a standing alarm).
      - name: Prove producer completeness, idempotency and the money path adversarially (tester T-6)
        env:
          PGPASSWORD: ${{ format('issue-1529-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1529_tester_adversarial.test.sql
