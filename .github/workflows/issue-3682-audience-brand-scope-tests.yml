name: issue-3682-audience-brand-scope
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "mingla-business/src/services/marketing/marketingAudienceService.ts"
      - "mingla-business/src/services/marketing/marketingCampaignService.ts"
      - "mingla-business/src/hooks/marketing/useAudienceList.ts"
      - "mingla-business/src/hooks/marketing/marketingKeys.ts"
      - "mingla-business/src/components/people/PeoplePage.tsx"
      - "mingla-business/src/components/ui/CommandPalette.web.tsx"
      - "mingla-business/app/(tabs)/marketing/campaigns/compose.tsx"
      - "mingla-business/src/services/marketing/__tests__/issue3682AudienceBrandScope*.ts"
      - "mingla-business/src/services/marketing/__tests__/marketingAudienceService.test.ts"
      - "supabase/functions/_shared/marketingAudienceBrandGate.ts"
      - "supabase/functions/marketing-send/index.ts"
      - "supabase/functions/marketing-send/issue_3682_audience_brand_gate*.ts"
      - ".github/workflows/issue-3682-audience-brand-scope-tests.yml"
  push:
    branches: [main]
    paths:
      - "mingla-business/src/services/marketing/**"
      - "mingla-business/src/hooks/marketing/useAudienceList.ts"
      - "mingla-business/src/components/people/PeoplePage.tsx"
      - "supabase/functions/_shared/marketingAudienceBrandGate.ts"
      - "supabase/functions/marketing-send/**"
      - ".github/workflows/issue-3682-audience-brand-scope-tests.yml"
  workflow_dispatch:

concurrency:
  group: ci-issue-3682-audience-brand-scope-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  audience-brand-scope:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: mingla-business
      - name: Jest brand-scope suites
        working-directory: mingla-business
        run: >
          npx jest --runInBand
          src/services/marketing/__tests__/issue3682AudienceBrandScope.implementor.happy.test.ts
          src/services/marketing/__tests__/issue3682AudienceBrandScope.tester.adversarial.test.ts
          src/services/marketing/__tests__/marketingAudienceService.test.ts
          src/services/marketing/__tests__/issue2514BrandScopedCampaigns.tester.adversarial.test.ts
          app/(tabs)/marketing/__tests__/MarketingAudiences.disabled-query.adversarial.test.ts
      - name: Deno audience brand gate
        run: |
          deno test --allow-read --no-check \
            supabase/functions/marketing-send/issue_3682_audience_brand_gate.happy.test.ts \
            supabase/functions/marketing-send/issue_3682_audience_brand_gate.tester_adversarial.test.ts
