name: ORCH-1403 Connect-Bank Onboard Scroll Test

# ORCH-1403 [connect-bank-heading-collision] — fails-on-revert regression for the
# BrandOnboardView scroll fix (the "Set up payments" body must be a ScrollView that
# centers-when-short / scrolls-when-tall, NOT a fixed flex:1 centered View that
# overflows its headings on a short viewport). This is a jest suite; the class-D
# strict-grep `jest-suites` job does NOT run jest, so without this dedicated job the
# test would exist but never gate (the dark-test-surface trap, ORCH-1383). EXPLICIT
# registry (never a glob) — add a suite by appending its path below.

on:
  push:
    branches: [Seth, main]
    paths:
      - "mingla-business/src/components/brand/**"
      - ".github/workflows/orch-1403-onboard-scroll-tests.yml"
  pull_request:
    paths:
      - "mingla-business/src/components/brand/**"
      - ".github/workflows/orch-1403-onboard-scroll-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  orch-1403-jest:
    name: "ORCH-1403: connect-bank onboard body scrolls (fails-on-revert regression)"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
      # EXPLICIT registry — add a new ORCH-1403 suite by appending a path; never glob.
      - name: Run ORCH-1403 onboard-scroll jest suite
        run: >
          npx jest
          src/components/brand/__tests__/onboardBodyScrolls.orch1403.source.test.ts
          --runInBand
