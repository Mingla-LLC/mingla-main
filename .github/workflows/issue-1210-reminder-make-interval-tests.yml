# QUOTED name: an unquoted leading '#' would truncate the workflow name.
name: "Issue #1210 reminder make_interval int"

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20271026001210_issue_1210_reminder_make_interval_int.sql"
      - "supabase/migrations/__tests__/issue_1210_reminder_make_interval.implementor.happy.pg17.test.sql"
      - "supabase/migrations/__tests__/issue_1210_reminder_make_interval.tester.adversarial.pg17.test.sql"
      - ".github/scripts/__tests__/issue-1210-reminder-make-interval.test.mjs"
      - ".github/workflows/issue-1210-reminder-make-interval-tests.yml"
      - ".github/actions/migrated-postgres/**"
      - "supabase/functions/notify-reminders/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "supabase/migrations/20271026001210_issue_1210_reminder_make_interval_int.sql"
      - "supabase/migrations/__tests__/issue_1210_reminder_make_interval.implementor.happy.pg17.test.sql"
      - "supabase/migrations/__tests__/issue_1210_reminder_make_interval.tester.adversarial.pg17.test.sql"
      - ".github/scripts/__tests__/issue-1210-reminder-make-interval.test.mjs"
      - ".github/workflows/issue-1210-reminder-make-interval-tests.yml"
      - ".github/actions/migrated-postgres/**"
      - "supabase/functions/notify-reminders/**"

permissions:
  contents: read

concurrency:
  group: ci-issue-1210-reminder-make-interval-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  source-guard:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Source guard
        run: node --test .github/scripts/__tests__/issue-1210-reminder-make-interval.test.mjs

  pg17:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL 17 with every migration applied
        uses: ./.github/actions/migrated-postgres
        with:
          image: supabase/postgres:17.4.1.075
          password: ${{ format('issue-1210-ci-{0}', github.run_id) }}
      - name: Implementor happy path
        env:
          PGPASSWORD: ${{ format('issue-1210-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1210_reminder_make_interval.implementor.happy.pg17.test.sql
      - name: Tester adversarial
        env:
          PGPASSWORD: ${{ format('issue-1210-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1210_reminder_make_interval.tester.adversarial.pg17.test.sql
