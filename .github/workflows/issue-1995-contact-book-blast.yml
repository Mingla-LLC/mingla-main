name: issue-1995-contact-book-blast
on:
  pull_request:
    paths:
      - "supabase/migrations/20270401001995_issue_1995_contact_book_blast.sql"
      - "supabase/functions/marketing-send/**"
      - "supabase/functions/_shared/marketingAudience.ts"
      - "supabase/functions/_shared/marketingBookQuote.ts"
      - "supabase/functions/_shared/smsPriceBook.ts"
      - "supabase/functions/_shared/offeringInviteQuote.ts"
      # #2520 — the renderer that turns a campaign body into the email a buyer
      # actually receives. It belongs to this blast pipeline, and the registry
      # is locked at 200 origins, so its gates live here rather than in a new
      # workflow of their own.
      - "supabase/functions/_shared/marketingEmailRender.ts"
      - "supabase/functions/_shared/email/shell.ts"
      - "supabase/functions/_shared/issue_2520_email_paragraphs.test.ts"
      - "supabase/functions/_shared/issue_2520_email_paragraphs.tester_adversarial.test.ts"
      # #2509 — blast durability: resume, wall-clock budget, reclaim, honest 429.
      - "supabase/migrations/20270525002509_issue_2509_blast_durability.sql"
      - "supabase/functions/_shared/issue_2509_blast_durability.test.ts"
      - "supabase/functions/_shared/issue_2509_blast_durability.tester_adversarial.test.ts"
      # #2510 — Resend event ingest: open rate, bounce/complaint suppression.
      - "supabase/functions/resend-webhook/**"
      - "supabase/migrations/20270526002510_issue_2510_email_event_ingest.sql"
      - "supabase/migrations/__tests__/issue_2510_email_event_ingest.tester_adversarial.pg17.test.sql"
      # #2714 — truthful campaign open measurement and early-event repair.
      - "supabase/migrations/20270606002714_issue_2714_campaign_open_tracking_truth.sql"
      - "supabase/migrations/__tests__/issue_2714_campaign_open_truth.happy.pg17.test.sql"
      - "supabase/migrations/__tests__/issue_2714_campaign_open_truth.tester_adversarial.pg17.test.sql"
      - "mingla-marketing/lib/privacyContent.ts"
      - "mingla-business/**"
      - ".github/scripts/strict-grep/issue-1995-contact-book-blast.mjs"
      - ".github/scripts/strict-grep/issue-2714-campaign-open-truth.mjs"
      - ".github/workflows/issue-1995-contact-book-blast.yml"
concurrency:
  group: ci-issue-1995-contact-book-blast-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-1995-contact-book-blast:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - uses: actions/setup-node@v4
        with:
          {
            node-version: 20,
            cache: npm,
            cache-dependency-path: mingla-business/package-lock.json,
          }
      - run: node .github/scripts/strict-grep/issue-1995-contact-book-blast.mjs --self-test
      - run: node .github/scripts/strict-grep/issue-1995-contact-book-blast.mjs
      - run: node .github/scripts/strict-grep/issue-2714-campaign-open-truth.mjs --self-test
      - run: node .github/scripts/strict-grep/issue-2714-campaign-open-truth.mjs
      - run: deno test supabase/functions/marketing-send/issue_1995_contact_book_blast.happy.test.ts
      - run: deno test supabase/functions/marketing-send/issue_1995_contact_book_blast.adversarial.test.ts
      - run: deno check supabase/functions/marketing-send/index.ts
      # #2520 — paragraph reflow. Without it every campaign shipped as one
      # unbroken wall of text; proven against the 189 We Go Again emails.
      - name: Format-check the new #2520 Deno test files (NARROW gate — #1184 precedent)
        run: |
          deno fmt --check \
            supabase/functions/_shared/issue_2520_email_paragraphs.test.ts \
            supabase/functions/_shared/issue_2520_email_paragraphs.tester_adversarial.test.ts
      - run: deno check supabase/functions/_shared/marketingEmailRender.ts
      - name: "#2520 paragraph reflow (implementor happy-path + tester adversarial)"
        run: |
          deno test --allow-env --allow-read \
            supabase/functions/_shared/issue_2520_email_paragraphs.test.ts \
            supabase/functions/_shared/issue_2520_email_paragraphs.tester_adversarial.test.ts
      - name: Format-check the new #2509 Deno test files (NARROW gate — #1184 precedent)
        run: |
          deno fmt --check \
            supabase/functions/_shared/issue_2509_blast_durability.test.ts \
            supabase/functions/_shared/issue_2509_blast_durability.tester_adversarial.test.ts
      - name: "#2509 blast durability (implementor happy-path + tester adversarial)"
        run: |
          deno test --allow-env --allow-read \
            supabase/functions/_shared/issue_2509_blast_durability.test.ts \
            supabase/functions/_shared/issue_2509_blast_durability.tester_adversarial.test.ts
      - name: "#2520 neighbouring email-pipeline suites must stay green"
        run: |
          deno test --allow-env --allow-read --no-check \
            supabase/functions/_shared/__tests__/orch_1195_experience_email.test.ts \
            supabase/functions/_shared/__tests__/orch_1200_email_pipeline_adversarial.test.ts
      - name: Apply full migration chain and prove PG17 contract
        env:
          PGPASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do pg_isready -h localhost -U postgres && break; sleep 1; done
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z | while IFS= read -r -d '' migration; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/__tests__/issue_1995_contact_book_blast.happy.pg17.test.sql
      # #2509 — the chain above already APPLIES the durability migration. What
      # it does not prove is that re-applying is safe (every migration is
      # replayed on a fresh baseline) or that the indexes actually REFUSE the
      # duplicate that caused the double-send. Both are asserted here.
      - name: Format-check the new #2510 Deno files (NARROW gate — #1184 precedent)
        run: |
          deno fmt --check \
            supabase/functions/resend-webhook/index.ts \
            supabase/functions/resend-webhook/issue_2510_resend_webhook.test.ts
      - name: "#2510 webhook signature + fail-closed contracts"
        run: |
          deno check supabase/functions/resend-webhook/index.ts
          deno test --allow-env --allow-read \
            supabase/functions/resend-webhook/issue_2510_resend_webhook.test.ts
      - name: "#2714 campaign open truth (sender + webhook happy paths)"
        run: |
          deno fmt --check \
            supabase/functions/marketing-send/issue_2714_campaign_open_truth.happy.test.ts \
            supabase/functions/resend-webhook/issue_2714_campaign_open_truth.happy.test.ts
          deno test --allow-read \
            supabase/functions/marketing-send/issue_2714_campaign_open_truth.happy.test.ts \
            supabase/functions/resend-webhook/issue_2714_campaign_open_truth.happy.test.ts
      - name: "#1821 durable terminal readback compatibility"
        run: |
          deno fmt --check \
            supabase/functions/marketing-send/issue-1821-accepted-email-sms-invites.test.ts
          deno test --allow-env --allow-read \
            supabase/functions/marketing-send/issue-1821-accepted-email-sms-invites.test.ts
      - name: "#2714 campaign open truth (tester adversarial boundaries)"
        run: |
          deno fmt --check \
            supabase/functions/marketing-send/issue_2714_campaign_open_truth.tester_adversarial.test.ts \
            supabase/functions/resend-webhook/issue_2714_campaign_open_truth.tester_adversarial.test.ts
          deno test --allow-read \
            supabase/functions/marketing-send/issue_2714_campaign_open_truth.tester_adversarial.test.ts \
            supabase/functions/resend-webhook/issue_2714_campaign_open_truth.tester_adversarial.test.ts
      - name: "#2510 event ingest is idempotent, monotonic, and suppresses correctly"
        env:
          PGPASSWORD: ${{ github.run_id }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2510_email_event_ingest.tester_adversarial.pg17.test.sql
      - name: "#2714 early events reconcile exactly once and health stays private"
        env:
          PGPASSWORD: ${{ github.run_id }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2714_campaign_open_truth.happy.pg17.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2714_campaign_open_truth.tester_adversarial.pg17.test.sql
      - name: "#2509 migration is idempotent and the uniqueness actually bites"
        env:
          PGPASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20270525002509_issue_2509_blast_durability.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2509_blast_durability.pg17.test.sql
      - run: npm ci
        working-directory: mingla-business
      - run: npx jest src/components/marketing/__tests__/issue_1995_contact_book_blast.happy.test.tsx --runInBand
        working-directory: mingla-business
      - name: "#2714 complete overview regression suite"
        run: >-
          npx jest --runTestsByPath
          'app/(tabs)/marketing/__tests__/overview-no-revenue.test.ts'
          src/services/marketing/__tests__/issue2514BrandScopedCampaigns.test.ts
          src/services/marketing/__tests__/marketingOverviewService.test.ts
          src/services/marketing/__tests__/issue_2714_campaign_open_truth.happy.test.ts
          src/services/marketing/__tests__/issue_2714_campaign_open_truth.tester_adversarial.test.ts
          --runInBand --no-cache
        working-directory: mingla-business
      - name: Type-check the #1995 and #2714 changed Business files
        run: |
          set +e
          npx tsc --noEmit --pretty false > /tmp/issue-1995-tsc.log 2>&1
          tsc_status=$?
          set -e
          if [ "$tsc_status" -ne 0 ] && ! grep -q 'error TS' /tmp/issue-1995-tsc.log; then
            cat /tmp/issue-1995-tsc.log
            exit "$tsc_status"
          fi
          if grep -E 'compose\.tsx|AudiencePickerSheet\.tsx|ComposerReviewSheet\.tsx|marketingCampaignService\.ts|useBookBlastPreview\.ts|issue_1995_contact_book_blast\.happy\.test\.tsx|types/marketing\.ts|marketingOverviewService\.ts|marketingReportService\.ts|OverviewMetricCard\.tsx|marketing/index\.tsx|marketing/campaigns/\[id\]\.tsx|issue_2714_campaign_open_truth\.happy\.test\.ts' /tmp/issue-1995-tsc.log; then
            cat /tmp/issue-1995-tsc.log
            exit 1
          fi
          echo "No TypeScript diagnostics in #1995 or #2714 changed Business files"
        working-directory: mingla-business
