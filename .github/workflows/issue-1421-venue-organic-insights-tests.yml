name: Issue #1421 Venue Organic Insights

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    # #2885 AC-4 — a pull request whose ONLY changed file is the machine-written
    # boot-payload baseline cannot affect this suite. Those recording PRs were
    # starting 53 jobs each, ~15/day (~51,000 job-min/month). `paths-ignore`
    # skips ONLY when nothing else changed: touch this file alongside anything
    # and this workflow runs exactly as it always did.
    paths-ignore:
      - "mingla-business/scripts/ci/bundle-baseline.json"
  # [#3072] The backstop, and the thing that makes PR-time routing safe to do at
  # all. Routing changes WHEN this lane runs on a pull request, never WHETHER it
  # runs -- the same contract #2882 gave the 85 batched suites, which route on a
  # pull request and run in full on merge. Selection is the identity function on
  # a push event, so every job below runs here with no routing and no `paths`
  # filter of any kind. Without this, an `originPaths` list that turns out to be
  # incomplete would mean a change got NO coverage ever, instead of a slow catch
  # on `main`; #3079 is the standing evidence that incompleteness is a live risk,
  # not a hypothetical one.
  push:
    branches: [main]
    # #2885 AC-4 again, on this side too. The backstop above must catch an
    # incomplete `originPaths` on a HUMAN merge; it must not resurrect the
    # fan-out AC-4 removed. Without this exclusion a commit touching ONLY the
    # machine-written baseline starts all six lanes on `main` -- ~53 jobs per
    # recording change, ~15/day, ~51,000 job-min per month -- which the #2524
    # auto-merge guard catches by enumerating exactly which workflows such a
    # merge starts. Same trade the red-`main` alert landed on this morning.
    #
    # THE RESIDUAL, stated rather than buried: a baseline-only merge does not
    # run this lane on `main`. That commit changes one recorded boot-payload
    # number and nothing this lane reads -- proven, not assumed: the router was
    # RUN against the real baseline-only commit 5692d0358 and reports
    # `selected=false` here, and no gate this lane executes reads that file
    # (traced: it is stat-ed while walking `scripts/ci`, never opened).
    paths-ignore:
      - "mingla-business/scripts/ci/bundle-baseline.json"
  workflow_dispatch:

concurrency:
  group: ci-issue-1421-venue-organic-insights-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  route:
    # [#3072] The routing decision, taken before this lane spends anything.
    #
    # The `paths-ignore` above is #2885 AC-4 and is UNTOUCHED: a pull request whose
    # ONLY changed file is the machine-written boot-payload baseline still never
    # reaches this workflow at all. That filter stopped the recording PRs; it was
    # never able to route human changes, and it still does not.
    #
    # This job is the second filter and the one that reads the registry.
    # `.github/ci-batch/MANIFEST.json` records this lane's `originPaths` — derived
    # from the files this lane's own gates, tests, typecheck and exports actually
    # READ, not from its name — and the script below matches the pull request's
    # diff against them using #2882's single origin-pattern grammar. No glob is
    # written into this file: widening the route means editing the registry, where
    # the fail-closed emptiness gate and the pattern-liveness gate can see it.
    #
    # On push, schedule and workflow_dispatch the selection is the identity
    # function and every job below runs in full, exactly as before. If the router
    # cannot see the diff it also selects, and says so in an annotation: this lane
    # can be run needlessly, never skipped silently.
    if: ${{ github.event.pull_request.draft != true }}
    name: Route (issue 1421)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.decide.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether this pull request can affect this lane
        id: decide
        run: node .github/scripts/ci-batch/route-live-provider.mjs --issue 1421

  issue-1421-venue-organic-insights:
    if: ${{ (github.event.pull_request.draft != true) && (needs.route.outputs.selected == 'true') }}
    needs: [route]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install Business dependencies
        working-directory: mingla-business
        run: npm ci
      - name: Organic capture checks and tests
        run: |
          deno check supabase/functions/venue-organic-capture/index.ts
          deno check supabase/functions/attribution-capture/index.ts
          deno check supabase/functions/venue-reservation-create/index.ts
          deno test --allow-read \
            supabase/functions/venue-organic-capture/__tests__/issue1421_source_contract.test.ts \
            supabase/functions/venue-organic-capture/__tests__/issue1421_tester_expiry_surface.adversarial.test.ts
      - name: Focused Business tests
        working-directory: mingla-business
        run: npx jest --config jest.issue1421.render.cjs --runInBand
      - name: Focused Consumer capture test
        run: node --test app-mobile/src/services/__tests__/venueOrganicCapture.issue1421.test.mjs
      - name: Venue organic wiring self-test and gate
        run: |
          node .github/scripts/strict-grep/issue-1421-venue-organic-insights-wiring.mjs --self-test
          node .github/scripts/strict-grep/issue-1421-venue-organic-insights-wiring.mjs
      - name: Auth-ready and invariant-conversion gates
        run: |
          node .github/scripts/strict-grep/orch-1004-auth-scoped-query-readiness.mjs --self-test
          node .github/scripts/strict-grep/orch-1004-auth-scoped-query-readiness.mjs
          node mingla-business/scripts/ci/select-source-text-pins.mjs --check
      - name: Scoped lint
        working-directory: mingla-business
        run: |
          npx eslint \
            src/components/venue/VenueIntelligenceModule.tsx \
            src/components/venue/VenueOrganicEngagementSection.tsx \
            src/services/venueOrganicInsightsService.ts \
            src/services/venueOrganicCaptureService.ts \
            src/services/venueOrganicCaptureService.web.ts \
            src/hooks/useVenueOrganicInsights.ts \
            src/analytics/businessAnalyticsEvents.ts
      - name: Buyer web export
        working-directory: mingla-business
        run: npx expo export -p web --output-dir /tmp/issue-1421-web

  issue-1421-migration-pg17:
    if: ${{ (github.event.pull_request.draft != true) && (needs.route.outputs.selected == 'true') }}
    needs: [route]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # #2148 — the `services:` block that used to live here is gone. A service
    # container is started by the runner BEFORE any step runs, so nothing can
    # place a pre-migrated data directory into it; owning the container from a
    # step is what makes the cached snapshot possible. It still listens on
    # localhost:5432 with the same password, so every step below is unchanged.
    steps:
      - uses: actions/checkout@v4
      # #2148 — replaces this job's postgres bring-up: a service container plus a
      # full replay of every migration (MEASURED ~75s boot + ~105s replay). The
      # shared action restores a cached snapshot of the already-migrated cluster
      # and applies only what landed since, falling back to a full replay on any
      # doubt. It verifies policy/trigger/index/RLS counts against the snapshot's
      # build-time manifest before any test runs.
      - name: PostgreSQL 17 with every migration applied
        uses: ./.github/actions/migrated-postgres
        with:
          # Pinned at the call site, not inherited from the action default, so this
          # workflow still states the database it certifies against.
          image: supabase/postgres:17.4.1.075
          password: ${{ format('issue-1421-ci-{0}', github.run_id) }}
      - name: Execute #1421 SQL proof
        env:
          PGPASSWORD: ${{ format('issue-1421-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1421_venue_organic_engagement.test.sql
