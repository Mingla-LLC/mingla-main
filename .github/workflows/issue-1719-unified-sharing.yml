name: Issue 1719 Unified Sharing
on:
  pull_request:
    paths:
      - "scripts/issue-1719/**"
      - "packages/sharing/**"
      - "app-mobile/**"
      - "mingla-business/**"
      - "mingla-marketing/**"
      - "supabase/functions/_shared/contentShare*.ts"
      - "supabase/functions/event-cover-video-*/**"
      - "supabase/functions/run-business-place-authoring-pipeline/**"
      - "supabase/migrations/*1719*"
      - "supabase/security/anon_executable_definer_allowlist.txt"
      - ".github/workflows/issue-1719-unified-sharing.yml"
  push:
    branches: [main]

jobs:
  unified-sharing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --ignore-scripts
        working-directory: mingla-business
      - run: npm ci --ignore-scripts
        working-directory: app-mobile
      - run: node --test scripts/issue-1719/unified-sharing.implementor.happy.test.mjs
      - run: node --test scripts/issue-1719/unified-sharing.amendment.implementor.happy.test.mjs
      - run: node --experimental-strip-types --test scripts/issue-1719/source-card-fidelity.implementor.happy.test.mjs
      - run: node --experimental-strip-types --test scripts/issue-1719/source-card-fidelity.tester.adversarial.test.mjs
      - run: npx jest src/components/ui/__tests__/issue_1719_share_same_turn.happy.test.tsx --runInBand
        working-directory: mingla-business
      - run: node --experimental-strip-types --test scripts/issue-1719/unified-sharing.tester.adversarial.test.mjs
      - run: node --test scripts/issue-1719/unified-sharing.amendment.tester.adversarial.test.mjs
      - run: node --test packages/sharing/__tests__/issue_1615_sharing_contract.happy.test.mjs packages/sharing/__tests__/issue_1615_media_identity.happy.test.mjs
      - run: node --experimental-strip-types --test scripts/issue-1615/content-share-producers.happy.test.mjs scripts/issue-1615/content-share-portrait.happy.test.mjs scripts/issue-1615/content-share-portrait.adversarial.test.mjs
      - run: node --test scripts/issue-1615/content-sharing-semantic-gate.implementor.happy.test.mjs scripts/issue-1615/content-sharing-semantic-gate.adversarial.test.mjs
      - run: node scripts/issue-1615/content-sharing-semantic-gate.mjs
      - run: node --test packages/card-identity/__tests__/card_identity_single_source.test.mjs packages/card-identity/__tests__/issue_1714_contrast_tokens_happy_path.test.mjs packages/card-identity/__tests__/issue_1714_contrast_tokens_adversarial.test.mjs

  postgres-17-adversarial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Apply full migration history
        run: |
          for migration in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f "$migration"
          done
      - name: Run issue 1719 lifecycle and recipient adversarial suite
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f scripts/issue-1719/unified-sharing.amendment.tester.adversarial.sql
      - name: Run issue 1719 native source-card fidelity suite
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f scripts/issue-1719/source-card-fidelity.implementor.happy.sql
      - name: Run issue 1719 native source-card tester adversarial suite
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f scripts/issue-1719/source-card-fidelity.tester.adversarial.sql
      - name: Run issue 1719 native source-card four-worker concurrency suite
        run: bash scripts/issue-1719/source-card-fidelity.tester.concurrency.sh
      - name: Prove issue 1719 native migration reapply
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres -f supabase/migrations/20270301001719_issue_1719_native_content_card_snapshots.sql
