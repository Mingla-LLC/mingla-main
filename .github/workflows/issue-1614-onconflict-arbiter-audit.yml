name: "#1614 PostgREST upsert arbiter audit"

on:
  pull_request:
    # #2885 AC-4 — a pull request whose ONLY changed file is the machine-written
    # boot-payload baseline cannot affect this suite. Those recording PRs were
    # starting 53 jobs each, ~15/day (~51,000 job-min/month). `paths-ignore`
    # skips ONLY when nothing else changed: touch this file alongside anything
    # and this workflow runs exactly as it always did.
    paths-ignore:
      - "mingla-business/scripts/ci/bundle-baseline.json"
  push:
    branches: [main]
    # #2885 AC-4 — the baseline recording auto-merges now (~15/day), so this
    # suite would re-run on main for a one-number JSON measurement. Same waste,
    # other side of the merge. Any other file in the push and this runs.
    paths-ignore:
      - "mingla-business/scripts/ci/bundle-baseline.json"

permissions:
  contents: read

concurrency:
  group: ci-issue-1614-onconflict-arbiter-audit-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-1614-onconflict-arbiter-audit:
    name: "#1614 all-runtime onConflict + preference contracts (PG17)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # #2148 — the `services:` block that used to live here is gone. A service
    # container is started by the runner BEFORE any step runs, so nothing can put a
    # pre-migrated data directory into it; owning the container from a step is what
    # makes the cached snapshot possible. The container still listens on
    # localhost:5432 with the same password, so every step below is unchanged.
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json

      - name: Install Business test dependencies from lockfile
        working-directory: mingla-business
        run: npm ci

      - name: Parse every runtime onConflict target and run parser fixtures
        run: |
          node .github/scripts/issue-1614-onconflict-arbiter-audit.mjs --self-test
          node --test .github/scripts/__tests__/issue-1614-onconflict-arbiter-audit.test.mjs
          if test -f .github/scripts/__tests__/issue-1614-onconflict-arbiter-audit.tester-adversarial.test.mjs; then
            node --test .github/scripts/__tests__/issue-1614-onconflict-arbiter-audit.tester-adversarial.test.mjs
          fi

      # #2148 — replaces the "Wait for PostgreSQL 17" + "Apply complete migration
      # chain in timestamp order" steps (MEASURED ~75 s boot + ~110 s replay). The
      # action restores a cached snapshot of the already-migrated cluster in ~3 s and
      # falls back to a full replay on a cache miss, so the worst case is exactly the
      # old behaviour. It verifies policy/trigger/index/RLS counts against the
      # snapshot's build-time manifest before any test runs.
      - name: PostgreSQL 17 with every migration applied
        uses: ./.github/actions/migrated-postgres
        with:
          # Pinned explicitly rather than inherited from the action's default.
          # The #1614 wiring gate asserts this exact literal is present in THIS
          # file — it caught the conversion when the pin moved into the shared
          # action, which is precisely its job. Keeping the pin at the call site
          # is also the more honest arrangement: each workflow states the
          # database it certifies against instead of trusting a default it
          # cannot see.
          image: supabase/postgres:17.4.1.075
          password: ${{ format('issue-1614-ci-{0}', github.run_id) }}

      - name: Ask PostgreSQL to adjudicate every runtime target
        env:
          PGPASSWORD: ${{ format('issue-1614-ci-{0}', github.run_id) }}
        run: >-
          node .github/scripts/issue-1614-onconflict-arbiter-audit.mjs --emit-sql |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1

      - name: Prove PostgreSQL rejects partial and accepts full UNIQUE arbiters
        env:
          PGPASSWORD: ${{ format('issue-1614-ci-{0}', github.run_id) }}
        run: >-
          node .github/scripts/issue-1614-onconflict-arbiter-audit.mjs --emit-self-test-sql |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1

      - name: Run SQL happy-path and tester contracts
        env:
          PGPASSWORD: ${{ format('issue-1614-ci-{0}', github.run_id) }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1614_upsert_and_notification_prefs.test.sql
          if test -f supabase/migrations/__tests__/issue_1614_upsert_and_notification_prefs.tester_adversarial.test.sql; then
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -f supabase/migrations/__tests__/issue_1614_upsert_and_notification_prefs.tester_adversarial.test.sql
          fi

      - name: Run paired-impression Deno contracts
        run: |
          deno test --allow-read supabase/functions/_shared/__tests__/issue_1614_person_impressions.test.ts
          if test -f supabase/functions/_shared/__tests__/issue_1614_person_impressions.tester_adversarial.test.ts; then
            deno test --allow-read supabase/functions/_shared/__tests__/issue_1614_person_impressions.tester_adversarial.test.ts
          fi

      - name: Run dispatch Deno contracts
        run: |
          deno test --allow-read supabase/functions/notify-dispatch/__tests__/issue_1614_business_type_preferences.test.ts
          if test -f supabase/functions/notify-dispatch/__tests__/issue_1614_business_type_preferences.tester_adversarial.test.ts; then
            deno test --allow-read supabase/functions/notify-dispatch/__tests__/issue_1614_business_type_preferences.tester_adversarial.test.ts
          fi

      - name: Run Business preference contracts
        working-directory: mingla-business
        run: |
          npm test -- --runInBand src/hooks/__tests__/issue1614NotificationTypePrefs.test.tsx
          if test -f src/hooks/__tests__/issue1614NotificationTypePrefs.testerAdversarial.test.tsx; then
            npm test -- --runInBand src/hooks/__tests__/issue1614NotificationTypePrefs.testerAdversarial.test.tsx
          fi
