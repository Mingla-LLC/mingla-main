name: "Issue #2009 published event visibility"

on:
  pull_request:
    paths:
      - "supabase/migrations/20270418002009_issue_2009_business_event_visibility.sql"
      - "supabase/migrations/__tests__/issue_2009_*"
      - "supabase/functions/_shared/agentTools.ts"
      - "supabase/functions/_shared/__tests__/issue_2009_ari_visibility_via_rpc.test.ts"
      - "supabase/functions/discover-merged-events/_cache.ts"
      - "supabase/functions/discover-merged-events/_memory-cache.ts"
      - "supabase/functions/discover-merged-events/index.ts"
      - "supabase/functions/discover-merged-events/__tests__/issue_2009_discovery_generation_cache_key.test.ts"
      - "supabase/functions/discover-merged-events/__tests__/issue_2009_generation_read_ceiling.test.ts"
      - "supabase/functions/agent-confirm-action/index.ts"
      - "supabase/functions/agent-confirm-action/__tests__/issue_2009_private_visibility_status.test.ts"
      - "mingla-business/src/services/businessEvents.ts"
      - "mingla-business/src/services/__tests__/businessEventVisibility.issue2009*"
      - "mingla-business/src/components/event/EditPublishedScreen.tsx"
      - "mingla-admin/src/services/offeringsService.js"
      - ".github/scripts/strict-grep/issue-2009-published-event-visibility.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-2009-published-event-visibility.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20270418002009_issue_2009_business_event_visibility.sql"
      - "supabase/migrations/__tests__/issue_2009_*"
      - "supabase/functions/_shared/agentTools.ts"
      - "supabase/functions/_shared/__tests__/issue_2009_ari_visibility_via_rpc.test.ts"
      - "supabase/functions/discover-merged-events/_cache.ts"
      - "supabase/functions/discover-merged-events/_memory-cache.ts"
      - "supabase/functions/discover-merged-events/index.ts"
      - "supabase/functions/discover-merged-events/__tests__/issue_2009_discovery_generation_cache_key.test.ts"
      - "supabase/functions/discover-merged-events/__tests__/issue_2009_generation_read_ceiling.test.ts"
      - "supabase/functions/agent-confirm-action/index.ts"
      - "supabase/functions/agent-confirm-action/__tests__/issue_2009_private_visibility_status.test.ts"
      - "mingla-business/src/services/businessEvents.ts"
      - "mingla-business/src/services/__tests__/businessEventVisibility.issue2009*"
      - "mingla-business/src/components/event/EditPublishedScreen.tsx"
      - ".github/scripts/strict-grep/issue-2009-published-event-visibility.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-2009-published-event-visibility.yml"

permissions:
  contents: read

jobs:
  postgres-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ github.sha }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10 --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - name: "Canonical migration replay (whole chain, timestamp order)"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          set -euo pipefail
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done

      # Every assertion in this suite EXECUTES an object against real rows.
      # Per #2113 nothing here is satisfiable by source text — in particular the
      # Private fail-closed path is proven by CALLING the RPC with a Private
      # target and observing the refusal plus zero audit/effect/generation
      # residue. The suite self-fails if fewer than 60 assertions run or if not
      # one real transition was committed.
      - name: "#2009 executable suite (implementor happy path)"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2009_business_event_visibility.pg17.test.sql

      # The suite pre-cleans and tears down its own fixtures. Running it twice
      # proves it, and proves it left no residue for a later suite to trip over.
      - name: "#2009 suite is idempotent (second consecutive run)"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2009_business_event_visibility.pg17.test.sql

      # AMENDMENT 3A Defect 1 — the real-row half of Ari's routing: the exact
      # statement shape Ari used BEFORE the fix is refused by the guard, the
      # exact arguments it sends NOW are accepted by the real RPC, and a real
      # transition really moves the discovery generation (Defect 2's input).
      - name: "#2009 Ari visibility routing — real rows (AMENDMENT 3A)"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2009_ari_visibility_rpc.pg17.test.sql

      - name: "#2009 Ari suite is idempotent (second consecutive run)"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2009_ari_visibility_rpc.pg17.test.sql

      # SC-9 / the shipped anon-definer gate must stay green with the allowlist
      # UNMODIFIED: no object #2009 creates is anon-executable.
      - name: Anonymous SECURITY DEFINER allowlist gate
        env:
          PGPASSWORD: ${{ github.sha }}
        run: bash scripts/ci/security_definer_anon_gate.sh

  business-jest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # npm ci ONLY. A bare `npm install` fails ERESOLVE here on a floating
      # lottie-react-native caret (COMMS-0134).
      - run: npm ci
        working-directory: mingla-business
      - name: "#2009 focused Business suite"
        working-directory: mingla-business
        run: npx jest --ci src/services/__tests__/businessEventVisibility.issue2009.test.ts

  # AMENDMENT 3A — the two edge-function behaviours. Both EXECUTE: the Ari
  # suite drives the real update_event executor, the discovery suite drives the
  # real cache-key builder and the real L1 store. Neither asserts on source
  # text. `--no-check` matches the house pattern for these suites (the
  # pre-existing Uint8Array/BodyInit diagnostics in _response-bytes.ts are
  # unrelated to #2009 and present on main).
  edge-function-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - name: "#2009 Defect 1 — Ari routes visibility through the narrow RPC"
        run: |
          deno test --no-check --allow-env --allow-net --allow-read \
            supabase/functions/_shared/__tests__/issue_2009_ari_visibility_via_rpc.test.ts
      - name: "#2009 Defect 2 — the discovery cache key carries the visibility epoch"
        run: |
          deno test --no-check --allow-env \
            supabase/functions/discover-merged-events/__tests__/issue_2009_discovery_generation_cache_key.test.ts
      # AMENDMENT 3B Defect 3 — the generation read is bounded to one database
      # round-trip per 5s per isolate, so an L1 hit is back to zero database
      # contact (ORCH-426's hot path) while worst-case staleness after a
      # visibility change stays ~5s. Counting round-trips is the whole point, so
      # the reader is a counting double driving the SHIPPED resolver.
      - name: "#2009 Defect 3 — the generation read is bounded and still fails closed"
        run: |
          deno test --no-check --allow-env \
            supabase/functions/discover-merged-events/__tests__/issue_2009_generation_read_ceiling.test.ts
      # AMENDMENT 3B Defect 4 — a known, expected, correctly-refused Private
      # transition must not be reported to the client as a server fault. The
      # code is taken off the REAL ToolError the shipped executor raises, never
      # typed by hand, because the code that arrives is the UPPERCASED one.
      - name: "#2009 Defect 4 — private_visibility_unavailable maps to 4xx, not 500"
        run: |
          deno test --no-check --allow-env --allow-net --allow-read \
            supabase/functions/agent-confirm-action/__tests__/issue_2009_private_visibility_status.test.ts
      - name: "#2009 no regression to the pre-existing discover cache-key contracts"
        run: |
          deno test --no-check --allow-env \
            supabase/functions/discover-merged-events/__tests__/cache_key.test.ts \
            supabase/functions/discover-merged-events/__tests__/issue_1020_cache_key_geo.test.ts \
            supabase/functions/discover-merged-events/__tests__/issue_1637_coords_anchor.test.ts

  strict-grep-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # The gate proves itself first: it must REJECT every one of its BAD
      # fixtures — including the two comment-forgery fixtures that defeated
      # earlier gates in this area — before its verdict on the real tree counts.
      - run: node .github/scripts/strict-grep/issue-2009-published-event-visibility.mjs --self-test
      - run: node .github/scripts/strict-grep/issue-2009-published-event-visibility.mjs
