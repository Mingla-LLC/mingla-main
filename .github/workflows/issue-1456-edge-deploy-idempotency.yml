name: Issue #1456 Edge deploy idempotency

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/deploy-functions.yml'
      - '.github/workflows/issue-1456-edge-deploy-idempotency.yml'
      - 'scripts/deploy-supabase-functions.sh'
      - 'scripts/ci/issue1456-edge-deploy-idempotency.test.mjs'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-functions.yml'
      - '.github/workflows/issue-1456-edge-deploy-idempotency.yml'
      - 'scripts/deploy-supabase-functions.sh'
      - 'scripts/ci/issue1456-edge-deploy-idempotency.test.mjs'

concurrency:
  group: ci-issue-1456-edge-deploy-idempotency-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  exact-duplicate-only:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      - name: Prove duplicate-only continuation and fail-closed behavior
        run: node scripts/ci/issue1456-edge-deploy-idempotency.test.mjs
