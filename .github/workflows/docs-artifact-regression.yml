name: Docs Artifact Regression

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "README.md"
      - "AGENTS.md"
      - "PRODUCT_AND_STRATEGY.md"
      - "MARKETING.md"
      - "COMMS.md"
      - "COMMS_LEDGER.md"
      - "docs/**"
      - "scripts/docs/**"
      - ".github/workflows/docs-artifact-regression.yml"
      - ".codex/skills/**"
      - ".claude/skills/mingla-*/**"
  push:
    branches:
      - main
    paths:
      - "README.md"
      - "AGENTS.md"
      - "PRODUCT_AND_STRATEGY.md"
      - "MARKETING.md"
      - "COMMS.md"
      - "COMMS_LEDGER.md"
      - "docs/**"
      - "scripts/docs/**"
      - ".github/workflows/docs-artifact-regression.yml"
      - ".codex/skills/**"
      - ".claude/skills/mingla-*/**"

# ORCH-1383 — cancel a superseded PR run instead of letting it finish.
# Measured: 28 of 260 July strict-grep runs (10.8%) were superseded before finishing.
# The expression (not a bare `true`) is deliberate: cancelling a `push` to main would
# abandon the post-merge verification run for that commit. Guarding on pull_request
# recovers the PR-side waste while main runs always complete.
concurrency:
  group: ci-docs-artifact-regression-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  docs-artifact-regression:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Check markdown link baseline
        run: python3 scripts/docs/check_links.py --format markdown --baseline-file scripts/docs/link_baseline.json

      - name: Check artifact placement
        run: python3 scripts/docs/check_artifact_placement.py

      # #3476 — the COMMS.md table is retired; this only keeps it from growing back.
      - name: Check the retired COMMS table stays retired
        run: |
          python3 scripts/docs/check_ota_comms_authority.py --self-test
          python3 scripts/docs/check_ota_comms_authority.py

      - name: Check README snapshot
        run: python3 scripts/docs/check_readme_snapshot.py

      - name: Check frozen invariant history and local declarations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/docs/check_invariant_declarations.py --repo-root . --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      - name: Check invariant-registry freeze happy path
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/docs/__tests__/issue_3643_invariant_registry_freeze.implementor.happy.test.py --repo-root . --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA"

      - name: Check issue release-record authority
        run: python3 scripts/docs/__tests__/issue_3643_reports_retirement.implementor.happy.test.py --repo-root .

      - name: Check issue release-record fail-closed boundaries
        run: python3 scripts/docs/__tests__/issue_3643_reports_retirement.tester.adversarial.test.py --repo-root .
