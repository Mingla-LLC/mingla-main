name: Issue 1875 Transient Sign-In Failure Tests

# #1875 [transient-signin-failure] — the consumer native sign-in path now
# CLASSIFIES a caught failure (`classifyAuthFailure`), retries the SUPABASE TOKEN
# EXCHANGE ONLY on a transient transport failure (bounded by a counter against a
# frozen constant), and renders the user-facing Alert from fixed i18n keys.
#
# WHY THIS GATE EXISTS:
#  · F-3 — a one-second connectivity blip during "Continue with Google" was
#    handled exactly like a permanent authentication fault. No retry, no
#    offline-aware copy. The user was dead-ended by something a second tap would
#    have cleared.
#  · F-4 — the failure modal rendered `error.message` verbatim. For a 502/503/504,
#    @supabase/auth-js's `_getErrorMessage` falls through to `JSON.stringify(err)`
#    on a `Response`, so the modal contained our Supabase project URL and a blob
#    id. Same string, three destinations: Sentry title, Mixpanel property, Alert
#    body.
#  · The classifier MUST NOT key on `statusCodes.INTERNAL_ERROR` / `.NETWORK_ERROR`
#    / `.TIMEOUT`. The installed google-signin 16.0.0 freezes `statusCodes` to
#    exactly SIGN_IN_CANCELLED, IN_PROGRESS, PLAY_SERVICES_NOT_AVAILABLE and
#    SIGN_IN_REQUIRED, so those three names are `undefined` and the comparison
#    would match EVERY codeless error — recreating the #1038 blind spot that
#    #1044 exists to close, inside its own fix. The suites pin the numeric-string
#    keying the native ErrorDto.kt bridge actually emits ("7"/"8"/"15").
#
# WITHOUT THIS WORKFLOW BOTH SUITES WOULD BE DARK (the ORCH-1383 dark-test-surface
# trap): app-mobile has NO jest at all — its .test.ts files run under Node's
# built-in runner with type-stripping, and no workflow sweeps
# src/hooks/__tests__/. Same shape and rationale as
# issue-1044-auth-failure-capture-tests.yml, which is deliberately NOT modified
# here — its existing `app-mobile/src/hooks/useAuthSimple.ts` path gate already
# fires the (amended) #1044 suites on any change to this file.
#
# Both suites SLICE and EXECUTE the REAL shipped source via `new Function` rather
# than a retyped copy — ORCH-1373 P2-2 proved a replica test stays green while the
# real guard is deleted.
#
# The tester's adversarial suite path is registered BELOW BEFORE IT EXISTS, on
# purpose, so it is not dark on the day it lands.
#
# EXPLICIT registry (never a glob) — add a suite by appending its path below.
# Invokes no .mjs under .github/scripts/strict-grep/, so MANIFEST.json totality,
# `expectedStrictGrepMjsFiles` and `selfTestWiredFloor` are untouched.

on:
  push:
    branches: [main]
    paths:
      - "app-mobile/src/hooks/useAuthSimple.ts"
      - "app-mobile/src/i18n/locales/en/auth.json"
      - "app-mobile/src/hooks/__tests__/useAuthSimple.transientSignInFailure.issue1875.test.ts"
      - "app-mobile/src/hooks/__tests__/useAuthSimple.transientSignInFailure.adversarial.issue1875.test.ts"
      - ".github/workflows/issue-1875-google-signin-transient-failure-tests.yml"
  pull_request:
    paths:
      - "app-mobile/src/hooks/useAuthSimple.ts"
      - "app-mobile/src/i18n/locales/en/auth.json"
      - "app-mobile/src/hooks/__tests__/useAuthSimple.transientSignInFailure.issue1875.test.ts"
      - "app-mobile/src/hooks/__tests__/useAuthSimple.transientSignInFailure.adversarial.issue1875.test.ts"
      - ".github/workflows/issue-1875-google-signin-transient-failure-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-1875-consumer-node-test:
    name: "#1875 CONS: transient sign-in failures retry and never leak raw errors (fails-on-revert)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 — `--experimental-strip-types` is how EVERY .test.ts in this
          # app runs (there is no jest here). See useLaunchCityGate.test.ts.
          node-version: "22"
      # Both suites import ONLY node builtins (node:test/assert/crypto/fs/path/url)
      # and compile source TEXT, so no npm ci is required.
      - name: Run issue-1875 consumer suite (implementor happy-path, T1-T16)
        run: >
          node --experimental-strip-types --test
          src/hooks/__tests__/useAuthSimple.transientSignInFailure.issue1875.test.ts
      # TESTER ADVERSARIAL suite — registered before it exists so the guard is not
      # dark when it lands. `if` keeps the job green until then; delete the guard
      # when the file is committed.
      - name: Check for the tester adversarial suite
        id: adversarial
        run: |
          if [ -f src/hooks/__tests__/useAuthSimple.transientSignInFailure.adversarial.issue1875.test.ts ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::#1875 tester adversarial suite not yet committed — registered, not yet running."
          fi
      - name: Run issue-1875 consumer TESTER ADVERSARIAL suite
        if: steps.adversarial.outputs.present == 'true'
        run: >
          node --experimental-strip-types --test
          src/hooks/__tests__/useAuthSimple.transientSignInFailure.adversarial.issue1875.test.ts
