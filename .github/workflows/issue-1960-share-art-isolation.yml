name: Issue 1960 share-art isolation

on:
  pull_request:
    paths:
      - "mingla-business/src/components/event/FoundationEventPreview.tsx"
      - "mingla-business/src/components/event/PublicEventPage.tsx"
      - "mingla-business/app/t/[brandSlug]/[tripSlug].tsx"
      - "mingla-business/app/b/[brandSlug]/index.tsx"
      - "mingla-business/app/b/[brandSlug]/v/[venueSlug].tsx"
      - "packages/offering-rendering/**"
      - "packages/brand-rendering/**"
      - "app-mobile/app/s/[code].tsx"
      - "mingla-business/server/socialPreview.js"
      - "mingla-business/server/cardIdentityRenderer.js"
      - "mingla-business/api/og-*.js"
      - "scripts/issue-1960/**"
      - ".github/scripts/strict-grep/issue-1960-share-art-isolation.mjs"
      - ".github/workflows/issue-1960-share-art-isolation.yml"

jobs:
  share-art-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/issue-1960/public-cover-share-isolation.implementor.happy.test.mjs
      - name: Run independent tester proof when present
        run: |
          proof="scripts/issue-1960/public-cover-share-isolation.tester.adversarial.test.mjs"
          if test -f "$proof"; then node --test "$proof"; fi
