name: "Issue #1463 permitted staff venue submit"

on:
  push:
    branches: [main]
    paths:
      - "mingla-business/src/components/venue/claim/ClaimStepBookings.tsx"
      - "mingla-business/src/components/venue/venueBookingSetupCopy.ts"
      - "mingla-business/src/components/venue/__tests__/ClaimStepBookings.issue1463.test.ts"
      - "mingla-business/src/utils/sanitizeAuthoringError.ts"
      - "mingla-business/src/utils/__tests__/sanitizeAuthoringError.issue1463.test.ts"
      - "supabase/migrations/20270208001463_issue_1463_permitted_staff_venue_submit.sql"
      - "supabase/migrations/__tests__/issue_1463_permitted_staff_venue_submit.*"
      - ".github/workflows/issue-1463-permitted-staff-venue-submit-tests.yml"
      # #2148 — this suite now gets its database from a shared composite action;
      # without this path a change to that action would not re-run it.
      - ".github/actions/migrated-postgres/**"
  pull_request:
    paths:
      - "mingla-business/src/components/venue/claim/ClaimStepBookings.tsx"
      - "mingla-business/src/components/venue/venueBookingSetupCopy.ts"
      - "mingla-business/src/components/venue/__tests__/ClaimStepBookings.issue1463.test.ts"
      - "mingla-business/src/utils/sanitizeAuthoringError.ts"
      - "mingla-business/src/utils/__tests__/sanitizeAuthoringError.issue1463.test.ts"
      - "supabase/migrations/20270208001463_issue_1463_permitted_staff_venue_submit.sql"
      - "supabase/migrations/__tests__/issue_1463_permitted_staff_venue_submit.*"
      - ".github/workflows/issue-1463-permitted-staff-venue-submit-tests.yml"
      # #2148 — this suite now gets its database from a shared composite action;
      # without this path a change to that action would not re-run it.
      - ".github/actions/migrated-postgres/**"

permissions:
  contents: read

concurrency:
  group: ci-issue-1463-permitted-staff-venue-submit-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  contracts-and-client:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
        working-directory: mingla-business
      - name: Prove role, grant, copy, and error contracts
        run: >
          deno test --allow-read
          supabase/migrations/__tests__/issue_1463_permitted_staff_venue_submit.test.ts
      - name: Prove category copy and structured errors
        working-directory: mingla-business
        run: >
          npx jest
          src/components/venue/__tests__/ClaimStepBookings.issue1463.test.ts
          src/utils/__tests__/sanitizeAuthoringError.issue1463.test.ts
          src/utils/__tests__/sanitizeAuthoringError.test.ts
          --runInBand
      - name: Lint changed client boundaries
        working-directory: mingla-business
        run: >
          npx eslint
          src/components/venue/claim/ClaimStepBookings.tsx
          src/components/venue/venueBookingSetupCopy.ts
          src/components/venue/__tests__/ClaimStepBookings.issue1463.test.ts
          src/utils/sanitizeAuthoringError.ts
          src/utils/__tests__/sanitizeAuthoringError.issue1463.test.ts

  postgres-17-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # #2148 — the `services:` block that used to live here is gone. A service
    # container is started by the runner BEFORE any step runs, so nothing can
    # place a pre-migrated data directory into it; owning the container from a
    # step is what makes the cached snapshot possible. It still listens on
    # localhost:5432 with the same password, so every step below is unchanged.
    steps:
      - uses: actions/checkout@v4
      # #2148 — replaces this job's postgres bring-up: a service container plus a
      # full replay of every migration (MEASURED ~75s boot + ~105s replay). The
      # shared action restores a cached snapshot of the already-migrated cluster
      # and applies only what landed since, falling back to a full replay on any
      # doubt. It verifies policy/trigger/index/RLS counts against the snapshot's
      # build-time manifest before any test runs.
      - name: PostgreSQL 17 with every migration applied
        uses: ./.github/actions/migrated-postgres
        with:
          # Pinned at the call site, not inherited from the action default, so this
          # workflow still states the database it certifies against.
          image: supabase/postgres:17.4.1.075
          password: ${{ format('issue-1463-ci-{0}', github.run_id) }}
      - name: Execute manager, cross-brand, lower-role, and grant proof
        env:
          PGPASSWORD: ${{ format('issue-1463-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1463_permitted_staff_venue_submit.test.sql
