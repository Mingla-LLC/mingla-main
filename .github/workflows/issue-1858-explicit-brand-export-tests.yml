name: Issue 1858 explicit Brand People export target

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20270326001858_issue_1858_explicit_brand_export.sql"
      - "supabase/migrations/__tests__/issue_1858_explicit_brand_export.test.sql"
      - "supabase/migrations/__tests__/issue_1858_explicit_brand_export.tester.adversarial.test.sql"
      - "supabase/functions/brand-people-export/**"
      - ".github/scripts/strict-grep/issue-1858-explicit-brand-export.mjs"
      - ".github/scripts/strict-grep/__tests__/issue-1858-explicit-brand-export.test.mjs"
      - ".github/scripts/strict-grep/__tests__/issue-1858-explicit-brand-export.tester.adversarial.test.mjs"
      - ".github/workflows/issue-1858-explicit-brand-export-tests.yml"
  pull_request:
    paths:
      - "supabase/migrations/20270326001858_issue_1858_explicit_brand_export.sql"
      - "supabase/migrations/__tests__/issue_1858_explicit_brand_export.test.sql"
      - "supabase/migrations/__tests__/issue_1858_explicit_brand_export.tester.adversarial.test.sql"
      - "supabase/functions/brand-people-export/**"
      - ".github/scripts/strict-grep/issue-1858-explicit-brand-export.mjs"
      - ".github/scripts/strict-grep/__tests__/issue-1858-explicit-brand-export.test.mjs"
      - ".github/scripts/strict-grep/__tests__/issue-1858-explicit-brand-export.tester.adversarial.test.mjs"
      - ".github/workflows/issue-1858-explicit-brand-export-tests.yml"

permissions:
  contents: read

concurrency:
  group: ci-issue-1858-explicit-brand-export-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-1858-explicit-brand-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ format('issue-1858-ci-{0}', github.run_id) }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10 --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run static contract and true-mutation proof
        run: |
          node .github/scripts/strict-grep/issue-1858-explicit-brand-export.mjs --self-test
          node .github/scripts/strict-grep/issue-1858-explicit-brand-export.mjs
          node --test .github/scripts/strict-grep/__tests__/issue-1858-explicit-brand-export.test.mjs
          node --test .github/scripts/strict-grep/__tests__/issue-1858-explicit-brand-export.tester.adversarial.test.mjs
      - name: Run Edge request-boundary regressions
        run: deno test --allow-env --allow-read supabase/functions/brand-people-export/issue_1770_export.happy.test.ts supabase/functions/brand-people-export/issue_1858_explicit_brand_export.test.ts
      - name: Wait for PostgreSQL 17 and apply every migration
        env:
          PGPASSWORD: ${{ format('issue-1858-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..90}; do
            if psql -h localhost -U postgres -d postgres -Atc "SELECT to_regnamespace('vault') IS NOT NULL" 2>/dev/null | grep -qx t; then
              ready=true
              break
            fi
            sleep 1
          done
          "$ready"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z |
            while IFS= read -r -d '' migration; do
              psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
            done
      - name: Prove exact-brand SQL contract
        env:
          PGPASSWORD: ${{ format('issue-1858-ci-{0}', github.run_id) }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/__tests__/issue_1858_explicit_brand_export.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/__tests__/issue_1858_explicit_brand_export.tester.adversarial.test.sql
