name: Issue #874 Business Analytics

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    # #2885 AC-4 — a pull request whose ONLY changed file is the machine-written
    # boot-payload baseline cannot affect this suite. Those recording PRs were
    # starting 53 jobs each, ~15/day (~51,000 job-min/month). `paths-ignore`
    # skips ONLY when nothing else changed: touch this file alongside anything
    # and this workflow runs exactly as it always did.
    paths-ignore:
      - "mingla-business/scripts/ci/bundle-baseline.json"
  # [#3072] The backstop, and the thing that makes PR-time routing safe to do at
  # all. Routing changes WHEN this lane runs on a pull request, never WHETHER it
  # runs -- the same contract #2882 gave the 85 batched suites, which route on a
  # pull request and run in full on merge. Selection is the identity function on
  # a push event, so every job below runs here with no routing and no `paths`
  # filter of any kind. Without this, an `originPaths` list that turns out to be
  # incomplete would mean a change got NO coverage ever, instead of a slow catch
  # on `main`; #3079 is the standing evidence that incompleteness is a live risk,
  # not a hypothetical one.
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-issue-874-business-analytics-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  route:
    # [#3072] The routing decision, taken before this lane spends anything.
    #
    # The `paths-ignore` above is #2885 AC-4 and is UNTOUCHED: a pull request whose
    # ONLY changed file is the machine-written boot-payload baseline still never
    # reaches this workflow at all. That filter stopped the recording PRs; it was
    # never able to route human changes, and it still does not.
    #
    # This job is the second filter and the one that reads the registry.
    # `.github/ci-batch/MANIFEST.json` records this lane's `originPaths` — derived
    # from the files this lane's own gates, tests, typecheck and exports actually
    # READ, not from its name — and the script below matches the pull request's
    # diff against them using #2882's single origin-pattern grammar. No glob is
    # written into this file: widening the route means editing the registry, where
    # the fail-closed emptiness gate and the pattern-liveness gate can see it.
    #
    # On push, schedule and workflow_dispatch the selection is the identity
    # function and every job below runs in full, exactly as before. If the router
    # cannot see the diff it also selects, and says so in an annotation: this lane
    # can be run needlessly, never skipped silently.
    if: ${{ github.event.pull_request.draft != true }}
    name: Route (issue 874)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.decide.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether this pull request can affect this lane
        id: decide
        run: node .github/scripts/ci-batch/route-live-provider.mjs --issue 874

  issue-874-business-analytics:
    if: ${{ (github.event.pull_request.draft != true) && (needs.route.outputs.selected == 'true') }}
    needs: [route]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare typecheck comparison evidence
        run: |
          mkdir -p "$RUNNER_TEMP/issue874-typecheck"
          printf '%s\n' \
            'Typecheck comparison did not complete; inspect the preceding failed step.' \
            > "$RUNNER_TEMP/issue874-typecheck/INCOMPLETE.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
      - name: Install render-only test dependencies
        run: npm install --no-save react-test-renderer@19.1.0 @testing-library/react-native
      - name: Pure contract tests
        run: npm test -- --runInBand brandAnalyticsService.issue874 useBrandAnalytics.issue874 businessAnalyticsEvents.issue874 brandCache.issue874 brandAnalyticsService.issue874.tester.adversarial
      - name: Native render contracts
        run: npx jest --config jest.issue874.render.cjs --runInBand
      - name: Web render contracts
        run: npx jest --config jest.issue874.web.render.cjs --runInBand
      - name: Auth-ready query gate
        run: npm run test:orch-1004
      - name: Home single-scroll gate
        run: node ../.github/scripts/strict-grep/orch-0974-home-mobile-lock-pane.mjs
      - name: Source-pin partition audit
        run: node scripts/ci/select-source-text-pins.mjs --check
      - name: Quarantine policy audit
        run: node ../.github/scripts/strict-grep/orch-1047-quarantine-list-is-source-pins-only.mjs
      - name: Last-seven-days gate self-test
        run: node ../.github/scripts/strict-grep/orch-0816-last-7-days-binds-rev7d.mjs --self-test
      - name: Last-seven-days gate
        run: node ../.github/scripts/strict-grep/orch-0816-last-7-days-binds-rev7d.mjs
      - name: Currency fallback gate self-test
        run: node ../.github/scripts/strict-grep/issue-0962-prebank-no-gbp.mjs --self-test
      - name: Currency fallback gate
        run: node ../.github/scripts/strict-grep/issue-0962-prebank-no-gbp.mjs
      - name: Typecheck delta guard self-test
        run: node scripts/ci/issue-874-typecheck-delta.mjs --self-test
      - name: Typecheck full graph against exact PR base
        env:
          ISSUE_874_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: >-
          node scripts/ci/issue-874-typecheck-delta.mjs
          --base "$ISSUE_874_BASE_REF"
          --output-dir "$RUNNER_TEMP/issue874-typecheck"
      - name: Upload typecheck comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-874-typecheck-comparison
          path: ${{ runner.temp }}/issue874-typecheck
          if-no-files-found: error
      - name: Scoped issue lint
        run: |
          npx eslint \
            'app/(tabs)/_layout.tsx' \
            'app/(tabs)/home.tsx' \
            'app/(tabs)/analytics.tsx' \
            'app/(tabs)/__tests__/analytics.issue874.tester.adversarial.render.test.tsx' \
            'app/(tabs)/__tests__/home.issue874.render.test.tsx' \
            'src/services/brandAnalyticsService.ts' \
            'src/services/__tests__/brandAnalyticsService.issue874.test.ts' \
            'src/services/__tests__/brandAnalyticsService.issue874.tester.adversarial.test.ts' \
            'src/hooks/useBrandAnalytics.ts' \
            'src/hooks/__tests__/useBrandAnalytics.issue874.test.tsx' \
            'src/hooks/brandCache.ts' \
            'src/hooks/__tests__/brandCache.issue874.test.ts' \
            'src/hooks/useBrands.ts' \
            'src/analytics/businessAnalyticsEvents.ts' \
            'src/analytics/__tests__/businessAnalyticsEvents.issue874.test.ts' \
            'src/components/home/AnalyticsHomeTile.tsx' \
            'src/components/home/__tests__/AnalyticsHomeTile.issue874.render.test.tsx' \
            'src/components/analytics/AnalyticsModuleState.tsx' \
            'src/components/analytics/BrandAnalyticsScreen.tsx' \
            'src/components/analytics/CustomerPatternsSection.tsx' \
            'src/components/analytics/CustomersMinglaDroveSection.tsx' \
            'src/components/analytics/RegularsSection.tsx' \
            'src/components/analytics/__tests__/BrandAnalyticsA11y.issue874.tester.adversarial.render.test.tsx' \
            'src/components/analytics/__tests__/BrandAnalyticsScreen.issue874.render.test.tsx' \
            'src/components/analytics/__tests__/RegularsSection.issue874.render.test.tsx' \
            'src/store/liveEventStore.ts' \
            'src/utils/liveEventConverter.ts' \
            'src/utils/__tests__/issue_0962_prebank_display_no_gbp.test.ts' \
            'src/utils/__tests__/issue_0962_r5_adversarial_prebank_display.test.ts'
      - run: npx expo export -p web
