name: Issue 2168 revocation refund handoff

on:
  pull_request:
    paths:
      - "supabase/functions/checkout-sale-revocation/**"
      - "supabase/migrations/20270419002168_issue_2168_revocation_refund_handoff.sql"
      - "supabase/migrations/20270419002169_issue_2168_revocation_cron.sql"
      - "supabase/migrations/__tests__/issue_2168_revocation_refund_handoff.pg17.test.sql"
      - ".github/workflows/issue-2168-revocation-refund-handoff-tests.yml"

concurrency:
  group: ci-issue-2168-revocation-refund-handoff-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-2168-deno-check:
    name: "Issue 2168 edge fn type-check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check the revocation worker
        run: >-
          deno check supabase/functions/checkout-sale-revocation/index.ts

  issue-2168-pg17:
    name: "Issue 2168 refund handoff proof (PG17)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ format('issue-2168-ci-{0}', github.run_id) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PostgreSQL 17
        env:
          PGPASSWORD: ${{ format('issue-2168-ci-{0}', github.run_id) }}
        run: |
          for i in {1..90}; do
            if psql -h localhost -U postgres -d postgres -Atc \
              "SELECT to_regnamespace('vault') IS NOT NULL AND to_regrole('supabase_admin') IS NOT NULL" \
              2>/dev/null | grep -qx t; then
              echo "postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready in 90s"
          exit 1
      - name: Apply all migrations in timestamp order
        env:
          PGPASSWORD: ${{ format('issue-2168-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 \
            | sort -z \
            | while IFS= read -r -d '' migration; do
                echo "::group::Applying $migration"
                psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
                echo "::endgroup::"
              done
      - name: Execute issue 2168 refund handoff proof
        env:
          PGPASSWORD: ${{ format('issue-2168-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_2168_revocation_refund_handoff.pg17.test.sql
