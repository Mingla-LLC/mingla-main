name: issue-2099-pending-venue-identity-correction
on:
  pull_request:
    paths:
      - "supabase/migrations/20270412002099_issue_2099_pending_venue_identity_correction.sql"
      - "supabase/migrations/__tests__/issue_2099_pending_venue_identity_correction.test.sql"
      - "supabase/migrations/__tests__/issue_2099_pending_venue_identity_correction.test.ts"
      - "mingla-business/src/services/venueListingsService.ts"
      - "mingla-business/src/components/venue/VenueListingContent.tsx"
      - "mingla-business/src/components/venue/__tests__/issue2099PendingIdentityCorrection.test.tsx"
      - "mingla-admin/src/services/adminClaimsService.js"
      - "mingla-admin/src/pages/ClaimsPage.jsx"
      - "mingla-admin/src/__tests__/issue2099_pending_identity_correction.test.js"
      - ".github/workflows/issue-2099-pending-venue-identity-correction-tests.yml"
      - ".github/scripts/strict-grep/MANIFEST.json"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20270412002099_issue_2099_pending_venue_identity_correction.sql"
      - "supabase/migrations/__tests__/issue_2099_pending_venue_identity_correction.test.sql"
      - "supabase/migrations/__tests__/issue_2099_pending_venue_identity_correction.test.ts"
      - "mingla-business/src/services/venueListingsService.ts"
      - "mingla-business/src/components/venue/VenueListingContent.tsx"
      - "mingla-business/src/components/venue/__tests__/issue2099PendingIdentityCorrection.test.tsx"
      - "mingla-admin/src/services/adminClaimsService.js"
      - "mingla-admin/src/pages/ClaimsPage.jsx"
      - "mingla-admin/src/__tests__/issue2099_pending_identity_correction.test.js"
      - ".github/workflows/issue-2099-pending-venue-identity-correction-tests.yml"
      - ".github/scripts/strict-grep/MANIFEST.json"
  workflow_dispatch:

jobs:
  issue-2099-web-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: |
            mingla-business/package-lock.json
            mingla-admin/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm --prefix mingla-business ci
      - run: npm --prefix mingla-admin ci
      - run: deno test --allow-read supabase/migrations/__tests__/issue_2099_pending_venue_identity_correction.test.ts
      - run: npm --prefix mingla-business test -- --runInBand src/components/venue/__tests__/issue2099PendingIdentityCorrection.test.tsx
      - run: node --test mingla-admin/src/__tests__/issue2099_pending_identity_correction.test.js
      - run: npm --prefix mingla-business run typecheck -- --noEmit
      - run: npm --prefix mingla-admin run build

  issue-2099-postgres-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - name: PostgreSQL 17 full-chain correction contract
        shell: bash
        run: |
          set -euo pipefail
          sql_root="$(mktemp -d /tmp/issue-2099-sql.XXXXXX)"
          cleanup() { supabase stop --workdir "$sql_root" --no-backup --yes || true; }
          trap cleanup EXIT
          supabase init --workdir "$sql_root" --yes
          target="$sql_root/supabase/migrations"
          rsync -a supabase/migrations/ "$target/"
          mv "$target/20260612000001_tr4_revoke_rpc_anon_grants.sql" "$target/20260612000002_tr4_revoke_rpc_anon_grants.sql"
          mv "$target/20260612000000_tr4_refund_tiers_booking_deadline.sql" "$target/20260612000001_tr4_refund_tiers_booking_deadline.sql"
          mv "$target/20260615000000_orch_426_discover_cache_gzip.sql" "$target/20260615010000_orch_426_discover_cache_gzip.sql"
          mv "$target/20261012000000_orch_1150_rsvp_maybe.sql" "$target/20261012010000_orch_1150_rsvp_maybe.sql"
          mv "$target/20261113000000_orch_1172_rsvp_edit_privacy_settings.sql" "$target/20261113010000_orch_1172_rsvp_edit_privacy_settings.sql"
          mv "$target/20261116000000_orch_1187_reconcile_stuck_checkouts_cron.sql" "$target/20261116010000_orch_1187_reconcile_stuck_checkouts_cron.sql"
          mv "$target/20261117000001_orch_1188_finalize_persist_event_date_id.sql" "$target/20261117000002_orch_1188_finalize_persist_event_date_id.sql"
          mv "$target/20261117000000_orch_1188_orders_event_date_id.sql" "$target/20261117000001_orch_1188_orders_event_date_id.sql"
          supabase start --workdir "$sql_root" --exclude gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor --yes
          db_container="$(docker ps --filter "label=com.supabase.cli.project=$(basename "$sql_root")" --format '{{.Names}}' | awk '/^supabase_db_/ {print; exit}')"
          test -n "$db_container"
          db_password="$(docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$db_container" | sed -n 's/^POSTGRES_PASSWORD=//p')"
          docker exec -i -e PGPASSWORD="$db_password" "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -f - < supabase/migrations/__tests__/issue_2099_pending_venue_identity_correction.test.sql
          started="$(date +%s)"
          docker exec -e PGPASSWORD="$db_password" "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "BEGIN; LOCK TABLE public.issue_2099_dependency_schema_guard IN SHARE MODE NOWAIT; SELECT pg_sleep(2); COMMIT;" >/tmp/issue2099-correction-first.out &
          correction_pid=$!
          sleep 0.3
          docker exec -e PGPASSWORD="$db_password" "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE TABLE public.issue_2099_concurrent_ddl_test(venue_id uuid);" >/tmp/issue2099-ddl-wait.out
          wait "$correction_pid"
          test "$(( $(date +%s) - started ))" -ge 2
          docker exec -e PGPASSWORD="$db_password" "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "BEGIN; LOCK TABLE public.issue_2099_dependency_schema_guard IN EXCLUSIVE MODE; SELECT pg_sleep(2); COMMIT;" >/tmp/issue2099-ddl-first.out &
          ddl_pid=$!
          sleep 0.3
          set +e
          busy="$(docker exec -e PGPASSWORD="$db_password" "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "BEGIN; LOCK TABLE public.issue_2099_dependency_schema_guard IN SHARE MODE NOWAIT; ROLLBACK;" 2>&1)"
          busy_code=$?
          set -e
          wait "$ddl_pid"
          test "$busy_code" -ne 0
          case "$busy" in *"could not obtain lock"*) ;; *) exit 1;; esac
          docker exec -e PGPASSWORD="$db_password" "$db_container" psql -U postgres -d postgres -v ON_ERROR_STOP=1 -c "DROP TABLE public.issue_2099_concurrent_ddl_test;" >/dev/null
