name: Issue 885 Scanner Invite Loader Guard Tests

# #885 [scanner-invite-loader-guard] — the /accept-scanner-invitation route must
# render an ACTIONABLE screen for a terminal-but-actionable auth state, never an
# infinite spinner. The fix (app/accept-scanner-invitation.tsx, shipped in commit
# 26cd280bb) branches on the five-state `authStatus`: `signed_out` -> a working
# "Sign in" screen; `error` -> a "Try again" screen; a spinner ONLY for the transient
# states (bootstrapping / refreshing, or signed_in_ready while the accept mutation is
# in flight). It replaced the dead `if (!isAuthReady) return;`-above-`router.replace`
# clone that would have spun a logged-out scanner forever.
#
# WHY THIS GATE EXISTS: the shared authReadiness tests and the layout route-gate test
# (orch_1373_auth_route_gate.test.ts) protect the auth DERIVATION and the route MOUNT,
# but NOTHING pinned THIS component's own render control flow. Revert the route to the
# dead-redirect / spinner-for-signed_out shape and, absent this suite, no test goes
# red. The suite MOUNTS THE REAL SHIPPED ROUTE via react-test-renderer (not a
# hand-rolled branch copy — the ORCH-1373 P2-2 disease, where a replica stays green
# while the real branch is deleted) and asserts the produced tree renders a "Sign in"
# affordance and NO ActivityIndicator for authStatus=signed_out; it fails on revert.
#
# WITHOUT THIS WORKFLOW THE SUITE WOULD BE DARK (the ORCH-1383 dark-test-surface
# trap): mingla-business's DEFAULT jest config is exercised on PRs only by
# mingla-business-jest-suite.yml, which is admin-bypassable and paths-unfiltered — a
# focused, always-on, source-gated proof for this specific fix belongs here. Same
# shape and same rationale as issue-1044-auth-failure-capture-tests.yml. The renderer
# install mirrors issue-948-web-skip-download-tests.yml (react-test-renderer is a
# TEST-ONLY dep, deliberately kept out of package.json / the lockfile via --no-save).
#
# EXPLICIT registry (never a glob) — add a suite by appending its path below.
# Invokes no .mjs under .github/scripts/strict-grep/, so MANIFEST.json totality and
# parity are untouched.

on:
  push:
    branches: [main]
    paths:
      - "mingla-business/app/accept-scanner-invitation.tsx"
      - "mingla-business/src/utils/__tests__/issue_885_scanner_invite_signed_out_actionable.implementor.test.ts"
      - "mingla-business/src/utils/__tests__/issue_885_scanner_invite_actionable.adversarial.test.ts"
      - ".github/workflows/issue-885-scanner-invite-loader-tests.yml"
  pull_request:
    paths:
      - "mingla-business/app/accept-scanner-invitation.tsx"
      - "mingla-business/src/utils/__tests__/issue_885_scanner_invite_signed_out_actionable.implementor.test.ts"
      - "mingla-business/src/utils/__tests__/issue_885_scanner_invite_actionable.adversarial.test.ts"
      - ".github/workflows/issue-885-scanner-invite-loader-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-885-scanner-invite-loader-jest:
    name: "#885 BIZ: logged-out scanner invitee gets an actionable screen, never an infinite spinner (fails-on-revert)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - name: Install business dependencies
        run: npm ci
      # react-test-renderer is a TEST-ONLY renderer, deliberately NOT an app
      # dependency; --no-save keeps it out of the lockfile. The suite MOUNTS the real
      # route to exercise its render decision, so this renderer is required.
      - name: Install route-render proof dependency (react-test-renderer, --no-save)
        run: npm install --no-save --package-lock=false react-test-renderer@19.1.0
      # IMPLEMENTOR happy-path suite. Mounts the REAL AcceptScannerInvitationRoute and
      # asserts: signed_out + unresolved phase -> a "Sign in" affordance renders, the
      # accept mutation is not attempted, and NO ActivityIndicator is produced. Fails
      # on revert to the dead-redirect / spinner-for-signed_out shape.
      - name: Run issue-885 scanner-invite loader guard (implementor happy-path)
        run: >
          npx jest
          src/utils/__tests__/issue_885_scanner_invite_signed_out_actionable.implementor.test.ts
          --runInBand
      # TESTER adversarial suite. Mounts the same REAL route and pins two OTHER
      # invariants of the fix: authStatus="error" -> an actionable "Try again" screen
      # (never a spinner), and C-1373-C precedence (a resolved `phase` is not re-masked
      # by a later transient auth change). Fails on revert of the error arm / the render
      # precedence ordering.
      - name: Run issue-885 scanner-invite loader guard (tester adversarial)
        run: >
          npx jest
          src/utils/__tests__/issue_885_scanner_invite_actionable.adversarial.test.ts
          --runInBand
