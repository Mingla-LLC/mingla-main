name: Issue 1179 cancellation refund fan-out

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "supabase/functions/event-cancel-refund-fanout/**"
      - "supabase/functions/_shared/paystackRefunds.ts"
      - "supabase/functions/_shared/stripe.ts"
      - "supabase/config.toml"
      - "supabase/migrations/20270110000009_issue_1179_cancel_refund_fanout.sql"
      - "supabase/migrations/__tests__/issue_1179_cancel_refund_fanout_pg17.test.sql"
      - "supabase/migrations/__tests__/issue_1179_cancel_refund_fanout_adversarial_pg17.test.sql"
      - "mingla-business/src/services/businessEvents.ts"
      - "mingla-admin/src/services/offeringsService.js"
      - ".github/workflows/issue-1179-cancel-refund-fanout-tests.yml"
      # #2148 — this suite now gets its database from a shared composite action;
      # without this path a change to that action would not re-run it.
      - ".github/actions/migrated-postgres/**"

concurrency:
  group: ci-issue-1179-cancel-refund-fanout-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-1179-deno-check:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Issue 1179 edge fn type-check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check the fan-out handler
        run: >-
          deno check
          supabase/functions/event-cancel-refund-fanout/index.ts

  issue-1179-pg17:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Issue 1179 cancel-refund fan-out proof (PG17)"
    runs-on: ubuntu-latest
    # #2148 — the `services:` block that used to live here is gone. A service
    # container is started by the runner BEFORE any step runs, so nothing can
    # place a pre-migrated data directory into it; owning the container from a
    # step is what makes the cached snapshot possible. It still listens on
    # localhost:5432 with the same password, so every step below is unchanged.
    steps:
      - uses: actions/checkout@v4
      # #2148 — replaces this job's postgres bring-up: a service container plus a
      # full replay of every migration (MEASURED ~75s boot + ~105s replay). The
      # shared action restores a cached snapshot of the already-migrated cluster
      # and applies only what landed since, falling back to a full replay on any
      # doubt. It verifies policy/trigger/index/RLS counts against the snapshot's
      # build-time manifest before any test runs.
      - name: PostgreSQL 17 with every migration applied
        uses: ./.github/actions/migrated-postgres
        with:
          # Pinned at the call site, not inherited from the action default, so this
          # workflow still states the database it certifies against.
          image: supabase/postgres:17.4.1.075
          password: ${{ format('issue-1179-ci-{0}', github.run_id) }}
      - name: Execute issue 1179 cancel-refund fan-out proof (implementor happy-path)
        env:
          PGPASSWORD: ${{ format('issue-1179-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1179_cancel_refund_fanout_pg17.test.sql
      - name: Execute issue 1179 cancel-refund fan-out proof (tester adversarial)
        env:
          PGPASSWORD: ${{ format('issue-1179-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1179_cancel_refund_fanout_adversarial_pg17.test.sql
