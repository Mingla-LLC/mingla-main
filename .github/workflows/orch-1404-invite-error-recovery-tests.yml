name: ORCH-1404 Accept-Invite Error-Recovery Tests

# ORCH-1404 [accept-invite-web-error-recovery] — the fails-on-revert regression
# tests for (a) the Supabase FunctionsHttpError status/code parse fix and (b) the
# wrong-account "Sign in with a different email" recovery. These are jest suites
# (.test.ts/.test.tsx); the class-D strict-grep `jest-suites` job does NOT run
# jest, and the META-ORCH-1337 jest job is a DIFFERENT concern — so without this
# dedicated job the ORCH-1404 tests would exist but never gate (the dark-test-
# surface trap, ORCH-1383). EXPLICIT registry (never a glob), same discipline as
# meta-orch-1337-social-proof-tests.yml: add a new ORCH-1404 suite by appending
# its path below.

on:
  push:
    branches: [Seth, main]
    paths:
      - "mingla-business/app/**"
      - "mingla-business/src/**"
      - ".github/workflows/orch-1404-invite-error-recovery-tests.yml"
  pull_request:
    paths:
      - "mingla-business/app/**"
      - "mingla-business/src/**"
      - ".github/workflows/orch-1404-invite-error-recovery-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  orch-1404-jest:
    name: "ORCH-1404: accept-invite error-parse + wrong-account recovery (fails-on-revert regression suites)"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
      # EXPLICIT registry — add a new ORCH-1404 suite by appending a path; never glob.
      - name: Run ORCH-1404 mingla-business jest suites
        run: >
          npx jest
          src/services/__tests__/orch_1404_functions_error_parse.tester.test.ts
          src/components/invite/__tests__/orch_1404_wrong_account_recovery.tester.test.tsx
          --runInBand
