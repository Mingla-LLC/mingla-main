# #2438 SHADOW-PARITY-TRIGGER — remove before cutover
name: Issue 948 Wave 3 Screens and Copy Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "mingla-business/app/accept-brand-invitation.tsx"
      - "mingla-business/app/accept-brand-invitation/success.tsx"
      - "mingla-business/src/utils/bankFirstPartnerInvite.ts"
      - "mingla-business/src/utils/__tests__/issue_948_w3_bank_first_invite.implementor.test.ts"
      - "mingla-business/src/utils/__tests__/issue_948_w3_bank_first_invite.tester.test.ts"
      - "mingla-business/src/components/invite/**"
      - "mingla-business/src/components/brand/**"
      - "mingla-business/src/utils/brandStripeUiState.ts"
      - "mingla-business/src/utils/brandRole.ts"
      - "mingla-business/src/utils/brandPayout.ts"
      - "mingla-business/src/types/brand.ts"
      - "supabase/functions/_shared/brandInviteEmail.ts"
      - "supabase/functions/invite-brand-member/__tests__/issue-948-w3-bank-first-invite.implementor.test.ts"
      - "supabase/functions/invite-brand-member/__tests__/orch-1329-invite-email.tester.test.ts"
      - "supabase/functions/invite-brand-member/__tests__/orch-1329-download-cta.test.ts"
      - ".github/scripts/strict-grep/issue-949-invite-onboarding-offering-agnostic.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-948-w3-screens-copy-tests.yml"
  push:
    branches: [main]
    paths:
      - "mingla-business/app/accept-brand-invitation.tsx"
      - "mingla-business/app/accept-brand-invitation/success.tsx"
      - "mingla-business/src/utils/bankFirstPartnerInvite.ts"
      - "mingla-business/src/utils/__tests__/issue_948_w3_bank_first_invite.implementor.test.ts"
      - "mingla-business/src/utils/__tests__/issue_948_w3_bank_first_invite.tester.test.ts"
      - "mingla-business/src/components/invite/**"
      - "mingla-business/src/components/brand/**"
      - "mingla-business/src/utils/brandStripeUiState.ts"
      - "mingla-business/src/utils/brandRole.ts"
      - "mingla-business/src/utils/brandPayout.ts"
      - "mingla-business/src/types/brand.ts"
      - "supabase/functions/_shared/brandInviteEmail.ts"
      - "supabase/functions/invite-brand-member/__tests__/issue-948-w3-bank-first-invite.implementor.test.ts"
      - "supabase/functions/invite-brand-member/__tests__/orch-1329-invite-email.tester.test.ts"
      - "supabase/functions/invite-brand-member/__tests__/orch-1329-download-cta.test.ts"
      - ".github/scripts/strict-grep/issue-949-invite-onboarding-offering-agnostic.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-948-w3-screens-copy-tests.yml"

concurrency:
  group: issue-948-w3-screens-copy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-948-w3-screens-copy:
    name: "#948 W3: bank-first screens + offering-agnostic copy"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json

      - name: Install business dependencies
        working-directory: mingla-business
        run: npm ci

      - name: Install route-render proof dependency
        working-directory: mingla-business
        run: npm install --no-save --package-lock=false react-test-renderer@19.1.0

      - name: Run W3 business routing contracts
        working-directory: mingla-business
        run: >
          npx jest
          src/utils/__tests__/issue_948_w3_bank_first_invite.implementor.test.ts
          src/utils/__tests__/issue_948_w3_bank_first_invite.tester.test.ts
          src/components/invite/__tests__/BusinessAppDownloadCta.test.ts
          --runInBand

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run frozen invite-email contracts
        run: |
          deno test --allow-env --allow-net --no-check \
            supabase/functions/invite-brand-member/__tests__/issue-948-w3-bank-first-invite.implementor.test.ts \
            supabase/functions/invite-brand-member/__tests__/orch-1329-download-cta.test.ts \
            supabase/functions/invite-brand-member/__tests__/orch-1329-invite-email.tester.test.ts

      - name: Run #949 copy guard in both registered modes
        run: |
          node .github/scripts/strict-grep/issue-949-invite-onboarding-offering-agnostic.mjs --self-test
          node .github/scripts/strict-grep/issue-949-invite-onboarding-offering-agnostic.mjs
