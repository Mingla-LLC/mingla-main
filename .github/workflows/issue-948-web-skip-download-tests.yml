name: Issue 948 W4 Web Skip Download Tests

# #948 W4 [web-skip-download] — invite bank screen: Skip → {Download app |
# Continue on web} + invite-only Back-hide (WEB-only). Focused, paths-gated proof
# for the four touched product files, the two new jest suites, and the modified
# W3 route assertion. No strict-grep .mjs is added (the #949 guard's SURFACES
# array is merely extended), so MANIFEST.json totality is unaffected.

on:
  pull_request:
    branches: [main]
    paths:
      - "mingla-business/src/components/brand/BrandBankConnectBody.web.tsx"
      - "mingla-business/app/accept-brand-invitation.tsx"
      - "mingla-business/app/accept-brand-invitation/success.tsx"
      - "mingla-business/src/utils/bankFirstPartnerInvite.ts"
      - "mingla-business/src/utils/inviteFunnelSignal.ts"
      - "mingla-business/src/utils/__tests__/issue_948_web_skip_download.implementor.test.ts"
      - "mingla-business/src/components/brand/__tests__/issue_948_web_skip_download.render.tester.test.tsx"
      - "mingla-business/src/components/brand/__tests__/issue_948_web_skip_download.adversarial.tester.test.tsx"
      - "mingla-business/src/utils/__tests__/issue_948_w3_bank_first_invite.tester.test.ts"
      - "mingla-business/src/components/invite/**"
      - ".github/scripts/strict-grep/issue-949-invite-onboarding-offering-agnostic.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-948-web-skip-download-tests.yml"
  push:
    branches: [main]
    paths:
      - "mingla-business/src/components/brand/BrandBankConnectBody.web.tsx"
      - "mingla-business/app/accept-brand-invitation.tsx"
      - "mingla-business/app/accept-brand-invitation/success.tsx"
      - "mingla-business/src/utils/bankFirstPartnerInvite.ts"
      - "mingla-business/src/utils/inviteFunnelSignal.ts"
      - "mingla-business/src/utils/__tests__/issue_948_web_skip_download.implementor.test.ts"
      - "mingla-business/src/components/brand/__tests__/issue_948_web_skip_download.render.tester.test.tsx"
      - "mingla-business/src/components/brand/__tests__/issue_948_web_skip_download.adversarial.tester.test.tsx"
      - "mingla-business/src/utils/__tests__/issue_948_w3_bank_first_invite.tester.test.ts"
      - "mingla-business/src/components/invite/**"
      - ".github/scripts/strict-grep/issue-949-invite-onboarding-offering-agnostic.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-948-web-skip-download-tests.yml"

concurrency:
  group: issue-948-web-skip-download-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-948-web-skip-download:
    name: "#948 W4: web skip-download screen + copy guard"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json

      - name: Install business dependencies
        working-directory: mingla-business
        run: npm ci

      - name: Install route-render proof dependency
        working-directory: mingla-business
        run: npm install --no-save --package-lock=false react-test-renderer@19.1.0

      - name: Run W4 web skip-download contracts
        working-directory: mingla-business
        run: >
          npx jest
          src/utils/__tests__/issue_948_web_skip_download.implementor.test.ts
          src/components/brand/__tests__/issue_948_web_skip_download.render.tester.test.tsx
          src/components/brand/__tests__/issue_948_web_skip_download.adversarial.tester.test.tsx
          src/utils/__tests__/issue_948_w3_bank_first_invite.tester.test.ts
          --runInBand

      - name: Run #949 offering-agnostic copy guard in both registered modes
        run: |
          node .github/scripts/strict-grep/issue-949-invite-onboarding-offering-agnostic.mjs --self-test
          node .github/scripts/strict-grep/issue-949-invite-onboarding-offering-agnostic.mjs
