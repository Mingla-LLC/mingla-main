# #2437 SHADOW-PARITY-TRIGGER — remove before cutover
name: Issue 1516 Coach Mark Single Process Tests

# #1516 [coach mark single process] — there is exactly ONE coach-mark process.
#
# WHY THIS GATE EXISTS: `CoachMarkContext.tsx` carried an ORCH-0635 "legacy tour"
# normalization branch that fired on EVERY provider mount for any stored
# `coach_mark_step` in 1..COACH_STEP_COUNT and rewrote it to TOUR_COMPLETED (12),
# rendering nothing. But 1..11 is exactly the range the LIVE 11-step tour occupies
# while it is IN PROGRESS, so a real in-progress tour was indistinguishable from
# stale data and was destroyed by the post-onboarding provider remount (ATT prompt
# + refreshAllSessions showLoading unmounts the authed subtree). Brand-new users
# were dropped onto the Home deck with no tour and permanently stamped
# `coach_mark_step = 12`. Confirmed live on a real signup, and INVISIBLE to
# monitoring: 12 is written by BOTH the genuine-completion path and the silent-
# cancel path, and coach-mark analytics go to Mixpanel only. The database could
# not tell a completed tour from a cancelled one.
#
# WITHOUT THIS WORKFLOW THE SUITE WOULD BE DARK (the ORCH-1383 dark-test-surface
# trap): app-mobile has NO jest, its tests run under plain `node`, and no workflow
# sweeps src/contexts/__tests__/. Same shape and rationale as
# issue-1044-auth-failure-capture-tests.yml.
#
# The suite is NOT a source-grep — it sucrase-transpiles and EXECUTES the real
# CoachMarkContext.tsx against a deterministic hook runtime with fake timers, and
# asserts on the state machine (currentStep / isCoachActive / overlayVisible) plus
# the observed write log. Asserting on the persisted value alone is worthless here
# because 12 is unfalsifiable.
#
# EXPLICIT registry (never a glob) — add a suite by appending its path below.
# Invokes no .mjs under .github/scripts/strict-grep/, so MANIFEST.json totality
# and parity are untouched.

on:
  push:
    branches: [main]
    paths:
      - "app-mobile/src/contexts/CoachMarkContext.tsx"
      - "app-mobile/src/constants/coachMarkSteps.ts"
      - "app-mobile/src/contexts/__tests__/issue-1516-coach-mark-single-process.test.tsx"
      - "app-mobile/src/contexts/__tests__/issue-1516-coach-mark-grammar-and-blast-radius.tester-adversarial.test.tsx"
      - "app-mobile/app/index.tsx"
      - "supabase/migrations/20270210001516_issue_1516_normalize_coach_mark_step_grammar.sql"
      - "app-mobile/package.json"
      - ".github/workflows/issue-1516-coach-mark-tests.yml"
  pull_request:
    paths:
      - "app-mobile/src/contexts/CoachMarkContext.tsx"
      - "app-mobile/src/constants/coachMarkSteps.ts"
      - "app-mobile/src/contexts/__tests__/issue-1516-coach-mark-single-process.test.tsx"
      - "app-mobile/src/contexts/__tests__/issue-1516-coach-mark-grammar-and-blast-radius.tester-adversarial.test.tsx"
      - "app-mobile/app/index.tsx"
      - "supabase/migrations/20270210001516_issue_1516_normalize_coach_mark_step_grammar.sql"
      - "app-mobile/package.json"
      - ".github/workflows/issue-1516-coach-mark-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-1516-coach-mark-resume:
    name: "#1516 CONS: an in-progress coach tour survives the post-onboarding remount (fails-on-revert)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 — the app-mobile convention (there is no jest in this app).
          node-version: "22"
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json
      # npm ci is required: the suite EXECUTES the real provider, which it
      # transpiles with the already-vendored `sucrase`, and it loads the real
      # coachMarkSteps.ts so COACH_STEP_COUNT is never a replica.
      - name: Install deps (the suite executes the real provider via sucrase)
        run: npm ci
      - name: Run issue-1516 suite (implementor happy-path)
        run: npm run test:issue-1516
      # TESTER ADVERSARIAL (#1516). Different angle from the happy-path suite: the
      # value-grammar EDGES (COACH_STEP_COUNT / +1 / +2 / 99 / -5 / NULL), bottom-nav
      # liveness in every state that renders nothing (Constitution #1, gate expression
      # read out of app/index.tsx so it cannot drift), the TOUR_UNAVAILABLE public-API
      # blast radius, unmount-during-fetch-retry, concurrent double-mount, cross-user
      # start-delay anchor isolation, and the STEP-COUNT DRIFT TRIPWIRE — deleting the
      # ORCH-0635 branch also deleted the runtime's ability to repair a value it does
      # not understand, so bumping COACH_STEP_COUNT without shipping a migration must
      # turn this job red rather than silently re-open the tour for completed users.
      - name: Run issue-1516 suite (tester adversarial)
        run: npm run test:issue-1516-adv
      # The pre-existing coach-mark suites must stay green UNMODIFIED — the tour's
      # step count, id bijection, measurement gating, and Android inset correction
      # are untouched by #1516.
      - name: Run the pre-existing ORCH-1029 coach-mark suites (backward compatibility)
        run: npm run test:orch-1029 && npm run test:orch-1029-adv
