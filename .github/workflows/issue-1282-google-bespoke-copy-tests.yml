name: ISSUE-1282 Google Video Bespoke Copy Tests

# Scope #1282 — a follow-up to #997 D2. The Google Demand Gen VIDEO create branch
# already ACCEPTS explicit creative.long_headlines (≤90) + creative.business_name
# (≤25) and DERIVES them (RSA headlines / title-cased brand slug) when absent.
# #1282 wires the Campaign Builder wizard so the operator can WRITE bespoke long
# headlines + an optional business name, threaded through payload.js into the
# create branch; an empty field sends NOTHING so the derivation fallback and the
# SEARCH/RSA path stay byte-identical.
#
# This is an ADMIN-ONLY change (mingla-admin: payload.js + StepCopy.jsx +
# CampaignBuilderPage.jsx). No edge/_shared/migration file is touched, so the
# create branch is UNCHANGED — the shared ad-engine Deno siblings
# (#862/#866/#867/#927/#1002 + google/tiktok) cannot regress from this PR and are
# already re-run by issue-997-video-d2-tests.yml (it triggers on mingla-admin/src/**).
# Pure/source-only Node tests here: ZERO provider calls, ZERO ad objects, no spend.

on:
  push:
    branches: [main, "issue-1282-google-bespoke-copy"]
    paths:
      - "mingla-admin/src/lib/adBuilder/payload.js"
      - "mingla-admin/src/components/campaign-builder/StepCopy.jsx"
      - "mingla-admin/src/pages/CampaignBuilderPage.jsx"
      - "mingla-admin/src/__tests__/issue1282_google_bespoke_copy.test.js"
      - ".github/workflows/issue-1282-google-bespoke-copy-tests.yml"
  pull_request:
    paths:
      - "mingla-admin/src/**"
      - ".github/workflows/issue-1282-google-bespoke-copy-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run ISSUE-1282 regressions + the #864 / #927 / #997 / #992 / #995 / #989 / #986 / #1002 / #979 admin siblings
        # The siblings prove the payload.js google-branch edit did not regress the
        # existing per-channel payload contracts, the RSA/Search path, video
        # create gating, targeting, or multi-destination fan-out.
        working-directory: mingla-admin
        run: |
          node --test \
            src/__tests__/issue1282_google_bespoke_copy.test.js \
            src/__tests__/issue864_campaign_builder_happy.test.js \
            src/__tests__/issue864_campaign_builder_tester_adversarial.test.js \
            src/__tests__/issue927_create_wired_widened.test.js \
            src/__tests__/issue927_tester_adversarial.test.js \
            src/__tests__/issue997_google_video_create.test.js \
            src/__tests__/issue997_google_video_create.adversarial.tester.test.js \
            src/__tests__/issue992_google_snap_targeting.test.js \
            src/__tests__/issue992_google_snap_targeting_adversarial.test.js \
            src/__tests__/issue995_creative_video_not_creatable.test.js \
            src/__tests__/issue995_creative_video_variants.test.js \
            src/__tests__/issue995_creative_video_honesty.tester_adversarial.test.js \
            src/__tests__/issue989_targeting.test.js \
            src/__tests__/issue989_targeting_adversarial.test.js \
            src/__tests__/issue986_platform_picker.test.js \
            src/__tests__/issue986_platform_picker.adversarial.test.js \
            src/__tests__/issue1002_multi_destination.test.js \
            src/__tests__/issue1002_multi_destination.tester_adversarial.test.js \
            src/__tests__/issue979_correctness.adversarial.test.js
