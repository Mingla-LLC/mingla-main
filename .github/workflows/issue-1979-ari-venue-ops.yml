name: Issue 1979 Ari venue ops / SMS / availability / menu / waitlist

on:
  push:
    paths:
      - "supabase/functions/_shared/agentDomainTools.ts"
      - "supabase/functions/_shared/agentToolAuthorization.ts"
      - "supabase/functions/_shared/agentSystemPrompt.ts"
      - "supabase/functions/_shared/__tests__/issue_1979_ari_venue_ops.test.ts"
      - "supabase/functions/_shared/__tests__/issue_424_ari_domain_children.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2593_ari_wave3_defects.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2593_ari_wave3_defects.tester_adversarial.test.ts"
      # issue #2592 — the #1975 Stay/venue reservation tool contract, and the
      # migration whose repaired database contract that suite asserts. The
      # #1978 venue listings/claims suite is here for the same reason: it was
      # merged by PR #2413 and executed by NO lane, so it could pass by hand
      # forever while the contracts it pins drifted underneath it.
      - "supabase/functions/_shared/__tests__/issue_1975_ari_stays_reservations.test.ts"
      - "supabase/functions/_shared/__tests__/issue_1978_venue_listings_claims.test.ts"
      - "supabase/migrations/20270512001975_issue_1975_ari_stays_reservations.sql"
      - "docs/contracts/ari-capability-ledger.json"
      - ".github/scripts/strict-grep/issue-2000-ari-capability-ledger.mjs"
      - ".github/scripts/strict-grep/issue-2019-ari-delegated-auth.mjs"
      - ".github/scripts/strict-grep/issue-1970-ari-capabilities-sync.mjs"
  pull_request:
    paths:
      - "supabase/functions/_shared/agentDomainTools.ts"
      - "supabase/functions/_shared/agentToolAuthorization.ts"
      - "supabase/functions/_shared/agentSystemPrompt.ts"
      - "supabase/functions/_shared/__tests__/issue_1979_ari_venue_ops.test.ts"
      - "supabase/functions/_shared/__tests__/issue_424_ari_domain_children.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2593_ari_wave3_defects.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2593_ari_wave3_defects.tester_adversarial.test.ts"
      # issue #2592 — the #1975 Stay/venue reservation tool contract, and the
      # migration whose repaired database contract that suite asserts. The
      # #1978 venue listings/claims suite is here for the same reason: it was
      # merged by PR #2413 and executed by NO lane, so it could pass by hand
      # forever while the contracts it pins drifted underneath it.
      - "supabase/functions/_shared/__tests__/issue_1975_ari_stays_reservations.test.ts"
      - "supabase/functions/_shared/__tests__/issue_1978_venue_listings_claims.test.ts"
      - "supabase/migrations/20270512001975_issue_1975_ari_stays_reservations.sql"
      - "docs/contracts/ari-capability-ledger.json"
      - ".github/scripts/strict-grep/issue-2000-ari-capability-ledger.mjs"
      - ".github/scripts/strict-grep/issue-2019-ari-delegated-auth.mjs"
      - ".github/scripts/strict-grep/issue-1970-ari-capabilities-sync.mjs"

permissions:
  contents: read

concurrency:
  group: ci-issue-1979-ari-venue-ops-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  venue-ops-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 — issue-2000 ledger reads owners.source at the
      # immutable proven-broken audit SHA via `git show`.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      # Source contract + adversarial rejection for the repaired/registered tools.
      - run: deno test --allow-read supabase/functions/_shared/__tests__/issue_1979_ari_venue_ops.test.ts supabase/functions/_shared/__tests__/issue_424_ari_domain_children.test.ts supabase/functions/_shared/__tests__/issue_1975_ari_stays_reservations.test.ts supabase/functions/_shared/__tests__/issue_1978_venue_listings_claims.test.ts
      # issue #2593 — the eight #2415 (#424 Wave 3) defect-class repairs. Both
      # source files this lane already watches are the ones under repair, so the
      # proofs execute in the SAME lane that type-checks them.
      - run: deno test --allow-read supabase/functions/_shared/__tests__/issue_2593_ari_wave3_defects.test.ts
      - run: deno fmt --check supabase/functions/_shared/__tests__/issue_2593_ari_wave3_defects.test.ts
      # issue #2593 — INDEPENDENT TESTER adversarial proofs. Different axis:
      # the cursor guard at the executor seam (which the implementor suite
      # never reaches), the advertised contracts compared against the MIGRATION
      # itself, the refund numeric tower in BOTH directions, and containment
      # across the bulk guest_ids array. Reads the migration, so --allow-read.
      - run: deno test --allow-read supabase/functions/_shared/__tests__/issue_2593_ari_wave3_defects.tester_adversarial.test.ts
      - run: deno fmt --check supabase/functions/_shared/__tests__/issue_2593_ari_wave3_defects.tester_adversarial.test.ts
      - run: deno check supabase/functions/_shared/agentDomainTools.ts supabase/functions/_shared/agentTools.ts supabase/functions/_shared/agentToolAuthorization.ts
      # The registry / prompt / ledger / authorization contracts stay in bijection.
      - run: node .github/scripts/strict-grep/issue-1970-ari-capabilities-sync.mjs
      - run: node .github/scripts/strict-grep/issue-2019-ari-delegated-auth.mjs
      - run: node .github/scripts/strict-grep/issue-2000-ari-capability-ledger.mjs
