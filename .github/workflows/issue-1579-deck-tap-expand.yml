# #2437 SHADOW-PARITY-TRIGGER — remove before cutover
name: Issue 1579 Deck Tap Expand

# Enforces I-PROPOSED-1579-GESTURE-LEASE-RELEASE-COMPLETENESS.
#
# Gesture.Pan().onBegin claims the DRAGGING lease at touch-DOWN, ~106-117ms before
# TouchableOpacity.onPress runs at touch-UP. Gating tap-expand on canAdmitDeckInput
# (IDLE-only) was therefore unsatisfiable by construction — 100% of taps rejected,
# deterministically. And RNGH delivers NO onStart/onEnd/onFinalize for a pan that never
# activates, so nothing returned the phase to IDLE after a tap: the next swipe was
# rejected by admission control yet committed anyway on the stale epoch, bypassing the
# identity guard #1481 exists to provide.
#
# The runtime oracle for the symptom is "an expanded modal opens on a real device", which
# needs a simulator and cannot run here. These guards assert the CAUSE instead: the two new
# lifecycle predicates are pure and exported, so they are EXECUTED, and the measured RNGH
# callback traces are replayed through them. The structural wiring checks run on comment-
# and string-stripped source with paren/brace matching, because two guards on this very deck
# have already been found satisfiable by a comment or an opening-tag match.
#
# MEASURED ORDERING, and why the release is conditional (RNGH 2.28.0 / RN 0.81.5 / iOS 26.5):
# on a real swipe onTouchesUp arrives BEFORE onFinalize, and finalizeGesture early-returns
# unless the phase is still DRAGGING. An unconditional release kills EVERY swipe on the deck.
# That is the highest-risk mistake available here and it is invisible to all ten existing
# swipeDeck guards.
#
# This is a SEPARATE workflow from issue-1481-explorer-deck-tests.yml on purpose: that job's
# "require all eight" step must remain exactly eight guards, and a test reads the workflow
# and asserts it.
#
# NOTE ON THE ADVERSARIAL GUARD: issue_1579_tap_expand_admission.adversarial.test.mjs is the
# tester's deliverable (SPEC #1579 section 9.2) and lands on this same branch before merge,
# exactly as all eight #1481 guards did in PR #1531 and as #1576's did. Until it lands this
# job FAILS at the require step by design — an enforcement workflow that silently tolerates a
# missing guard is not an enforcement workflow. Do not weaken this step to make the PR green;
# land the guard.

on:
  push:
    branches: [main]
    paths:
      - "app-mobile/src/components/swipeDeck/**"
      - "docs/INVARIANT_REGISTRY.md"
      - ".github/workflows/issue-1579-deck-tap-expand.yml"
  pull_request:
    paths:
      - "app-mobile/src/components/swipeDeck/**"
      - "docs/INVARIANT_REGISTRY.md"
      - ".github/workflows/issue-1579-deck-tap-expand.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-1579-tap-expand-admission:
    name: "Issue 1579: a touch-down lease is releasable on every way the touch can end"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require both independent append-only guards
        run: |
          test -f app-mobile/src/components/swipeDeck/__tests__/issue_1579_tap_expand_admission.test.mjs
          test -f app-mobile/src/components/swipeDeck/__tests__/issue_1579_tap_expand_admission.adversarial.test.mjs
      - name: Execute the tap-admission and lease-release predicates against measured traces
        run: >-
          node --test
          app-mobile/src/components/swipeDeck/__tests__/issue_1579_tap_expand_admission.test.mjs
          app-mobile/src/components/swipeDeck/__tests__/issue_1579_tap_expand_admission.adversarial.test.mjs
