# #2437 SHADOW-PARITY-TRIGGER — remove before cutover
name: "Issue #2207 — merged-main manifest awareness"

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/scripts/strict-grep/**"
      - ".github/scripts/__tests__/issue-2207-merged-checkout-workflow.tester.test.mjs"
      - ".github/workflows/issue-2207-manifest-merge-awareness.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/strict-grep/**"
      - ".github/scripts/__tests__/issue-2207-merged-checkout-workflow.tester.test.mjs"
      - ".github/workflows/issue-2207-manifest-merge-awareness.yml"

permissions:
  contents: read

concurrency:
  group: issue-2207-manifest-merge-awareness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  merged-main-manifest-awareness:
    name: "Issue #2207: merged-main manifest awareness"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # META-1383 names the recent first-parent gate-registration commits
          # when the combined tree is wrong. A one-commit checkout would turn
          # that evidence into another vacuous diagnostic.
          fetch-depth: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install META-1383 YAML parser
        run: npm install --no-save yaml
      - name: Prove merge-aware regression behavior
        run: node --test .github/scripts/strict-grep/__tests__/issue-2207-manifest-merge-awareness.test.js
      - name: Prove merged-checkout workflow contract
        run: node --test .github/scripts/__tests__/issue-2207-merged-checkout-workflow.tester.test.mjs
      - name: Prove META-1383 hostile fixtures
        run: node .github/scripts/strict-grep/meta-1383-manifest-parity.mjs --self-test
      - name: Check the exact combined checkout
        run: node .github/scripts/strict-grep/meta-1383-manifest-parity.mjs
