name: Issue 1437 secret bundle compatibility tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/_shared/secretBundle.ts"
      - "supabase/functions/_shared/notificationRecipientHmac.ts"
      - "supabase/functions/_shared/sourceRefundControlPlane.ts"
      - "supabase/functions/_shared/issue_1437_secret_bundle_compatibility.test.ts"
      - "supabase/functions/_shared/issue_1437_secret_bundle_compatibility.tester.adversarial.test.ts"
      - "supabase/functions/notify-dispatch/index.ts"
      - "supabase/functions/brand-stripe-onboard/index.ts"
      - "supabase/functions/payout-release-sweep/index.ts"
      - ".github/scripts/strict-grep/issue-1437-secret-bundle-compatibility.mjs"
      - ".github/workflows/issue-1437-secret-bundle-compatibility-tests.yml"
  pull_request:
    paths:
      - "supabase/functions/_shared/secretBundle.ts"
      - "supabase/functions/_shared/notificationRecipientHmac.ts"
      - "supabase/functions/_shared/sourceRefundControlPlane.ts"
      - "supabase/functions/_shared/issue_1437_secret_bundle_compatibility.test.ts"
      - "supabase/functions/_shared/issue_1437_secret_bundle_compatibility.tester.adversarial.test.ts"
      - "supabase/functions/notify-dispatch/index.ts"
      - "supabase/functions/brand-stripe-onboard/index.ts"
      - "supabase/functions/payout-release-sweep/index.ts"
      - ".github/scripts/strict-grep/issue-1437-secret-bundle-compatibility.mjs"
      - ".github/workflows/issue-1437-secret-bundle-compatibility-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-1437-secret-bundle-compatibility:
    name: "#1437 bundled control compatibility and fail-safe guards"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - name: Run compatibility and adjacent runtime guards
        run: >-
          deno test --allow-env --allow-read --allow-net=deno.land,esm.sh
          supabase/functions/_shared/issue_1437_secret_bundle_compatibility.test.ts
          supabase/functions/_shared/issue_1437_secret_bundle_compatibility.tester.adversarial.test.ts
          supabase/functions/_shared/issue_1203_secret_bundles.test.ts
          supabase/functions/_shared/issue_1203_secret_bundle_adversarial.test.ts
          supabase/functions/_shared/__tests__/issue_1221_source_refund_control_plane.test.ts
          supabase/functions/brand-stripe-onboard/__tests__/issue_1173_onboard_dark_default.test.ts
          supabase/functions/payout-release-sweep/__tests__/issue_1172_stripe_payout_execution.test.ts
          supabase/functions/notify-dispatch/__tests__/issue_1221_source_refund_safe_boundary.test.ts
      - name: Run structural regression guard
        run: |
          node .github/scripts/strict-grep/issue-1437-secret-bundle-compatibility.mjs --self-test
          node .github/scripts/strict-grep/issue-1437-secret-bundle-compatibility.mjs
