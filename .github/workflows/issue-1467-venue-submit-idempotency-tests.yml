name: "Issue #1467 venue submit idempotency"

on:
  push:
    branches: [main]
    paths:
      - "mingla-business/app/venue/create.tsx"
      - "mingla-business/src/store/draftVenueStore.ts"
      - "mingla-business/src/components/venue/VenueCreatorWizard.tsx"
      - "mingla-business/src/components/venue/venueCreateBrandLifecycle.ts"
      - "mingla-business/src/components/venue/venueSubmissionResume.ts"
      - "mingla-business/src/components/venue/__tests__/venueSubmissionCompletion.issue1467.test.ts"
      - "mingla-business/src/components/venue/__tests__/venueSubmissionResume.issue1467.test.ts"
      - ".github/workflows/issue-1467-venue-submit-idempotency-tests.yml"
  pull_request:
    paths:
      - "mingla-business/app/venue/create.tsx"
      - "mingla-business/src/store/draftVenueStore.ts"
      - "mingla-business/src/components/venue/VenueCreatorWizard.tsx"
      - "mingla-business/src/components/venue/venueCreateBrandLifecycle.ts"
      - "mingla-business/src/components/venue/venueSubmissionResume.ts"
      - "mingla-business/src/components/venue/__tests__/venueSubmissionCompletion.issue1467.test.ts"
      - "mingla-business/src/components/venue/__tests__/venueSubmissionResume.issue1467.test.ts"
      - ".github/workflows/issue-1467-venue-submit-idempotency-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  single-row-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
      - name: Prove create-once retry and visible completion
        run: >-
          npx jest
          src/components/venue/__tests__/venueSubmissionResume.issue1467.test.ts
          src/components/venue/__tests__/venueSubmissionCompletion.issue1467.test.ts
          src/components/venue/__tests__/venueCreateBrandLifecycle.issue1461.test.ts
          src/components/venue/__tests__/VenueCreatorWizard.ve2.test.ts
          --runInBand
      - name: Lint changed boundaries
        run: >-
          npx eslint
          app/venue/create.tsx
          src/store/draftVenueStore.ts
          src/components/venue/VenueCreatorWizard.tsx
          src/components/venue/venueCreateBrandLifecycle.ts
          src/components/venue/venueSubmissionResume.ts
          src/components/venue/__tests__/venueSubmissionResume.issue1467.test.ts
          src/components/venue/__tests__/venueSubmissionCompletion.issue1467.test.ts
