name: Issue 1902 RSVP backend safety tests

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**issue_1902_public_event_lifecycle*"
      - "supabase/functions/public-submit-rsvp/**"
      - "docs/INVARIANT_REGISTRY.md"
      - ".github/scripts/strict-grep/issue-1902-rsvp-backend-safety.mjs"
      - ".github/workflows/issue-1902-rsvp-backend-safety-tests.yml"
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "supabase/migrations/**issue_1902_public_event_lifecycle*"
      - "supabase/functions/public-submit-rsvp/**"
      - "docs/INVARIANT_REGISTRY.md"
      - ".github/scripts/strict-grep/issue-1902-rsvp-backend-safety.mjs"
      - ".github/workflows/issue-1902-rsvp-backend-safety-tests.yml"

permissions:
  contents: read

concurrency:
  group: ci-issue-1902-rsvp-backend-safety-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  rsvp-backend-contract:
    if: ${{ github.event.pull_request.draft != true }}
    name: "#1902 RSVP SQLSTATE and handler contract"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - name: Prove the strict gate fails on true-source reversions
        run: node .github/scripts/strict-grep/issue-1902-rsvp-backend-safety.mjs --self-test
      - name: Enforce the backend safety boundary
        run: node .github/scripts/strict-grep/issue-1902-rsvp-backend-safety.mjs
      - name: Run implementor migration contract proof
        run: deno test --allow-read supabase/migrations/__tests__/issue_1902_public_event_lifecycle.test.ts
      - name: Run implementor shipped Edge mapping proof
        run: deno test --allow-read supabase/functions/public-submit-rsvp/__tests__/issue_1902_rsvp_end_guard.test.ts
      - name: Cache the real handler before the bounded child-process proof
        run: deno cache supabase/functions/public-submit-rsvp/index.ts
      - name: Run independent tester migration proof when present
        run: |
          test_file="supabase/migrations/__tests__/issue_1902_public_event_lifecycle.tester_adversarial.test.ts"
          if test -f "$test_file"; then deno test --allow-read "$test_file"; fi
      - name: Run independent tester Edge proof when present
        run: |
          test_file="supabase/functions/public-submit-rsvp/__tests__/issue_1902_rsvp_end_guard.tester_adversarial.test.ts"
          if test -f "$test_file"; then
            deno test --allow-env --allow-net --allow-read --allow-run "$test_file"
          fi
          # This invokes the actual public-submit-rsvp HTTP handler in a child
          # Deno process against a disposable Supabase-compatible HTTP upstream.
          # The named Deno test must remain present so source-only mapping proof
          # can never substitute for the required real-handler boundary.
          grep -Fq "actual public-submit-rsvp HTTP handler" "$test_file"
      - name: Type-check the deployed handler
        run: deno check supabase/functions/public-submit-rsvp/index.ts

  rsvp-backend-pg17:
    if: ${{ github.event.pull_request.draft != true }}
    name: "#1902 fresh PostgreSQL 17 RSVP boundary"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ format('issue-1902-ci-{0}', github.run_id) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PostgreSQL 17
        env:
          PGPASSWORD: ${{ format('issue-1902-ci-{0}', github.run_id) }}
        run: |
          for attempt in {1..90}; do
            if psql -h localhost -U postgres -d postgres -Atc \
              "SELECT to_regnamespace('vault') IS NOT NULL AND to_regrole('supabase_admin') IS NOT NULL" \
              2>/dev/null | grep -qx t; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Apply every migration in timestamp order
        env:
          PGPASSWORD: ${{ format('issue-1902-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 \
            | sort -z \
            | while IFS= read -r -d '' migration; do
                psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
              done
      - name: Run implementor RSVP write and Upcoming behavior proof
        env:
          PGPASSWORD: ${{ format('issue-1902-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1902_public_event_lifecycle.pg17.test.sql
      - name: Run independent tester PG17 proof when present
        env:
          PGPASSWORD: ${{ format('issue-1902-ci-{0}', github.run_id) }}
        run: |
          test_file="supabase/migrations/__tests__/issue_1902_public_event_lifecycle.pg17.tester_adversarial.test.sql"
          if test -f "$test_file"; then
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$test_file"
          fi
