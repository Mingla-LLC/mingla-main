name: Bundle Baseline Auto-Merge

# Issue #2524 — the missing half of #1509's ratchet.
#
# THE PROBLEM THIS EXISTS FOR: the boot-payload gate charges every pull request
# for `measured - baseline`, and that is only a PER-PR allowance if
# bundle-baseline.json tracks main. It does not track main on its own. The
# ratchet only ever LOWERS the baseline (to bank savings); growth is recorded by
# a machine-authored one-file PR that nobody merged. Eight were opened and
# abandoned on 2026-08-23, each superseding the last. So the baseline went stale
# by construction and the bill landed on whoever opened the next branch — #2479
# was charged 9,660 B it did not write, #2515 3,718 B, on consecutive days. Both
# cost a full CI cycle and both were "fixed" by a human doing this job by hand.
#
# WHAT THIS DOES: merges that recording PR, and only that PR, and only when it
# is provably safe and green. Five locks, all in
# mingla-business/scripts/ci/bundle-baseline-automerge.mjs, all fail-closed:
# author, single-file, all-green (PENDING AND EMPTY ARE NOT GREEN), ceiling
# runway, and a permanent trace in the merge commit.
#
# WHAT THIS DELIBERATELY DOES NOT DO: approve. #2058 forbade the review and
# approval endpoints and that still stands — an automation that approves its own
# artifact has no independent verifier left. The App instead holds a BYPASS on
# main's `general security` ruleset, granted 2026-08-24, which is a different
# thing: a permission GitHub evaluates against the caller when the merge is
# attempted, not a review this automation writes. It also cannot move
# HARD_CEILING or PR_DELTA_ALLOWANCE; those live in
# orch-1083-initial-bundle-budget.mjs and remain Seth's.
#
# THERE IS NO OPERATOR PREREQUISITE. An earlier version of this comment said the
# App had to be added as a bypass actor before the merge could work, and that
# instruction outlived its truth by a week: the bypass was granted on
# 2026-08-24 and the job kept printing the instruction anyway, because it was
# deciding by READING `mergeable_state` — a field GitHub computes without
# reference to the caller, so it reports `blocked` to a bypass holder too. That
# made it a guard that could not pass. Proven by execution (#2885) on
# 2026-09-01: the same job, the same minted token, four seconds apart, read
# `mergeable_state="blocked"` with 56 checks green and then merged PR #2884 with
# `PUT /pulls/2884/merge` -> HTTP 200. The job now ATTEMPTS the merge and reports
# whatever GitHub answers; if a merge is ever genuinely blocked, the returned
# message names the real reason instead of a guessed one. If this ever starts
# refusing on every run again, it FAILS after
# STALE_REFUSAL_MINUTES rather than going unread.
#
# WHY A POLL RATHER THAN AN EVENT: the merge can only happen in the window where
# the recording PR's checks have finished AND main has not moved. Nothing emits
# an event at that moment — check completion does not know about main, and the
# ratchet fires long before the checks exist. A poll re-reads live state each
# time, so there is no "decided earlier, acted later" gap. Missing a window
# costs nothing: the baseline is an ABSOLUTE measurement of main, not a delta,
# so the next merge's recording PR carries the cumulative number anyway. On a
# busy day only the last one needs to land.
#
# WHY NOT GITHUB'S NATIVE AUTO-MERGE: it fires on the ruleset's REQUIRED checks
# only, which cannot express "every check completed and none failed", and it has
# no way at all to express the ceiling-runway refusal. It would also leave PRs
# armed after they go stale.

on:
  schedule:
    # Every 15 minutes. A recording PR's checks land roughly 15 minutes after
    # its merge, so the baseline is current within about half an hour of the
    # last merge in a burst.
    - cron: "*/15 * * * *"
  workflow_dispatch:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths: &issue2524_paths
      - ".github/workflows/bundle-baseline-automerge.yml"
      - "mingla-business/scripts/ci/bundle-baseline-automerge.mjs"
      - "mingla-business/scripts/ci/bundle-baseline-pr-handoff.mjs"
      - "mingla-business/scripts/ci/bundle-baseline-update.mjs"
      - "mingla-business/scripts/ci/orch-1083-initial-bundle-budget.mjs"
      - "mingla-business/scripts/ci/__tests__/issue2524_bundle_baseline_automerge.happy.test.mjs"
      # #2885 AC-4. `bundle-baseline.json` is deliberately NOT here: its VALUE
      # cannot change what the merge machinery does, and starting two jobs to
      # prove that on every recording PR is the waste this scoping removes.
      # `.github/workflows/**` IS here: the guard suite asserts that a
      # baseline-only pull request starts nothing but the two ruleset-required
      # checks and the provenance guard, and a new workflow is exactly how that
      # scoping gets silently undone.
      - ".github/workflows/**"
  push:
    branches: [main]
    paths: *issue2524_paths

permissions:
  contents: read

concurrency:
  group: ci-bundle-baseline-automerge-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  # Runs on pull requests and on main. Never sees a credential — the App key is
  # referenced only inside the scheduled job below, which cannot run on a PR
  # event. This repository is public; that separation is not cosmetic.
  guard-tests:
    name: "issue #2524: the five auto-merge guards"
    if: ${{ (github.event.pull_request.draft != true) && (github.event_name == 'pull_request' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # House rule (per meta-orch-1337 and #2468): EXPLICIT file names, never a
      # glob and never a `-t` pattern. A pattern that matches zero files exits 0
      # and reports success, which is the unfalsifiable-gate class these guards
      # exist to close. The existence check makes a renamed or deleted suite a
      # RED, not a silent skip.
      - name: The guard suite exists
        run: test -f scripts/ci/__tests__/issue2524_bundle_baseline_automerge.happy.test.mjs

      - name: Run the #2524 guard suite
        run: node --test scripts/ci/__tests__/issue2524_bundle_baseline_automerge.happy.test.mjs

  automerge:
    name: "Merge the current baseline recording PR, if it is safe and green"
    if: ${{ (github.event.pull_request.draft != true) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      # The same repository-only App that authors the recording PR is the only
      # identity allowed to merge it. The built-in token stays read-only and can
      # neither push a ref nor merge a pull request.
      - name: Mint the one-job bundle-baseline App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.BUNDLE_BASELINE_APP_CLIENT_ID }}
          private-key: ${{ secrets.BUNDLE_BASELINE_APP_PRIVATE_KEY }}
          owner: Mingla-LLC
          repositories: mingla-main
          permission-contents: write
          permission-pull-requests: write

      - name: Merge the recording PR if every guard passes
        env:
          BUNDLE_BASELINE_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          BUNDLE_BASELINE_APP_SLUG: ${{ vars.BUNDLE_BASELINE_APP_SLUG }}
        run: node mingla-business/scripts/ci/bundle-baseline-automerge.mjs --automerge
