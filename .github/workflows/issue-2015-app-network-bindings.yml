name: "Issue #2015 app-network and AppsFlyer bindings"

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "supabase/migrations/**2015**"
      - "supabase/migrations/**2041**"
      - "supabase/functions/admin-ad-app-readiness/**"
      - "supabase/functions/_shared/adAppReadiness.ts"
      - "supabase/functions/_shared/adAppReadinessProviders/**"
      - "mingla-admin/src/services/adEngineService.js"
      - ".github/workflows/issue-2015-app-network-bindings.yml"
  workflow_dispatch:

concurrency:
  group: ci-issue-2015-app-network-bindings-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  contracts:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mingla-admin/package-lock.json
      - run: deno test --allow-read supabase/migrations/__tests__/issue_2015_app_network_appsflyer_bindings.test.ts
      - run: deno test --allow-read supabase/migrations/__tests__/issue_2015_app_network_appsflyer_bindings.rework.test.ts
      - run: deno test --allow-read supabase/migrations/__tests__/issue_2041_google_link_id_format.test.ts
      - run: deno test supabase/functions/_shared/__tests__/issue2015_app_network_bindings.test.ts supabase/functions/_shared/__tests__/issue2015_provider_allowlist.adversarial.test.ts supabase/functions/_shared/__tests__/issue2015_rework_provider_truth.test.ts supabase/functions/_shared/__tests__/issue2038_appsflyer_production_shape.test.ts supabase/functions/_shared/__tests__/issue2038_appsflyer_production_shape.adversarial.test.ts supabase/functions/_shared/__tests__/issue2038_appsflyer_production_authority.rework.test.ts supabase/functions/_shared/__tests__/issue2041_google_app_link_readiness.test.ts supabase/functions/_shared/__tests__/issue2041_google_app_link_readiness.adversarial.test.ts supabase/functions/_shared/__tests__/issue2041_google_app_link_id_hex.rework.test.ts supabase/functions/admin-ad-app-readiness/__tests__/issue2015_safe_binding.test.ts supabase/functions/admin-ad-app-readiness/__tests__/issue2015_rework_conflicts.test.ts
      - run: deno test --allow-read supabase/functions/_shared/__tests__/issue1950_app_readiness.test.ts supabase/functions/admin-ad-app-readiness/__tests__/issue1950_handler.test.ts
      - run: deno check supabase/functions/_shared/adAppReadiness.ts supabase/functions/_shared/adAppReadinessProviders/*.ts supabase/functions/admin-ad-app-readiness/index.ts
      - name: Apply full migration chain and prove PG17 contract
        env:
          PGPASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do pg_isready -h localhost -U postgres && break; sleep 1; done
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z | while IFS= read -r -d '' migration; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
          done
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/__tests__/issue_2015_app_network_appsflyer_bindings.happy.pg17.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/__tests__/issue_2015_app_network_appsflyer_bindings.rework.pg17.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/__tests__/issue_2041_google_link_id_format.pg17.test.sql
          bash supabase/migrations/__tests__/issue_2015_app_network_appsflyer_bindings.concurrency.pg17.test.sh
      - name: Install Admin dependencies
        working-directory: mingla-admin
        run: npm ci
      - name: Lint the #2015 Admin service boundary
        working-directory: mingla-admin
        run: npx eslint src/services/adEngineService.js
      - name: Build Admin production bundle
        working-directory: mingla-admin
        run: npm run build
