name: "Issue #2117 offering visibility gate"

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "supabase/migrations/20270415002117_issue_2117_offering_visibility_gate.sql"
      - "supabase/migrations/20270605002728_issue_2728_ticket_sold_count_namespace.sql"
      - "supabase/migrations/__tests__/issue_2117_offering_visibility_gate*"
      - "supabase/migrations/__tests__/issue_2728_*"
      - "supabase/migrations/__tests__/issue_2117_asc9_baseline_capture.sql"
      - "supabase/functions/_shared/contentShare.ts"
      - "supabase/functions/_shared/businessNotifyTriggers.ts"
      - "supabase/security/anon_executable_definer_allowlist.txt"
      - "docs/INVARIANT_REGISTRY.md"
      - ".github/workflows/issue-2117-offering-visibility-gate-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20270415002117_issue_2117_offering_visibility_gate.sql"
      - "supabase/migrations/20270605002728_issue_2728_ticket_sold_count_namespace.sql"
      - "supabase/migrations/__tests__/issue_2117_offering_visibility_gate*"
      - "supabase/migrations/__tests__/issue_2728_*"
      - "supabase/migrations/__tests__/issue_2117_asc9_baseline_capture.sql"
      - "supabase/functions/_shared/contentShare.ts"
      - "supabase/functions/_shared/businessNotifyTriggers.ts"
      - "supabase/security/anon_executable_definer_allowlist.txt"
      - ".github/workflows/issue-2117-offering-visibility-gate-tests.yml"

permissions:
  contents: read

concurrency:
  group: ci-issue-2117-offering-visibility-gate-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  postgres-replay:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ github.sha }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10 --health-start-period 30s
    steps:
      # fetch-depth: 0 is required by the allowlist-diff step below. The default
      # shallow checkout has no base commit, which makes `git diff <base>` fail
      # with `fatal: bad revision` rather than reporting a real modification.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A-SC-9 is a SET DIFFERENCE, so it needs a genuine BEFORE snapshot.
      # The chain is therefore applied in two phases: everything except the
      # #2117 migration, then the baseline capture, then #2117. Applying the
      # chain in one pass would leave nothing to difference against.
      - name: "Canonical migration replay — phase 1 (chain except #2117)"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          set -euo pipefail
          for f in $(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | sort); do
            case "$f" in
              *20270415002117_issue_2117_offering_visibility_gate.sql) continue ;;
              # issue #2489 — SKIPPED for the same reason this phase skips #2117.
              #
              # This phase deliberately runs the chain WITHOUT #2117, and
              # 20270523002489 re-emits `pg_public_experience_by_slug`, whose
              # CURRENT body — defined by #2117 itself — calls
              # `pg_offering_visibility_gate`. A `LANGUAGE sql` body is validated
              # at CREATE time, so applying #2489 here aborts with "function
              # public.pg_offering_visibility_gate(...) does not exist".
              #
              # The reference is CORRECT — it is the visibility control on a public
              # reader — and removing it to green this lane would delete that
              # control. #2489 re-emits the function only to route its
              # address-privacy predicate through the one shared definition; the
              # visibility arm is untouched.
              #
              # Covered end-to-end by the unfiltered full-chain lanes that trigger
              # on `supabase/migrations/**`, which replay the FULL chain in true
              # filename order.
              #
              # Matched by EXACT filename, never an issue-number infix.
              *20270523002489_issue_2489_address_privacy_server_gate.sql) continue ;;
              # issue #2728 -- the fix-forward definition must not land before
              # the pre-#2117 baseline; doing so contaminates the before-state.
              *20270605002728_issue_2728_ticket_sold_count_namespace.sql) continue ;;
              *20270607002774_issue_2774_public_hero_alt.sql) continue ;;
              # issue #2491 C2 steps 3+4 — SKIPPED for the same reason this phase
              # skips #2117. #2491 re-emits `pg_direct_event_checkout_bundle`,
              # whose CURRENT body reaches `issue_2489_address_withheld` /
              # `issue_2489_public_theme`, which this phase does not have.
              # EXACT FILENAME: an `*_issue_2491_*` infix would also skip the
              # step-1 and step-1b migrations, which this phase must apply.
              *20270604002491_issue_2491_c2_step34_switch_sold_readers.sql) continue ;;
            esac
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: "A-SC-9 baseline capture (before #2117 lands)"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2117_asc9_baseline_capture.sql

      - name: "Canonical migration replay — phase 2 (#2117)"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q \
            -f supabase/migrations/20270415002117_issue_2117_offering_visibility_gate.sql

      - name: "#2728 forward repair migration"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q \
            -f supabase/migrations/20270605002728_issue_2728_ticket_sold_count_namespace.sql

      - name: "#2728 namespace-collision executable suites"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          set -euo pipefail
          for suite in supabase/migrations/__tests__/issue_2728_*.pg17.test.sql; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$suite"
          done

      # Every assertion in this suite EXECUTES an object against real rows.
      # Per #2113, nothing here is satisfiable by source text. The suite also
      # self-fails (A-SC-10) if the fixture matrix is incomplete, if any
      # reader produced no ALLOW outcome, or if any produced no DENY outcome.
      - name: "#2117 executable suite (implementor happy path)"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2117_offering_visibility_gate.pg17.test.sql

      # The suite is idempotent: it pre-cleans and tears down its own fixtures.
      # Running it twice proves it, and proves the first run left no residue
      # that a later suite in the same job would trip over.
      - name: "#2117 suite is idempotent (second consecutive run)"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2117_offering_visibility_gate.pg17.test.sql

      # TESTER ADVERSARIAL suite — a DIFFERENT ANGLE from the implementor's
      # happy path, on its own 60-fixture matrix (3 offering types x 5
      # visibility states x 4 status values) and its own namespace, so the two
      # cannot mask each other. It compares payload DIGESTS across roles rather
      # than cardinality, differences the public path against the §4.5 siblings
      # (the pre-change bodies verbatim, and therefore an in-cluster pre-change
      # oracle) in BOTH directions at every public (type x status) pair,
      # exercises the organiser under the REAL signed-in role on the read AND
      # write path with affected-row-count comparison, measures non-vacuity from
      # public.events rather than from its own ledger, and asserts closure
      # against BOTH governed roles. It reds on three mutations the happy-path
      # suite greens. It runs LAST among the psql steps because it tears down
      # its own fixtures and creates no object outside its own schema, so the
      # allowlist gate below is unaffected by it.
      - name: "#2117 tester adversarial suite"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2117_offering_visibility_gate.tester_adversarial.pg17.test.sql

      # SC-9 / A-SC-9: the shipped anon-definer gate must stay green with the
      # allowlist UNMODIFIED. No object created by #2117 is anon-executable,
      # so the allowlist gains zero entries.
      - name: Anonymous SECURITY DEFINER allowlist gate
        env:
          PGPASSWORD: ${{ github.sha }}
        run: bash scripts/ci/security_definer_anon_gate.sh

      # A-SC-9 clause 1: the allowlist FILE gains and loses ZERO lines. Asserted
      # against the exact base commit, never a symbolic ref -- a missing ref
      # must not be able to masquerade as a passing or a failing diff.
      - name: "A-SC-9 clause 1 — allowlist file is unmodified by this change"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          ALLOWLIST=supabase/security/anon_executable_definer_allowlist.txt
          if [ -z "${BASE_SHA:-}" ]; then
            BASE_SHA="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "${BASE_SHA:-}" ]; then
            echo "A-SC-9 clause 1 FAILED: no base commit resolved, so the criterion could not be evaluated."
            echo "A criterion that cannot be evaluated is not a criterion that passed."
            exit 1
          fi
          if ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "A-SC-9 clause 1 FAILED: base commit ${BASE_SHA} is not present in this checkout."
            echo "fetch-depth: 0 is required for this step."
            exit 1
          fi
          echo "Base commit: ${BASE_SHA}"
          if ! git diff --quiet "${BASE_SHA}" -- "$ALLOWLIST"; then
            echo "A-SC-9 clause 1 FAILED: the anon-definer allowlist was modified; #2117 requires zero added or removed lines."
            git diff "${BASE_SHA}" -- "$ALLOWLIST"
            exit 1
          fi
          echo "OK: allowlist file unmodified against ${BASE_SHA}."

  edge-typecheck:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      # §4.5 repointing: the two privileged consumers must still type-check
      # after being pointed at the service_role-only siblings.
      - run: deno check supabase/functions/_shared/contentShare.ts
      - run: deno check supabase/functions/_shared/businessNotifyTriggers.ts
