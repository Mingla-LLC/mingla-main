name: ORCH-0976 Draft-Promotion Tests

# Issue #976 [event-name-focus] — the fails-on-revert regression suites for the
# create-event first-keystroke focus/keyboard drop: (a) the single-flight
# d_*→server promotion registry (draftPromotion.ts — one createServerDraft per
# d_* id, live-merge swap, discard-mid-flight guard), (b) the legacy migration
# loop's active-draft suppression, and (c) the route-level keystroke-survives
# proofs (1 wizard mount, 0 router.replace, 1 row, full live text) on BOTH
# wizards. These are jest suites (.test.ts/.test.tsx) under the STOCK
# mingla-business/jest.config.cjs — bare react-test-renderer harnesses, NO
# .orch1118-testdeps overlay (#976 SPEC §8 CI-truth preamble). The class-D
# strict-grep `jest-suites` job does NOT run mingla-business jest, so without
# this dedicated job the #976 tests would exist but never gate (the
# dark-test-surface trap, ORCH-1383). EXPLICIT registry (never a glob), same
# discipline as orch-1404-invite-error-recovery-tests.yml: add a new #976
# suite by appending its path below.

on:
  push:
    branches: [Seth, main]
    paths:
      - "mingla-business/**"
      - ".github/workflows/orch-0976-draft-promotion-tests.yml"
  pull_request:
    paths:
      - "mingla-business/**"
      - ".github/workflows/orch-0976-draft-promotion-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  orch-0976-jest:
    name: "ORCH-0976: single-owner draft promotion + keystroke-survives (fails-on-revert regression suites)"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
      # react-test-renderer is a TEST-ONLY renderer, deliberately NOT an app
      # dependency (same class as the strict-grep workflow's --no-save parser
      # installs). Pin to the installed react major.
      - name: Install test-only renderer (react-test-renderer, --no-save)
        run: npm install --no-save react-test-renderer@19.1.0
      # EXPLICIT registry — add a new #976 suite by appending a path; never glob.
      - name: Run ORCH-0976 mingla-business jest suites
        run: >
          npx jest
          src/utils/__tests__/draftPromotion.orch0976.test.ts
          src/hooks/__tests__/useServerDraftEvents.orch0976.activeDraft.test.tsx
          src/components/rsvp/__tests__/RsvpRouteKeystrokeSurvives.orch0976.test.tsx
          src/components/event/__tests__/EventRouteKeystrokeSurvives.orch0976.test.tsx
          --runInBand
