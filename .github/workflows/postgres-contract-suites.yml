            supabase/functions/payout-release-sweep/__tests__/issue_1174_atomic_visibility_race_adversarial.sh \
            pg-contract-suites suite_1174

      # ── Guard G-7 — the #1174 driver honoured its database argument ──────
      #
      # This driver is the one file of the twenty-three that commits durable,
      # un-cleaned fixture rows on SUCCESS. If the database argument had not
      # reached it, that residue would be in the migrated template and every
      # assertion in the file would still have passed.
