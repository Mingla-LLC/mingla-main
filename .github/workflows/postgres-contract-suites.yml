      - name: "#1840 · Run the #1840 sweep wiring + money-path regression tests"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          source .github/scripts/parity/pgsuite.sh
          run_logged M-1840-06 deno - -- \
            deno test --allow-read --allow-env --allow-net --no-check \
            supabase/functions/payout-release-sweep/__tests__/issue_1840_ng_float_alerts.test.ts \
            supabase/functions/payout-release-sweep/__tests__/issue_1840_ng_float_alerts_adversarial.test.ts \
            supabase/functions/payout-release-sweep/__tests__/issue_1840_ng_float_alerts_retest.test.ts

      # Duplicates M-1177-03 and M-1217A-03 exactly. It moves across as its own
      # step and is NOT merged with them (D-3).
      - name: "#1840 · Re-run the neighbouring #1177/#1219 payout suites"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          source .github/scripts/parity/pgsuite.sh
          run_logged M-1840-07 deno - -- \
            deno test --allow-read --allow-env --allow-net --no-check \
            supabase/functions/payout-release-sweep/__tests__/issue_1177_paystack_organiser_release.test.ts \
            supabase/functions/payout-release-sweep/__tests__/issue_1177_paystack_organiser_release_adversarial.test.ts \
            supabase/functions/payout-release-sweep/__tests__/issue_1219_reversal_amount_safety.test.ts

      # ══ #1177 ═══════════════════════════════════════════════════════════
      #
      # #1177 executes ZERO SQL — its two Deno tests never touch a database.
      # It moves across intact anyway (D-3), and it is given NO suite database.
      # Provisioning one nothing connects to would be an artifact carrying no
      # information. Guard G-2b asserts that absence positively, so it is
      # visible rather than silent.
      - name: "#1177 · Run the #1177 organiser Paystack execution behavior tests"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          source .github/scripts/parity/pgsuite.sh
          run_logged M-1177-03 deno - -- \
            deno test --allow-read --allow-env --allow-net --no-check \
            supabase/functions/payout-release-sweep/__tests__/issue_1177_paystack_organiser_release.test.ts \
            supabase/functions/payout-release-sweep/__tests__/issue_1177_paystack_organiser_release_adversarial.test.ts

      # ══ #1171 ═══════════════════════════════════════════════════════════
      #
      # The only Deno leg of the nine that touches a database: its tests reach
      # PostgreSQL by `docker exec`, taking the container from
      # ISSUE_1171_POSTGRES_CONTAINER and — since #2591 — the database from
      # ISSUE_1171_POSTGRES_DATABASE.
      - name: "G-8 · record the per-database session counters before #1171 runs"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          sessions_of() {
            docker exec -i "$PG_CONTRACT_CONTAINER" \
              psql -v ON_ERROR_STOP=1 -At -U postgres -d template1 \
              -c "SELECT coalesce(sessions, 0) FROM pg_stat_database WHERE datname = '$1'"
          }
          sessions_of suite_1171 > "$RUNNER_TEMP/g8_suite_before.txt"
          echo "before: suite_1171=$(cat "$RUNNER_TEMP/g8_suite_before.txt")"

      - name: "#1171 · Run executable SQL contract and seeded dark-sweep tests"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        env:
          ISSUE_1171_SQL_BEHAVIOR: "1"
          ISSUE_1171_POSTGRES_CONTAINER: pg-contract-suites
          ISSUE_1171_POSTGRES_DATABASE: suite_1171
        run: |
          source .github/scripts/parity/pgsuite.sh
          run_logged M-1171-03 deno suite_1171 -- \
            deno test --allow-read --allow-env --allow-net --allow-run=docker --no-check \
            supabase/migrations/__tests__/issue_1171_dark_payout_ledger.test.ts \
            supabase/functions/payout-release-sweep/__tests__/issue_1171_dark_payout_ledger.test.ts \
            supabase/functions/payout-release-sweep/__tests__/issue_1171_dark_payout_ledger.adversarial.test.ts

      # ── Guard G-8 — #1171's Deno tests honoured their database variable ──
      #
      # #1171's SQL is BEGIN...ROLLBACK, so it leaves no durable residue to
      # count. The POSITIVE witness is the cluster's own per-database session
      # counter: sessions opened against suite_1171 must have gone up. If
      # ISSUE_1171_POSTGRES_DATABASE does not reach the tests, that delta is zero
      # and this is RED — which is the mutant this guard exists for.
      #
      # The NEGATIVE half deliberately no longer counts template sessions.
      # `pg_stat_database.sessions` is cumulative over ALL sessions and cannot
      # tell a background worker from a client backend, and this image runs
      # `pg_net` and `pg_cron` permanently attached to the default database —
      # MEASURED in run 3: they reconnect the instant the copy window reopens and
      # contributed a template delta of 2 while all 19 of #1171's tests passed
      # against suite_1171. A bare count cannot pass on this image. Subtracting a
      # constant 2 would be worse than useless: it would match today's worker
      # count and rot silently the day the image ships a third worker.
      #
      # This is the same defect as G-3b's, in a second place, and it is fixed the
      # same way — by backend_type, not by arithmetic.
      #
      # What actually proves "not in the template" is the placement guard the
      # tester ships INSIDE the two #1171 suites: it runs through the suite's own
      # connection and RAISEs if current_database() is not a suite_* database, so
      # no background worker can stand in for it and no counter can be fooled.
      # This guard therefore asserts what only it can see from outside — that the
      # suite really connected to suite_1171 — and reports the workers by name
      # instead of pretending they are not there.
      - name: "G-8 · #1171's SQL ran against suite_1171, not against the template"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          sessions_of() {
            docker exec -i "$PG_CONTRACT_CONTAINER" \
              psql -v ON_ERROR_STOP=1 -At -U postgres -d template1 \
              -c "SELECT coalesce(sessions, 0) FROM pg_stat_database WHERE datname = '$1'"
          }
          suite_delta=$(( $(sessions_of suite_1171) - $(cat "$RUNNER_TEMP/g8_suite_before.txt") ))
          echo "sessions opened against suite_1171 by #1171's suite: $suite_delta"
          if [ "$suite_delta" -le 0 ]; then
            echo "::error::G-8: #1171's Deno suite opened no session against suite_1171. ISSUE_1171_POSTGRES_DATABASE did not reach the tests, so their SQL ran somewhere else and every assertion still passed."
            exit 1
          fi
          echo "── what is attached to the template, by identity, not by count ──"
          docker exec -i "$PG_CONTRACT_CONTAINER" \
            psql -v ON_ERROR_STOP=1 -At -F' | ' -U postgres -d template1 \
            -c "SELECT pid, usename, coalesce(application_name, '-'), backend_type
                  FROM pg_stat_activity WHERE datname = '$PG_CONTRACT_TEMPLATE' ORDER BY pid" || true
          stragglers="$(docker exec -i "$PG_CONTRACT_CONTAINER" \
            psql -v ON_ERROR_STOP=1 -At -U postgres -d template1 \
            -c "SELECT count(*) FROM pg_stat_activity
                 WHERE datname = '$PG_CONTRACT_TEMPLATE' AND pid <> pg_backend_pid()
                   AND backend_type = 'client backend'")"
          if [ "$stragglers" != "0" ]; then
            echo "::error::G-8: $stragglers client backend(s) are still attached to the migrated template after #1171 ran. A suite reaches PostgreSQL as a client backend, so this is a suite in the template."
            exit 1
          fi
          echo "G-8 PASS: $suite_delta session(s) opened against suite_1171; no client backend on the template. The in-suite placement guard is the authority for the negative."

      # ══ #1173 ═══════════════════════════════════════════════════════════
      #
      # One step, not seven. Its four processes are a single ordered sequence
      # and splitting them would break the `&` / `$!` / `wait` pairing on which
      # the concurrency proof depends. All seven executions target the SAME
      # database — `race_setup` COMMITs the fixtures `race_a`, `race_b` and the
      # assert file depend on, so a different database for any one of them
      # silently voids the proof.
      #
      # Last of the nine origin-lane suites because `race_a` holds its FOR
      # UPDATE lock through pg_sleep(6): this sequence carries a ~8 s serial
      # floor and is the critical path. [#2594] It is no longer the last step in
      # the job — the rehomed #1384/#1397 subjects follow it — and the sentence
      # is corrected rather than left standing, because a stale "last in the
      # job" is exactly the kind of claim a later reader cites as fact.
      - name: "#1173 · Apply every migration to clean PostgreSQL 17 + run the RPC SQL test"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          source .github/scripts/parity/pgsuite.sh
          run_psql M-1173-02a suite_1173 supabase/migrations/__tests__/issue_1173_stamp_cutover.test.sql
          run_psql M-1173-02b suite_1173 supabase/migrations/__tests__/issue_1173_rollback_cutover_guard.adversarial.test.sql
          run_psql M-1173-02c suite_1173 supabase/migrations/__tests__/issue_1807_paystack_ledger_truth.test.sql
          # The #1807 tester-adversarial suite proves two admins stamping the
          # same brand at once cannot double-stamp it. That needs two genuinely
          # concurrent sessions. dblink cannot supply them here: dblink_connect
          # and dblink_connect_u are the same C function differing only in
          # SECURITY DEFINER, and it gates on superuser() — supabase/postgres
          # de-superusers `postgres`, which is also the role that creates the
          # extension in this job and therefore OWNS dblink_connect_u, so the
          # bypass is inert. Two real psql processes authenticate exactly the way
          # every other step here already does, and need no credential passed in.
          #
          # A is launched in the background and holds the FOR UPDATE row lock;
          # B contends two seconds later and blocks on it; the suite then asserts
          # exactly one stamp and one idempotent skip per brand, whichever won.
          run_psql M-1173-02d suite_1173 supabase/migrations/__tests__/issue_1807_tester_adversarial_race_setup.sql
          # `race_a` is backgrounded by run_psql_background, which wraps it in a
          # subshell exiting with psql's OWN status so `wait` below propagates a
          # failure instead of reporting tee's success, and captures the PID with
          # `$!` into PARITY_BG_PID. Its output is written to the ledger log and
          # echoed once the process finishes, rather than teed, so it cannot
          # interleave with `race_b`'s.
          run_psql_background M-1173-02e suite_1173 supabase/migrations/__tests__/issue_1807_tester_adversarial_race_a.sql
          issue1807_race_a_pid="$PARITY_BG_PID"
          sleep 2
          run_psql M-1173-02g suite_1173 supabase/migrations/__tests__/issue_1807_tester_adversarial_race_b.sql
          wait "$issue1807_race_a_pid"
          run_psql M-1173-02i suite_1173 supabase/migrations/__tests__/issue_1807_paystack_ledger_truth.tester_adversarial.test.sql

      - name: "#1173 · Run #1173 schedule-flip regression tests (Deno)"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          source .github/scripts/parity/pgsuite.sh
          run_logged M-1173-03 deno - -- \
            deno test --allow-read --allow-env --allow-net --no-check \
            supabase/functions/_shared/__tests__/issue_1173_payout_schedule_helper.test.ts \
            supabase/functions/admin-payout-hold-migrate/__tests__/issue_1173_admin_migrate.test.ts \
            supabase/functions/admin-payout-hold-migrate/__tests__/issue_1807_paystack_lane.test.ts \
            supabase/functions/admin-payout-hold-migrate/__tests__/issue_1807_paystack_lane.tester_adversarial.test.ts \
            supabase/functions/brand-stripe-onboard/__tests__/issue_1173_onboard_dark_default.test.ts

      # ── Guard G-2b — #1177's zero-SQL status, asserted positively ────────
      - name: "G-2b · #1177 executed its Deno files and holds no database"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          suite_1177_present="$(docker exec -i "$PG_CONTRACT_CONTAINER" \
            psql -v ON_ERROR_STOP=1 -At -U postgres -d template1 \
            -c "SELECT count(*) FROM pg_database WHERE datname = 'suite_1177'")"
          if [ "$suite_1177_present" != "0" ]; then
            echo "::error::G-2b: a suite_1177 database exists. #1177 executes zero SQL; a database nothing connects to is an artifact that carries no information, and nobody decided to give it one."
            exit 1
          fi
          echo "suite_1177 databases: $suite_1177_present"

      # ══ #1384/#1397 — rehomed out of the class-A static-gates job (#2594) ═
      #
      # These five subjects used to run inside `strict-grep-mingla-business.yml`'s
      # `static-gates` job, behind a `supabase start` bring-up that booted a
      # container and replayed the whole migration chain a SECOND time inside a
      # job named "static gates". 19.5 % of that job was this work. The bring-up
      # is retired with its subject; the destination already holds an
      # unconditional from-zero replay, and G-4 asserts it covers the whole tree.
      #
      # This is NOT a consolidation origin. G-9's nine members and the registry's
      # `legacyOrigins` are untouched — nothing here adds one. The trigger for
      # these five subjects therefore narrows to this workflow's `on:` paths,
      # which is a stated judgement and not a silent one: every file they read or
      # assert about lives under `supabase/migrations/**`, and the `\i` / `\ir` /
      # pg_read_file / `COPY … FROM '` scan over all four suites returns zero
      # hits. Widening this workflow's trigger to class A's fifteen path groups
      # is the opposite move and is explicitly refused — it would make every
      # docs-only PR pay a full replay.
      - name: "#1384/#1397 · PostgreSQL 17 server assertion and migration-prefix normality"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          # (f) THE SERVER REPORTS 17 — carried across from the retired class-A
          # step unchanged. Here the image tag is the pinned literal
          # supabase/postgres:17.4.1.075, so this assertion has a weaker subject
          # than it did behind the CLI. It is rehomed anyway: "the image tag says
          # so" and "the server reports so" are not the same statement, and it
          # costs milliseconds.
          #
          # NOT a `run_psql` call site by design — it registers no ledger row and
          # is not an L-5 subject, because it carries no suite file. It names
          # suite_1384_1397, never the migrated template, so G-3a's single-mention
          # rule for the template is untouched.
          docker exec -i "$PG_CONTRACT_CONTAINER" \
            psql -v ON_ERROR_STOP=1 -U postgres -d suite_1384_1397 \
            -c "DO \$\$ DECLARE v int := current_setting('server_version_num')::int; BEGIN IF v < 170000 OR v >= 180000 THEN RAISE EXCEPTION 'PostgreSQL 17 required, got server_version_num=%', v; END IF; END \$\$;"
          echo "server version assertion: PostgreSQL 17 confirmed by the server, not by the image tag."

          # (d) NO UN-NORMALISED DUPLICATE 14-CHARACTER MIGRATION PREFIXES.
          #
          # PROVEN unique in the repository: the only other duplicate-prefix
          # matcher, issue-1902-rsvp-backend-safety.mjs, is scoped to one literal
          # prefix rather than to the tree. Dropping this with its host step would
          # have been a silent coverage loss, so it moves.
          #
          # The retired step could normalise the collisions by renaming, because
          # `supabase start` requires unique prefixes. This job replays with a
          # plain `for f in supabase/migrations/*.sql` glob and does not, so the
          # renames are retired and the eight rename SOURCES become an explicit,
          # reviewable exclusion list instead. An unlisted ninth collision is RED.
          #
          # The list fails CLOSED in the other direction too: a name that no
          # longer exists aborts the step rather than silently widening what is
          # tolerated.
          known_collisions=(
            "20260612000001_tr4_revoke_rpc_anon_grants.sql"
            "20260612000000_tr4_refund_tiers_booking_deadline.sql"
            "20260615000000_orch_426_discover_cache_gzip.sql"
            "20261012000000_orch_1150_rsvp_maybe.sql"
            "20261113000000_orch_1172_rsvp_edit_privacy_settings.sql"
            "20261116000000_orch_1187_reconcile_stuck_checkouts_cron.sql"
            "20261117000001_orch_1188_finalize_persist_event_date_id.sql"
            "20261117000000_orch_1188_orders_event_date_id.sql"
          )
          stale=0
          for known in "${known_collisions[@]}"; do
            if [ ! -f "supabase/migrations/$known" ]; then
              echo "::error::#2594: the duplicate-prefix exclusion list names supabase/migrations/$known, which does not exist. A stale exclusion silently widens what this check tolerates, so it is refused rather than ignored."
              stale=1
            fi
          done
          if [ "$stale" -ne 0 ]; then
            exit 1
          fi
          duplicate_prefixes="$(
            for sql_file in supabase/migrations/*.sql; do
              name="$(basename "$sql_file")"
              excluded=0
              for known in "${known_collisions[@]}"; do
                if [ "$name" = "$known" ]; then
                  excluded=1
                  break
                fi
              done
              if [ "$excluded" -eq 0 ]; then
                printf '%s\n' "$name" | cut -c1-14
              fi
            done | LC_ALL=C sort | uniq -d
          )"
          if [ -n "$duplicate_prefixes" ]; then
            echo "::error::#2594: duplicate 14-character migration prefixes remain outside the ${#known_collisions[@]} known collision pairs. A version prefix that two files share can only ever stamp one of them; the loser is skipped as applied and the ledger reads clean."
            printf '%s\n' "$duplicate_prefixes" >&2
            exit 1
          fi
          echo "migration prefix normality: no duplicate 14-character prefix outside the ${#known_collisions[@]} excluded names, across $(ls -1 supabase/migrations/*.sql | wc -l | tr -d ' ') migrations."

      # M-1397-01 MUST PRECEDE THE FOUR SUITES. It is the only DURABLE mutation
      # of the five — it unschedules and re-registers the FX cron — and the
      # retired class-A step ran it first, against the same database, before any
      # suite opened. One shared database is what reproduces that ordering; four
      # would not. The four suites themselves are `BEGIN;` … `ROLLBACK;` and
      # leave no residue, so they cannot leak into one another.
      - name: "#1397 · re-apply the FX EOL cron migration on top of the full chain (replay-safety)"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          source .github/scripts/parity/pgsuite.sh
          run_psql M-1397-01 suite_1384_1397 supabase/migrations/20270130001397_issue_1397_fx_refresh_eol_cron.sql

      - name: "#1384 · discovery price/currency contract suite"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          source .github/scripts/parity/pgsuite.sh
          run_psql M-1384-02a suite_1384_1397 supabase/migrations/__tests__/issue_1384_discovery_price_currency.test.sql

      - name: "#1384 · tester adversarial discovery price/currency suite"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          source .github/scripts/parity/pgsuite.sh
          run_psql M-1384-02b suite_1384_1397 supabase/migrations/__tests__/issue_1384_discovery_price_currency.tester_adversarial.test.sql

      - name: "#1384 · executable discovery price/currency suite"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          source .github/scripts/parity/pgsuite.sh
          run_psql M-1384-02c suite_1384_1397 supabase/migrations/__tests__/issue_1384_discovery_price_currency_executable.test.sql

      - name: "#1397 · FX refresh EOL cron suite"
        if: ${{ !cancelled() && steps.provision.outcome == 'success' }}
        run: |
          source .github/scripts/parity/pgsuite.sh
          run_psql M-1397-02 suite_1384_1397 supabase/migrations/__tests__/issue_1397_fx_refresh_eol_cron.test.sql

      # ── The same-SHA parity ledger, and guards G-2 and G-5 ───────────────
      #
      # Reconciliation is PER ASSERTION, never per job. A `RAISE EXCEPTION`
      # count match is explicitly NOT evidence: the site is the failure path and
      # emits nothing when the assertion holds, so a guarded block that never
      # executed is byte-identical on stdout to one that executed and passed.
      # That is the #2438 shape — a payment guard whose retry silently never ran
      # while every count reconciled perfectly.
      #
      # The witness is psql's own command tag: one bare `DO` line per anonymous
      # block that ran to completion, emitted by an UNMODIFIED psql invocation.
      # An empty or unread file exits 0 with no output, which exit-status
      # checking calls green and this does not.
      - name: Emit the parity ledger
        id: ledger
        if: ${{ !cancelled() }}
        env:
          PARITY_SIDE: consolidated
        run: |
          export PARITY_DIR="$RUNNER_TEMP/parity"
          # A MISSING inventory must not read as "everything is unregistered".
          # Run 9: L-5 failed, and because the step that writes inventory.tsv
          # carried no `if:` it was SKIPPED by success(). The ledger then compared
          # 30 executed commands against an empty set and reported them as
          # unregistered — G-5 pointing at the wrong thing entirely. The `if:`
          # gating is the fix; this is the backstop, so the same shape can never
          # again present as a totality failure.
          if [ ! -s "$PARITY_DIR/inventory.tsv" ]; then
            echo "::error::the committed command inventory is missing or empty, so G-5 cannot be evaluated at all. It has NOT passed and it has NOT failed — the step that writes it did not run."
            exit 1
          fi
          node .github/scripts/parity/emit-parity-ledger.mjs

      - name: Upload the parity ledger
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: parity-consolidated
          path: ${{ runner.temp }}/parity/
          if-no-files-found: error

      - name: Remove disposable database
        if: always()
        run: docker rm -f pg-contract-suites || true
