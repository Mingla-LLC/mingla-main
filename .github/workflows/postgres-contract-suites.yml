            echo "::error::G-7: the #1174 driver left no durable fixture rows in suite_1174. Either it never ran, or it ran somewhere else."
            exit 1
          fi
          if [ "$in_template" != "0" ]; then
            echo "::error::G-7: the #1174 driver left $in_template durable fixture row(s) in the migrated template. The database argument did not reach it, and every suite copied afterwards would inherit the residue."
            exit 1
