# NOTE: the name is QUOTED — an unquoted ` #` starts a YAML comment and would
# truncate the workflow name.
#
# Dark-test-surface trap (ORCH-1383): the strict-grep `jest-suites` job does NOT
# run jest, and no workflow runs a full `npx jest`, so without this dedicated
# per-issue job the regression tests below would exist but never gate. This
# workflow makes issue #1039 + #1043 fail-on-revert in CI.
#
# #1039 (read-back): the management-view migration adds the three theme override
#   columns — asserted statically by the deno migration-contract test.
# #1043 (RSVP write-back): the rsvpMode branch of handleConfirmSave now writes
#   the theme columns — asserted by the jest source-text pin, which also pins the
#   #1039 publish-response forward in businessEvents.ts.
#
# MANIFEST.json untouched — no new strict-grep .mjs gate is added, so no
# registration is required (per issue-1014 / issue-1022 precedent).
name: "Issue #1039/#1043 Theme Read-Back + RSVP Write-Back Tests"

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20270110000000_issue_1039_mgmt_view_theme_columns.sql"
      - "supabase/migrations/__tests__/issue_1039_management_view_theme_columns.test.ts"
      - "supabase/migrations/__tests__/issue_1039_mgmt_view_exact_columns.test.ts"
      - "mingla-business/src/components/event/EditPublishedScreen.tsx"
      - "mingla-business/src/components/event/__tests__/issue1043RsvpThemeWrite.test.ts"
      - "mingla-business/src/components/event/__tests__/issue1043RsvpThemeClearPersists.test.ts"
      - "mingla-business/src/services/businessEvents.ts"
      - ".github/workflows/issue-1039-1043-theme-readback-rsvp-tests.yml"
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "supabase/migrations/20270110000000_issue_1039_mgmt_view_theme_columns.sql"
      - "supabase/migrations/__tests__/issue_1039_management_view_theme_columns.test.ts"
      - "supabase/migrations/__tests__/issue_1039_mgmt_view_exact_columns.test.ts"
      - "mingla-business/src/components/event/EditPublishedScreen.tsx"
      - "mingla-business/src/components/event/__tests__/issue1043RsvpThemeWrite.test.ts"
      - "mingla-business/src/components/event/__tests__/issue1043RsvpThemeClearPersists.test.ts"
      - "mingla-business/src/services/businessEvents.ts"
      - ".github/workflows/issue-1039-1043-theme-readback-rsvp-tests.yml"

concurrency:
  group: ci-issue-1039-1043-theme-readback-rsvp-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-1039-migration-deno-test:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Issue #1039: management-view theme columns migration contract (deno test)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - name: Run Issue #1039 migration contract suite (implementor + tester adversarial)
        run: >
          deno test --allow-read
          supabase/migrations/__tests__/issue_1039_management_view_theme_columns.test.ts
          supabase/migrations/__tests__/issue_1039_mgmt_view_exact_columns.test.ts

  issue-1043-business-jest:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Issue #1043/#1039: RSVP theme write + publish forward (fails-on-revert jest)"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
      - name: "Issue #1043/#1039: RSVP theme write + publish forward + clear-persists jest suites"
        run: >
          npx jest
          issue1043RsvpThemeWrite
          issue1043RsvpThemeClearPersists
          --runInBand
