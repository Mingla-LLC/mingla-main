name: ISSUE-979 Campaign Builder Correctness Tests

# ISSUE-979 [campaign-builder-correctness] — the fails-on-revert regression
# tests for the four correctness bugs: (1) goal-combination 422, (2) false
# "Created" toast, (3) compliance-flag leak, (4) silent $0-funding. These are
# node:test suites (mingla-admin's house runner, pure-logic + fs source
# assertions). No other CI job runs the mingla-admin campaign-builder suites, so
# without this dedicated job they would exist but never gate (the dark-test
# surface trap, ORCH-1383). EXPLICIT registry (never a glob) — append a path.

on:
  push:
    branches: [main]
    paths:
      - "mingla-admin/src/**"
      - "supabase/functions/admin-ad-create-campaign/**"
      - "supabase/functions/admin-ad-creative-upload/**"
      - "supabase/functions/_shared/adChannelCore.ts"
      - "supabase/functions/_shared/meta.ts"
      - "MARKETING.md"
      - ".github/workflows/issue-979-campaign-builder-correctness-tests.yml"
  pull_request:
    paths:
      - "mingla-admin/src/**"
      - "supabase/functions/admin-ad-create-campaign/**"
      - "supabase/functions/admin-ad-creative-upload/**"
      - "supabase/functions/_shared/adChannelCore.ts"
      - "supabase/functions/_shared/meta.ts"
      - "MARKETING.md"
      - ".github/workflows/issue-979-campaign-builder-correctness-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-979-node-test:
    name: "ISSUE-979: campaign-builder correctness (fails-on-revert regression suites)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mingla-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # EXPLICIT registry — the four ISSUE-979 implementor suites (one per bug)
      # plus the tester adversarial suite (registered here so it GATES, never a
      # dark test surface — ORCH-1383). Pure ESM + fs source assertions; no
      # node_modules required.
      - name: Run ISSUE-979 campaign-builder correctness suites
        run: >
          node --test
          src/__tests__/issue979_goal_combination_valid_pairs.test.js
          src/__tests__/issue979_honest_create_toast.test.js
          src/__tests__/issue979_compliance_flags_all_platforms.test.js
          src/__tests__/issue979_unfunded_eligible_channels.test.js
          src/__tests__/issue979_correctness.adversarial.test.js
          src/__tests__/issue1162_stock_first_ai_defaults.test.js
          src/__tests__/issue1162_stock_first_ai_defaults.tester_adversarial.test.js
