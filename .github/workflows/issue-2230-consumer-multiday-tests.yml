name: "Issue #2230 Consumer multi-day checkout"

on:
  pull_request:
    paths:
      - "app-mobile/src/hooks/usePublicEventBySlug.ts"
      - "app-mobile/src/hooks/__tests__/issue_2230_consumer_event_days.test.ts"
      - "app-mobile/src/utils/eventDateDisplay.ts"
      - "app-mobile/src/components/expandedCard/EventDayChooser.tsx"
      - "app-mobile/src/components/expandedCard/TicketCartSheet.tsx"
      - "app-mobile/src/screens/Event/ConsumerEventDetailScreen.tsx"
      - "app-mobile/src/payments/nativeCheckoutFlow.ts"
      - "app-mobile/src/payments/__tests__/issue_2230_native_day_payload.test.ts"
      - "app-mobile/src/screens/Event/__tests__/issue_2230_*"
      - "app-mobile/src/screens/Event/__tests__/orch_1342_cold_seed_landing.test.ts"
      - "app-mobile/src/components/expandedCard/__tests__/issue_2230_*"
      - "app-mobile/src/components/expandedCard/__tests__/issue_2230_scaled_text.tester_adversarial.test.tsx"
      - "packages/offering-rendering/QuantityRow.tsx"
      - ".github/scripts/strict-grep/issue-2230-consumer-carries-occurrences.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-2230-consumer-multiday-tests.yml"
      - "docs/INVARIANT_REGISTRY.md"
  push:
    branches: [main]
    paths:
      - "app-mobile/src/hooks/usePublicEventBySlug.ts"
      - "app-mobile/src/hooks/__tests__/issue_2230_consumer_event_days.test.ts"
      - "app-mobile/src/utils/eventDateDisplay.ts"
      - "app-mobile/src/components/expandedCard/EventDayChooser.tsx"
      - "app-mobile/src/components/expandedCard/TicketCartSheet.tsx"
      - "app-mobile/src/screens/Event/ConsumerEventDetailScreen.tsx"
      - "app-mobile/src/payments/nativeCheckoutFlow.ts"
      - "app-mobile/src/payments/__tests__/issue_2230_native_day_payload.test.ts"
      - "app-mobile/src/screens/Event/__tests__/issue_2230_*"
      - "app-mobile/src/screens/Event/__tests__/orch_1342_cold_seed_landing.test.ts"
      - "app-mobile/src/components/expandedCard/__tests__/issue_2230_*"
      - "app-mobile/src/components/expandedCard/__tests__/issue_2230_scaled_text.tester_adversarial.test.tsx"
      - "packages/offering-rendering/QuantityRow.tsx"
      - ".github/scripts/strict-grep/issue-2230-consumer-carries-occurrences.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-2230-consumer-multiday-tests.yml"
      - "docs/INVARIANT_REGISTRY.md"

permissions:
  contents: read

jobs:
  consumer-multiday-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: denoland/setup-deno@v2
      - run: npm ci
        working-directory: app-mobile
      - name: Mapper, screen, cart, payload, fingerprint, and accessibility suites
        working-directory: app-mobile
        run: >-
          npx jest --runInBand
          src/hooks/__tests__/issue_2230_consumer_event_days.test.ts
          src/payments/__tests__/issue_2230_native_day_payload.test.ts
          src/screens/Event/__tests__/issue_2230_screen_hands_down_days.test.tsx
          src/components/expandedCard/__tests__/issue_2230_cart_days.test.tsx
          src/components/expandedCard/__tests__/issue_2230_scaled_text.tester_adversarial.test.tsx
      - name: Preserved #1342 cold-read contract with #2230 warm supplement
        run: >-
          deno test --allow-read --no-check
          app-mobile/src/screens/Event/__tests__/orch_1342_cold_seed_landing.test.ts
      - name: Preserve #2242 ticket authority and #2160 per-day calendar truth
        run: >-
          deno test --allow-read --no-check
          app-mobile/src/screens/Event/__tests__/issue_2242_cold_route_cart_ticket_source.test.ts
          app-mobile/src/screens/Event/__tests__/issue_2242_cold_route_cart_ticket_source.tester_adversarial.test.ts
          app-mobile/src/services/__tests__/issue_2160_calendar_per_day_entries.test.ts
      - name: Preserve experience singular checkout byte identity
        run: node .github/scripts/strict-grep/orch-1138-experience-checkout-byte-identical.mjs
      - run: node .github/scripts/strict-grep/issue-2230-consumer-carries-occurrences.mjs --self-test
      - run: node .github/scripts/strict-grep/issue-2230-consumer-carries-occurrences.mjs
