name: Issue 873 guest status roster

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20270319000873_issue_0873_guest_status_roster.sql"
      - "supabase/migrations/__tests__/issue_0873_guest_status_roster.test.sql"
      - "supabase/functions/guest-roster-actions/**"
      - "supabase/functions/offering-invite-dispatch/index.ts"
      - "supabase/functions/brand-people-export/index.ts"
      - "supabase/config.toml"
      - ".github/workflows/issue-873-guest-status-roster-tests.yml"
      # #2148 — this suite now gets its database from a shared composite action;
      # without this path a change to that action would not re-run it.
      - ".github/actions/migrated-postgres/**"
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "supabase/migrations/20270319000873_issue_0873_guest_status_roster.sql"
      - "supabase/migrations/__tests__/issue_0873_guest_status_roster.test.sql"
      - "supabase/functions/guest-roster-actions/**"
      - "supabase/functions/offering-invite-dispatch/index.ts"
      - "supabase/functions/brand-people-export/index.ts"
      - "supabase/config.toml"
      - ".github/workflows/issue-873-guest-status-roster-tests.yml"
      # #2148 — this suite now gets its database from a shared composite action;
      # without this path a change to that action would not re-run it.
      - ".github/actions/migrated-postgres/**"

permissions:
  contents: read

concurrency:
  group: ci-issue-873-guest-status-roster-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  action-edge:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Issue 873 reminder/retry action boundary"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: >-
          deno test --allow-env --allow-read
          supabase/functions/guest-roster-actions/issue_0873_guest_roster_actions.test.ts
          supabase/functions/guest-roster-actions/issue_873_actions.tester_adversarial.test.ts

  business-render:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Issue 873 Business shared roster render"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
      - run: npx jest --config jest.issue873.render.cjs --runInBand

  issue-873-pg17:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Issue 873 roster truth and authorization (fresh PG17)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # #2148 — the `services:` block that used to live here is gone. A service
    # container is started by the runner BEFORE any step runs, so nothing can
    # place a pre-migrated data directory into it; owning the container from a
    # step is what makes the cached snapshot possible. It still listens on
    # localhost:5432 with the same password, so every step below is unchanged.
    steps:
      - uses: actions/checkout@v4
      # #2148 — replaces this job's postgres bring-up: a service container plus a
      # full replay of every migration (MEASURED ~75s boot + ~105s replay). The
      # shared action restores a cached snapshot of the already-migrated cluster
      # and applies only what landed since, falling back to a full replay on any
      # doubt. It verifies policy/trigger/index/RLS counts against the snapshot's
      # build-time manifest before any test runs.
      - name: PostgreSQL 17 with every migration applied
        uses: ./.github/actions/migrated-postgres
        with:
          # Pinned at the call site, not inherited from the action default, so this
          # workflow still states the database it certifies against.
          image: supabase/postgres:17.4.1.075
          password: ${{ format('issue-873-ci-{0}', github.run_id) }}
      - name: Match hosted Supabase Auth user shape
        env:
          PGPASSWORD: ${{ format('issue-873-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS banned_until timestamptz"
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -Atc \
            "SELECT 1 FROM information_schema.columns
             WHERE table_schema='auth' AND table_name='users'
               AND column_name='banned_until'" | grep -qx 1
      - name: Prove roster status, precedence, privacy, and rollout
        env:
          PGPASSWORD: ${{ format('issue-873-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_0873_guest_status_roster.test.sql
