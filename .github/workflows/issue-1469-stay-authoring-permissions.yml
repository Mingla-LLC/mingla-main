name: "Issue #1469 Stay authoring permissions"

on:
  push:
    branches: [main]
    paths:
      - "mingla-business/src/components/stay/StayInventoryManager.tsx"
      - "mingla-business/src/components/stay/__tests__/stayAuthoringPermissions.issue1469.test.ts"
      - "mingla-business/src/types/stayInventory.ts"
      - "supabase/migrations/20270209001469_issue_1469_stay_authoring_permissions.sql"
      - "supabase/migrations/__tests__/issue_1469_stay_authoring_permissions.test.sql"
      - ".github/workflows/issue-1469-stay-authoring-permissions.yml"
      # #2148 — this suite now gets its database from a shared composite action;
      # without this path a change to that action would not re-run it.
      - ".github/actions/migrated-postgres/**"
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "mingla-business/src/components/stay/StayInventoryManager.tsx"
      - "mingla-business/src/components/stay/__tests__/stayAuthoringPermissions.issue1469.test.ts"
      - "mingla-business/src/types/stayInventory.ts"
      - "supabase/migrations/20270209001469_issue_1469_stay_authoring_permissions.sql"
      - "supabase/migrations/__tests__/issue_1469_stay_authoring_permissions.test.sql"
      - ".github/workflows/issue-1469-stay-authoring-permissions.yml"
      # #2148 — this suite now gets its database from a shared composite action;
      # without this path a change to that action would not re-run it.
      - ".github/actions/migrated-postgres/**"

permissions:
  contents: read

concurrency:
  group: ci-issue-1469-stay-authoring-permissions-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  client-permission-parity:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
        working-directory: mingla-business
      - name: Prove server-driven controls and split-safe writes
        working-directory: mingla-business
        run: >
          npx jest
          src/components/stay/__tests__/stayAuthoringPermissions.issue1469.test.ts
          --runInBand
      - name: Lint changed Business boundaries
        working-directory: mingla-business
        run: >
          npx eslint
          src/components/stay/StayInventoryManager.tsx
          src/components/stay/__tests__/stayAuthoringPermissions.issue1469.test.ts
          src/types/stayInventory.ts

  postgres-17-runtime:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # #2148 — the `services:` block that used to live here is gone. A service
    # container is started by the runner BEFORE any step runs, so nothing can
    # place a pre-migrated data directory into it; owning the container from a
    # step is what makes the cached snapshot possible. It still listens on
    # localhost:5432 with the same password, so every step below is unchanged.
    steps:
      - uses: actions/checkout@v4
      # #2148 — replaces this job's postgres bring-up: a service container plus a
      # full replay of every migration (MEASURED ~75s boot + ~105s replay). The
      # shared action restores a cached snapshot of the already-migrated cluster
      # and applies only what landed since, falling back to a full replay on any
      # doubt. It verifies policy/trigger/index/RLS counts against the snapshot's
      # build-time manifest before any test runs.
      - name: PostgreSQL 17 with every migration applied
        uses: ./.github/actions/migrated-postgres
        with:
          # Pinned at the call site, not inherited from the action default, so this
          # workflow still states the database it certifies against.
          image: supabase/postgres:17.4.1.075
          password: ${{ format('issue-1469-ci-{0}', github.run_id) }}
      - name: Execute split authority, override and projection proof
        env:
          PGPASSWORD: ${{ format('issue-1469-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1469_stay_authoring_permissions.test.sql
      - name: Preserve the original inventory-versus-finance boundary
        env:
          PGPASSWORD: ${{ format('issue-1469-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1387_stay_inventory.test.sql
