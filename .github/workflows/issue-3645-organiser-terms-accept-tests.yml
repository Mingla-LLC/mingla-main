# #3645 PR11c — Organiser Terms accept edge contracts must run in CI.
# Source-level Deno assertions for brand-mingla-tos-accept (rank gate, active-row
# scoping, repeat-safe accept). Path-filtered so unrelated PRs skip the lane.
name: "#3645 Organiser Terms accept edge"

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "supabase/functions/brand-mingla-tos-accept/**"
      - "supabase/functions/brand-paystack-onboard/index.ts"
      - ".github/workflows/issue-3645-organiser-terms-accept-tests.yml"

permissions:
  contents: read

concurrency:
  group: ci-issue-3645-organiser-terms-accept-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  accept-edge-contracts:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: brand-mingla-tos-accept source contracts
        run: >-
          deno test --allow-read
          supabase/functions/brand-mingla-tos-accept/index.test.ts
      - name: brand-paystack-onboard requires current Organiser Terms
        run: |
          set -euo pipefail
          src=supabase/functions/brand-paystack-onboard/index.ts
          grep -F 'mingla_tos_not_accepted' "$src"
          grep -F 'CURRENT_ORGANISER_TERMS_VERSION' "$src"
          grep -F '.is("removed_at", null)' "$src"
          grep -F 'mingla_tos_version_accepted' "$src"
