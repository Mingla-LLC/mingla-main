# #2437 SHADOW-PARITY-TRIGGER — remove before cutover
name: Issue 1576 Deck Promoted Card

# Enforces I-PROPOSED-1576-ANIMATED-STYLE-SWAP-KEY-PARITY.
#
# DeckSwipeStage swaps ONE keyed, deliberately non-remounting poster node between
# previewCardStyle and currentCardStyle on behind -> current promotion. Reanimated does not
# restore properties written by a style that has been detached, so the two styles must write
# an identical property key set or the promoted node keeps the detached style's last value
# forever. That is #1576: previewCardStyle wrote opacity 0 at rest, currentCardStyle wrote no
# opacity at all, and every promoted hero photo was a black rectangle in production.
#
# The runtime oracle for the symptom is the mean luminance of the settled card's photo band,
# which needs a simulator and cannot run here. These guards assert the CAUSE instead: they
# extract each useAnimatedStyle object literal by comment-aware brace matching, EVALUATE it,
# and compare key sets over a sweep of positionX.
#
# This is a SEPARATE workflow from issue-1481-explorer-deck-tests.yml on purpose: that job's
# "require all eight" step must remain exactly eight guards.
#
# NOTE ON THE ADVERSARIAL GUARD: issue_1576_promoted_card_opacity.adversarial.test.mjs is the
# tester's deliverable (SPEC #1576 section 8.2) and lands on this same branch before merge,
# exactly as all eight #1481 guards did in PR #1531. Until it lands this job FAILS at the
# require step by design — an enforcement workflow that silently tolerates a missing guard is
# not an enforcement workflow. Do not weaken this step to make the PR green; land the guard.

on:
  push:
    branches: [main]
    paths:
      - "app-mobile/src/components/swipeDeck/**"
      - "app-mobile/src/components/SwipeableCards.tsx"
      - "app-mobile/src/utils/swipeCommit.ts"
      - "docs/INVARIANT_REGISTRY.md"
      - ".github/workflows/issue-1576-deck-promoted-card.yml"
  pull_request:
    paths:
      - "app-mobile/src/components/swipeDeck/**"
      - "app-mobile/src/components/SwipeableCards.tsx"
      - "app-mobile/src/utils/swipeCommit.ts"
      - "docs/INVARIANT_REGISTRY.md"
      - ".github/workflows/issue-1576-deck-promoted-card.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-1576-swap-key-parity:
    name: "Issue 1576: role-swappable animated styles keep key parity"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require both independent append-only guards
        run: |
          test -f app-mobile/src/components/swipeDeck/__tests__/issue_1576_promoted_card_opacity.test.mjs
          test -f app-mobile/src/components/swipeDeck/__tests__/issue_1576_promoted_card_opacity.adversarial.test.mjs
      - name: Evaluate the swapped animated styles and compare their key sets
        run: >-
          node --test
          app-mobile/src/components/swipeDeck/__tests__/issue_1576_promoted_card_opacity.test.mjs
          app-mobile/src/components/swipeDeck/__tests__/issue_1576_promoted_card_opacity.adversarial.test.mjs
