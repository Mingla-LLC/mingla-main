name: Issue 1615 Public Share Surfaces
on:
  pull_request:
    paths:
      - "scripts/issue-1615/**"
      - "supabase/functions/shared-card/**"
      - "supabase/functions/_shared/contentShare.ts"
      - "supabase/functions/_shared/contentShareService.ts"
      - "supabase/migrations/*1615*"
      - "supabase/config.toml"
      - "app-mobile/app.json"
      - "app-mobile/app/p/**"
      - "app-mobile/app/s/**"
      - "app-mobile/src/components/ShareModal.tsx"
      - "app-mobile/src/services/**"
      - "mingla-business/{api,server}/**"
      - "mingla-business/app/**"
      - "mingla-business/src/components/**"
      - "mingla-business/src/constants/publicUrls.ts"
      - "mingla-business/package*.json"
      - "mingla-business/tsconfig.json"
      - "mingla-business/vercel.json"
      - "mingla-marketing/vercel.json"
      - "mingla-marketing/middleware.ts"
      - "mingla-marketing/lib/shared-card-proxy.ts"
      - "mingla-marketing/app/api/internal-share-proxy/**"
      - "packages/brand-rendering/**"
      - "packages/card-identity/**"
      - "packages/sharing/**"
      - "packages/offering-rendering/**"
      - "**/.well-known/**"
      - ".github/workflows/issue-1615-public-share-surfaces.yml"
  push:
    branches: [main]
jobs:
  happy-path:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --ignore-scripts
        working-directory: mingla-business
      - run: node --experimental-strip-types --test scripts/issue-1615/public-share-surfaces.happy.test.cjs
      - run: node --experimental-strip-types --test scripts/issue-1615/public-share-surfaces.adversarial.test.cjs
      - run: node --test packages/sharing/__tests__/issue_1615_sharing_contract.happy.test.mjs
      - run: node --test packages/sharing/__tests__/issue_1615_media_identity.happy.test.mjs
      - run: node --test scripts/issue-1615/content-sharing-semantic-gate.adversarial.test.mjs
      - run: node --experimental-strip-types --test scripts/issue-1615/content-share-foundation.happy.test.mjs scripts/issue-1615/content-share-foundation.adversarial.test.mjs
      - run: node --experimental-strip-types --test scripts/issue-1615/content-share-receiver.happy.test.mjs scripts/issue-1615/content-share-receiver.adversarial.test.mjs
      - run: node --experimental-strip-types --test scripts/issue-1615/content-share-portrait.happy.test.mjs scripts/issue-1615/content-share-portrait.adversarial.test.mjs
      - run: node --experimental-strip-types --test scripts/issue-1615/content-share-media.adversarial.test.mjs
      - run: node scripts/issue-1615/content-sharing-semantic-gate.mjs
      - run: node --test packages/card-identity/__tests__/card_identity_single_source.test.mjs packages/card-identity/__tests__/issue_1714_contrast_tokens_happy_path.test.mjs packages/card-identity/__tests__/issue_1714_contrast_tokens_adversarial.test.mjs
