# #2437 SHADOW-PARITY-TRIGGER — remove before cutover
name: ISSUE-1322 Admin Sentry Tests

on:
  push:
    branches: [main, "1322-admin-sentry"]
    paths:
      - "mingla-admin/src/diagnostics/sentry.js"
      - "mingla-admin/src/main.jsx"
      - "mingla-admin/src/components/ErrorBoundary.jsx"
      - "mingla-admin/scripts/ci/require-sentry-dsn-on-prod.mjs"
      - "mingla-admin/src/__tests__/issue1322_admin_sentry*.js"
      - ".github/workflows/issue-1322-admin-sentry-tests.yml"
  pull_request:
    paths:
      - "mingla-admin/src/diagnostics/sentry.js"
      - "mingla-admin/src/main.jsx"
      - "mingla-admin/src/components/ErrorBoundary.jsx"
      - "mingla-admin/scripts/ci/require-sentry-dsn-on-prod.mjs"
      - "mingla-admin/src/__tests__/issue1322_admin_sentry*.js"
      - ".github/workflows/issue-1322-admin-sentry-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # npm ci is required: the happy-path suite imports sentry.js, which
      # statically imports @sentry/react.
      - name: Install admin deps
        working-directory: mingla-admin
        run: npm ci
      - name: Run ISSUE-1322 admin Sentry regressions
        working-directory: mingla-admin
        # The implementor happy-path suite always runs. The tester adds the
        # adversarial suite (build-time guard subprocess) later on this branch;
        # it runs conditionally once present (mirror of issue-1184's guard).
        run: |
          files=(
            src/__tests__/issue1322_admin_sentry.test.js
          )
          tester=src/__tests__/issue1322_admin_sentry.adversarial.tester.test.js
          if [[ -f "$tester" ]]; then files+=("$tester"); fi
          node --test "${files[@]}"
