# Issue #1484 [stay-desktop-shell] — the Hotel/Stay manager now renders the SAME
# desktop rail + full-width workspace as the Restaurant manager, via ONE shared
# `src/components/suite/SuiteDesktopShell.tsx` that both suites consume.
#
# WHY A DEDICATED WORKFLOW: the proof has to MOUNT both shells (rail present /
# pill row absent / resolved flattened styles), so it is a `*.render.test.tsx`.
# `mingla-business/jest.config.cjs` deliberately excludes every
# `*.render.test.tsx` from the default node/ts-jest suite, so without this job
# the regression proof would be DARK. Mirrors issue-874 / issue-1036 /
# issue-1403 / issue-1421.
#
# NOT a required check (not in ruleset 13549056 / 19508605) — it reports, it
# does not gate.

name: Issue #1484 Stay Desktop Shell

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    # #2885 AC-4 — a pull request whose ONLY changed file is the machine-written
    # boot-payload baseline cannot affect this suite. Those recording PRs were
    # starting 53 jobs each, ~15/day (~51,000 job-min/month). `paths-ignore`
    # skips ONLY when nothing else changed: touch this file alongside anything
    # and this workflow runs exactly as it always did.
    paths-ignore:
      - "mingla-business/scripts/ci/bundle-baseline.json"
  # [#3072] The backstop, and the thing that makes PR-time routing safe to do at
  # all. Routing changes WHEN this lane runs on a pull request, never WHETHER it
  # runs -- the same contract #2882 gave the 85 batched suites, which route on a
  # pull request and run in full on merge. Selection is the identity function on
  # a push event, so every job below runs here with no routing and no `paths`
  # filter of any kind. Without this, an `originPaths` list that turns out to be
  # incomplete would mean a change got NO coverage ever, instead of a slow catch
  # on `main`; #3079 is the standing evidence that incompleteness is a live risk,
  # not a hypothetical one.
  push:
    branches: [main]
    # #2885 AC-4 again, on this side too. The backstop above must catch an
    # incomplete `originPaths` on a HUMAN merge; it must not resurrect the
    # fan-out AC-4 removed. Without this exclusion a commit touching ONLY the
    # machine-written baseline starts all six lanes on `main` -- ~53 jobs per
    # recording change, ~15/day, ~51,000 job-min per month -- which the #2524
    # auto-merge guard catches by enumerating exactly which workflows such a
    # merge starts. Same trade the red-`main` alert landed on this morning.
    #
    # THE RESIDUAL, stated rather than buried: a baseline-only merge does not
    # run this lane on `main`. That commit changes one recorded boot-payload
    # number and nothing this lane reads -- proven, not assumed: the router was
    # RUN against the real baseline-only commit 5692d0358 and reports
    # `selected=false` here, and no gate this lane executes reads that file
    # (traced: it is stat-ed while walking `scripts/ci`, never opened).
    paths-ignore:
      - "mingla-business/scripts/ci/bundle-baseline.json"
  workflow_dispatch:

concurrency:
  group: ci-issue-1484-stay-desktop-shell-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  route:
    # [#3072] The routing decision, taken before this lane spends anything.
    #
    # The `paths-ignore` above is #2885 AC-4 and is UNTOUCHED: a pull request whose
    # ONLY changed file is the machine-written boot-payload baseline still never
    # reaches this workflow at all. That filter stopped the recording PRs; it was
    # never able to route human changes, and it still does not.
    #
    # This job is the second filter and the one that reads the registry.
    # `.github/ci-batch/MANIFEST.json` records this lane's `originPaths` — derived
    # from the files this lane's own gates, tests, typecheck and exports actually
    # READ, not from its name — and the script below matches the pull request's
    # diff against them using #2882's single origin-pattern grammar. No glob is
    # written into this file: widening the route means editing the registry, where
    # the fail-closed emptiness gate and the pattern-liveness gate can see it.
    #
    # On push, schedule and workflow_dispatch the selection is the identity
    # function and every job below runs in full, exactly as before. If the router
    # cannot see the diff it also selects, and says so in an annotation: this lane
    # can be run needlessly, never skipped silently.
    if: ${{ github.event.pull_request.draft != true }}
    name: Route (issue 1484)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      selected: ${{ steps.decide.outputs.selected }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decide whether this pull request can affect this lane
        id: decide
        run: node .github/scripts/ci-batch/route-live-provider.mjs --issue 1484

  issue-1484-stay-desktop-shell:
    if: ${{ (github.event.pull_request.draft != true) && (needs.route.outputs.selected == 'true') }}
    needs: [route]
    name: Stay desktop shell (render proof + gates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json

      - name: Install Business dependencies
        run: npm ci

      # NOTE: no `--no-save` test-dep overlay is needed. The #1484 render suites
      # use `react-test-renderer` (a real devDependency), NOT
      # `@testing-library/react-native` — which is absent from package.json and
      # would add a TS2307 diagnostic to the issue-1403 typecheck-delta gate.
      - name: Stay/Venue desktop shell render proof (react-test-renderer)
        run: npx jest --config jest.issue1484.render.cjs --runInBand

      # THE #1484 P1-1 GUARD. The desktop uncap once shipped broken while every
      # react-test-renderer suite was green, because `react-native`'s flatten
      # keeps a `maxWidth` key set to undefined while react-native-web keeps the
      # BASE style's atomic class in the DOM. This job renders through the REAL
      # RNW style compiler and asserts on the emitted CSS, so a silently-retained
      # cap cannot pass again.
      - name: Stay desktop WIDTH proof (react-native-web resolver)
        run: npx jest --config jest.issue1484.web.render.cjs --runInBand

      # The relocation amendment: the ORCH-1184 full-width contract now reads the
      # shared shell. The protected rule (no maxWidth cap, alignSelf flex-start,
      # paddingHorizontal kept) must stay green.
      - name: ORCH-1184 full-width contract + venue suite contracts
        run: >-
          npx jest --runInBand
          src/components/venue/__tests__/venueSuiteShell.orch1184.fullwidth.test.ts
          src/components/venue/__tests__/venueSuitePolish.orch1190.test.ts
          src/components/venue/__tests__/venueSuiteShell.overviewIntelligence.test.ts
          src/components/venue/__tests__/venueShellScroll.test.ts
          src/components/venue/__tests__/venueModules.test.ts
          src/components/venue/__tests__/venueLucideIcons.orch1196.test.ts
          venueTab.contract.test.ts

      # I-DESKTOP-GATE-VIA-HOOK: the new Stay desktop branch must read the
      # canonical hook, never an inlined platform+width expression.
      - name: Desktop-gate-via-hook gate
        working-directory: .
        run: |
          node .github/scripts/strict-grep/orch-0885-a-no-bottomnav-on-wide-desktop.mjs --self-test
          node .github/scripts/strict-grep/orch-0885-a-no-bottomnav-on-wide-desktop.mjs

      - name: Source-pin partition audit
        run: node scripts/ci/select-source-text-pins.mjs --check

      - name: Scoped lint
        run: >-
          npx eslint
          src/components/suite/SuiteDesktopShell.tsx
          src/components/venue/VenueSuiteShell.tsx
          src/components/stay/StaySuiteShell.tsx
          src/components/stay/StayReservationsModule.tsx
          src/components/stay/StayInventoryManager.tsx
          src/constants/designSystem.ts

      - name: Buyer web export (bundle still builds)
        run: npx expo export -p web --output-dir /tmp/issue-1484-web --clear
