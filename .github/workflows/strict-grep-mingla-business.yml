name: Strict Grep Gates (Mingla Business)

on:
  pull_request:
    branches: [main, Seth]
    paths:
      - "mingla-business/**"
      - "supabase/migrations/**"
      - ".github/scripts/strict-grep/**"
      - ".github/workflows/strict-grep-mingla-business.yml"
  push:
    branches: [main, Seth]
    paths:
      - "mingla-business/**"
      - "supabase/migrations/**"
      - ".github/scripts/strict-grep/**"
      - ".github/workflows/strict-grep-mingla-business.yml"

# Registry pattern (per DEC-101 D-17b-5):
# Each invariant CI gate is its own modular Node.js script in
# .github/scripts/strict-grep/. Adding a new gate = add one script + one
# job below. Each job runs in parallel; any failure fails the PR.
#
# Currently registered gates:
#   - I-37 (i37-topbar-cluster.mjs) — primary-tab default cluster (Cycle 17b)
#   - I-38 (i38-icon-chrome-touch-target.mjs) — IconChrome touch-target ≥ 44 effective (Cycle 17c)
#   - I-39 (i39-pressable-label.mjs) — Pressable accessibilityLabel coverage (Cycle 17c)
#   - I-PROPOSED-A (i-proposed-a-brands-deleted-filter.mjs) — brands queries filter deleted_at IS NULL (Cycle 17e-A)
#   - I-PROPOSED-C (i-proposed-c-brand-crud-via-react-query.mjs) — no setBrands() callers (Cycle 17e-A)
#   - I-PROPOSED-H (i-proposed-h-rls-returning-owner-gap.mjs) — every owner-callable mutation policy paired with direct-predicate owner-SELECT (ORCH-0734)
#   - I-PROPOSED-I (i-proposed-i-mutation-rowcount-verified.mjs) — every per-row .update/.delete must chain .select to verify rowcount (ORCH-0734-RW)
#   - I-PROPOSED-O (i-proposed-o-stripe-no-webview-wrap.mjs) — Stripe Embedded Components via official SDK only — no DIY WebView wrap (B2a)
#   - I-PROPOSED-P (i-proposed-p-stripe-state-canonical.mjs) — stripe_connect_accounts canonical; brands.stripe_* mirror via DB trigger only (B2a)
#   - I-PROPOSED-Q (i-proposed-q-stripe-api-version.mjs) — Stripe API version pinned via _shared/stripe.ts only; no inline overrides (B2a Path C)
#   - I-PROPOSED-R (i-proposed-r-stripe-idempotency-key.mjs) — Idempotency-Key on every Stripe API call (B2a Path C)
#   - I-PROPOSED-S (i-proposed-s-stripe-audit-log.mjs) — Audit log import + call on every Stripe edge function (B2a Path C)
#   - I-PROPOSED-T (i-proposed-t-stripe-country-allowlist.mjs) — Stripe country from canonical 34-country allowlist only (B2a Path C V3)
#   - I-PROPOSED-U (i-proposed-u-mingla-tos-gate.mjs) — Mingla ToS accepted before any Stripe Connect call (B2a Path C V3)
#   - I-PROPOSED-V (i-proposed-v-stripe-notification-via-shared.mjs) — Stripe edge fns dispatch via notify-dispatch only (B2a Path C V3)
#   - I-PROPOSED-W (i-proposed-w-notifications-app-type-prefix.mjs) — notifications reads filtered by app-type prefix (B2a Path C V3)
#   - I-PROPOSED-Y (i-proposed-y-platform-web-url-from-env.mjs) — platform web URL from env, never hardcoded (B2a Path C V3 forensics fix)
#   - I-PROPOSED-Z (i-proposed-z-home-no-fabricated-events.mjs) — Home uses real event/order truth, no fabricated upcoming rows (ORCH-0754)
#   - I-PROPOSED-K (i-proposed-k-require-cycles.mjs) — require-cycles baselined (META-ORCH-0744)
#   - I-PROPOSED-L (process invariant) — DIAG markers reaped at CLOSE (META-ORCH-0744)
#   - I-PROPOSED-M (i-proposed-m-persist-key-whitelist.mjs) — persist-key whitelist sync (META-ORCH-0744)
#   - I-PROPOSED-N (i-proposed-n-transitional-exit-condition.mjs) — TRANSITIONAL exit-condition lint (META-ORCH-0744)
#   - I-PROPOSED-X (i-proposed-x-web-deprecation.mjs) — web-export deprecation parser (META-ORCH-0744)
#   - ORCH-0785-A (orch-0785-resend-attachment-aware.mjs) — Resend POST must declare attachments or opt out (ORCH-0785)
#   - ORCH-0785-B (orch-0785-no-resend-sandbox-fallback.mjs) — no onboarding@resend.dev fallback in source (ORCH-0785)
#   - ORCH-0785-C (orch-0785-buyer-string-escape.mjs) — buyer/event/order strings must flow through escapeHtml (ORCH-0785)
#   - ORCH-0785-D (orch-0785-shell-singleton.mjs) — shared email shell singleton (ORCH-0785)
#   - ORCH-0785-E (orch-0785-pdf-privacy.mjs) — ticket PDF privacy contract (ORCH-0785)
#   - ORCH-0776 (orch-0776-video-processing-status-bridge.mjs) — event cover video processing status bridge
#   - ORCH-0776D (orch-0776d-cancelled-at-schema.mjs) — event cover video cancelled_at schema/code parity
#   - ORCH-0777 (orch-0777-ticket-checkout-production.mjs) — production ticket checkout + organizer order visibility
#   - ORCH-0778 (orch-0778-web-stripe-native-import-gate.mjs) — Stripe React Native imports stay behind .native payment boundaries (re-armed by ORCH-0781)
#   - ORCH-0783 (orch-0783-event-cover-image-provider-pivot.mjs) — event cover image/provider pivot preserves legacy renderers
#   - ORCH-0784 (orch-0784-event-list-sales-summary-visibility.mjs) — Home/Events list sales summaries stay visible and server-backed
#   - ORCH-0786 (orch-0786-creator-avatar-upload-integrity.mjs) — creator avatar upload uses expo-file-system + canonical URL + Image onError fallback
#   - ORCH-0795 (orch-0795-event-scanner-auto-provision.mjs) — event_scanners auto-provision trigger + UI honesty plumbing (I-PROPOSED-AZ EVENT_HAS_MANAGER_SCANNER)
#   - ORCH-0788 (orch-0788-notification-template-key-dispatched.mjs) — buyer notification dispatcher routes by template_key + writers inline-dispatch + sweeper migration (I-PROPOSED-BA NOTIFICATION_TEMPLATE_KEY_DISPATCHED)
#   - ORCH-0793 (orch-0793-scan-time-window.mjs) — biz_ticket_scan event_dates time-window enforcement + mobile discriminator plumbing (I-PROPOSED-BB SCAN_TIME_WINDOW_ENFORCED)
#
# Future gates to register (proposed but not yet implemented):
#   - I-32 rank parity (Cycle 13a proposal)
#   - I-34 canManualCheckIn decommission (Cycle 13b proposal)
#   - I-36 ROOT-ERROR-BOUNDARY (Cycle 16a proposal)
#
# When adding a new gate, follow the 4 steps in
# .github/scripts/strict-grep/README.md.

jobs:
  i37-topbar-default-cluster:
    name: "I-37: TopBar primary-tab default cluster"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Babel parser
        run: npm install --no-save @babel/parser @babel/traverse
      - name: Run I-37 gate
        run: node .github/scripts/strict-grep/i37-topbar-cluster.mjs

