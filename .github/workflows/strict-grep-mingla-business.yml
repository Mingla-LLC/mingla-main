# When adding a new gate, follow the 4 steps in
# .github/scripts/strict-grep/README.md.

jobs:
  circle-rpc-sole-owner:
    name: "G-CIRCLE-RPC-SOLE-OWNER: Your Circle RPC sole owner"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run G-CIRCLE-RPC-SOLE-OWNER gate
        run: bash .github/scripts/strict-grep/circle-rpc-sole-owner.sh

  circle-badge-dual-app:
    name: "G-CIRCLE-BADGE-DUAL-APP: briefcase means dual-app"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run G-CIRCLE-BADGE-DUAL-APP gate
        run: bash .github/scripts/strict-grep/circle-badge-dual-app.sh

  orch-0913-no-tabs-on-dashboards:
    name: "ORCH-0913: no tab strips on dashboards"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run ORCH-0913 dashboard parity gate
        run: node .github/scripts/strict-grep/orch-0913-no-tabs-on-dashboards.mjs
      - name: Run ORCH-1016 bottom-sheet inline scroll-binding gate
        run: node .github/scripts/strict-grep/i-bottomsheet-inline-scroll-binding.mjs
      - name: Run ORCH-1055 nav-tab rank-gate parity (scanner-only app shell)
        run: node .github/scripts/strict-grep/orch-1055-nav-tab-rank-gate.mjs

  orch-0947-trip-spots-tickets-not-orders:
    name: "ORCH-0947: trip spots count tickets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run ORCH-0947 trip spots tickets gate
        run: node .github/scripts/strict-grep/orch-0947-trip-spots-tickets-not-orders.mjs

  orch-0957-no-metered-place-photo-reads:
    name: "ORCH-0957: no metered place-photo reads"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run ORCH-0957 storage transform overage gate
        run: node .github/scripts/strict-grep/orch-0957-no-metered-place-photo-reads.mjs

  orch-0963-public-trip-rpc-and-route-segregation:
    name: "ORCH-0963: public trip RPC and route segregation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run ORCH-0963 public trip RPC and route segregation gate
        run: node .github/scripts/strict-grep/orch-0963-public-trip-rpc-and-route-segregation.mjs

  orch-0964-theme-typed-columns:
    name: "ORCH-0964: theme typed columns"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run ORCH-0964 theme typed-columns gate
        run: node .github/scripts/strict-grep/orch-0964-theme-typed-columns.mjs

  orch-0964-theme-resolver-canonical:
    name: "ORCH-0964: theme resolver canonical"
