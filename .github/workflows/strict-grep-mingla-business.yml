name: Strict Grep Gates (Mingla Host)

on:
  pull_request:
    branches: [main, Seth]
    paths:
      - "mingla-business/**"
      - "app-mobile/**"
      - "mingla-admin/**"
      - "mingla-marketing/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "packages/**"
      - ".claude/skills/**"
      - "AGENTS.md"
      - ".github/scripts/strict-grep/**"
      # issue #2431 — the topology brake must run when ANY workflow is added;
      # otherwise a workflow-only PR could add the exact wrapper it forbids
      # without starting this batch.
      - ".github/workflows/**"
      - ".github/workflows/strict-grep-mingla-business.yml"
      # #994 — the 2026-08-06 landmine was a DOCUMENT. A bypass-prevention gate
      # that cannot run on the file class the bug lives in is theatre, so
      # docs-only PRs (including CLOSE docs PRs) now run this suite. That cost
      # is accepted deliberately. `scripts/ota/**` is narrow on purpose: the
      # post-publish verifier lives there and is swept by manifest-parity P11,
      # so a PR touching only it must still run the suite. Do NOT widen this to
      # all of `scripts/**`.
      - "docs/**"
      - "scripts/ota/**"
      # issue #2227 — the native openAuthSessionAsync redirect registry. ONE
      # file, deliberately: the gate SCANS app-mobile/** and mingla-business/**
      # (already above, so a new call site always re-runs it); this entry exists
      # only so editing the gate itself re-runs the gate. Same narrowness rule
      # as scripts/ota/** — do NOT widen to all of scripts/**.
      - "scripts/ci/check-native-authsession-redirects.sh"
      # issue #2264 — the discarded-answer registry. Same narrowness rule: the
      # gate already SCANS app-mobile/** and mingla-business/**, so a new
      # ticket-checkout-status call site re-runs it via those entries; this line
      # exists only so editing the gate itself re-runs the gate.
      - "scripts/ci/check-checkout-status-consumers.sh"
      # #2885 AC-4 — the machine-written baseline sits under a broad pattern
      # above, so a one-file recording PR matched this filter and ran the whole
      # suite. LAST on purpose: any other changed file still matches a positive
      # pattern above, so this only skips a baseline-ONLY change.
      - "!mingla-business/scripts/ci/bundle-baseline.json"
  push:
    branches: [main, Seth]
    paths:
      - "mingla-business/**"
      - "app-mobile/**"
      - "mingla-admin/**"
      - "mingla-marketing/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "packages/**"
      - ".claude/skills/**"
      - "AGENTS.md"
      - ".github/scripts/strict-grep/**"
      # issue #2431 — keep the post-merge topology proof reachable for every
      # workflow change, including workflow-only commits.
      - ".github/workflows/**"
      - ".github/workflows/strict-grep-mingla-business.yml"
      # #994 — the 2026-08-06 landmine was a DOCUMENT. A bypass-prevention gate
      # that cannot run on the file class the bug lives in is theatre, so
      # docs-only PRs (including CLOSE docs PRs) now run this suite. That cost
      # is accepted deliberately. `scripts/ota/**` is narrow on purpose: the
      # post-publish verifier lives there and is swept by manifest-parity P11,
      # so a PR touching only it must still run the suite. Do NOT widen this to
      # all of `scripts/**`.
      - "docs/**"
      - "scripts/ota/**"
      # issue #2227 — the native openAuthSessionAsync redirect registry. ONE
      # file, deliberately: the gate SCANS app-mobile/** and mingla-business/**
      # (already above, so a new call site always re-runs it); this entry exists
      # only so editing the gate itself re-runs the gate. Same narrowness rule
      # as scripts/ota/** — do NOT widen to all of scripts/**.
      - "scripts/ci/check-native-authsession-redirects.sh"
      # issue #2264 — the discarded-answer registry. Same narrowness rule: the
      # gate already SCANS app-mobile/** and mingla-business/**, so a new
      # ticket-checkout-status call site re-runs it via those entries; this line
      # exists only so editing the gate itself re-runs the gate.
      - "scripts/ci/check-checkout-status-consumers.sh"
      # #2885 AC-4 — the machine-written baseline sits under a broad pattern
      # above, so a one-file recording PR matched this filter and ran the whole
      # suite. LAST on purpose: any other changed file still matches a positive
      # pattern above, so this only skips a baseline-ONLY change.
      - "!mingla-business/scripts/ci/bundle-baseline.json"
concurrency:
  group: ci-strict-grep-mingla-business-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

# ORCH-1383 — BATCHED. This workflow used to declare 351 jobs, one per gate,
# each of which checked out the 685 MB repo and installed Node to run a ~0.1s script.
# ~92% of the machine time was duplicated setup. It now declares 10 jobs, grouped by
# WHAT EACH GATE NEEDS INSTALLED (the only axis that removes duplicated setup):
#
#   A static-gates      pure node + checkout                      (majority)
#   B dep-gates         + npm install of parsers/analyzers
#   C expo-export-gate  + a full `npx expo export -p web`, whose stderr its gate reads
#   D jest-suites       + app-mobile npm-run structural suites
#   E full-clone-gates  + fetch-depth: 0 (full git history)
#
# plus 4 CARVE-OUT jobs (gates that assert their own job key exists in this file —
# ORCH-1383 amendment, Seth-authorised Option 2) and 1 PRESERVED LANE
# (orch-1387-wallet-type-contract: a scoped npm-ci + tsc typecheck job that invokes no
# gate script — the batch runner cannot represent it, so its job survives verbatim).
#
# The gate list is NOT in this file any more — it is .github/scripts/strict-grep/MANIFEST.json,
# and run-batch.mjs asserts executed === manifest-expected for its class. A gate that
# stops running fails the build instead of vanishing silently. Per DEC-101 D-17b-5 the
# registry pattern survives; "one script + one workflow job" became "one script + one
# manifest entry", machine-checked by meta-1383-manifest-parity.mjs (P1-P9).
#
# ADDING A GATE: add the script + ONE MANIFEST.json entry. Do NOT add a job here.
# See .github/scripts/strict-grep/README.md.
#
# Differential proof that no gate went dark in the 351 -> 10 collapse:
# Mingla_Artifacts/reports/ORCH-1383_DIFFERENTIAL_PROOF.md (baseline run 29664288163,
