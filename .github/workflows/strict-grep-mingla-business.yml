#   orch-1369-release-submit-config  ->  orch-1369-release-submit-config.mjs
#   orch-1371-1372-picker-not-copresent  ->  orch-1371-1372-picker-not-copresent-with-sheet-modal.mjs
#   orch-1381-business-getapp-android-choice  ->  orch-1381-business-getapp-android-choice.mjs
#   orch-1381-open-external-no-double-nav  ->  orch-1381-open-external-no-double-nav.mjs
#   orch-1385-workspace-deps-declared  ->  orch-1385-workspace-deps-declared.mjs, orch-1385-workspace-deps-declared.test.mjs
#   orch-1387-wallet-config-threaded  ->  orch-1387-wallet-config-threaded.mjs, walletConfigThreading.orch1387.test.mjs, wallet_config_threading.orch1387.test.mjs
#   orch-1398-expo-pinned-54  ->  orch-1398-expo-pinned-54.mjs
#   regression-test-backfill-warning  ->  regression-test-backfill-warning.mjs
#   trip-capacity-single-source  ->  i-proposed-trip-canonical-columns.mjs, i-proposed-trip-canonical-columns.test.mjs

jobs:
  static-gates:
    name: "Strict grep — static gates (class A)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Run class A gates (batched)
        run: node .github/scripts/strict-grep/run-batch.mjs --class A
      - name: "Issues #1384/#1397: Edge currency state and FX executable suites"
        run: |
          deno check \
            supabase/functions/_shared/discoveryPrice.ts \
            supabase/functions/_shared/fxRates.ts \
            supabase/functions/discover-cards/index.ts \
            supabase/functions/manage-brand-discovery-currency/index.ts \
            supabase/functions/refresh-fx-rates/index.ts \
            supabase/functions/admin-review-venue-claim/index.ts \
            supabase/functions/_shared/discoveryPrice.issue1384.test.ts \
            supabase/functions/_shared/fxRates.issue1384.test.ts \
            supabase/functions/_shared/fxRates.issue1397.test.ts \
            supabase/functions/discover-cards/index.issue1384.test.ts \
            supabase/functions/manage-brand-discovery-currency/index.test.ts \
            supabase/functions/refresh-fx-rates/index.test.ts \
            supabase/functions/refresh-fx-rates/index.issue1397.test.ts \
            supabase/functions/admin-review-venue-claim/__tests__/issue_1384_discovery_price_approval_persistence.test.ts

          deno test --allow-env --allow-read \
            supabase/functions/_shared/discoveryPrice.issue1384.test.ts \
            supabase/functions/_shared/fxRates.issue1384.test.ts \
            supabase/functions/_shared/fxRates.issue1397.test.ts \
            supabase/functions/discover-cards/index.issue1384.test.ts \
            supabase/functions/manage-brand-discovery-currency/index.test.ts \
            supabase/functions/refresh-fx-rates/index.test.ts \
            supabase/functions/refresh-fx-rates/index.issue1397.test.ts \
            supabase/functions/admin-review-venue-claim/__tests__/issue_1384_discovery_price_approval_persistence.test.ts
      - name: "Issue #1384: Admin reason and revision-CAS suites"
        run: |
          node --test \
            mingla-admin/src/lib/__tests__/issue1384DiscoveryPriceAdminExecutable.test.js \
            mingla-admin/src/lib/__tests__/issue1384DiscoveryPriceAdmin.test.js
      - name: Upload class A gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results-A
          path: gate-results-A.json
          if-no-files-found: error

  # issue #2594 — OUT-OF-BAND adjudication of the class-A elapsed-time bound.
  #
  # A7-SC1(1) says class A must conclude `success` within 600 s. Until #2594 that
  # was prose on #2438 with NOTHING behind it: a breach reported `success` and no
  # check turned red. The one mechanism that did fire — the `timeout-minutes` kill
  # — surfaces as conclusion `cancelled`, not `failure`, and was misread as noise
  # four separate times on #2148.
  #
  # It has to be adjudicated from OUTSIDE the job it measures, for two independent
  # reasons: A7-SC4 forbids a wall-clock threshold inside any gate, and a cap kill
  # terminates class A before any step of its own can report. `needs:` plus
  # `if: always()` is what keeps this reachable in exactly that case.
  #
  # `permissions:` is JOB-level on purpose. This workflow declares no workflow-level
  # `permissions:` key, so every other job inherits the repository default; adding
  # one here at workflow level would change every one of their tokens.
  #
  # This is a REPORTING check with the same strength class A itself has. It is in
  # no ruleset, and putting it in one is out of scope for #2594.
  class-a-budget:
    name: "Strict grep — class A elapsed-time budget (out-of-band)"
    needs: [static-gates]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: "Adjudicate class A against the A7-SC1(1) 600 s bound"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLASS_A_JOB_NAME: "Strict grep — static gates (class A)"
          CLASS_A_BUDGET_SECONDS: "600"
          CLASS_A_TIMEOUT_KILL_SECONDS: "890"
        run: node .github/scripts/strict-grep/issue-2594-class-a-budget.mjs --enforce

  dep-gates:
    name: "Strict grep — dependency gates (class B)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # ORCH-1325 — PIN typescript to the repo's version (~5.9.2). The dist-tag
      # `latest` moved to TypeScript 7.0 (native rewrite), which dropped the
      # classic `ts.ModuleKind`/`transpileModule` JS API these gates transpile
      # with → an unpinned install crashed the gate repo-wide. Keep in lockstep
      # with app-mobile/package.json. Guarded by orch-1325-ci-typescript-pinned.
      # `yaml` is required by meta-1383-manifest-parity.mjs (P4 YAML-parses the
      # workflows; Correction D forbids grep).
      - name: Install gate dependencies
        run: npm install --no-save @babel/parser @babel/traverse madge typescript@~5.9.2 yaml
      - name: Run class B gates (batched)
        run: node .github/scripts/strict-grep/run-batch.mjs --class B
      - name: Upload class B gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results-B
          path: gate-results-B.json
          if-no-files-found: error

  expo-export-gate:
    name: "Strict grep — web-export deprecation parser (class C)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # SC-14: these two steps and the /tmp/expo-export-web.stderr side-effect path
      # are byte-identical to the pre-batch job. The gate reads a file a PRIOR step
      # writes — reordering or re-shelling them changes what the gate observes.
      - name: Install mingla-business deps
        working-directory: mingla-business
        run: npm install --no-save
      - name: "Issue #1919: Business provider-neutral readiness"
        working-directory: mingla-business
        run: >-
          npx jest --runInBand
          src/utils/__tests__/issue_1919_provider_neutral_paid_readiness.test.ts
          src/utils/__tests__/issue_1919_provider_neutral_paid_readiness.tester_adversarial.test.ts
      - name: "Issue #1384: Business authoring and buyer rendering suite"
        working-directory: mingla-business
        run: |
          npx jest --runInBand \
            src/services/__tests__/issue1384DiscoveryCurrencyExecutable.test.ts \
            src/components/venue/claim/__tests__/ClaimStepPrice.issue1384.executable.test.tsx \
            src/components/venue/__tests__/issue1384DiscoveryPriceAuthoringExecutable.test.ts
      - name: "Issue #2725: smarter competitor intelligence contracts"
        working-directory: mingla-business
        run: >-
          npx jest --runInBand
          src/components/venue/insights/__tests__/competitorIntelligence.issue2725.happy.test.ts
          src/services/__tests__/competitorBriefValidation.issue2725.tester.adversarial.test.ts
          src/services/__tests__/competitorBriefValidation.issue2725.rework.test.ts
      - name: "Issue #2796: premium competitor decision report"
        working-directory: mingla-business
        run: >-
          npx jest --runInBand
          src/services/__tests__/competitorDecisionReport.issue2796.happy.test.ts
          src/components/venue/insights/__tests__/competitorPremiumReportFocus.issue2796.tester.adversarial.test.tsx
          src/components/venue/insights/__tests__/competitorPremiumReport.issue2796.happy.test.ts
          src/components/venue/insights/__tests__/competitorAddSheetAccessibilityHeader.issue2796.happy.test.tsx
      - name: "Issue #2796: strict contract gate"
        run: node .github/scripts/strict-grep/issue-2796-competitor-decision-report.mjs
      - name: Run expo export -p web (capture stderr)
        working-directory: mingla-business
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://stub.supabase.co
          EXPO_PUBLIC_SUPABASE_ANON_KEY: stub_key_for_ci_export
        run: npx expo export -p web 2>/tmp/expo-export-web.stderr || true
      - name: Run class C gate (batched)
        run: node .github/scripts/strict-grep/run-batch.mjs --class C
      - name: Upload class C gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results-C
          path: gate-results-C.json
          if-no-files-found: error

  jest-suites:
    name: "Strict grep — app-mobile structural suites (class D)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 (issue #967): class D hosts the app-mobile test-runner gates that
          # spawn `node --experimental-strip-types --test <logic>.ts` (orch-1028 launch-city,
          # orch-1028 scroll-policy, orch-1039 collab-gate, orch-1161 notif-prefs). That flag
          # was added in Node 22.6 and errors on Node 20. Their .ts tests import only
          # dependency-free pure-logic modules, so no npm install is needed here. The two
          # pre-existing class-D npm-script gates are node-version-agnostic file checks.
          node-version: "22"
      - name: Install app-mobile test dependencies
        working-directory: app-mobile
        run: npm install --no-save
      - name: "Issue #1919: Consumer provider-neutral readiness"
        working-directory: app-mobile
        run: >-
          npx jest --runInBand
          src/hooks/__tests__/issue_1919_provider_neutral_paid_readiness.test.ts
          src/hooks/__tests__/issue_1919_provider_neutral_paid_readiness.tester_adversarial.test.ts
      - name: "Issue #1384: consumer carrier and runtime-parity suites"
        working-directory: app-mobile
        run: |
          npx jest --runInBand \
            src/components/utils/__tests__/discoveryPriceCarriers.issue1384.test.ts \
            src/services/__tests__/deckService.issue1384.test.ts \
            src/utils/__tests__/priceTiers.issue1384.test.ts \
            src/utils/__tests__/discoveryPriceRuntimeParity.issue1384.test.ts
      # Issue #1669 — the BEHAVIOURAL half of the one-producer work. The
      # structural half (the producer registry) runs as a class-A gate; this
      # opens the SAME place through four real production entry points and
      # asserts the rendered price pill, the Open-now badge, the rating chip and
      # the weather-block location agree. A registry that proves everyone calls
      # the mapper is worth nothing if the mapper stops carrying the fields.
      # The two ORCH-0997 holiday-adapter suites are appended because they were
      # DARK — present in the tree since PR #253 and wired into no workflow at
      # all. One of them asserted the friend page's Constitution-#9 behaviour for
      # an unrated place and nothing ran it, which is how it kept asserting a
      # premise (`rating` coerced to 0 counts as "hidden") that was false. They
      # cover the same producer as the suites above, so they belong in the same
      # step rather than a workflow of their own.
      - name: "Issue #1669: expanded-card one-producer parity"
        working-directory: app-mobile
        run: |
          npx jest --runInBand \
            src/components/utils/__tests__/issue_1669_one_producer_parity.test.ts \
            src/components/utils/__tests__/issue_1669_tester_adversarial.test.ts \
            src/components/utils/__tests__/holidayCardToExpandedCardData.test.ts \
            src/components/utils/__tests__/holidayCardToExpandedCardData.adversarial.test.ts
      # issue #2227 — the native browser-primitive registry gate lives at
      # scripts/ci/check-native-authsession-redirects.sh (a .sh outside the
      # strict-grep dir, like scripts/ci/security_definer_anon_gate.sh), so it
      # is wired by an explicit step rather than a MANIFEST entry. It belongs in
      # THIS workflow rather than a per-issue lane because it scans all of
      # app-mobile/** and mingla-business/**, which is exactly what this
      # workflow's paths filter already triggers on: a new openAuthSessionAsync
      # call site ANYWHERE in those trees re-runs the gate. A paths-gated
      # per-issue lane would only have guarded the files #2227 happened to
      # touch, which is not what a registry is for.
      #
      # Self-test first, so a gate that can no longer fail is caught before its
      # green is believed (the #2242 shape: a guard whose failing half never
      # ran, green for six days).
      - name: "Issue #2227: browser-redirect registry gate (self-test first)"
        run: bash scripts/ci/check-native-authsession-redirects.sh --self-test
      - name: "Issue #2227: no native openAuthSessionAsync https redirect"
        run: bash scripts/ci/check-native-authsession-redirects.sh
      # issue #2264 — the discarded-answer registry. Same reasoning and the same
      # home as #2227's: it scans all of app-mobile/** and mingla-business/**,
      # which is exactly what this workflow's paths filter already triggers on,
      # so a NEW ticket-checkout-status caller anywhere in those trees re-runs
      # it. That is the point — #2264 was one of five poll sites reading only
      # `order`, and a paths-gated per-issue lane would only have guarded the
      # files #2264 happened to touch.
      #
      # Self-test first, so a gate that can no longer fail is caught before its
      # green is believed (the #2242 shape).
      - name: "Issue #2264: checkout-status consumer registry (self-test first)"
        run: bash scripts/ci/check-checkout-status-consumers.sh --self-test
      - name: "Issue #2264: no caller discards the checkout-status verdict"
        run: bash scripts/ci/check-checkout-status-consumers.sh
      # The behavioural half. These run the REAL useNativeCheckoutFlow with only
      # the transport, the browser and the Stripe SDK stubbed, so they assert
      # which primitive was called with which URL and how many creates actually
      # fired — not that a function exists. Without this step they would sit in
      # the tree unrun, which is the state #2227's own report flagged.
      #
      # GLOBBED, NOT HAND-LISTED (#2227 QA F-4). A hand-list has now failed
      # twice on this one change: the #2050 amendment's own guard had no CI
      # home, and then the tester's three `.tester_adversarial.test.ts` files
      # landed in this exact directory and ran in NO workflow at all — the same
      # shape as #1038 / #1047 / #2242, a regression guard present in the tree
      # and wired into nothing. A list a human must remember to extend is the
      # defect; the fix is to stop keeping one. The globs sweep:
      #   * every #2227 / #2229 suite in the payments directory, and
      #   * every tester adversarial suite there, whatever issue it belongs to.
      # The whole directory is deliberately NOT globbed: two files in it are
      # node:test suites jest cannot host (orch_1244_applepay_cartitem.test.ts,
      # wallet_config_threading.orch1387.test.mjs).
      #
      # FLOOR ASSERTION. A glob that matches nothing is a step that cannot fail
      # — the #2242 shape this change keeps running into. `nullglob` + an
      # explicit minimum means a rename, a move or a typo REDS the lane instead
      # of quietly passing on an empty set. Raise the floor when suites are
      # added; it may never be lowered without saying which suite was retired.
      # #2264/#2265 join this lane rather than opening a new one: same files,
      # same directory, same reason. The `issue_2265_*` glob reaches into
      # expandedCard/__tests__ because that is where the cart sheet's own
      # regression lives, and an unwired suite is the defect this repo has now
      # fixed three times in two days.
      #
      # Floor 10 -> 11: the tester's adversarial suite
      # `issue_2264_return_leg_hostile_inputs.tester_adversarial.test.ts` is
      # matched by BOTH the `issue_2264_*` and the `*.tester_adversarial*` globs
      # and deduped by `sort -u`, so it counts once. It attacks the return-leg
      # mapper with the hostile-input set #2229's own adversarial suite already
      # pins against the create-leg mapper in the same module.
      - name: "Issues #2227/#2229/#2264/#2265: native Paystack hand-off, total error mapper + pending surface"
        working-directory: app-mobile
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          suites=$(printf '%s\n' \
            src/payments/__tests__/issue_2227_*.test.ts \
            src/payments/__tests__/issue_2229_*.test.ts \
            src/payments/__tests__/issue_2264_*.test.ts \
            src/payments/__tests__/*.tester_adversarial.test.ts \
            src/components/expandedCard/__tests__/issue_2265_*.test.ts \
            | sort -u)
          echo "Suites matched:"
          echo "$suites"
          matched=$(printf '%s\n' "$suites" | grep -c '\.test\.ts$' || true)
          if [ "$matched" -lt 11 ]; then
            echo "FAIL: the suite globs matched $matched files, expected at least 11."
            echo "A guard that matches nothing cannot fail. Fix the glob or the paths."
            exit 1
          fi
          npx jest --runInBand $suites
      # ORCH-1187's experience-purchase guard is DARK — present in the tree and
      # wired into no workflow at all. It asserts the stale-occurrence recovery
      # on ConsumerExperienceDetailScreen.tsx, which #2229 edits, and it caught a
      # real break in that change during implementation. It covers the same
      # surface as the step above, so it runs here rather than in a lane of its
      # own (same reasoning as the ORCH-0997 adapters in #1669 above).
      - name: "ORCH-1187: experience stale-occurrence recovery (was dark)"
        working-directory: app-mobile
        run: >-
          node --experimental-strip-types --test
          src/screens/Experience/__tests__/orch_1187_consumer_experience_purchase_bugs.test.tsx
      - name: "Issue #2443: Explorer release native identity"
        working-directory: app-mobile
        run: npx jest --runInBand src/services/__tests__/issue_2443_explorer_native_identity.implementor.test.ts
      - name: "Issue #2443: adversarial Explorer native identity"
        working-directory: app-mobile
        run: npx jest --runInBand src/services/__tests__/issue_2443_explorer_native_identity.tester_adversarial.test.ts
      - name: Run class D suites (batched)
        run: node .github/scripts/strict-grep/run-batch.mjs --class D
      - name: Upload class D gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results-D
          path: gate-results-D.json
          if-no-files-found: error

  full-clone-gates:
    name: "Strict grep — full-history gates (class E)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # SC-15: class E MUST keep fetch-depth: 0. These 3 gates read git history;
      # a shallow clone silently changes what they observe. Classes A–D stay shallow.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run class E gates (batched)
        run: node .github/scripts/strict-grep/run-batch.mjs --class E
      - name: Upload class E gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-results-E
          path: gate-results-E.json
          if-no-files-found: error

  # ===========================================================================
  # CARVE-OUT JOBS (4) — ORCH-1383 AMENDMENT, authorised by Seth at REVIEW
  # (Option 2 of the implementor's costed blocker; supersedes SPEC SC-1's
  # "exactly 5 jobs").
  #
  # These 4 jobs are PRESERVED BYTE-FOR-BYTE from the pre-batch workflow and are
  # deliberately NOT batched. Four gates assert that THEIR OWN JOB KEY exists in
  # this file:
  #
  #   orch-0778-web-stripe-native-import-gate.mjs   /^\s{2}<key>:\s*$/m
  #   orch-0885-a-no-bottomnav-on-wide-desktop.mjs  /^\s{2}<key>:\s*$/m
  #   mingla-admin/.../orch1271_admin_authz_foundation.test.js   /<key>:/
  #   mingla-admin/.../orch1273_offerings_console_read.test.js   /<key>:/
  #
  # Batching them deletes the key and fails all four, and SC-16 / SPEC §15 forbid
  # editing any of them (2 are gate scripts, 2 are mingla-admin product tests).
  # Keeping the jobs keeps those assertions TRUE rather than retargeting them at a
  # comment. Cost: ~4 billed minutes; wall clock unchanged (they run in parallel).
  #
  # DO NOT fold these into a batch class without first fixing those 4 assertions.
  # meta-1383-manifest-parity.mjs P9 fails the PR if a carve-out job disappears,
  # stops running its gate, or drops one of its invocation modes.
  # ===========================================================================

  orch-0778-web-stripe-native-import-gate:
    name: "ORCH-0778: Stripe native imports stay behind .native boundaries"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Self-test the ORCH-0778 gate
        run: node .github/scripts/strict-grep/orch-0778-web-stripe-native-import-gate.mjs --self-test
      - name: Run ORCH-0778 gate
        run: node .github/scripts/strict-grep/orch-0778-web-stripe-native-import-gate.mjs

  # #890 — carve-out (asserts its own job key + npm/workflow wiring, like ORCH-0778).
  # Keeps @sentry/browser out of the web graph except as the lazy dynamic import()
  # inside src/diagnostics/sentry.ts, and fails RED on revert to the no-op stub.
  issue-890-web-sentry-lazy-only:
    name: "#890: web @sentry/browser is lazy dynamic-import only (no static import; no stub revert)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Self-test the #890 gate
        run: node .github/scripts/strict-grep/issue-890-web-sentry-lazy-only.mjs --self-test
      - name: Run #890 gate
        run: node .github/scripts/strict-grep/issue-890-web-sentry-lazy-only.mjs

  orch-0885-a-no-bottomnav-on-wide-desktop:
    name: "ORCH-0885-A: No BottomNav outside (tabs)/_layout.tsx + desktop gate via hook only"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run ORCH-0885-A gate
        run: node .github/scripts/strict-grep/orch-0885-a-no-bottomnav-on-wide-desktop.mjs

  orch-1271-admin-authz-foundation:
    name: "ORCH-1271: admin single-gate + audited-write primitive + gate-first (I-PROPOSED-1271-ADMIN-SINGLE-GATE + I-PROPOSED-1271-ADMIN-WRITE-AUDITED + I-PROPOSED-1271-ADMIN-GATE-FIRST-STATEMENT)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Self-test the ORCH-1271 single-gate gate
        run: node .github/scripts/strict-grep/i-admin-single-gate.mjs --self-test
      - name: Run ORCH-1271 single-gate gate
        run: node .github/scripts/strict-grep/i-admin-single-gate.mjs
      - name: Self-test the ORCH-1271 write-audited gate
        run: node .github/scripts/strict-grep/i-admin-write-audited.mjs --self-test
      - name: Run ORCH-1271 write-audited gate
        run: node .github/scripts/strict-grep/i-admin-write-audited.mjs
      - name: Self-test the ORCH-1271 gate-first-statement gate
        run: node .github/scripts/strict-grep/i-admin-gate-first-statement.mjs --self-test
      - name: Run ORCH-1271 gate-first-statement gate
        run: node .github/scripts/strict-grep/i-admin-gate-first-statement.mjs

