324 (check (e) -> delegation) and I-PROPOSED-1328 (check 4 -> delegation). Self-tested 8/8 (incl. the noreferrer-only trap + an unconditional-sibling case only R3 catches) + fails-on-revert against 4 revert shapes (ORCH-1381 ADDENDUM — DRAFT until CLOSE)
