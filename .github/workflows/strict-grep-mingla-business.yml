name: Strict Grep Gates (Mingla Business)

on:
  pull_request:
    branches: [main, Seth]
    paths:
      - "mingla-business/**"
      - "app-mobile/**"
      - "mingla-admin/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "packages/**"
      - ".github/scripts/strict-grep/**"
      - ".github/workflows/strict-grep-mingla-business.yml"
  push:
    branches: [main, Seth]
    paths:
      - "mingla-business/**"
      - "app-mobile/**"
      - "mingla-admin/**"
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "packages/**"
      - ".github/scripts/strict-grep/**"
      - ".github/workflows/strict-grep-mingla-business.yml"

# Registry pattern (per DEC-101 D-17b-5):
# Each invariant CI gate is its own modular Node.js script in
# .github/scripts/strict-grep/. Adding a new gate = add one script + one
# job below. Each job runs in parallel; any failure fails the PR.
#
# Currently registered gates:
#   - I-37 (i37-topbar-cluster.mjs) — primary-tab default cluster (Cycle 17b)
#   - I-38 (i38-icon-chrome-touch-target.mjs) — IconChrome touch-target ≥ 44 effective (Cycle 17c)
#   - I-39 (i39-pressable-label.mjs) — Pressable accessibilityLabel coverage (Cycle 17c)
#   - I-PROPOSED-A (i-proposed-a-brands-deleted-filter.mjs) — brands queries filter deleted_at IS NULL (Cycle 17e-A)
#   - I-PROPOSED-C (i-proposed-c-brand-crud-via-react-query.mjs) — no setBrands() callers (Cycle 17e-A)
#   - I-PROPOSED-H (i-proposed-h-rls-returning-owner-gap.mjs) — every owner-callable mutation policy paired with direct-predicate owner-SELECT (ORCH-0734)
#   - I-PROPOSED-I (i-proposed-i-mutation-rowcount-verified.mjs) — every per-row .update/.delete must chain .select to verify rowcount (ORCH-0734-RW)
#   - I-PROPOSED-O (i-proposed-o-stripe-no-webview-wrap.mjs) — Stripe Embedded Components via official SDK only — no DIY WebView wrap (B2a)
#   - I-PROPOSED-P (i-proposed-p-stripe-state-canonical.mjs) — stripe_connect_accounts canonical; brands.stripe_* mirror via DB trigger only (B2a)
#   - I-PROPOSED-Q (i-proposed-q-stripe-api-version.mjs) — Stripe API version pinned via _shared/stripe.ts only; no inline overrides (B2a Path C)
#   - I-PROPOSED-R (i-proposed-r-stripe-idempotency-key.mjs) — Idempotency-Key on every Stripe API call (B2a Path C)
#   - I-PROPOSED-S (i-proposed-s-stripe-audit-log.mjs) — Audit log import + call on every Stripe edge function (B2a Path C)
#   - I-PROPOSED-T (i-proposed-t-stripe-country-allowlist.mjs) — Stripe country from canonical 34-country allowlist only (B2a Path C V3)
#   - I-PROPOSED-U (i-proposed-u-mingla-tos-gate.mjs) — Mingla ToS accepted before any Stripe Connect call (B2a Path C V3)
#   - I-PROPOSED-V (i-proposed-v-stripe-notification-via-shared.mjs) — Stripe edge fns dispatch via notify-dispatch only (B2a Path C V3)
#   - I-PROPOSED-W (i-proposed-w-notifications-app-type-prefix.mjs) — notifications reads filtered by app-type prefix (B2a Path C V3)
#   - I-PROPOSED-Y (i-proposed-y-platform-web-url-from-env.mjs) — platform web URL from env, never hardcoded (B2a Path C V3 forensics fix)
#   - I-PROPOSED-Z (i-proposed-z-home-no-fabricated-events.mjs) — Home uses real event/order truth, no fabricated upcoming rows (ORCH-0754)
#   - I-PROPOSED-TR2-EVENTS-TYPE-FILTER (i-proposed-tr2-events-type-filter.mjs) — services/hooks .from("events") + events-views must filter event_type or use allowlist (ORCH-0859 REWORK 3)
#   - I-PROPOSED-BV (orch-0854-tickets-realtime-publication-paired.mjs) — every client postgres_changes subscription paired with publication-add migration (ORCH-0854)
#   - I-PROPOSED-K (i-proposed-k-require-cycles.mjs) — require-cycles baselined (META-ORCH-0744)
#   - I-PROPOSED-L (process invariant) — DIAG markers reaped at CLOSE (META-ORCH-0744)
#   - I-PROPOSED-M (i-proposed-m-persist-key-whitelist.mjs) — persist-key whitelist sync (META-ORCH-0744)
#   - I-PROPOSED-N (i-proposed-n-transitional-exit-condition.mjs) — TRANSITIONAL exit-condition lint (META-ORCH-0744)
#   - I-PROPOSED-X (i-proposed-x-web-deprecation.mjs) — web-export deprecation parser (META-ORCH-0744)
#   - ORCH-0785-A (orch-0785-resend-attachment-aware.mjs) — Resend POST must declare attachments or opt out (ORCH-0785)
#   - ORCH-0785-B (orch-0785-no-resend-sandbox-fallback.mjs) — no onboarding@resend.dev fallback in source (ORCH-0785)
#   - ORCH-0785-C (orch-0785-buyer-string-escape.mjs) — buyer/event/order strings must flow through escapeHtml (ORCH-0785)
#   - ORCH-0785-D (orch-0785-shell-singleton.mjs) — shared email shell singleton (ORCH-0785)
#   - ORCH-0785-E (orch-0785-pdf-privacy.mjs) — ticket PDF privacy contract (ORCH-0785)
#   - I-ARI-NO-OKLCH (i-ari-no-oklch.mjs) — Ari mobile surface must use HSL/hex/rgb only; no oklch/color-mix/lab (ORCH-0821)
#   - I-ARI-USER-JWT-ONLY (i-ari-user-jwt-only.mjs) — Ari edge fn handlers must use caller JWT, not service role (ORCH-0821)
#   - I-VE5-PARSE-MENU-USER-JWT-ONLY (i-ve5-parse-menu-user-jwt-only.mjs) — parse-restaurant-menu uses caller JWT only (ORCH-0881)
#   - I-VE6-PARSE-PLAY-USER-JWT-ONLY (i-ve6-parse-play-user-jwt-only.mjs) — parse-play-activities uses caller JWT only (ORCH-0882)
#   - ORCH-0776 (orch-0776-video-processing-status-bridge.mjs) — event cover video processing status bridge
#   - ORCH-0776D (orch-0776d-cancelled-at-schema.mjs) — event cover video cancelled_at schema/code parity
#   - ORCH-0777 (orch-0777-ticket-checkout-production.mjs) — production ticket checkout + organizer order visibility
#   - ORCH-0778 (orch-0778-web-stripe-native-import-gate.mjs) — Stripe React Native imports stay behind .native payment boundaries (re-armed by ORCH-0781)
#   - ORCH-0783 (orch-0783-event-cover-image-provider-pivot.mjs) — event cover image/provider pivot preserves legacy renderers
#   - ORCH-0784 (orch-0784-event-list-sales-summary-visibility.mjs) — Home/Events list sales summaries stay visible and server-backed
#   - ORCH-0786 (orch-0786-creator-avatar-upload-integrity.mjs) — creator avatar upload uses expo-file-system + canonical URL + Image onError fallback
#   - ORCH-0795 (orch-0795-event-scanner-auto-provision.mjs) — event_scanners auto-provision trigger + UI honesty plumbing (I-PROPOSED-AZ EVENT_HAS_MANAGER_SCANNER)
#   - ORCH-0788 (orch-0788-notification-template-key-dispatched.mjs) — buyer notification dispatcher routes by template_key + writers inline-dispatch + sweeper migration (I-PROPOSED-BA NOTIFICATION_TEMPLATE_KEY_DISPATCHED)
#   - ORCH-0793 (orch-0793-scan-time-window.mjs) — biz_ticket_scan event_dates time-window enforcement + mobile discriminator plumbing (I-PROPOSED-BB SCAN_TIME_WINDOW_ENFORCED)
#   - ORCH-0796 (orch-0796-no-stub-payout-fee.mjs) — Reconciliation expected-payout derived from real Stripe app-fee + refund cols, no 4% stub (I-PROPOSED-BC EVENT_PAYOUT_DATA_DERIVED)
#   - ORCH-0808 (orch-0808-appsflyer-devices-app-discriminator.mjs) — appsflyer_devices writes carry app: 'consumer' | 'business' (I-PROPOSED-AF-DISCRIMINATOR)
#   - ORCH-0816 (orch-0816-last-7-days-binds-rev7d.mjs) — "Last 7 days" KPI tile binds stats.rev7d, never stats.rev (label/data agreement)
#   - ORCH-0829-B D-1 (orch-0829b-d1-checkout-expiry-tombstone-or-clause-present.mjs) — biz_ticket_checkout_create_session tombstones past-expiry in-flight sessions (I-PROPOSED-CHECKOUT-EXPIRY-TOMBSTONE)
#   - ORCH-0836 (app-mobile/scripts/ci/orch-0836-regression-check.mjs) — Stripe RN 0.65.1 forwardRef warning silenced via LogBox.ignoreLogs
#   - ORCH-0837 (app-mobile/scripts/ci/orch-0837-regression-check.mjs) — Stripe PI card-only + handleURLCallback wired (I-PROPOSED-STRIPE-PI-EXPLICIT-METHOD-TYPES + I-PROPOSED-STRIPE-CALLBACK-WIRED)
#   - ORCH-0839-A pagination (app-mobile/scripts/ci/orch-0839-a-tm-pagination-aligned.mjs) — TM cache-hit serves events verbatim (I-PROPOSED-DISCOVER-TM-CACHE-NO-SLICE)
#   - ORCH-0839-A meta (app-mobile/scripts/ci/orch-0839-a-meta-items-consistent.mjs) — merged meta counts match items returned (I-PROPOSED-DISCOVER-META-MATCHES-ITEMS)
#   - ORCH-0839-A cache-removed (app-mobile/scripts/ci/orch-0839-a-mobile-cache-removed.mjs) — mobile AsyncStorage cache permanently removed (I-PROPOSED-DISCOVER-NO-MOBILE-CACHE; supersedes ORCH-0835 cache-symmetry gate)
#   - ORCH-0839-B (RETIRED by ORCH-0849 [Stripe payment-method parity] 2026-05-15) — was: mingla-business hosted Stripe Checkout only. Superseded by ORCH-0849's native PaymentSheet adoption + I-PROPOSED-STRIPE-PAYMENTSHEET-PARITY. Gate file deleted.
#   - ORCH-0843 (orch-0843-stripe-direct-charges-only.mjs) — Mingla charge-creating Stripe API calls use DIRECT-CHARGE shape only (Stripe-Account header + application_fee_amount + statement_descriptor_suffix "MINGLA"); no transfer_data.destination anywhere under supabase/functions/ (I-PROPOSED-STRIPE-CHARGE-SHAPE-IS-DIRECT + I-PROPOSED-STRIPE-APPLICATION-FEE-PRESENT + I-PROPOSED-STRIPE-ACCOUNT-HEADER-ON-CONNECTED-CALLS + I-PROPOSED-STRIPE-STATEMENT-DESCRIPTOR-SUFFIX-MINGLA)
#   - ORCH-0844 (orch-0844-stripe-connect-account-id-per-pi.mjs) — mobile re-applies the connected-account scope per-PI via initStripe(...) BEFORE initPaymentSheet, and edge fn returns stripeAccountId + customerId + customerEphemeralKeySecret on requires_payment (I-PROPOSED-STRIPE-CONNECT-ACCOUNT-ID-PER-PI)
#   - ORCH-0845 (i-discover-excludes-ended-master-date.mjs) — discover-merged-events always filters event_dates.end_at >= lowerBoundUtc on the master date row, on BOTH the no-window and dated-chip paths (I-PROPOSED-DISCOVER-EXCLUDES-ENDED-MASTER-DATE)
#   - ORCH-0849 parity (i-stripe-paymentsheet-parity.mjs) — both app-mobile and mingla-business mount <StripeNativeProvider> + call initStripe per-PI with stripeAccountId + pass customer + customerEphemeralKeySecret to initPaymentSheet (I-PROPOSED-STRIPE-PAYMENTSHEET-PARITY)
#   - ORCH-0849 allowlist (i-stripe-pm-method-allowlist.mjs) — ticket-checkout-create sources payment_method_types from MINGLA_PM_ALLOWLIST in _shared/stripePaymentMethods.ts; no hardcoded literal at PI-create site; no automatic_payment_methods fan-out (I-PROPOSED-STRIPE-PM-METHOD-ALLOWLIST)
#   - ORCH-0846 (orch-0846-consumer-event-address-parity.mjs) — consumer-side discover-merged-events + ExpandedBusinessEventSheet resolve venueName/address/format identically to brand-side publicEventsService; restores META-ORCH-0827 Pass 2 Step 10 parity contract (I-PROPOSED-CONSUMER-EVENT-ADDRESS-PARITY)
#   - I-PROPOSED-AK (i-ticket-pdf-owner-check.mjs) — ticket-pdf-fetch enforces auth.uid() == orders.buyer_user_id before any storage op (ORCH-0842 [Fold Tickets into Active + render real ticket PDF in bottom sheet with venue/QR/Save])
#   - I-PROPOSED-AL (i-ticket-pdf-single-renderer.mjs) — pdf-lib import isolated to supabase/functions/_shared/ticketPdf.ts; no parallel renderer (ORCH-0842 [Fold Tickets into Active + render real ticket PDF in bottom sheet with venue/QR/Save])
#   - I-REGRESSION-TEST-BACKFILL-WARN (regression-test-backfill-warning.mjs) — informational warning for modified source files without sibling regression tests (ORCH-0840 [Regression-test enforcement + append-only CI])
#   - ORCH-0852 own-confirm-path (i-checkout-own-confirm-path.mjs) — buyer checkout routes call confirmTicketCheckout, never pollTicketCheckoutStatus; no `finalizing*` / `webResumeError` state; no "Payment received" / "Finalizing your tickets" / "Check now" / "Help me find my order" copy (I-CHECKOUT-OWN-CONFIRM-PATH + I-CHECKOUT-NO-POLL-AND-FAIL)
#   - ORCH-0852 wallet-stubs-removed (i-wallet-stubs-removed.mjs) — no "Add to Apple Wallet" / "Add to Google Wallet" affordances anywhere in mingla-business/ until real .pkpass + Google Wallet JWT ships (I-WALLET-PASS-HIDDEN-UNTIL-IMPLEMENTED)
#   - ORCH-0852 consumer-frozen (i-consumer-payment-flow-frozen.mjs) — consumer app nativeCheckoutFlow.ts + ExpandedBusinessEventSheet.tsx unchanged during ORCH-0852; identifier-substring fingerprint check
#   - ORCH-0862 brand-delete-date-aware (i-brand-delete-blocking-date-aware.mjs) — softDeleteBrand Step 1 + useBrandCascadePreview both filter event_dates.end_at > now (I-PROPOSED-BRAND-DELETE-BLOCKING-DATE-AWARE; DISCOVERY-7 regression guard)
#   - ORCH-0862 event-detail-cancel-no-nav (i-event-detail-cancel-no-navigation.mjs) — event/[id]/index.tsx handleCancelConfirm contains zero router.replace/push/back calls (Symptom A regression guard)
#
# Future gates to register (proposed but not yet implemented):
#   - I-32 rank parity (Cycle 13a proposal)
#   - I-34 canManualCheckIn decommission (Cycle 13b proposal)
#   - I-36 ROOT-ERROR-BOUNDARY (Cycle 16a proposal)
#
# When adding a new gate, follow the 4 steps in
# .github/scripts/strict-grep/README.md.

jobs:
  i37-topbar-default-cluster:
    name: "I-37: TopBar primary-tab default cluster"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Babel parser
        run: npm install --no-save @babel/parser @babel/traverse
      - name: Run I-37 gate
        run: node .github/scripts/strict-grep/i37-topbar-cluster.mjs

  i38-icon-chrome-touch-target:
    name: "I-38: IconChrome touch-target >= 44 effective"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Babel parser
        run: npm install --no-save @babel/parser @babel/traverse
      - name: Run I-38 gate
        run: node .github/scripts/strict-grep/i38-icon-chrome-touch-target.mjs

  i39-pressable-label:
