  # ===========================================================================
  # PRESERVED LANE (1) — ORCH-1383 REPLAY addition (main grew this job mid-flight).
  # orch-1387-wallet-type-contract is NOT a gate job: it runs a scoped
  # `npm ci` + `npx tsc --noEmit` type-contract lane and invokes NO gate script,
  # so it cannot be represented by run-batch.mjs (no script file to iterate) and
  # would be INVISIBLE to the differential proof if silently dropped — the proof's
  # universe is gate scripts. It is therefore preserved VERBATIM from the pre-batch
  # workflow. Its setup (full npm ci in mingla-business) is also unique — folding it
  # into any batch class would tax that class with a ~2-min install.
  # ===========================================================================

  orch-1387-wallet-type-contract:
    name: "ORCH-1387: scoped wallet type-contract lane — PaymentSheetInitInput wallet keys vendor-typed against the installed @stripe/stripe-react-native; two-sided: reverting the extension breaks the typetest positives, any-widening trips TS2578 on the negatives (D-6-immune scoped tsc lane, never the app baselines)"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
      - name: Run the ORCH-1387 scoped type-contract lane
        run: npx tsc --noEmit -p ../packages/payments-native/tsconfig.orch1387.typetest.json
