#   - I-PROPOSED-BRAND-FIELD-MAP-COVERAGE (orch-0962-brand-field-map-coverage.mjs) — brand-edit persisted fields stay mapped into public brand views/mappers/renderers (ORCH-0962)
#   - ORCH-0974 (orch-0974-home-mobile-lock-pane.mjs) — mobile Home locks KPI hero + Active Events + Upcoming header above the FlatList
