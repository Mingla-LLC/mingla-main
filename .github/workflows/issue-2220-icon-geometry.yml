name: "#2220/#2223 Icon Geometry"

on:
  pull_request:
    branches: [main]
    paths:
      - "app-mobile/assets/adaptive-icon.png"
      - "app-mobile/assets/favicon.png"
      - "app-mobile/app.json"
      - "mingla-business/assets/images/android-icon-foreground.png"
      - "mingla-business/assets/images/android-icon-monochrome.png"
      - "mingla-business/assets/images/android-icon-background.png"
      - "mingla-business/assets/images/favicon.png"
      - "mingla-business/app.json"
      - "scripts/ci/issue-2220-icon-geometry.py"
      - ".github/workflows/issue-2220-icon-geometry.yml"

permissions:
  contents: read

concurrency:
  group: ci-issue-2220-icon-geometry-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  icon-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pillow
      - name: Self-test — the measurements must catch broken icons
        run: python3 scripts/ci/issue-2220-icon-geometry.py --self-test
      - name: Measure the shipped icons
        run: python3 scripts/ci/issue-2220-icon-geometry.py
