name: issue-2217-confirmation-app-cta
# issue #2217 [confirmation screen: one device-aware button + connect the ticket
# to the buyer's account] — the dedicated PR + push lane.
#
# WHY THIS FILE EXISTS. Nothing in the repository applies the migration chain to
# a PostgreSQL service for the attendance-claim RPCs: #871 shipped the token
# claim with a `__tests__` suite that only the repository-wide Deno lane names,
# and that lane never executes SQL. #2217 moves a PAID ASSET between accounts on
# an identifier match, so its decision has to be executed against real
# PostgreSQL or it is not tested at all.
#
# Path filters err BROAD over the guarded SOURCE trees, not only the tests, so a
# revert of the product re-triggers the lane (the docs-only-CLOSE hazard).
#
# NOTE ON THE JEST INVOCATION BELOW: it names a FILENAME, never a route folder.
# `npx jest app/checkout/[eventId]` reads `[eventId]` as a character class,
# matches nothing, and exits 0 having run no tests — a green check that carries
# no information. `--listTests` is run first so the lane fails loudly if the
# pattern ever stops resolving to a file.

on:
  pull_request:
    paths: &issue_2217_paths
      - "supabase/migrations/20270421002217_issue_2217_identity_attendance_claim.sql"
      - "supabase/migrations/__tests__/issue_2217_identity_attendance_claim.test.sql"
      # #871 owns the token claim these RPCs sit beside; a re-emit of its
      # foundation can silently replace claim_attendance_internal or the proof
      # state CHECK that the identity claim has to keep satisfying.
      - "supabase/migrations/20270302000871_issue_0871_attendance_claim_foundation.sql"
      # add_buyer_to_event_chat and the conversation the sweep removes from.
      - "supabase/migrations/20260710000000_orch_0897_trip_event_group_chat.sql"
      - "supabase/functions/attendance-claim-identity/**"
      - "supabase/functions/attendance-claim-link/**"
      - "supabase/functions/claim-attendance/**"
      - "supabase/functions/_shared/attendanceClaim.ts"
      - "supabase/config.toml"
      - "mingla-business/src/components/checkout/DownloadMinglaCta.tsx"
      - "mingla-business/src/services/guestFunnelLink.ts"
      - "mingla-business/src/constants/storeLinks.ts"
      - "mingla-business/src/utils/attendanceClaimDeepLink.ts"
      - "mingla-business/app/checkout/**"
      - "mingla-business/app/checkout-trip/**"
      - "mingla-business/app/checkout-experience/**"
      - "mingla-business/src/services/__tests__/issue_2217_confirmation_app_cta.test.ts"
      - "app-mobile/src/services/attendanceClaimService.ts"
      - "app-mobile/app/index.tsx"
      - ".github/workflows/issue-2217-confirmation-app-cta-tests.yml"
      - "docs/INVARIANT_REGISTRY.md"
  push:
    branches: [main]
    paths: *issue_2217_paths
  workflow_dispatch:

concurrency:
  group: ci-issue-2217-confirmation-app-cta-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-2217-edge-contract:
    name: "#2217 Edge — the claim RPC takes a user id and nothing else"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # 10 tests. Fails on a true line deletion of the arming call in
      # attendance-claim-link, on any identifier parameter reaching the claim
      # RPC, on verify_jwt flipping, and on either confirmed_at column returning
      # to the identifier predicate.
      - name: "#2217 identity claim edge contract"
        run: >-
          deno test --allow-env --allow-read --no-check
          supabase/functions/attendance-claim-identity/__tests__/issue_2217_identity_claim_contract.test.ts
      # #871 owns the surface #2217 rewrote. Its suite must stay green.
      - name: "#871 sibling attendance-claim suite stays green"
        run: >-
          deno test --allow-env --allow-read --no-check
          supabase/functions/claim-attendance/__tests__/issue_0871_attendance_claim_contract.test.ts
      - run: deno check supabase/functions/attendance-claim-identity/index.ts
      - run: deno check supabase/functions/attendance-claim-link/index.ts

  issue-2217-client-cta:
    name: "#2217 Client — one button, and it points at the right store"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
      # THE BRACKET TRAP, GUARDED. The suite reads the three confirmation routes,
      # whose paths contain `[eventId]` / `[tripEventId]` / `[experienceEventId]`.
      # A jest pattern containing those brackets matches NOTHING and exits 0.
      # This step asserts the pattern resolves to exactly the one test file
      # before the suite is allowed to count as a pass.
      - name: "Prove the jest pattern resolves to a real file"
        run: |
          set -euo pipefail
          found=$(npx jest --listTests issue_2217_confirmation_app_cta | grep -c 'issue_2217_confirmation_app_cta.test.ts')
          if [ "$found" -ne 1 ]; then
            echo "jest pattern resolved to $found files, expected 1"; exit 1
          fi
      # 18 tests. Fails on a true line deletion of the detectClientPlatform
      # resolution, on the second store badge returning, on the guest-list card
      # returning to any of the three routes, or on fallbackUrl being dropped
      # from the deep-link opener.
      - name: "#2217 confirmation app CTA suite"
        run: npx jest issue_2217_confirmation_app_cta --runInBand
      - name: "#1342 sibling guest-funnel suite stays green"
        run: npx jest orch_1342_guest_funnel_link --runInBand

  issue-2217-postgres-contract:
    name: "#2217 PostgreSQL 17 — a guessed identifier is handed nothing"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ format('issue-2217-ci-{0}', github.run_id) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PostgreSQL 17 bootstrap to complete
        env:
          PGPASSWORD: ${{ format('issue-2217-ci-{0}', github.run_id) }}
        run: |
          for attempt in {1..90}; do
            if psql -h localhost -U postgres -d postgres -Atc \
              "SELECT to_regnamespace('vault') IS NOT NULL AND to_regrole('supabase_admin') IS NOT NULL" \
              2>/dev/null | grep -qx t; then
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not finish bootstrapping in 90s"; exit 1
      - name: Apply migrations in timestamp order
        env:
          PGPASSWORD: ${{ format('issue-2217-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f" >/dev/null
          done
      # This image's auth schema is the pre-GoTrue stub. The identity claim reads
      # `auth.identities`, which the stub does not have at all, and the columns
      # `email_confirmed_at` / `phone` / `phone_confirmed_at`, which it also
      # lacks. Provisioned as the owning role, exactly as #2150, #2136 and #1529
      # provision the auth.users columns they need. On hosted Supabase all of
      # this already exists and GoTrue owns it.
      - name: Match hosted Supabase Auth identity shape
        env:
          PGPASSWORD: ${{ format('issue-2217-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS deleted_at timestamptz" \
            -c "ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS is_anonymous boolean DEFAULT false" \
            -c "ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS banned_until timestamptz" \
            -c "ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS email_confirmed_at timestamptz" \
            -c "ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS phone text" \
            -c "ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS phone_confirmed_at timestamptz" \
            -c "CREATE TABLE IF NOT EXISTS auth.identities (id uuid PRIMARY KEY DEFAULT gen_random_uuid(), provider_id text, user_id uuid NOT NULL, identity_data jsonb NOT NULL DEFAULT '{}'::jsonb, provider text NOT NULL, last_sign_in_at timestamptz, created_at timestamptz DEFAULT now(), updated_at timestamptz DEFAULT now())" \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON auth.identities TO postgres"
      # I-01..I-13, executed. I-02 is the one that matters: `attacker` is given
      # auth.users.email = the buyer's address WITH email_confirmed_at set — the
      # shape 125 of 125 production users already have — and must be handed
      # nothing. Measured: replacing the auth.identities predicate with that
      # column makes I-02 hand the attacker the ticket.
      - name: "Prove the claim moves for the buyer and never for a guess"
        env:
          PGPASSWORD: ${{ format('issue-2217-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_2217_identity_attendance_claim.test.sql
      # #871's own PostgreSQL suite covers the token claim these RPCs sit beside.
      # It runs as `supabase_admin` — it sets `session_replication_role` inside a
      # DO block, which `postgres` is refused on this image. Copied from the #871
      # lane rather than re-derived, because the failure is a permission error
      # that looks exactly like a real regression.
      - name: "#871 sibling PostgreSQL suite stays green under the #2217 change"
        env:
          PGPASSWORD: ${{ format('issue-2217-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_0871_attendance_roster_pg17.test.sql
