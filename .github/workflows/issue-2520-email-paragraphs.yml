name: "Issue #2520 — email paragraph reflow"

# Guards the fix for #2520: the composer stores body copy as a token string
# whose paragraph separator is `\n\n`, and nothing converted it to HTML — so
# every marketing email shipped as one unbroken wall of text. Proven against
# the 189 emails sent for the `We Go Again` blast on 2026-08-24.

on:
  pull_request:
    paths:
      - "supabase/functions/_shared/marketingEmailRender.ts"
      - "supabase/functions/_shared/email/shell.ts"
      - "supabase/functions/_shared/issue_2520_email_paragraphs.test.ts"
      - "supabase/functions/_shared/issue_2520_email_paragraphs.tester_adversarial.test.ts"
      - ".github/workflows/issue-2520-email-paragraphs.yml"
  push:
    branches: ["**"]
    paths:
      - "supabase/functions/_shared/marketingEmailRender.ts"
      - "supabase/functions/_shared/email/shell.ts"
      - "supabase/functions/_shared/issue_2520_email_paragraphs.test.ts"
      - "supabase/functions/_shared/issue_2520_email_paragraphs.tester_adversarial.test.ts"
      - ".github/workflows/issue-2520-email-paragraphs.yml"

permissions:
  contents: read

jobs:
  email-paragraph-reflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Format-check the new #2520 Deno test files (NARROW gate — #1184 precedent)
        # Enumerated, never globbed: a directory glob would pull in pre-existing
        # legacy `_shared` files that are intentionally NOT reformatted.
        # `marketingEmailRender.ts` is deliberately NOT fmt-checked for the same
        # reason — it predates the gate. It stays protected by `deno check` below.
        run: |
          deno fmt --check \
            supabase/functions/_shared/issue_2520_email_paragraphs.test.ts \
            supabase/functions/_shared/issue_2520_email_paragraphs.tester_adversarial.test.ts
      - name: Type-check the changed edge module
        run: deno check supabase/functions/_shared/marketingEmailRender.ts
      - name: Paragraph reflow contracts (implementor happy-path + tester adversarial)
        run: |
          deno test --allow-env --allow-read \
            supabase/functions/_shared/issue_2520_email_paragraphs.test.ts \
            supabase/functions/_shared/issue_2520_email_paragraphs.tester_adversarial.test.ts
      - name: Neighbouring email-pipeline suites must stay green
        run: |
          deno test --allow-env --allow-read --no-check \
            supabase/functions/_shared/__tests__/orch_1195_experience_email.test.ts \
            supabase/functions/_shared/__tests__/orch_1200_email_pipeline_adversarial.test.ts
