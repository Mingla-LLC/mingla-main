name: Issue 1639 Profile Cards Batched Request Tests

# #1639 [profile cards fix] — the paired-profile card sections ask for what is
# actually on screen, exactly once.
#
# WHY THIS GATE EXISTS: `usePairedProfileCards` keyed the BATCHED card query on
# (pairedUserId, mode) only. `sections` is a request-body input and was absent from
# the key, while `batchedSectionRequests` is built from `customHolidays`, which the
# PARENT fetches asynchronously and which lands AFTER PersonHolidayView has already
# mounted and fired with `customHolidays = []`. The section list grew; the key did
# not; React Query never refetched; `sections['custom_<id>']` stayed `undefined` for
# the life of the cache entry. Custom-holiday rows were not slow — they were never
# requested — and the row then rendered a horizontal strip containing nothing but a
# shuffle button, with no skeleton, no empty state, no error and no retry.
#
# The obvious repair is worse than the bug if shipped alone: putting `sections` in
# the key without a readiness gate fires the request TWICE on a cold mount (measured
# at 12 sections then 14). Each request fans out server-side to ~17 sections, each
# running `query_person_hero_places_by_signal`, measured on production at 1.8 s warm
# and 3.9 s cold, ~200k buffer accesses per call. A duplicate doubles the single most
# expensive operation in the product. So the key change is gated, and the committed
# section set is GROW-ONLY so that archiving a holiday never re-issues the fan-out.
#
# WITHOUT THIS WORKFLOW THE SUITE WOULD BE DARK (the ORCH-1383 dark-test-surface
# trap): app-mobile has NO jest, its tests run under plain `node`, and no workflow
# sweeps src/components/__tests__/. Same shape and rationale as
# issue-1516-coach-mark-tests.yml.
#
# The suite is NOT a source-grep — it sucrase-transpiles and EXECUTES the real
# PersonHolidayView, usePairedProfileCards, useHolidayCategories, usePairedCards,
# queryKeys and constants/holidays against a deterministic hook runtime, and records
# every request AT THE SERVICE BOUNDARY, so the assertions are about the request body
# that would go on the wire.
#
# EXPLICIT registry (never a glob) — add a suite by appending its path below.
# Invokes no .mjs under .github/scripts/strict-grep/, so MANIFEST.json totality
# and parity are untouched.

on:
  push:
    branches: [main]
    paths:
      - "app-mobile/src/components/PersonHolidayView.tsx"
      - "app-mobile/src/components/profile/ViewFriendProfileScreen.tsx"
      - "app-mobile/src/hooks/usePairedProfileCards.ts"
      - "app-mobile/src/hooks/usePairedCards.ts"
      - "app-mobile/src/hooks/useHolidayCategories.ts"
      - "app-mobile/src/hooks/queryKeys.ts"
      - "app-mobile/src/constants/holidays.ts"
      - "app-mobile/src/components/__tests__/issue-1639-profile-cards-batch*.test.tsx"
      - "app-mobile/package.json"
      - "app-mobile/scripts/ci/issue-1639-orch1016-fixc-guard.mjs"
      - ".github/workflows/issue-1639-profile-cards-tests.yml"
  pull_request:
    paths:
      - "app-mobile/src/components/PersonHolidayView.tsx"
      - "app-mobile/src/components/profile/ViewFriendProfileScreen.tsx"
      - "app-mobile/src/hooks/usePairedProfileCards.ts"
      - "app-mobile/src/hooks/usePairedCards.ts"
      - "app-mobile/src/hooks/useHolidayCategories.ts"
      - "app-mobile/src/hooks/queryKeys.ts"
      - "app-mobile/src/constants/holidays.ts"
      - "app-mobile/src/components/__tests__/issue-1639-profile-cards-batch*.test.tsx"
      - "app-mobile/package.json"
      - "app-mobile/scripts/ci/issue-1639-orch1016-fixc-guard.mjs"
      - ".github/workflows/issue-1639-profile-cards-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-1639-batched-card-request:
    name: "#1639 CONS: the batched card request asks for every section on screen, exactly once (fails-on-revert)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 — the app-mobile convention (there is no jest in this app).
          node-version: "22"
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json
      # npm ci is required: the suite EXECUTES the real component, which it
      # transpiles with the already-vendored `sucrase`, and it loads the real
      # constants/holidays.ts so the section count is never a replica.
      - name: Install deps (the suite executes the real component via sucrase)
        run: npm ci
      - name: Run issue-1639 suite (implementor happy-path)
        run: npm run test:issue-1639
      # BACKWARD COMPATIBILITY, narrowed deliberately. The pre-existing ORCH-1016 suite
      # (`orch_1016_rework4_sheets_keyboard_pills.test.tsx`) also reads
      # PersonHolidayView's source, and its FIX-C checks — the collapsed card's chip
      # containment — are the ones #1639 must not disturb. It is NOT invoked whole,
      # because its `B-ref` drift guard has been RED since ORCH-1361 (e3d87c40b)
      # rewrote `CityPickerSheet.tsx` and removed BottomSheetTextInput: that suite is
      # wired into no workflow, so nothing has ever run it and nobody noticed (the
      # #1584 dark-suite class — reported as a discovery on #1639). Wiring it whole
      # here would make this gate red for an unrelated, pre-existing reason. Its FIX-C
      # assertions are re-asserted directly instead, so the contract THIS pr could
      # actually break stays guarded.
      - name: ORCH-1016 FIX-C contract on PersonHolidayView is intact (chips still contained)
        run: node ./scripts/ci/issue-1639-orch1016-fixc-guard.mjs
