name: CI batch (per-issue suites)

# #2148 Stage 3 [ci-runtime]. Replaces one CI job per issue-suite with one job for
# the whole class.
#
# MEASURED on a real PR: the non-database CI set spent 60 job-minutes running tests
# and 65 job-minutes setting up to run them. A typical per-issue job spent ~40s on
# checkout and runner boot to execute ~14s of `node --test`. With the org capped at
# 20 concurrent jobs, that PR queued 335 job-minutes against 141 spent executing —
# the median job waited 182s to do 46s of work.
#
# This deletes the setup, not the tests. Every suite that ran before still runs;
# `.github/ci-batch/MANIFEST.json` is the registry and run-suite-batch.mjs asserts
# executed === expected, so a suite that goes missing fails the run instead of
# quietly disappearing (the ORCH-1383 contract, which replaced 340 one-gate jobs on
# the same guarantee).
#
# NO paths: filter, deliberately. The workflows folded in here were each paths-gated;
# the batch is not. That is MORE coverage than before — a paths-gated suite silently
# skips on a PR that misses its globs, which is how a latent main-red landed in
# PR #743 and surfaced on someone else's unrelated PR. Each suite's former globs are
# retained in the manifest as `originPaths`, for provenance only.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: "Bounded operational suite"
        required: true
        type: choice
        options:
          - issue-2300-orch-artifact-reap

permissions:
  contents: read

concurrency:
  group: ci-ci-batch-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  batch:
    name: "CI batch: ${{ matrix.class }}"
    # jobs.<job_id>.if is evaluated before matrix expansion, so this condition
    # deliberately uses only the event context available at that point.
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.hostTimeoutMinutes }}
    strategy:
      # fail-fast MUST stay false: one class going red must not cancel the others,
      # or a single failure hides the state of every suite in every other class —
      # the same reason the runner never breaks early (R2).
      fail-fast: false
      matrix:
        include:
          # Classes are dependency profiles, not arbitrary shards: suites are grouped
          # by what they need installed, so a class pays ONE setup for all of them.
          # That is the entire saving — 14 suites sharing one `npm ci` instead of
          # running 14 of them.
          - class: node20-noinstall
            node: "20"
            cache: ""
            cache-lock: ""
            hostTimeoutMinutes: 50
            secondaryClass: phase3b-tenant-node20-deno146
            secondaryNode: "20"
            secondaryDeno: "1.46.x"
            tertiaryClass: ""
            tertiaryNode: ""
            tertiaryDeno: ""
            tertiaryOrder: ""
          # The business suites are split 4 ways: MEASURED locally they take ~730s
          # end to end, so as ONE job they would become the new critical path — a
          # regression, since today they run in parallel. The split is round-robin
          # by count for now; suite-results.json carries per-suite seconds so these
          # can be rebalanced from evidence after the first run.
          - class: business-node20-1
            node: "20"
            cache: npm
            cache-lock: mingla-business/package-lock.json
            hostTimeoutMinutes: 45
            secondaryClass: ""
            secondaryNode: ""
            secondaryDeno: ""
            tertiaryClass: phase3c-deno146-node20
            tertiaryNode: "20"
            tertiaryDeno: "1.46.x"
            tertiaryOrder: "node-first"
          - class: business-node20-2
            node: "20"
            cache: npm
            cache-lock: mingla-business/package-lock.json
            hostTimeoutMinutes: 40
            secondaryClass: ""
            secondaryNode: ""
            secondaryDeno: ""
            tertiaryClass: phase3c-deno2x-node20
            tertiaryNode: "20"
            tertiaryDeno: "v2.x"
            tertiaryOrder: "node-first"
          - class: business-node20-3
            node: "20"
            cache: npm
            cache-lock: mingla-business/package-lock.json
            hostTimeoutMinutes: 45
            secondaryClass: ""
            secondaryNode: ""
            secondaryDeno: ""
            tertiaryClass: phase3c-deno2714-admin-node20
            tertiaryNode: "20"
            tertiaryDeno: "v2.7.14"
            tertiaryOrder: "node-first"
          - class: business-node20-4
            node: "20"
            cache: npm
            cache-lock: mingla-business/package-lock.json
            hostTimeoutMinutes: 45
            secondaryClass: ""
            secondaryNode: ""
            secondaryDeno: ""
            tertiaryClass: phase3c-deno2x-admin-node20
            tertiaryNode: "20"
            tertiaryDeno: "v2.x"
            tertiaryOrder: "deno-first"
          - class: admin-node20-install
            node: "20"
            cache: npm
            cache-lock: mingla-admin/package-lock.json
            hostTimeoutMinutes: 55
            secondaryClass: phase3b-lifecycle-node20-deno2
            secondaryNode: "20"
            secondaryDeno: "v2.x"
            tertiaryClass: ""
            tertiaryNode: ""
            tertiaryDeno: ""
            tertiaryOrder: ""
          - class: node22-noinstall
            node: "22"
            cache: ""
            cache-lock: ""
            hostTimeoutMinutes: 55
            secondaryClass: phase3b-theme-node20
            secondaryNode: "20"
            secondaryDeno: ""
            tertiaryClass: ""
            tertiaryNode: ""
            tertiaryDeno: ""
            tertiaryOrder: ""
          - class: app-node22-install
            node: "22"
            cache: npm
            cache-lock: app-mobile/package-lock.json
            hostTimeoutMinutes: 50
            secondaryClass: ""
            secondaryNode: ""
            secondaryDeno: ""
            tertiaryClass: phase3c-deno2x-app-node22
            tertiaryNode: "22"
            tertiaryDeno: "v2.x"
            tertiaryOrder: "node-first"
          - class: business-node22-ignore-scripts
            node: "22"
            cache: npm
            cache-lock: mingla-business/package-lock.json
            hostTimeoutMinutes: 60
            secondaryClass: phase3b-brand-follow-node20-deno146
            secondaryNode: "20"
            secondaryDeno: "1.46.x"
            tertiaryClass: ""
            tertiaryNode: ""
            tertiaryDeno: ""
            tertiaryOrder: ""
          - class: cross-root-node22-ignore-scripts
            node: "22"
            cache: ""
            cache-lock: ""
            hostTimeoutMinutes: 62
            secondaryClass: phase3b-draft-node20-renderer
            secondaryNode: "20"
            secondaryDeno: ""
            tertiaryClass: phase3c-deno2714-node20
            tertiaryNode: "20"
            tertiaryDeno: "v2.7.14"
            tertiaryOrder: "node-first"
          - class: root-node20-yaml-no-save
            node: "20"
            cache: ""
            cache-lock: ""
            hostTimeoutMinutes: 55
            secondaryClass: phase3b-scanner-node20-renderer
            secondaryNode: "20"
            secondaryDeno: ""
            tertiaryClass: ""
            tertiaryNode: ""
            tertiaryDeno: ""
            tertiaryOrder: ""
          - class: node20-19-noinstall
            node: "20.19.4"
            cache: ""
            cache-lock: ""
            hostTimeoutMinutes: 55
            secondaryClass: phase3b-screens-node20-deno2-renderer
            secondaryNode: "20"
            secondaryDeno: "v2.x"
            tertiaryClass: ""
            tertiaryNode: ""
            tertiaryDeno: ""
            tertiaryOrder: ""
          - class: ota-app-node20-19-install
            node: "20.19.4"
            cache: npm
            cache-lock: app-mobile/package-lock.json
            hostTimeoutMinutes: 105
            secondaryClass: phase3b-business-node22
            secondaryNode: "22"
            secondaryDeno: ""
            tertiaryClass: ""
            tertiaryNode: ""
            tertiaryDeno: ""
            tertiaryOrder: ""
          - class: ota-business-node20-19-install
            node: "20.19.4"
            cache: npm
            cache-lock: mingla-business/package-lock.json
            hostTimeoutMinutes: 55
            secondaryClass: phase3b-enablers-node20-deno2
            secondaryNode: "20"
            secondaryDeno: "v2.x"
            tertiaryClass: ""
            tertiaryNode: ""
            tertiaryDeno: ""
            tertiaryOrder: ""
    steps:
      # fetch-depth: 0 is REQUIRED, not incidental. Three batched suites
      # (#1881, #1532, #1996) run `git show <baseline>` / `git diff <baseline>` to
      # pin a byte-level patch, and their own workflows each asked for full history.
      # The batch originally used the default shallow clone and #1881 went red on
      # CI while passing locally, because a depth-1 clone has no baseline commit to
      # diff against. The generator refused workflows using an ACTION it could not
      # reproduce, but said nothing about the OPTIONS on the actions it kept — this
      # is that gap, closed. Any future suite needing deeper checkout config must be
      # checked here before being folded in.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      # #2882. The selection, printed once per job with its denominator, before
      # the job spends anything. Four of sixteen sampled commits on main select
      # ZERO suites — a legitimate outcome that must never be indistinguishable
      # from a router that silently did nothing, so the count is always printed
      # beside the registry size it was drawn from. On push and workflow_dispatch
      # the mode is `full` and every registered suite runs, exactly as before.
      # This step also fails the job in seconds when the changed-path list cannot
      # be derived, rather than after fourteen hosts have finished installing.
      - name: Print the routed suite selection with its denominator
        timeout-minutes: 2
        run: node .github/scripts/ci-batch/run-suite-batch.mjs --route-preview "${{ matrix.class }}"
      - name: Select Phase 3B suites from complete local Git history
        id: phase3b-select
        timeout-minutes: 2
        continue-on-error: true
        run: >-
          node .github/scripts/ci-batch/select-phase3b-suites.mjs --select
          --host "${{ matrix.class }}"
          --document "$RUNNER_TEMP/phase3b-raw-${{ matrix.class }}.json"
      - name: Normalize Phase 3B decision fail-safe
        id: phase3b-decision
        if: always()
        timeout-minutes: 1
        continue-on-error: true
        run: >-
          node .github/scripts/ci-batch/select-phase3b-suites.mjs --normalize
          --host "${{ matrix.class }}"
          --input "$RUNNER_TEMP/phase3b-raw-${{ matrix.class }}.json"
          --outcome "${{ steps.phase3b-select.outcome }}"
          --document "$RUNNER_TEMP/phase3b-decision-${{ matrix.class }}.json"
      - name: Upload Phase 3B selection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase3b-selection-${{ matrix.class }}
          path: ${{ runner.temp }}/phase3b-decision-${{ matrix.class }}.json
          if-no-files-found: error
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: always()
        with:
          node-version: ${{ matrix.node }}
          cache: ${{ matrix.cache }}
          cache-dependency-path: ${{ matrix.cache-lock }}

      # Setup is selected only from the reviewed typed profile registry. The runner
      # executes each exact argv capability once, then writes non-forgeable evidence
      # before any assertion suite is admitted.
      - name: Execute and record one typed shard setup
        if: always()
        run: node .github/scripts/ci-batch/run-suite-batch.mjs --setup "${{ matrix.class }}"

      # The runner's own guarantees are load-bearing: it is the only thing standing
      # between "one job for many suites" and "one green lie". Prove it still bites
      # BEFORE trusting it to report on anything.
      # #2882 rides on the same step rather than adding one: routing decides
      # WHICH suites this job runs, so the proof that routing is correct belongs
      # exactly where the proof that the runner is honest already lives — before
      # either is trusted to report on anything.
      # #3072 rides here for the same reason and one more: it routes the six
      # live-provider lanes ci-batch does NOT execute, using this same registry
      # and this same origin-pattern grammar. Its proof that #2885 AC-4's
      # baseline exclusion still holds must run on every pull request, not only
      # on the ones that touch those six lanes — that assertion is the one most
      # likely to be broken silently by something else.
      - name: Batch runner self-test (proves a vanished suite fails the run)
        if: always()
        run: >-
          node --test
          .github/scripts/ci-batch/__tests__/run-suite-batch.test.mjs
          .github/scripts/ci-batch/__tests__/issue-2882-origin-paths-routing.implementor.test.mjs
          .github/scripts/ci-batch/__tests__/issue-2882-routing-cannot-select-silently.tester.test.mjs
          .github/scripts/ci-batch/__tests__/issue-3072-live-provider-routing.implementor.test.mjs

      - name: Run the ${{ matrix.class }} suites
        if: always()
        run: node .github/scripts/ci-batch/run-suite-batch.mjs --run "${{ matrix.class }}"

      - name: Upload suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-results-${{ matrix.class }}
          path: suite-results.json
          if-no-files-found: error

      - name: Select secondary Node runtime
        if: always() && matrix.secondaryClass != '' && (steps.phase3b-decision.outputs.runSecondary != 'false' || steps.phase3b-select.outcome != 'success' || steps.phase3b-decision.outcome != 'success')
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.secondaryNode }}
      - name: Select immutable Deno 1.46 runtime
        if: always() && matrix.secondaryDeno == '1.46.x' && (steps.phase3b-decision.outputs.runSecondary != 'false' || steps.phase3b-select.outcome != 'success' || steps.phase3b-decision.outcome != 'success')
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d
        with:
          deno-version: 1.46.x
      - name: Select immutable Deno v2 runtime
        if: always() && matrix.secondaryDeno == 'v2.x' && (steps.phase3b-decision.outputs.runSecondary != 'false' || steps.phase3b-select.outcome != 'success' || steps.phase3b-decision.outcome != 'success')
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Execute one typed Phase 3B setup
        if: always() && matrix.secondaryClass != '' && (steps.phase3b-decision.outputs.runSecondary != 'false' || steps.phase3b-select.outcome != 'success' || steps.phase3b-decision.outcome != 'success')
        timeout-minutes: 5
        run: node .github/scripts/ci-batch/run-suite-batch.mjs --setup "${{ matrix.secondaryClass }}"
      - name: Run selected Phase 3B suites with exact attribution
        if: always() && matrix.secondaryClass != '' && (steps.phase3b-decision.outputs.runSecondary != 'false' || steps.phase3b-select.outcome != 'success' || steps.phase3b-decision.outcome != 'success')
        run: >-
          node .github/scripts/ci-batch/run-suite-batch.mjs --run-phase3b-host
          "${{ matrix.class }}" "$RUNNER_TEMP/phase3b-decision-${{ matrix.class }}.json"
          --fail-safe-host "${{ matrix.secondaryClass }}"
      - name: Upload Phase 3B suite results
        if: always() && matrix.secondaryClass != '' && (steps.phase3b-decision.outputs.runSecondary != 'false' || steps.phase3b-select.outcome != 'success' || steps.phase3b-decision.outcome != 'success')
        uses: actions/upload-artifact@v4
        with:
          name: suite-results-phase3b-${{ matrix.class }}
          path: suite-results-phase3b.json
          if-no-files-found: error
      - name: Reconcile Phase 3B host and surface deferred selector errors
        if: always()
        timeout-minutes: 2
        run: >-
          node .github/scripts/ci-batch/select-phase3b-suites.mjs --reconcile
          --host "${{ matrix.class }}"
          --input "$RUNNER_TEMP/phase3b-decision-${{ matrix.class }}.json"
          --primary "suite-results.json"
          --secondary "suite-results-phase3b.json"

      # ---------------------------------------------------------------------
      # #2439 Phase 3C. Six secondary Deno classes hosted inside the SAME
      # fourteen primary matrix jobs - no new GitHub Actions job. Each host runs
      # every Phase 3C suite the registry assigns it; there is no selection
      # protocol here, so there is no decision document to defer or fail safe
      # over. The three Deno runtime selectors are mutually exclusive by matrix
      # value and every action SHA is immutable.
      # ---------------------------------------------------------------------
      # [#2439 SC-7.2] Setup ORDER is part of the profile, so it is preserved per
      # class rather than normalised. #1427 and #2230 ran setup-node BEFORE
      # setup-deno; #1950 ran setup-deno FIRST. Exactly one of these two steps
      # fires for a given host, chosen by the reviewed matrix field.
      - name: Select tertiary Node runtime before Deno
        if: always() && matrix.tertiaryClass != '' && matrix.tertiaryOrder == 'node-first'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.tertiaryNode }}
      - name: Select immutable Phase 3C Deno 1.46 runtime
        if: always() && matrix.tertiaryDeno == '1.46.x'
        uses: denoland/setup-deno@11b63cf76cfcafb4e43f97b6cad24d8e8438f62d
        with:
          deno-version: 1.46.x
      - name: Select immutable Phase 3C Deno v2 runtime
        if: always() && matrix.tertiaryDeno == 'v2.x'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Select immutable Phase 3C Deno v2.7.14 runtime
        if: always() && matrix.tertiaryDeno == 'v2.7.14'
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.7.14
      - name: Select tertiary Node runtime after Deno
        if: always() && matrix.tertiaryClass != '' && matrix.tertiaryOrder == 'deno-first'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.tertiaryNode }}
      - name: Execute one typed Phase 3C setup
        if: always() && matrix.tertiaryClass != ''
        timeout-minutes: 5
        run: node .github/scripts/ci-batch/run-suite-batch.mjs --setup "${{ matrix.tertiaryClass }}"
      - name: Run assigned Phase 3C suites with exact attribution
        if: always() && matrix.tertiaryClass != ''
        run: node .github/scripts/ci-batch/run-suite-batch.mjs --run-phase3c-host "${{ matrix.class }}"
      - name: Upload Phase 3C suite results
        if: always() && matrix.tertiaryClass != ''
        uses: actions/upload-artifact@v4
        with:
          name: suite-results-phase3c-${{ matrix.class }}
          path: suite-results-phase3c.json
          if-no-files-found: error

  dispatch:
    name: "CI batch: issue-2300-orch-artifact-reap (bounded dispatch)"
    if: github.event_name == 'workflow_dispatch' && inputs.suite == 'issue-2300-orch-artifact-reap'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20.19.4"
      - name: Execute and record one typed shard setup
        run: node .github/scripts/ci-batch/run-suite-batch.mjs --setup "node20-19-noinstall"
      - name: Batch runner self-test (proves a vanished suite fails the run)
        run: node --test .github/scripts/ci-batch/__tests__/run-suite-batch.test.mjs
      - name: Run the node20-19-noinstall suites
        run: node .github/scripts/ci-batch/run-suite-batch.mjs --run "node20-19-noinstall"
      - name: Upload suite results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-results-node20-19-noinstall
          path: suite-results.json
          if-no-files-found: error
