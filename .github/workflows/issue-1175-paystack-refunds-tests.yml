name: Issue 1175 Paystack refunds

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "supabase/functions/_shared/paystackRefunds.ts"
      - "supabase/functions/_shared/paystackRefundRouter.ts"
      - "supabase/functions/refund-order/**"
      - "supabase/functions/admin-refund-order/**"
      - "supabase/functions/cancel-trip-booking/**"
      - "supabase/functions/venue-reservation-cancel/**"
      - "supabase/functions/paystack-webhook/**"
      - "mingla-admin/src/services/adminMoneyActService.js"
      - "mingla-admin/src/pages/BusinessOrdersPage.jsx"
      - "mingla-admin/src/__tests__/issue1175_admin_refund_idempotency.test.js"
      - "supabase/migrations/20270110000006_issue_1175_paystack_refunds.sql"
      - "supabase/migrations/__tests__/issue_1175_paystack_refunds.test.ts"
      - "supabase/migrations/__tests__/issue_1175_immutable_manifest_pg17.test.sql"
      - ".github/workflows/issue-1175-paystack-refunds-tests.yml"
      # #2148 — this suite now gets its database from a shared composite action;
      # without this path a change to that action would not re-run it.
      - ".github/actions/migrated-postgres/**"

concurrency:
  group: ci-issue-1175-paystack-refunds-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-1175-paystack-refunds:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check handlers
        run: >-
          deno check
          supabase/functions/refund-order/index.ts
          supabase/functions/admin-refund-order/index.ts
          supabase/functions/cancel-trip-booking/index.ts
          supabase/functions/venue-reservation-cancel/index.ts
          supabase/functions/paystack-webhook/index.ts
      - name: Run issue 1175 regression contract
        run: >-
          deno test --allow-read --allow-env
          supabase/functions/refund-order/__tests__/issue_1175_paystack_refunds.test.ts
          supabase/functions/refund-order/__tests__/issue_1175_rework_contract.test.ts
          supabase/functions/refund-order/__tests__/issue_1175_processed_replay_debt_adversarial.test.ts
          supabase/functions/refund-order/__tests__/issue_1175_failure_boundary_rework.test.ts
          supabase/functions/refund-order/__tests__/issue_1175_immutable_manifest_runtime.test.ts
          supabase/migrations/__tests__/issue_1175_paystack_refunds.test.ts
      - name: Run Admin refund intent idempotency contract
        run: node --test mingla-admin/src/__tests__/issue1175_admin_refund_idempotency.test.js

  issue-1175-pg17:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Issue 1175 executable manifest proof (PG17)"
    runs-on: ubuntu-latest
    # #2148 — the `services:` block that used to live here is gone. A service
    # container is started by the runner BEFORE any step runs, so nothing can
    # place a pre-migrated data directory into it; owning the container from a
    # step is what makes the cached snapshot possible. It still listens on
    # localhost:5432 with the same password, so every step below is unchanged.
    steps:
      - uses: actions/checkout@v4
      # #2148 — replaces this job's postgres bring-up: a service container plus a
      # full replay of every migration (MEASURED ~75s boot + ~105s replay). The
      # shared action restores a cached snapshot of the already-migrated cluster
      # and applies only what landed since, falling back to a full replay on any
      # doubt. It verifies policy/trigger/index/RLS counts against the snapshot's
      # build-time manifest before any test runs.
      - name: PostgreSQL 17 with every migration applied
        uses: ./.github/actions/migrated-postgres
        with:
          # Pinned at the call site, not inherited from the action default, so this
          # workflow still states the database it certifies against.
          image: supabase/postgres:17.4.1.075
          password: ${{ format('issue-1175-ci-{0}', github.run_id) }}
      - name: Execute issue 1175 immutable-manifest proof
        env:
          PGPASSWORD: ${{ format('issue-1175-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1175_immutable_manifest_pg17.test.sql
