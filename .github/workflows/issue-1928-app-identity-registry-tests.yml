name: "Issue #1928 app identity registry"

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20270324001928_issue_1928_app_identity_registry.sql"
      - "supabase/migrations/__tests__/issue_1928_app_identity_registry.test.ts"
      - "supabase/functions/_shared/adAppIdentityRegistry.ts"
      - "supabase/functions/_shared/adChannelCore.ts"
      - "supabase/functions/_shared/adChannel.ts"
      - "supabase/functions/_shared/meta.ts"
      - "supabase/functions/_shared/tiktok.ts"
      - "supabase/functions/_shared/google.ts"
      - "supabase/functions/_shared/snapchat.ts"
      - "supabase/functions/_shared/reddit.ts"
      - "supabase/functions/_shared/__tests__/issue1928_app_identity_registry.test.ts"
      - "supabase/functions/_shared/__tests__/issue1928_app_identity_registry.adversarial.tester.test.ts"
      - "supabase/functions/_shared/__tests__/issue1937_provider_import_cycle.test.ts"
      - "supabase/functions/admin-ad-app-identity-preflight/**"
      - "supabase/config.toml"
      - "mingla-admin/src/services/adEngineService.js"
      - "mingla-admin/src/lib/adAppIdentityReadiness.js"
      - "mingla-admin/src/components/AppIdentityReadinessPanel.jsx"
      - "mingla-admin/src/pages/AdEnginePage.jsx"
      - "mingla-admin/src/__tests__/issue1928_app_identity_readiness.test.js"
      - "mingla-admin/src/__tests__/issue1928_app_identity_focus_rework.test.js"
      - ".github/workflows/issue-1928-app-identity-registry-tests.yml"
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "supabase/migrations/20270324001928_issue_1928_app_identity_registry.sql"
      - "supabase/migrations/__tests__/issue_1928_app_identity_registry.test.ts"
      - "supabase/functions/_shared/adAppIdentityRegistry.ts"
      - "supabase/functions/_shared/adChannelCore.ts"
      - "supabase/functions/_shared/adChannel.ts"
      - "supabase/functions/_shared/meta.ts"
      - "supabase/functions/_shared/tiktok.ts"
      - "supabase/functions/_shared/google.ts"
      - "supabase/functions/_shared/snapchat.ts"
      - "supabase/functions/_shared/reddit.ts"
      - "supabase/functions/_shared/__tests__/issue1928_app_identity_registry.test.ts"
      - "supabase/functions/_shared/__tests__/issue1928_app_identity_registry.adversarial.tester.test.ts"
      - "supabase/functions/_shared/__tests__/issue1937_provider_import_cycle.test.ts"
      - "supabase/functions/admin-ad-app-identity-preflight/**"
      - "supabase/config.toml"
      - "mingla-admin/src/services/adEngineService.js"
      - "mingla-admin/src/lib/adAppIdentityReadiness.js"
      - "mingla-admin/src/components/AppIdentityReadinessPanel.jsx"
      - "mingla-admin/src/pages/AdEnginePage.jsx"
      - "mingla-admin/src/__tests__/issue1928_app_identity_readiness.test.js"
      - "mingla-admin/src/__tests__/issue1928_app_identity_focus_rework.test.js"
      - ".github/workflows/issue-1928-app-identity-registry-tests.yml"

permissions:
  contents: read

concurrency:
  group: ci-issue-1928-app-identity-registry-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  contracts:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - name: Require implementor and independent tester regressions
        run: |
          test -f supabase/functions/_shared/__tests__/issue1928_app_identity_registry.test.ts
          test -f supabase/functions/_shared/__tests__/issue1928_app_identity_registry.adversarial.tester.test.ts
          test -f supabase/functions/admin-ad-app-identity-preflight/__tests__/issue1942_meta_identity_authority.adversarial.tester.test.ts
      - name: Run migration and endpoint contracts
        run: deno test --allow-read supabase/migrations/__tests__/issue_1928_app_identity_registry.test.ts supabase/functions/admin-ad-app-identity-preflight/__tests__/issue1928_contract.test.ts supabase/functions/admin-ad-app-identity-preflight/__tests__/issue1942_meta_identity_authority.test.ts supabase/functions/admin-ad-app-identity-preflight/__tests__/issue1942_meta_identity_authority.adversarial.tester.test.ts
      - name: Run exact identity and sibling provider suites
        run: deno test --allow-env --allow-read supabase/functions/_shared/__tests__/issue1928_app_identity_registry.test.ts supabase/functions/_shared/__tests__/issue1928_app_identity_registry.adversarial.tester.test.ts supabase/functions/_shared/__tests__/tiktok.test.ts supabase/functions/_shared/__tests__/meta.test.ts supabase/functions/_shared/__tests__/meta_issue939_ig_delivery.test.ts
      - name: Reject provider-first import cycles
        run: deno test --allow-run --allow-read supabase/functions/_shared/__tests__/issue1937_provider_import_cycle.test.ts
      - name: Type-check Edge contracts
        run: deno check supabase/functions/_shared/adChannelCore.ts supabase/functions/_shared/adChannel.ts supabase/functions/_shared/meta.ts supabase/functions/_shared/tiktok.ts supabase/functions/_shared/google.ts supabase/functions/_shared/snapchat.ts supabase/functions/_shared/reddit.ts supabase/functions/_shared/adAppIdentityRegistry.ts supabase/functions/admin-ad-app-identity-preflight/index.ts
      - name: Run Admin identity suite
        run: node --test mingla-admin/src/__tests__/issue1928_app_identity_readiness.test.js mingla-admin/src/__tests__/issue1928_app_identity_focus_rework.test.js mingla-admin/src/__tests__/issue978_ad_connections_panel.test.js mingla-admin/src/__tests__/orch1008_adversarial_tabs_keyboard.test.js

  admin-build:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mingla-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mingla-admin/package-lock.json
      - run: npm ci
      - run: npx eslint src/services/adEngineService.js src/lib/adAppIdentityReadiness.js src/components/AppIdentityReadinessPanel.jsx src/pages/AdEnginePage.jsx src/__tests__/issue1928_app_identity_readiness.test.js src/__tests__/issue1928_app_identity_focus_rework.test.js
      - run: npm run build
