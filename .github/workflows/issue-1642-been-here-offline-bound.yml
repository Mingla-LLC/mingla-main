name: Issue 1642 Been Here Offline Bound

# #1642 — with no signal, "Been here" spun forever instead of reaching
# "Couldn't save".
#
# #1618 put a 15s operation-level bound in visitService. On a physical Samsung
# in airplane mode it never fired: the spinner ran past 15s, 35s, 120s and 180s
# and the row landed ~3.5 minutes later, the instant connectivity returned.
# The bound was still BELOW the thing that blocks. React Query's default
# `networkMode` is 'online' and onlineManager is wired to NetInfo, so query-core
# PAUSED the mutation before ever calling mutationFn — recordVisit never ran and
# the 15s timer inside it was never created.
#
# The suite this workflow runs is deliberately behavioural: it drives the REAL
# @tanstack/react-query mutation machinery with the REAL onlineManager offline
# and the REAL, byte-for-byte visitService.ts as the mutationFn, over a Supabase
# client that never settles. It carries its own NEGATIVE CONTROL (T-1) which
# proves the harness can still see the bug. A gate that merely asserted
# `VISIT_WRITE_TIMEOUT_MS = 15000` would have been GREEN for the entire
# 3.5-minute hang — the constant was there the whole time; the code holding it
# never executed. See #1607/#1627/#1631/#1633 for that failure class.
#
# node_modules is REQUIRED here (unlike most gates in this repo). The suite's
# whole point is that it exercises the real library's pause/resume semantics, so
# it must resolve the version app-mobile/package-lock.json actually pins — which
# is also why package-lock.json is in the trigger set: a react-query major could
# change networkMode semantics underneath this fix without touching a line of
# our source.
#
# Node 22 is REQUIRED: the suite loads the real TypeScript service through
# `module.stripTypeScriptTypes` (Node >= 22.13).

on:
  push:
    branches: [main]
    paths:
      - "app-mobile/src/hooks/useVisits.ts"
      - "app-mobile/src/services/visitService.ts"
      - "app-mobile/src/config/queryClient.ts"
      - "app-mobile/src/components/SwipeableCards.tsx"
      - "app-mobile/src/i18n/locales/en/cards.json"
      - "app-mobile/src/hooks/__tests__/issue_1642_been_here_offline_write_bound.test.mjs"
      - "app-mobile/src/components/swipeDeck/__tests__/issue_1609_direction_c_plate.test.mjs"
      - "app-mobile/package-lock.json"
      - ".github/workflows/issue-1642-been-here-offline-bound.yml"
  pull_request:
    paths:
      - "app-mobile/src/hooks/useVisits.ts"
      - "app-mobile/src/services/visitService.ts"
      - "app-mobile/src/config/queryClient.ts"
      - "app-mobile/src/components/SwipeableCards.tsx"
      - "app-mobile/src/i18n/locales/en/cards.json"
      - "app-mobile/src/hooks/__tests__/issue_1642_been_here_offline_write_bound.test.mjs"
      - "app-mobile/src/components/swipeDeck/__tests__/issue_1609_direction_c_plate.test.mjs"
      - "app-mobile/package-lock.json"
      - ".github/workflows/issue-1642-been-here-offline-bound.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  been-here-offline-bound:
    name: "Issue 1642: an offline Been-here tap fails within the bound"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: app-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json

      - name: The suite must exist
        # Without this the job is green when the file is deleted — the exact
        # "assertion that does not assert" shape #1642 was filed against.
        run: test -f src/hooks/__tests__/issue_1642_been_here_offline_write_bound.test.mjs

      - run: npm ci

      - name: Offline Been-here write is bounded, never paused, never replayed
        run: >
          node --test --test-reporter=spec
          src/hooks/__tests__/issue_1642_been_here_offline_write_bound.test.mjs

      - name: Re-run the #1609/#1618 operation-bound contract on visitService
        # #1642 edits visitService.ts, whose bound is asserted by #1609's T-6.
        # That suite's own workflow does not trigger on visitService.ts, so it
        # is re-run here rather than left to chance.
        run: >
          node --test
          src/components/swipeDeck/__tests__/issue_1609_direction_c_plate.test.mjs
