# #2437 SHADOW-PARITY-TRIGGER — remove before cutover
name: Issue 2084 credential-output safety

on:
  pull_request:
    paths:
      - "docs/runbooks/B2_WEBHOOK_SECRET_ROTATION_RUNBOOK.md"
      - "scripts/security/issue_2084_safe_credential_inventory.mjs"
      - "scripts/security/issue_2084_safe_credential_inventory.test.mjs"
      - "scripts/security/issue_2084_safe_credential_inventory.tester.adversarial.test.mjs"
      - ".github/scripts/strict-grep/issue-2084-credential-output-safety.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-2084-credential-output-safety.yml"
  push:
    branches: [main]
    paths:
      - "docs/runbooks/B2_WEBHOOK_SECRET_ROTATION_RUNBOOK.md"
      - "scripts/security/issue_2084_safe_credential_inventory.mjs"
      - "scripts/security/issue_2084_safe_credential_inventory.test.mjs"
      - "scripts/security/issue_2084_safe_credential_inventory.tester.adversarial.test.mjs"
      - ".github/scripts/strict-grep/issue-2084-credential-output-safety.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-2084-credential-output-safety.yml"

permissions:
  contents: read

jobs:
  credential-output-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
      - name: Run no-output regression suite
        run: >-
          node --test
          scripts/security/issue_2084_safe_credential_inventory.test.mjs
          scripts/security/issue_2084_safe_credential_inventory.tester.adversarial.test.mjs
      - name: Prove the structural guard catches regressions
        run: node .github/scripts/strict-grep/issue-2084-credential-output-safety.mjs --self-test
      - name: Enforce credential-output safety structure
        run: node .github/scripts/strict-grep/issue-2084-credential-output-safety.mjs
