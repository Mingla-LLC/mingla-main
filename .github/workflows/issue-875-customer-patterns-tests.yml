name: Issue 875 customer commitment patterns

on:
  pull_request:
    paths:
      - "supabase/migrations/20270131001875_issue_875_brand_customer_commitment_patterns.sql"
      - "supabase/migrations/__tests__/issue_875_brand_customer_commitment_patterns*.test.sql"
      - ".github/workflows/issue-875-customer-patterns-tests.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20270131001875_issue_875_brand_customer_commitment_patterns.sql"
      - "supabase/migrations/__tests__/issue_875_brand_customer_commitment_patterns*.test.sql"
      - ".github/workflows/issue-875-customer-patterns-tests.yml"

permissions:
  contents: read

concurrency:
  group: ci-issue-875-customer-patterns-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-875-customer-patterns-pg17:
    name: "Issue #875 customer commitment patterns (PG17)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ format('issue-875-ci-{0}', github.run_id) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4

      - name: Wait for PostgreSQL 17
        env:
          PGPASSWORD: ${{ format('issue-875-ci-{0}', github.run_id) }}
        run: |
          for attempt in {1..90}; do
            if psql -h localhost -U postgres -d postgres -Atc \
              "SELECT to_regnamespace('vault') IS NOT NULL AND to_regrole('supabase_admin') IS NOT NULL" \
              2>/dev/null | grep -qx t; then
              echo "postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready in 90s"
          exit 1

      - name: Apply all migrations in lexical order
        env:
          PGPASSWORD: ${{ format('issue-875-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 \
            | sort -z \
            | while IFS= read -r -d '' migration_file; do
                echo "::group::Applying $migration_file"
                psql -h localhost -U postgres -d postgres \
                  -v ON_ERROR_STOP=1 -f "$migration_file"
                echo "::endgroup::"
              done

      - name: Run issue 875 SQL suites in lexical order
        env:
          PGPASSWORD: ${{ format('issue-875-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          mapfile -d '' test_files < <(
            find supabase/migrations/__tests__ -maxdepth 1 -type f \
              -name 'issue_875_brand_customer_commitment_patterns*.test.sql' \
              -print0 | sort -z
          )
          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "No issue #875 SQL test suites found"
            exit 1
          fi
          for test_file in "${test_files[@]}"; do
            echo "::group::Running $test_file"
            psql -h localhost -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -f "$test_file"
            echo "::endgroup::"
          done
