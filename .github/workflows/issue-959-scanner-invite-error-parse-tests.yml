name: Issue #959 Scanner-Invite Error-Parse Tests

# Issue #959 [scanner-invite-error-parse] — byte-identical sibling of the shipped
# ORCH-1404 fix, applied to the SCANNER invite flow. The fails-on-revert
# regression suite proves scannerInvitationsService reads a Supabase
# FunctionsHttpError's status/code from `error.context.status` +
# `await error.context.json()` (NOT the old `error.context.response.status` /
# `data.error`, which collapsed every failure to 500 / "server"). This is a jest
# suite (.test.ts); the class-D strict-grep `jest-suites` job does NOT run jest,
# so without this dedicated job the test would exist but never gate (the dark-
# test-surface trap, ORCH-1383). EXPLICIT registry (never a glob), same
# discipline as orch-1404-invite-error-recovery-tests.yml: add a new #959 suite
# by appending its path below.

on:
  push:
    branches: [Seth, main]
    paths:
      - "mingla-business/src/**"
      - ".github/workflows/issue-959-scanner-invite-error-parse-tests.yml"
  pull_request:
    paths:
      - "mingla-business/src/**"
      - ".github/workflows/issue-959-scanner-invite-error-parse-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-959-jest:
    name: "Issue #959: scanner-invite error-parse (fails-on-revert regression suite)"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
      # EXPLICIT registry — add a new #959 suite by appending a path; never glob.
      - name: Run Issue #959 scanner-invite error-parse jest suite
        run: >
          npx jest
          src/services/__tests__/issue_959_scanner_functions_error_parse.test.ts
          --runInBand
