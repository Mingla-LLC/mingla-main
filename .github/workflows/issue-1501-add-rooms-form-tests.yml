# Issue #1501 [add-rooms-form] — the Add Rooms or Places editor: the overlap fix
# (axis-scoped field measures), the approved terminology, the three new shared
# inputs (OptionCard / ChipInput / NameBuilder), D-4 + D-5, the 500 bulk cap,
# and the desktop form column + summary rail.
#
# WHY A DEDICATED WORKFLOW: the proofs MOUNT the editor, so they are
# `*.render.test.tsx`. `mingla-business/jest.config.cjs` deliberately excludes
# every `*.render.test.tsx` from the default node/ts-jest suite, so without this
# job the regression proofs would be DARK. Mirrors issue-874 / issue-1036 /
# issue-1403 / issue-1421 / issue-1484.
#
# THE WEB JOB IS THE LOAD-BEARING ONE. #1484's desktop uncap shipped BROKEN
# while 29 headless react-test-renderer suites were green, because
# `react-native`'s `StyleSheet.flatten` and `react-native-web`'s atomic-class
# resolver disagree about what reaches the DOM. Every width- and flex-axis
# contract in #1501 is therefore ALSO proved through the real RNW compiler, with
# an explicit vacuity guard so an absence assertion can never pass by matching
# nothing.
#
# NOT a required check (not in ruleset 13549056 / 19508605) — it reports, it
# does not gate.

name: Issue #1501 Add Rooms or Places

on:
  pull_request:
    # #2885 AC-4 — a pull request whose ONLY changed file is the machine-written
    # boot-payload baseline cannot affect this suite. Those recording PRs were
    # starting 53 jobs each, ~15/day (~51,000 job-min/month). `paths-ignore`
    # skips ONLY when nothing else changed: touch this file alongside anything
    # and this workflow runs exactly as it always did.
    paths-ignore:
      - "mingla-business/scripts/ci/bundle-baseline.json"
  workflow_dispatch:

concurrency:
  group: ci-issue-1501-add-rooms-form-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-1501-add-rooms-form:
    name: Add Rooms or Places (render proofs + gates)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json

      - name: Install Business dependencies
        run: npm ci

      # NOTE: no `--no-save` test-dep overlay is needed. These suites use
      # `react-test-renderer` (a real devDependency), NOT
      # `@testing-library/react-native` — which is absent from package.json and
      # would add a TS2307 diagnostic to the issue-1403 typecheck-delta gate.
      # `jest.issue1501.render.cjs` now also carries the CALL-SITE axis auditor
      # (`stayFieldCallSites.issue1501.render.test.tsx`), which walks the tree
      # carrying each node's inherited `flexDirection` — the assertion that
      # catches a field choosing the WRONG axis, as opposed to choosing none.
      - name: Editor render proofs (react-test-renderer)
        run: npx jest --config jest.issue1501.render.cjs --runInBand

      # THE #1484 P1-1 GUARD, applied to #1501. Renders through the REAL
      # react-native-web style compiler and asserts on the EMITTED CSS, so a
      # flex-axis key that silently survives into the DOM cannot pass again.
      - name: Width + axis proofs (react-native-web resolver)
        run: npx jest --config jest.issue1501.web.render.cjs --runInBand

      # TESTER ADVERSARIAL SUITE (#1501 QA). A second, independent angle on the
      # same change: a whole-tree AXIS AUDITOR run across a sweep of 18 editor
      # states (the shipped guard proves `fieldStack` is safe, but nothing
      # proved a CALL SITE picked the right axis — and one had not), the
      # multiline overflow proof, a fuzz over the chip reducer, the NameBuilder
      # boundaries at the server's exact 500, and a generic permission audit
      # that fails on any `stay-*` control left live outside the justified
      # allow-list. Runs as its own step so a tester regression is attributable.
      - name: Tester adversarial proofs (axis audit + boundaries)
        run: npx jest --config jest.issue1501.tester.cjs --runInBand

      # testID contract + the `styles.field` / override-with-undefined guards.
      # Runs under the DEFAULT node/ts-jest config (it reads source, no mount).
      - name: testID contract + axis source guards
        run: >-
          npx jest --runInBand
          src/components/stay/__tests__/stayTestIdContract.issue1501.test.ts
          src/components/ui/__tests__/OptionCard.iconSource.issue1501.test.ts
          src/components/stay/__tests__/stayAuthoringPermissions.issue1469.test.ts
          src/components/stay/__tests__/stayInventoryPresentation.issue1425.test.ts
          src/components/stay/__tests__/stayAuthoring.issue1424.test.ts
          src/components/stay/__tests__/stayAvailabilityContracts.issue1471.test.ts

      # #1484 must stay green: the Stay LIST is uncapped while the editor form
      # keeps a readable measure, and that distinction is the point.
      - name: Issue #1484 Stay desktop measures still hold
        run: |
          npx jest --config jest.issue1484.render.cjs --runInBand
          npx jest --config jest.issue1484.web.render.cjs --runInBand

      # #1501 adds 12 lucide glyphs to the option cards; the business WEB build
      # resolves them through the shim's used-set, and INV-4 fails CI if a new
      # icon import is missing from it.
      - name: Business-web lucide shim drift guard
        working-directory: .
        run: |
          node .github/scripts/strict-grep/i-proposed-1137-biz-web-lucide-real.mjs --self-test
          node .github/scripts/strict-grep/i-proposed-1137-biz-web-lucide-real.mjs

      # I-DESKTOP-GATE-VIA-HOOK: the editor's desktop branch must read the
      # canonical hook, never an inlined platform+width expression.
      - name: Desktop-gate-via-hook gate
        working-directory: .
        run: |
          node .github/scripts/strict-grep/orch-0885-a-no-bottomnav-on-wide-desktop.mjs --self-test
          node .github/scripts/strict-grep/orch-0885-a-no-bottomnav-on-wide-desktop.mjs

      - name: Source-pin partition audit
        run: node scripts/ci/select-source-text-pins.mjs --check

      - name: Scoped lint
        run: >-
          npx eslint
          src/components/stay/StayInventoryManager.tsx
          src/components/stay/stayInventoryPresentation.ts
          src/components/ui/OptionCard.tsx
          src/components/ui/ChipInput.tsx
          src/components/ui/NameBuilder.tsx
          src/constants/designSystem.ts

      # The editor is behind a lazy route, so NOTHING it adds may reach the
      # eager `__common` boot chunk. #1501's first pass registered 10 lucide
      # glyphs in the web shim — whose used-set is a GLOBAL EAGER registry — and
      # put +8,746 B into the payload every business-web visitor downloads
      # before anything renders, breaching the ORCH-1083 cap. The export now
      # feeds the budget guard directly so that can never merge unnoticed.
      - name: Buyer web export + ORCH-1083 boot-payload budget
        run: |
          npx expo export -p web --output-dir /tmp/issue-1501-web --clear
          ORCH_1083_WEB_BUILD=/tmp/issue-1501-web \
            node scripts/ci/orch-1083-initial-bundle-budget.mjs
