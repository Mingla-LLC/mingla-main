# #2437 SHADOW-PARITY-TRIGGER — remove before cutover
name: Issue 2004 share click canonical destination

on:
  pull_request:
    paths:
      - "mingla-business/server/socialPreview.js"
      - "mingla-business/api/content-share.js"
      - "mingla-business/vercel.json"
      - "mingla-marketing/middleware.ts"
      - "mingla-marketing/lib/shared-card-proxy.ts"
      - "app-mobile/app/s/[code].tsx"
      - "scripts/issue-1615/content-share-receiver.happy.test.mjs"
      - "scripts/issue-1968/**"
      - "scripts/issue-2004/**"
      - "docs/INVARIANT_REGISTRY.md"
      - ".github/workflows/issue-2004-share-click-canonical-destination.yml"

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: mingla-business
      - run: node --test scripts/issue-2004/*.test.mjs
      - name: Preserve Explorer receiver and canonical public-page contracts
        run: node --test scripts/issue-1615/content-share-receiver.happy.test.mjs scripts/issue-1968/public-web-canonical-sharing.implementor.happy.test.mjs scripts/issue-1968/public-web-canonical-sharing.tester.adversarial.test.mjs
