name: "#1178 NG Split Removal Tests"

on:
  pull_request:
    paths:
      - "supabase/functions/ticket-checkout-create/**"
      - "supabase/functions/rsvp-contribution-create/**"
      - "supabase/functions/venue-reservation-create/**"
      - "supabase/functions/*/issue_1178_ng_split*.test.ts"
      - ".github/workflows/issue-1178-ng-split-removal-tests.yml"
  workflow_dispatch:

jobs:
  ng-split-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Type-check the three edge functions (the gate wiring must compile).
      - name: Deno check the three edge functions
        run: |
          deno check \
            supabase/functions/ticket-checkout-create/index.ts \
            supabase/functions/rsvp-contribution-create/index.ts \
            supabase/functions/venue-reservation-create/index.ts
      # Run the #1178 split-gate behaviour tests. The glob picks up the
      # implementor happy-path guard now and the tester's adversarial guard
      # once it lands on the branch (both match issue_1178_ng_split*.test.ts).
      - name: Run #1178 split-gate behaviour tests
        run: |
          deno test supabase/functions/*/issue_1178_ng_split*.test.ts --allow-read
