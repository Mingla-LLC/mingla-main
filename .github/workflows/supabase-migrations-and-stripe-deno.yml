            # a gated waitlist_spot_open skip returns the seat to the pool, the
            # release is observed BEFORE the skip is recorded, and under an
            # errored / zero-row / unapplied release the notification is NEVER
            # marked skipped. Every group carries a vacuity guard: a drive that
            # never reached its send branch FAILS rather than passing on zero.
            supabase/functions/__tests__/issue_1541_sms_sole_send_path.test.ts
            # Issue #1541 — send-venue-sms source contract, RECONCILED. This file
            # existed since META-ORCH-1148 and was wired into NO workflow, while
            # asserting that send-venue-sms owned a private Twilio client — a
            # dark test blessing a dark bypass. It now asserts the opposite (the
            # send is delegated to smsAdapter and this fn holds no provider
            # credentials) and is wired here so it can never go dark again.
            supabase/functions/__tests__/send_venue_sms.test.ts
            # Issue #1541 — TESTER ADVERSARIAL on message COMPOSITION and the
            # OQ-1 release's write scope. The implementor's companion proves the
            # ROUTE (captured provider HTTP); this attacks the BODY, which is
            # where #1541 deliberately changes three delivered messages while
            # promising byte-identity on the fourth. ADV-1 sweeps ten hostile
            # venue names (empty, whitespace, a name that IS the footer, curly
            # punctuation the GSM-7 sanitizer rewrites, an embedded newline, a
            # 200-char name) and proves the locked copy never gains a second
            # STOP footer; ADV-2 proves composition never truncates across both
            # the GSM-7 160/153 and UCS-2 70/67 boundaries and that segmentation
            # only counts; ADV-3 proves the other three bodies gain exactly one.
            # ADV-4/5/6 PIN three known gaps so the ceiling is visible in CI
            # rather than buried in a report: an incidental "reply stop" in user
            # text suppresses the real footer; the waitlist release is scoped by
            # entry id alone, so a duplicate dispatch can clobber an invitation
            # it does not own; and the order rollup's default arm reports "sent"
            # for an all-skipped or empty outcome set. Every group carries a
            # vacuity guard — a lookup that located nothing FAILS.
            supabase/functions/__tests__/issue1541_sole_send_path.tester.adversarial.test.ts
            # Issue #1556 — CROSS-RUNTIME drift guard for the STOP-footer
            # suppression rule. #1541 end-anchored the guard in composeSmsBody;
            # the client mirror in mingla-business/src/utils/smsCost.ts kept the
            # loose form, so the marketing composer UNDER-reported segments and
            # campaign cost for any body that merely MENTIONS "reply stop". The
            # two rules live in different runtimes, which is why they drifted and
            # why nothing caught it. This suite IMPORTS BOTH SHIPPED MODULES and
            # executes them over one shared JSON corpus (fixtures/issue1556_*.json)
            # that the Jest twin reads too: mid-body mention, ends-with-footer
            # (plus trailing whitespace, plus mixed case), near misses, empty and
            # whitespace-only bodies, and six bodies sitting one character either
            # side of the 160 and 70 segment boundaries with and without the
            # footer. L0 is a vacuity guard — a corpus that shrank or lost a named
            # case FAILS rather than passing quietly.
            supabase/functions/__tests__/issue1556_sms_footer_parity.test.ts
            # Issue #1556 TESTER ADVERSARIAL — attacks the same rule from the
            # angle the corpus cannot reach. It never reads that corpus. It
            # checks both shipped segment counters against an INDEPENDENT GSM
            # 03.38 encoder written from the standard (so the two can be wrong
            # together and still be caught), sweeps all 63,488 non-surrogate BMP
            # codepoints for sanitizer drift with the expected fold set DERIVED
            # BY RUNNING THE SERVER rather than hardcoded, and runs a seeded
            # 3,000-body differential fuzz — which catches both #1556 defects
