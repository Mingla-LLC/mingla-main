name: Supabase Migrations + Stripe Deno Tests (B2a Path C V3)

# B2a Path C V3 SPEC §9 — migration ordering + Deno-side unit test coverage.
#
# Two checks per push:
#  1. Migrations apply cleanly from baseline. Uses `supabase/postgres:15`
#     image (NOT stock postgres:15) because the baseline migration
#     20260505000000_baseline_squash_orch_0729.sql does CREATE EXTENSION
#     pg_cron, which only ships with Supabase's flavored Postgres image.
#  2. Deno unit tests pass. Scoped to V3 stripe-* test files only — NOT the
#     full _shared/__tests__/ directory (the bouncer / scorer /
#     no_ai_categories tests have pre-existing failures from prior cycles
#     unrelated to B2 and not in scope here; cleaning those up is a separate
#     ORCH).
#
# Env vars set on the Deno step are inert defaults — `notify-dispatch` calls
# in the router unit tests need a non-empty SUPABASE_URL + service role key
# to construct the Supabase client (the test asserts dispatch was called,
# not that it actually reached a real Supabase instance).

on:
  push:
    branches: [Seth, main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/_shared/**"
      - "supabase/functions/_shared/__tests__/**"
      - "supabase/functions/__tests__/**"
      # ISSUE-1387 — Stay inventory management endpoint and hermetic contract test.
      - "supabase/functions/manage-stay-inventory/**"
      # ORCH-1270 — marketing-send edge fn + its strict-grep gates.
      - "supabase/functions/marketing-send/**"
      - ".github/scripts/strict-grep/i-proposed-1270-*.mjs"
      # ORCH-1282 — MMS media adapter gate.
      - ".github/scripts/strict-grep/i-proposed-1282-*.mjs"
      # ORCH-1333 retest — run-signal-scorer edge fn + its .in()-URL-chunk gate.
      - "supabase/functions/run-signal-scorer/**"
      - ".github/scripts/strict-grep/orch-1333-in-chunk-bounded.mjs"
      # ORCH-1331 — partner Paystack payout rail: webhook + onboard + sweep fns
      # and the two fail-soft/share gates (docs-only-CLOSE hazard: filters
      # cover the guarded SOURCE trees, not just the tests).
      - "supabase/functions/paystack-webhook/**"
      - "supabase/functions/partner-paystack-onboard/**"
      - "supabase/functions/partner-paystack-split-retry/**"
      - "supabase/functions/ticket-checkout-create/**"
      - ".github/scripts/strict-grep/orch-1331-*.mjs"
      # ORCH-1331 client leg — earnings NG fork + Paystack onboard form.
      - "mingla-business/app/partner/**"
      - "mingla-business/src/components/partner/**"
      - "mingla-business/src/services/partnerPaystackService.ts"
      - "mingla-business/src/services/partnerSplitsService.ts"
      - "mingla-business/src/hooks/usePartnerPaystack.ts"
      # ORCH-1361 [location-suggestions] — mapbox-geocode additive bias params +
      # the consumer multi-row swap + shared location-input package. Filters err
      # BROAD over the guarded SOURCE trees so a revert of the client swap
      # re-triggers the guard (not just an edit to the test file).
      - "supabase/functions/mapbox-geocode/**"
      - "packages/location-input/**"
      - "app-mobile/src/components/PreferencesSheet.tsx"
      - "app-mobile/src/components/PreferencesSheet/PreferencesSectionsAdvanced.tsx"
      - "app-mobile/src/components/location/MapboxAddressInput.tsx"
      - "app-mobile/src/components/discover/CityPickerSheet.tsx"
      - "app-mobile/src/components/__tests__/orch-1361-preferences-location-multirow-bias.test.tsx"
      # ORCH-1365 [location-search-relevance] — consumer place-search corrective:
      # `suggest_places` action + countryNames module + the new source-structure
      # guard. Same guarded SOURCE trees as ORCH-1361 (mapbox-geocode +
      # location-input + the Preferences hosts already listed above); ADD the new
      # app-mobile source-structure test so a client-side revert re-triggers it.
      - "supabase/functions/mapbox-geocode/countryNames.ts"
      - "app-mobile/src/components/__tests__/orch-1365-preferences-places-no-proximity.test.tsx"
      # ORCH-1363 — take-a-stroll reachable-first-stop fix + its curated deno tests
      # (the guarded SOURCE tree, not just the tests — docs-only-CLOSE hazard).
      - "supabase/functions/generate-curated-experiences/**"
      # ORCH-1362 [onboarding-location] — the onboarding no-GPS "Choose your city"
      # field reuses the shared place-search engine (searchMode="places",
      # inBottomSheet={false}). Guard the SOURCE tree (OnboardingFlow +the wrapper,
      # already listed above) so a revert of the swap re-triggers the source-
      # structure test — not just an edit to the test file.
      - "app-mobile/src/components/OnboardingFlow.tsx"
      - "app-mobile/src/components/__tests__/orch-1362-onboarding-location-places.test.tsx"
      - "app-mobile/src/components/__tests__/orch-1362-onboarding-location-adversarial.test.tsx"
      - ".github/workflows/supabase-migrations-and-stripe-deno.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/_shared/**"
      - "supabase/functions/__tests__/**"
      # ISSUE-1387 — Stay inventory management endpoint and hermetic contract test.
      - "supabase/functions/manage-stay-inventory/**"
      # ORCH-1270 — marketing-send edge fn + its strict-grep gates.
      - "supabase/functions/marketing-send/**"
      - ".github/scripts/strict-grep/i-proposed-1270-*.mjs"
      # ORCH-1282 — MMS media adapter gate.
      - ".github/scripts/strict-grep/i-proposed-1282-*.mjs"
      # ORCH-1333 retest — run-signal-scorer edge fn + its .in()-URL-chunk gate.
      - "supabase/functions/run-signal-scorer/**"
      - ".github/scripts/strict-grep/orch-1333-in-chunk-bounded.mjs"
      # ORCH-1331 — partner Paystack payout rail: webhook + onboard + sweep fns
      # and the two fail-soft/share gates.
      - "supabase/functions/paystack-webhook/**"
      - "supabase/functions/partner-paystack-onboard/**"
      - "supabase/functions/partner-paystack-split-retry/**"
      - "supabase/functions/ticket-checkout-create/**"
      - ".github/scripts/strict-grep/orch-1331-*.mjs"
      # ORCH-1331 client leg — earnings NG fork + Paystack onboard form.
      - "mingla-business/app/partner/**"
      - "mingla-business/src/components/partner/**"
      - "mingla-business/src/services/partnerPaystackService.ts"
      - "mingla-business/src/services/partnerSplitsService.ts"
      - "mingla-business/src/hooks/usePartnerPaystack.ts"
      # ORCH-1361 [location-suggestions] — same guarded trees as the push filter.
      - "supabase/functions/mapbox-geocode/**"
      - "packages/location-input/**"
      - "app-mobile/src/components/PreferencesSheet.tsx"
      - "app-mobile/src/components/PreferencesSheet/PreferencesSectionsAdvanced.tsx"
      - "app-mobile/src/components/location/MapboxAddressInput.tsx"
      - "app-mobile/src/components/discover/CityPickerSheet.tsx"
      - "app-mobile/src/components/__tests__/orch-1361-preferences-location-multirow-bias.test.tsx"
      # ORCH-1365 [location-search-relevance] — same guarded trees as the push filter.
      - "supabase/functions/mapbox-geocode/countryNames.ts"
      - "app-mobile/src/components/__tests__/orch-1365-preferences-places-no-proximity.test.tsx"
      # ORCH-1363 — take-a-stroll reachable-first-stop fix + its curated deno tests.
      - "supabase/functions/generate-curated-experiences/**"
      # ORCH-1362 [onboarding-location] — same guarded trees as the push filter.
      - "app-mobile/src/components/OnboardingFlow.tsx"
      - "app-mobile/src/components/__tests__/orch-1362-onboarding-location-places.test.tsx"
      - "app-mobile/src/components/__tests__/orch-1362-onboarding-location-adversarial.test.tsx"
      - ".github/workflows/supabase-migrations-and-stripe-deno.yml"

# ORCH-1383 — cancel a superseded PR run instead of letting it finish.
# Measured: 28 of 260 July strict-grep runs (10.8%) were superseded before finishing.
# The expression (not a bare `true`) is deliberate: cancelling a `push` to main would
# abandon the post-merge verification run for that commit. Guarding on pull_request
# recovers the PR-side waste while main runs always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  migrations:
    name: "Migrations apply cleanly from baseline"
    runs-on: ubuntu-latest
    services:
      postgres:
        # Supabase-flavored Postgres image — includes pg_cron, pgcrypto, pgsodium,
        # plv8, and other extensions the baseline migration requires.
        # Stock postgres:15 doesn't have pg_cron and fails immediately.
        #
        # Image-specific env contract: the supabase/postgres image's internal
        # migrate.sh creates `supabase_admin` (and aux roles) and uses
        # POSTGRES_PASSWORD as supabase_admin's password. We do NOT override
        # POSTGRES_USER (doing so causes `migrate.sh` to fail with
        # `role "supabase_admin" does not exist` per the historical CI runs).
        # We do NOT override POSTGRES_DB either — the supabase image restricts
        # extension creation to the default `postgres` database. The baseline
        # migration's `CREATE EXTENSION` calls fail with "can only create
        # extension in database postgres" otherwise. Run migrations in the
        # default `postgres` DB.
        #
        # Postgres MAJOR version pinning: production is on Postgres 17 (Supabase
        # default since mid-2026). Baseline `20260505000000_baseline_squash_orch_0729.sql`
        # uses PG 16+ syntax (`GRANT MAINTAIN ON …`). Earlier image tag
        # `supabase/postgres:15.8.1.060` rejected MAINTAIN with "unrecognized
        # privilege type". Pin to a 17.x image to match production.
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Wait for postgres
        env:
          PGPASSWORD: postgres
        run: |
          for i in {1..90}; do
            if psql -h localhost -U postgres -d postgres -c "SELECT 1" >/dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready in 90s"
          exit 1
      - name: Apply migrations in timestamp order
        env:
          PGPASSWORD: postgres
        run: |
          set -e
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::Applying $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1387_stay_inventory.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1387_stay_inventory.adversarial.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1388_stay_reservation.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1388_stay_reservation.adversarial.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1390_stay_guest_reads.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1390_stay_guest_reads.adversarial.test.sql

  deno-tests:
    name: "Deno unit tests for Stripe shared modules"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - name: Run V3 Stripe-scoped Deno tests
        env:
          # Inert defaults — the router test asserts dispatch was attempted; it
          # doesn't reach a real Supabase instance. These prevent the env-var
          # presence guards in `_shared/stripeEdgeAuth.ts` from throwing.
          SUPABASE_URL: "https://example-test.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key-not-real"
          STRIPE_WEBHOOK_SECRET: "whsec_test"
          STRIPE_WEBHOOK_SECRET_PLATFORM: "whsec_test_platform"
          STRIPE_WEBHOOK_SECRET_PREVIOUS: ""
        run: |
          set -euo pipefail
          DENO_TEST_FILES=(
            supabase/functions/_shared/__tests__/stripeIpAllowlist.test.ts
            supabase/functions/_shared/__tests__/stripeKycRemediation.test.ts
            supabase/functions/_shared/__tests__/stripeKycReminderSchedule.test.ts
            supabase/functions/_shared/__tests__/stripeWebhookRouter.test.ts
            supabase/functions/_shared/__tests__/stripeWebhookSignature.test.ts
            # ISSUE-865 WP-B — ad-conversion senders + fire helper (hermetic:
            # stubbed fetch + injected supabase; runs with the same flags).
            supabase/functions/_shared/__tests__/issue_865_wp_b_ad_conversion.test.ts
            # ISSUE-865 WP-B/C — mingla-tester adversarial battery (real timeout
            # path, end-to-end PII hashing on the wire, cross-side dedup contract).
            supabase/functions/_shared/__tests__/issue_865_wp_bc_adversarial.tester.test.ts
            # ISSUE-996 — implementor source guard: A5 keeps its local fetch
            # declaration + fireAdConversion injection (no network execution).
            supabase/functions/_shared/__tests__/issue_996_a5_hermetic_fetch.test.ts
            # ISSUE-996 — independent tester runtime guard: A1-A6 execute behind
            # a non-egressing global-fetch sentinel.
            supabase/functions/_shared/__tests__/issue_996_a5_no_global_fetch.tester.test.ts
            # ISSUE-1267 — Google Ads the 5th conversion lane: upload wire shape,
            # Enhanced-Conversions ids, two-tier value, validateOnly, fail-open, and
            # google_ads_status IN the redelivery-dedup gate (hermetic — injected
            # resolveClient/requestImpl seams, no global fetch).
            supabase/functions/_shared/__tests__/issue_1267_google_conversion_lane.test.ts
            # ISSUE-855 PR-0 — server-fire COALESCE backfill repairs the live #865
            # undercount: when the browser's EARLY ad_conversions row wins the race,
            # the server fire now fills the NULL brand_id/order_id/value_cents/
            # currency/mingla_event_id (only when NULL, never clobbering, never
            # touching the *_status dedup gate). Hermetic — spy senders + fake supabase.
            supabase/functions/_shared/__tests__/issue_855_pr0_conversion_brand_backfill.test.ts
            # ISSUE-1387 — JWT gate, canonical action envelope, and error hygiene.
            supabase/functions/manage-stay-inventory/index.test.ts
            # ISSUE-1388 — grouped Stay cart, Request actions, and error hygiene.
            supabase/functions/stay-reservations/index.test.ts
            # ISSUE-1390 — payment retry resumes one bound attempt across both apps.
            supabase/functions/stay-reservations/paymentResume.issue1390.test.ts
            supabase/functions/_shared/stayPaymentResume.issue1390.test.ts
          )
          for attempt in 1 2 3; do
            if deno test --allow-env --allow-net --allow-read --no-check "${DENO_TEST_FILES[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Stripe Deno tests failed after 3 attempts (esm.sh flake?)"
              exit 1
            fi
            echo "Stripe Deno tests failed (attempt ${attempt}), retrying in 10s..."
            sleep 10
          done

  notification-deno-tests:
    name: "Deno unit tests for META-ORCH-1161 notification system"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - name: Run META-ORCH-1161 notification Deno tests
        env:
          # Inert defaults — these tests use fake supabase clients + stubbed fetch
          # and never reach a real Supabase/Twilio/Resend instance. The SMS
          # kill-switch (SMS_LIVE_ENABLED_US) is intentionally UNSET so the
          # kill-switch-off assertions hold by default; the ON tests set it inline.
          SUPABASE_URL: "https://example-test.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key-not-real"
        run: |
          set -euo pipefail
          # META-ORCH-1161 Sub-A Deno test files (registered ORCH-1161 REWORK 2026-06-20):
          #   - implementor happy-path (8 tests)
          #   - tester adversarial anon/guest path (3 tests)
          #   - implementor REWORK guest-ledger + atomic-dedupe (2 tests)
          # META-ORCH-1161 go-live-prep (DEC-191, 2026-06-20):
          #   - can_send marketing default-ON + suppression (migration behavioral)
          #   - US quiet-hours recipient-timezone (P3-1 carry-forward)
          # META-ORCH-1161 go-live-prep REWORK (2026-06-20):
          #   - SMS phone-suppression audience exclusion (Sub-B, was unregistered)
          #   - EMAIL channel_suppressions audience exclusion (P2 fix)
          #   - quiet-hours-tz tester adversarial boundary cases (P3 retest)
          DENO_TEST_FILES=(
            supabase/functions/__tests__/orch_1161_notify_dispatch_v2.test.ts
            supabase/functions/__tests__/orch_1161_anon_guest_path.test.ts
            supabase/functions/__tests__/orch_1161_guest_ledger_and_dedupe.test.ts
            supabase/migrations/__tests__/orch_1161_golive_can_send_marketing_optout.test.ts
            supabase/functions/marketing-send/quiet-hours-tz.test.ts
            supabase/functions/_shared/marketingAudience.sms-suppression.test.ts
            supabase/functions/_shared/marketingAudience.email-suppression.golive.test.ts
            supabase/functions/marketing-send/quiet-hours-tz.tester.test.ts
            # ORCH-1270 — SMS quiet-hours DEFER disposition matrix + two-pass idempotency.
            supabase/functions/marketing-send/orch-1270-defer.test.ts
            # ORCH-1282 — MMS media threading: US MediaUrl param + NG drops media.
            supabase/functions/__tests__/marketing_send_mms_adapter.test.ts
          )
          for attempt in 1 2 3; do
            if deno test --allow-env --allow-net --allow-read --no-check "${DENO_TEST_FILES[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Notification Deno tests failed after 3 attempts (esm.sh flake?)"
              exit 1
            fi
            echo "Notification Deno tests failed (attempt ${attempt}), retrying in 10s..."
            sleep 10
          done

  orch-1270-strict-grep:
    name: "ORCH-1270: SMS quiet-hours DEFER + honest status + double-send guards (I-PROPOSED-1270-*)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Each gate self-tests (GOOD/BAD fixtures) then runs against the tree.
      - name: quiet-hours-defers-not-fails (self-test)
        run: node .github/scripts/strict-grep/i-proposed-1270-quiet-hours-defers-not-fails.mjs --self-test
      - name: quiet-hours-defers-not-fails
        run: node .github/scripts/strict-grep/i-proposed-1270-quiet-hours-defers-not-fails.mjs
      - name: no-empty-sent (self-test)
        run: node .github/scripts/strict-grep/i-proposed-1270-no-empty-sent.mjs --self-test
      - name: no-empty-sent
        run: node .github/scripts/strict-grep/i-proposed-1270-no-empty-sent.mjs
      - name: send-idempotent (self-test)
        run: node .github/scripts/strict-grep/i-proposed-1270-send-idempotent.mjs --self-test
      - name: send-idempotent
        run: node .github/scripts/strict-grep/i-proposed-1270-send-idempotent.mjs

  orch-1282-mms-strict-grep:
    name: "ORCH-1282: MMS media rides Twilio MediaUrl only; NG/Termii drops media (I-PROPOSED-1282-MMS-NG-DROPS-MEDIA)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: ng-drops-media (self-test)
        run: node .github/scripts/strict-grep/i-proposed-1282-mms-ng-drops-media.mjs --self-test
      - name: ng-drops-media
        run: node .github/scripts/strict-grep/i-proposed-1282-mms-ng-drops-media.mjs

  appsflyer-s2s-deno-tests:
    name: "Deno unit tests for ORCH-1313 AppsFlyer api3 S2S correctness"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - name: Run ORCH-1313 AppsFlyer S2S Deno tests
        env:
          # Inert defaults — apiHealthLog.recordApiCall (fire-and-forget) builds a
          # supabase client from these; the tests mock fetch and never reach a real
          # instance. The AppsFlyer env vars are set inline per-test.
          SUPABASE_URL: "https://example-test.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key-not-real"
        run: |
          set -euo pipefail
          DENO_TEST_FILES=(
            # ORCH-1313 §4.D — api3 token auth (not dev key), iOS id-prefix
            # (idempotent), os field, process-referral deletion.
            supabase/functions/_shared/__tests__/appsFlyerS2S.orch1313.test.ts
            # ORCH-1313 §9 — TESTER adversarial regression: Android-branch token
            # auth header (T-D4 omits it), cross-app-discriminator isolation,
            # blank-token fail-close. Fails-on-revert of the auth/os fixes.
            supabase/functions/_shared/__tests__/appsFlyerS2S.orch1313.adversarial.test.ts
          )
          for attempt in 1 2 3; do
            if deno test --allow-env --allow-net --allow-read --no-check "${DENO_TEST_FILES[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "ORCH-1313 AppsFlyer S2S Deno tests failed after 3 attempts (esm.sh flake?)"
              exit 1
            fi
            echo "ORCH-1313 AppsFlyer S2S Deno tests failed (attempt ${attempt}), retrying in 10s..."
            sleep 10
          done

  orch-1333-signal-scorer-deno-tests:
    name: "Deno unit tests for ORCH-1333 signal-scorer city-run incremental persist (I-PROPOSED-1333-SCORER-CITY-RUN-INCREMENTAL-PERSIST)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - name: Run ORCH-1333 signal-scorer batch Deno tests
        env:
          # Inert defaults — the ORCH-1333 engine (_shared/signalScorerBatch.ts)
          # is PURE logic (no Supabase client; all DB IO is injected by
          # run-signal-scorer/index.ts). These exist only for parity with the
          # sibling jobs and are never read.
          SUPABASE_URL: "https://example-test.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key-not-real"
        run: |
          set -euo pipefail
          DENO_TEST_FILES=(
            # ORCH-1333 §9 — the load-bearing fails-on-revert guard: a large
            # write-set city persists incrementally and does NOT abort-all when a
            # per-page sticky pre-read/upsert fails mid-run (T-A/T-B/T-D/T-E).
            supabase/functions/_shared/__tests__/signalScorerBatch.test.ts
            # ORCH-1333 §9 — adversarial: a per-page sticky/upsert failure keeps
            # prior pages + is resumable; admin pins stay sticky per page
            # (T-B/T-B2/T-C). These are NOT wired into any other job — required so
            # the incremental-persist guard is actually CI-enforced (I-CLOSE
            # regression-protection HARD MUST).
            supabase/functions/_shared/__tests__/signalScorerBatch.adversarial.test.ts
            # ORCH-1333 TESTER — independent adversarial coverage on a DIFFERENT
            # angle: resume-after-failure reconstructs the exact uninterrupted
            # end-state with ZERO double-writes across the seam (TC-1, fails-on-
            # revert), the real production city-mode loop (maxRows==pageSize==500)
            # terminates across an exactly-divisible boundary (TC-2), and an
            # admin-pin on the LAST short page stays sticky (TC-3).
