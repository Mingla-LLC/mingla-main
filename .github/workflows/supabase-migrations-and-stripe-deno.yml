        run: node --test src/__tests__/issue_3720_support_grant_session.implementor.happy.test.js
      - name: "#3720 Slice F — Community & Support console (admin node:test)"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue_3720_community_support_console.implementor.happy.test.js
      - name: "Issue #3697 — Admin video upload rides the shared lane; the library and Builder honour fit, archive and delete"
        working-directory: mingla-admin
        run: >-
          node --test
          src/services/__tests__/adminVideoUpload.issue3697.test.js
          src/services/__tests__/adminVideoUpload.issue3697.minDuration.test.js
          src/pages/__tests__/creativeLibrary.issue3697.test.js
          src/pages/__tests__/creativeLibraryFit.issue3697.test.js
          src/__tests__/issue3697_v14_creative_library.test.js
          src/__tests__/issue3697_v14_admin_ads_ia.test.js
          src/__tests__/issue3697_ads_learn_contract.test.js
