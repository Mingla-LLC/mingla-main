          src/__tests__/issue3697_stage_creatives.test.js
          src/__tests__/issue3697_tiktok_placement_control.test.js
      - name: Wait for postgres
        env:
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: |
          for i in {1..90}; do
            if psql -h localhost -U postgres -d postgres -c "SELECT 1" >/dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready in 90s"
          exit 1
      - name: Apply migrations in timestamp order
        env:
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: |
          set -e
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::Applying $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
          node .github/scripts/ci-discovery/run.mjs --lane migrations --through legacy-0113
          node --test supabase/functions/ticket-checkout-create/__tests__/issue_3313_day_choice_required.test.mjs
          node .github/scripts/ci-discovery/run.mjs --lane migrations --after legacy-0113

      - name: "Issue #3802 — the agent connector speaks the protocol and refuses every borrowed identity, against the real database"
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: supabase_admin
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: |
          node --experimental-strip-types --test --test-concurrency=1 \
            supabase/functions/team-agent/__tests__/protocol.issue3802.test.ts \
            supabase/functions/team-agent/__tests__/spoofing.issue3802.test.ts

      # Issue #3802 (Wave 4) — INDEPENDENT TESTER guard for the connector. It
      # hands the function's real handler the requests an HTTP server would
      # never tidy up (two credential headers, a body with no declared
      # length, a body one byte over the limit), keeps the refusal wait ON
      # under a clock it controls, and reads every answer the way a model
      # reads it: other people's text only inside JSON string values under a
      # note that says it is data, and unable to add a field, a heading or a
      # line to anything the connector says itself. The gateway behind it is
      # the real one, in the database replayed above. Its own step, because
      # each of these files adds and removes the one sign-in column this
      # image lacks.
      - name: "Issue #3802 — the agent connector: independent tester adversarial proof (header games, real body sizes, the refusal wait, hostile record text, forty malformed requests, every function name asked for as a tool, six keys at once)"
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: supabase_admin
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: |
          node --experimental-strip-types --test --test-concurrency=1 \
            supabase/functions/team-agent/__tests__/hostile.issue3802.tester.adversarial.test.ts

      # Issue #3802 (Wave 4, second part) — an agent set up by one message,
      # then adding and changing, over real HTTP into the real handler against
      # the database replayed above: a setup code made by the real function is
      # exchanged once for a key, and with that key the agent checks who is
      # contactable, adds, moves, logs, records a reply and adds-or-finds;
      # every change is the key owner's, via the key's agent; a request that
      # waits for its key's turn is answered 429. Its own step, because each
      # of these files adds and removes the one sign-in column this image
      # lacks.
      - name: "Issue #3802 — the agent connector writes: a real exchange of a setup code, then every write tool over HTTP as the key's owner"
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: supabase_admin
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: |
          node --experimental-strip-types --test --test-concurrency=1 \
            supabase/functions/team-agent/__tests__/writeProtocol.issue3802.test.ts

      # Issue #3802 (Connector part 3) — the private Drafts to send lifecycle
      # through the real handler and gateway, then the person's own review,
      # mark-sent and Undo RPCs. This proves full-argument request-key binding,
      # original/current text, personal-only text, and exact-touch rollback.
      - name: "Issue #3802 — Drafts to send works end to end against the replayed database"
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: supabase_admin
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: |
          node --experimental-strip-types --test --test-concurrency=1 \
            supabase/functions/team-agent/__tests__/draftProtocol.issue3802.implementor.happy.test.ts

      # Issue #3802 (Connector part 3) — INDEPENDENT TESTER guard. It attacks
      # cross-person text access, request-key reuse across tools and changed
      # arguments, agent calls to person-only actions, and concurrent marking.
      # Its own step keeps the harness's temporary sign-in column isolated.
      - name: "Issue #3802 — Drafts to send refuses borrowed text and duplicate effects"
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: supabase_admin
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: |
          node --experimental-strip-types --test --test-concurrency=1 \
            supabase/functions/team-agent/__tests__/draftProtocol.issue3802.tester.adversarial.test.ts

      # Issue #2587 — the share path publishes an offering's location, and it
      # read the base relation with no privacy gate at all: a host who turned on
      # "hide the address until someone buys" had that address served to an
      # unauthenticated crawler and baked into an image cached for a year.
      #
      # Registered HERE, in the already-registered migrations provider, for the
      # same two reasons #2489 was: a new issue-named workflow is refused by the
      # CI registry gate, and this proof needs a live PostgreSQL — which is the
      # whole point of it. The defect was graded "latent" twice, both times by
      # asking something other than the thing that serves the public. So this
      # suite asserts on rows read back out of the share-version table, written
      # by the real mint RPC, with the privacy verdict produced by the deployed
      # #2489 predicate. It creates and drops its own database and never touches
      # the migrated one above.
      #
      # It carries its own anti-vacuity twin (an offering whose host never asked
      # for privacy must still publish its location — a gate that strips
      # everything is an outage) and its own negative control (a real leaking
      # row, minted through the real RPC, that the detector must catch).
      - name: "Issue #2587 — the share capture cannot publish a withheld location"
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: node --experimental-strip-types --test scripts/issue-2587/share-capture-gate.dbboundary.test.mjs

      # Issue #2589 — one mechanism, four symptoms, and the interaction between
      # two of them.
      #
      # A volatile fact that the card CLIPS OFF and never draws was inside the
      # version fingerprint, so an ordinary ticket sale minted a new immutable
      # version and a new immutable image URL. Measured on the busiest live link:
      # 88 versions in four days, and versions 40/41/42/88 render BYTE-IDENTICAL
      # JPEGs. Every bump strands the warm CDN copy and buys a ~2 s cold render
      # for a picture that had not changed.
      #
      # THE INTERACTION IS WHY THIS RUNS AGAINST A REAL DATABASE. Stopping the
      # churn could create a stale-image bug: today a newly added cover
      # propagates by RIDING on that churn. So the suite asserts, in both
      # directions and by counting rows in the real table written by the real
      # mint RPC, that adding, changing and removing a cover each still mint —
      # and that a ticket sale no longer does. It carries its own anti-vacuity
      # twin (a fingerprint that never moves is exactly as broken as one that
      # always moves) and its own negative control, which restores the shipped
      # pre-fix arithmetic and proves the detector can go red. It creates and
      # drops its own database and never touches the migrated one above.
      - name: "Issue #2589 — a share version identifies the card, and a cover change still mints"
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: node --experimental-strip-types --test scripts/issue-2589/share-version-identity.dbboundary.test.mjs

      # Issue #2589 — the readiness check demanded EXACT version equality against
      # a page whose own fetch mints the next version. Deterministic, could not
      # converge, never timed out, and it disabled the Share button. Needs no
      # database: the decision was extracted into a dependency-free module for
      # exactly this reason, so it can be asserted here rather than only in a job
      # that installs a native image toolchain.
      - name: "Issue #2589 — readiness converges and stops retrying a settled verdict"
        run: node --experimental-strip-types --test scripts/issue-2589/readiness-convergence.test.mjs

      # Issue #2589 — the property the convergence work put at risk, proven by
      # EXECUTING the shipped function rather than reading it. The consumer share
      # sheet must become visible before anything is fetched, and preparation and
      # recipients must not gate each other: that is the behaviour behind the
      # original "tap Share, stare at nothing" report. The suites that already
      # guarded it compared string positions in a file; this one lifts the real
      # `openContentShare` body out of the provider, runs it over recording
      # stubs, and asserts the observed call order.
      - name: "Issue #2589 — the consumer sheet still opens synchronously"
        run: node --experimental-strip-types --test scripts/issue-2589/consumer-sheet-open.runtime.test.mjs

      # Issue #2589 — the other property the error-mapping work put at risk, and
      # the older of the two. When the current share producer fails it must fail
      # VISIBLY, exactly once, and must never quietly fall back to the pre-#1615
      # producer: a silent downgrade is how a failure stops being visible and
      # starts shipping subtly wrong artwork instead. That regression was caught
      # on a physical Samsung. The suites guarding it match regexes over the
      # adapter's source; this one lifts the real producer out and RUNS it over
      # fourteen failure shapes, asserting that every one throws, none returns,
      # and none reaches the legacy producer — which has no caller at all.
      - name: "Issue #2589 — a V1 failure has one exit and cannot reach the legacy producer"
        run: node --experimental-strip-types --test scripts/issue-2589/v1-producer-single-exit.runtime.test.mjs

      # Issue #2589 — the share host allowlist named `media.giphy.com`, which
      # Giphy's API never returns, so it matched ZERO real Giphy URLs; and the
      # content-type gate omitted GIF, so even a host-allowed GIF was refused.
      # The list was hand-copied into three files that had already drifted. One
      # shared URL corpus is now run through both remaining owners, so a
      # disagreement between them fails here instead of in production.
      - name: "Issue #2589 — one host corpus, every allowlist owner"
        run: node --experimental-strip-types --test scripts/issue-2589/share-media-hosts.corpus.test.mjs

      # Issue #3081 — THE #2489 GATE REGISTRY SURVIVES A REPLAY. Runs LAST in this job
      # deliberately: it re-applies migrations and stages a probe object, so it must not
      # perturb the schema any earlier fixture in this job reads. It restores what it
      # stages (step E), leaving the migrated database exactly as it found it.
      #
      # WHAT BROKE. `public.issue_2489_gate_registry()` was a hardcoded VALUES list that
      # two migrations re-emitted — nine entries in #2489, ten in #2986, which added
      # `public_search_source_facts`. #2489 ALSO carries the apply-time set-equality
      # check, ~1,500 lines after its own registry definition. So re-applying #2489
      # REWOUND the declared set to nine and compared it against a catalog that still
      # held the tenth carrier:
      #
      #   ERROR:  #2489: undeclared objects are carrying the shared gate: public_search_source_facts
      #
      # main was red from 2026-09-02 20:22 and every merge in the repository was blocked.
      # The gate was RIGHT — an undeclared object really was carrying it at that instant.
      # The defect was that the declared set could be REVERTED BY AN OLDER FILE. #3081
      # makes it append-only DATA (`public.issue_2489_gate_carriers`); a CREATE OR REPLACE
      # can revert code, nothing reverts a row.
      #
      # Mutants that must turn this RED: (a) restoring #2489's hardcoded VALUES registry;
      # (b) deleting 20270618003081_issue_3081_gate_registry_replay_safe.sql; (c) any
      # change that lets a re-apply drop a row a later migration added.
      - name: "Issue #3081 — the #2489 gate registry survives a mid-chain re-apply and a future carrier"
        env:
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          PSQL="psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1"
          GATE=supabase/migrations/20270523002489_issue_2489_address_privacy_server_gate.sql

          # A — THE EXACT PARTIAL RE-APPLY THAT REDDENED main. `#2333`'s replay-safety
          #     step ends by applying #2489 ALONE, and nothing re-applies #2986 after
          #     it, so a declared set living in #2489's body could never be restored.
          #     This single line is the whole bug: pre-#3081 it raised
          #     "undeclared objects are carrying the shared gate: public_search_source_facts".
          #
          #     WHY NOT "APPLY THE WHOLE CHAIN TWICE". Because the chain is not replay-
          #     safe and never has been: measured on supabase/postgres:17.4.1.075, a
          #     second full pass fails on 130 UNRELATED migrations (CREATE TABLE without
          #     IF NOT EXISTS, repeated ADD COLUMN / ADD CONSTRAINT). That is a
          #     pre-existing property of the tree, not something #3081 introduced or can
          #     fix, and asserting it here would red this lane for 130 reasons that have
          #     nothing to do with the gate. The re-apply below is the operation the
          #     repository ACTUALLY performs, and the one that broke.
          $PSQL -q -f "$GATE"
          echo "A OK — #2489 re-applied alone, mid-chain, without raising"

          # B — the new terminal migration is itself idempotent, so a lane that replays
          #     it (or a snapshot top-up that applies it twice) cannot break the shape.
          $PSQL -q -f supabase/migrations/20270618003081_issue_3081_gate_registry_replay_safe.sql
          echo "B OK — #3081 is idempotent"

          # C — the state it arrived in is the RIGHT state, not merely a surviving one.
          $PSQL -f supabase/migrations/__tests__/issue_3081_gate_registry_replay.implementor.happy.test.sql

          # D — THE PROPERTY THAT ACTUALLY MATTERS: THE ELEVENTH CARRIER. A future
          #     migration adds a gated object and declares it the way the contract says —
          #     one INSERT, no function re-emission — having never heard of #3081. That
          #     carrier must survive the same mid-chain re-apply. Under the old design
          #     the re-apply below discarded it; that is the trap this issue disarms.
          $PSQL -q -c "CREATE FUNCTION public.issue_3081_probe_carrier(p_theme jsonb) RETURNS boolean LANGUAGE sql STABLE SET search_path = '' AS \$fn\$ SELECT public.issue_2489_address_withheld(p_theme) \$fn\$;"
          $PSQL -q -c "INSERT INTO public.issue_2489_gate_carriers (object_name, object_kind) VALUES ('issue_3081_probe_carrier', 'function') ON CONFLICT (object_name) DO NOTHING;"
          $PSQL -q -f "$GATE"
          $PSQL -q -c "DO \$d\$ BEGIN IF (SELECT count(*) FROM public.issue_2489_gate_registry() WHERE object_name = 'issue_3081_probe_carrier') <> 1 THEN RAISE EXCEPTION '#3081: re-applying #2489 discarded a later migration''s carrier — the replay trap is still armed'; END IF; END \$d\$;"
          echo "D OK — an eleventh carrier declared by a future migration survives the re-apply"

          # E — leave the migrated database exactly as found, in ONE transaction so the
          #     registry never momentarily declares an object that no longer exists.
          $PSQL -q -c "BEGIN; DELETE FROM public.issue_2489_gate_carriers WHERE object_name = 'issue_3081_probe_carrier'; DROP FUNCTION public.issue_3081_probe_carrier(jsonb); COMMIT;"
          echo "E OK — probe carrier removed; the migrated database is as found"

      # Issue #3081 — TESTER ADVERSARIAL. Runs after the step above, on the same
      # re-applied schema, and attacks four properties that fixture cannot see:
      # the registry must GROW when a row is appended (it only ever tests removal);
      # volatility must be STABLE and the function SECURITY INVOKER (it never reads
      # pg_proc); an eleventh carrier must survive a verbatim replay of BOTH shipped
      # seed statements (that property currently lives only in the step above, and a
      # workflow step is not append-only); and anon/authenticated must NOT be able to
      # reach the carrier map THROUGH the function they still hold EXECUTE on — the
      # obvious "tidy-up" for that permission-denied is SECURITY DEFINER, which would
      # publish the full address-privacy gate map to every anonymous caller.
      #
      # It also exercises the equality's VIEW arm, which no other suite in this issue
      # has ever fired: every carrier staged anywhere else is a function.
      #
      # Self-contained: one transaction, ends in ROLLBACK, leaves no durable state.
      # Fails-on-revert proven at origin/main 2bb26d372 (table absent) and under a
      # surgical restore of the pre-#3081 IMMUTABLE VALUES registry with the table
      # left in place, which trips A-1 by name.
      - name: "Issue #3081 — tester adversarial: the declared set is append-only and the carrier map stays private"
        env:
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_3081_gate_registry_append_only.tester.adversarial.pg17.test.sql

      # Issue #3055 — the Ari certification backlog repair must be CONVERGENT.
      # Five certification migrations never ran in production (they sort below
      # its applied head), so production and this chain hold different
      # requirement sets and different certification functions. The repair
      # (20270630003055) must land ONE final state from both. The implementor
      # suite applies the REAL file to this chain (a no-op, twice) and to a
      # production-shaped fixture proven byte-identical to production's probed
      # fingerprints, then requires identical rows, set digest, functions,
      # trigger and ari_cert_* catalog, ledger-exact ids, and a begin/finalize
      # round trip that passes the digest gate. The adversarial suite requires
      # a named abort and zero residue for eight unexpected starting states,
      # one of them against the real file's own BEGIN/COMMIT.
      #
      # LAST in this job on purpose: both suites commit fixtures to this
      # database and restore the chain before they exit, each proving the
      # restoration exactly — nothing after them depends on that proof.
      # Runs from the checkout root: both read repo files via git rev-parse.
      - name: "Issue #3055 — Ari certification backlog repair converges from production and chain"
        env:
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_3055_ari_cert_backlog_repair.implementor.pg17.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_3055_ari_cert_backlog_repair.adversarial.pg17.test.sql

  deno-tests:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Deno unit tests for Stripe shared modules"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - name: Run V3 Stripe-scoped Deno tests
        env:
          # Inert defaults — the router test asserts dispatch was attempted; it
          # doesn't reach a real Supabase instance. These prevent the env-var
          # presence guards in `_shared/stripeEdgeAuth.ts` from throwing.
          SUPABASE_URL: "https://example-test.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key-not-real"
          STRIPE_WEBHOOK_SECRET: "whsec_test"
          STRIPE_WEBHOOK_SECRET_PLATFORM: "whsec_test_platform"
          STRIPE_WEBHOOK_SECRET_PREVIOUS: ""
        run: |
          set -euo pipefail
          node .github/scripts/ci-discovery/run.mjs --lane stripe-deno

  notification-deno-tests:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Deno unit tests for META-ORCH-1161 notification system"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - name: Run META-ORCH-1161 notification Deno tests
        env:
          # Inert defaults — these tests use fake supabase clients + stubbed fetch
          # and never reach a real Supabase/Twilio/Resend instance. The SMS
          # kill-switch (SMS_LIVE_ENABLED_US) is intentionally UNSET so the
          # kill-switch-off assertions hold by default; the ON tests set it inline.
          SUPABASE_URL: "https://example-test.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key-not-real"
        run: |
          set -euo pipefail
          node .github/scripts/ci-discovery/run.mjs --lane notification-deno

  discovered-deno-tests:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Deno 2.x locally declared suites"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "2.x"
      - name: Run locally declared Deno 2.x suites
        run: node .github/scripts/ci-discovery/run.mjs --lane deno2-discovered

  orch-1270-strict-grep:
    if: ${{ github.event.pull_request.draft != true }}
    name: "ORCH-1270: SMS quiet-hours DEFER + honest status + double-send guards (I-PROPOSED-1270-*)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Each gate self-tests (GOOD/BAD fixtures) then runs against the tree.
      - name: quiet-hours-defers-not-fails (self-test)
