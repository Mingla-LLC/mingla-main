            supabase/functions/notify-outbox-drain/issue1529.sourceCountry.test.ts
            # Issue #1529 T-3 — adapter routing and ZERO-HTTP under the operator
            # decision that the DESTINATION NUMBER is the routing authority
            # (Seth, 2026-08-03). Pins the production case nothing covered: a
            # +234 handset carrying a NULL or an outright wrong "US" label
