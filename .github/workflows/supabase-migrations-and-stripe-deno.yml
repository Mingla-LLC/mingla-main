      - ".github/scripts/strict-grep/issue-1971-ari-trip-lifecycle.mjs"
      - "mingla-admin/src/pages/ClaimsPage.jsx"
      - "mingla-admin/src/__tests__/issue2724_admin_approve_without_call.happy.test.js"
      - "mingla-business/src/services/rsvpEvents.ts"
