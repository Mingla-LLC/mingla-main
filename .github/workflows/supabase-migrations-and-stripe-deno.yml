      # Issue #2587 — the share path publishes an offering's location, and it
      # read the base relation with no privacy gate at all: a host who turned on
      # "hide the address until someone buys" had that address served to an
      # unauthenticated crawler and baked into an image cached for a year.
      #
      # Registered HERE, in the already-registered migrations provider, for the
      # same two reasons #2489 was: a new issue-named workflow is refused by the
      # CI registry gate, and this proof needs a live PostgreSQL — which is the
      # whole point of it. The defect was graded "latent" twice, both times by
      # asking something other than the thing that serves the public. So this
      # suite asserts on rows read back out of the share-version table, written
      # by the real mint RPC, with the privacy verdict produced by the deployed
      # #2489 predicate. It creates and drops its own database and never touches
      # the migrated one above.
      #
      # It carries its own anti-vacuity twin (an offering whose host never asked
      # for privacy must still publish its location — a gate that strips
      # everything is an outage) and its own negative control (a real leaking
      # row, minted through the real RPC, that the detector must catch).
      - name: "Issue #2587 — the share capture cannot publish a withheld location"
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: node --experimental-strip-types --test scripts/issue-2587/share-capture-gate.dbboundary.test.mjs

      # Issue #2589 — one mechanism, four symptoms, and the interaction between
      # two of them.
      #
      # A volatile fact that the card CLIPS OFF and never draws was inside the
      # version fingerprint, so an ordinary ticket sale minted a new immutable
      # version and a new immutable image URL. Measured on the busiest live link:
      # 88 versions in four days, and versions 40/41/42/88 render BYTE-IDENTICAL
      # JPEGs. Every bump strands the warm CDN copy and buys a ~2 s cold render
      # for a picture that had not changed.
      #
      # THE INTERACTION IS WHY THIS RUNS AGAINST A REAL DATABASE. Stopping the
      # churn could create a stale-image bug: today a newly added cover
      # propagates by RIDING on that churn. So the suite asserts, in both
      # directions and by counting rows in the real table written by the real
      # mint RPC, that adding, changing and removing a cover each still mint —
      # and that a ticket sale no longer does. It carries its own anti-vacuity
      # twin (a fingerprint that never moves is exactly as broken as one that
      # always moves) and its own negative control, which restores the shipped
      # pre-fix arithmetic and proves the detector can go red. It creates and
      # drops its own database and never touches the migrated one above.
      - name: "Issue #2589 — a share version identifies the card, and a cover change still mints"
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: node --experimental-strip-types --test scripts/issue-2589/share-version-identity.dbboundary.test.mjs

      # Issue #2589 — the readiness check demanded EXACT version equality against
      # a page whose own fetch mints the next version. Deterministic, could not
      # converge, never timed out, and it disabled the Share button. Needs no
      # database: the decision was extracted into a dependency-free module for
      # exactly this reason, so it can be asserted here rather than only in a job
      # that installs a native image toolchain.
      - name: "Issue #2589 — readiness converges and stops retrying a settled verdict"
        run: node --experimental-strip-types --test scripts/issue-2589/readiness-convergence.test.mjs

      # Issue #2589 — the property the convergence work put at risk, proven by
      # EXECUTING the shipped function rather than reading it. The consumer share
      # sheet must become visible before anything is fetched, and preparation and
      # recipients must not gate each other: that is the behaviour behind the
      # original "tap Share, stare at nothing" report. The suites that already
      # guarded it compared string positions in a file; this one lifts the real
      # `openContentShare` body out of the provider, runs it over recording
      # stubs, and asserts the observed call order.
      - name: "Issue #2589 — the consumer sheet still opens synchronously"
        run: node --experimental-strip-types --test scripts/issue-2589/consumer-sheet-open.runtime.test.mjs

      # Issue #2589 — the other property the error-mapping work put at risk, and
      # the older of the two. When the current share producer fails it must fail
      # VISIBLY, exactly once, and must never quietly fall back to the pre-#1615
      # producer: a silent downgrade is how a failure stops being visible and
      # starts shipping subtly wrong artwork instead. That regression was caught
      # on a physical Samsung. The suites guarding it match regexes over the
      # adapter's source; this one lifts the real producer out and RUNS it over
      # fourteen failure shapes, asserting that every one throws, none returns,
      # and none reaches the legacy producer — which has no caller at all.
      - name: "Issue #2589 — a V1 failure has one exit and cannot reach the legacy producer"
        run: node --experimental-strip-types --test scripts/issue-2589/v1-producer-single-exit.runtime.test.mjs

      # Issue #2589 — the share host allowlist named `media.giphy.com`, which
      # Giphy's API never returns, so it matched ZERO real Giphy URLs; and the
      # content-type gate omitted GIF, so even a host-allowed GIF was refused.
      # The list was hand-copied into three files that had already drifted. One
      # shared URL corpus is now run through both remaining owners, so a
      # disagreement between them fails here instead of in production.
      - name: "Issue #2589 — one host corpus, every allowlist owner"
        run: node --experimental-strip-types --test scripts/issue-2589/share-media-hosts.corpus.test.mjs

  deno-tests:
    name: "Deno unit tests for Stripe shared modules"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - name: Run V3 Stripe-scoped Deno tests
