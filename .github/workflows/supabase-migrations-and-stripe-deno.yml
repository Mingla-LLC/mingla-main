# ORCH-1383 — cancel a superseded PR run instead of letting it finish.
# Measured: 28 of 260 July strict-grep runs (10.8%) were superseded before finishing.
# The expression (not a bare `true`) is deliberate: cancelling a `push` to main would
# abandon the post-merge verification run for that commit. Guarding on pull_request
# recovers the PR-side waste while main runs always complete.
concurrency:
  group: ci-supabase-migrations-and-stripe-deno-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  # #2598 — the receipt ledger must stay usable as an answer to "what is
  # applied". A CHECK constraint merged 2026-04-25 never reached production and
  # hid for four months among clerical gaps because nothing distinguished a real
  # gap from an unstamped one, and six colliding version slots meant six
  # migrations could never be represented at all.
  migration-receipt-hygiene:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Migration receipt hygiene (#2598)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Audit self-test then filename and version hygiene
        run: |
          node scripts/ops/audit-migration-receipts.mjs --self-test
          node --test scripts/ops/__tests__/audit-migration-receipts.issue2598.test.mjs
      - name: Prove self-registering CI plans and immutable bootstraps
        run: node --test .github/scripts/ci-discovery/__tests__/*.test.mjs

  migrations:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Migrations apply cleanly from baseline"
    runs-on: ubuntu-latest
    services:
      postgres:
        # Supabase-flavored Postgres image — includes pg_cron, pgcrypto, pgsodium,
        # plv8, and other extensions the baseline migration requires.
        # Stock postgres:15 doesn't have pg_cron and fails immediately.
        #
        # Image-specific env contract: the supabase/postgres image's internal
        # migrate.sh creates `supabase_admin` (and aux roles) and uses
        # POSTGRES_PASSWORD as supabase_admin's password. We do NOT override
        # POSTGRES_USER (doing so causes `migrate.sh` to fail with
        # `role "supabase_admin" does not exist` per the historical CI runs).
        # We do NOT override POSTGRES_DB either — the supabase image restricts
        # extension creation to the default `postgres` database. The baseline
        # migration's `CREATE EXTENSION` calls fail with "can only create
        # extension in database postgres" otherwise. Run migrations in the
        # default `postgres` DB.
        #
        # Postgres MAJOR version pinning: production is on Postgres 17 (Supabase
        # default since mid-2026). Baseline `20260505000000_baseline_squash_orch_0729.sql`
        # uses PG 16+ syntax (`GRANT MAINTAIN ON …`). Earlier image tag
        # `supabase/postgres:15.8.1.060` rejected MAINTAIN with "unrecognized
        # privilege type". Pin to a 17.x image to match production.
        image: supabase/postgres:17.4.1.075
        env:
          # Issue #2587 — generated per run, never a literal. A secret scanner
          # cannot tell a throwaway CI credential from a real one, and it is not
          # its job to try; 33 sibling workflows already use this exact shape.
          # initdb applies this ONCE at container start, so every consumer below
          # must repeat the identical expression — a literal left behind in one
          # step fails authentication at test time, not at lint time.
          POSTGRES_PASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      # Issue #2587 — the share-capture gate proof runs the real edge-function
      # TypeScript against this job's postgres service, so this job needs a Node
      # that can strip types. 22, not the 20 the strict-grep jobs below pin:
      # `--experimental-strip-types` does not exist on 20.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Issue #2724 — Admin approval stays independent from call audit"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue2724_admin_approve_without_call.happy.test.js
      - name: "Issue #3645 — Admin payout pause/resume + debt view wiring pin"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue3645_admin_payout_pause_and_debt.test.js
      - name: "Issue #3802 — roles in Mingla Admin: what each role may open, and the invite flow"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue3802_wave0_roles.implementor.happy.test.js
      - name: "Issue #3802 — roles in Mingla Admin: independent tester adversarial proof"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue3802_wave0_roles.tester.adversarial.test.js
      - name: "Issue #3802 — Hosts and Creators boards in Mingla Admin: names, filters, addresses, access, one caller of the server functions"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue3802_wave1_pipelines.implementor.happy.test.js
      - name: "Issue #3802 — boards rework: unsent edits, stale cards, plain words, toasts and keyboard"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue3802_wave1_boards_rework.implementor.happy.test.js
      - name: "Issue #3802 — Hosts and Creators boards: independent tester adversarial proof (every server refusal in plain words, honest Undo, hostile input)"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue3802_wave1_pipelines.tester.adversarial.test.js
      - name: "Issue #3802 — role homes, targets, Beta leads and invite follow-ups: names, addresses, access, words for every answer, source contracts"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue3802_wave1_homes.implementor.happy.test.js
      - name: "Issue #3802 — homes rework: one stacking order, toasts at every width, Beta leads layouts, names by category, touch sizes, the strict invite rule"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue3802_wave1_homes_rework.implementor.happy.test.js
      # The rendered stacking check builds and renders the real card, layer and
      # "Why is this lost?" components, so it needs the admin app's packages
      # (react, react-dom, esbuild). `npm ci` only, from the lockfile. Every
      # other step in this job reads source text and needs nothing installed;
      # this install comes after them so it cannot change what they see.
      - name: "Issue #3802 — install the admin app's packages for the rendered stacking check"
        working-directory: mingla-admin
        run: npm ci --no-audit --no-fund
      - name: "Issue #3802 — Draft count refreshes coalesce behind a delayed request"
        working-directory: mingla-admin
        run: node --test src/__tests__/draft_count_refresh_issue3802.implementor.happy.test.js
      - name: "Issue #3802 — a question opened from an open card is drawn above the card (rendered, every width)"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue3802_wave1_overlay_stack.rendered.test.js
      - name: "Issue #4111 — Admin Reported enquiries: (needs the admin npm ci above) only reported threads, dismiss and block everywhere"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue4111_reported_enquiries.implementor.happy.test.js src/__tests__/issue4111_reported_enquiries.tester.adversarial.test.js
      - name: "Issue #3802 — role homes, targets, Beta leads and invite follow-ups: independent tester adversarial proof (hostile addresses, every area combination, answers that are not answers, no raw error on screen)"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue3802_wave1_homes.tester.adversarial.test.js
      - name: "Issue #3802 — My agent: who may open it, the lines to paste, the status in plain words, what it can do against the connector's own list, and that a key is never stored or logged"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue3802_wave4_agent.implementor.happy.test.js
      - name: "Issue #3802 — Drafts to send: private original/current text, copy-before-record, one count source, responsive queue and accessible states"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue3802_drafts_to_send.implementor.happy.test.js
      - name: "Issue #3802 — My agent: independent tester adversarial proof (the pasted lines run in a real shell, hostile keys and addresses, every combination of areas, broken dates and unknown reasons, no raw error on screen, where the key on screen can go)"
        working-directory: mingla-admin
        run: node --test src/__tests__/agent_connector_issue3802.tester.adversarial.test.js
      - name: "Issue #3802 — My agent, one-message setup: the four messages (one command, the code once, never a key), run in a real shell with stand-ins; the hand-typed lines never hold a key; every state of the setup card; the repeated check only while visible, with an end"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue3802_wave4_setup.implementor.happy.test.js
      - name: "Issue #3802 — Hosts and Creators: emails, phones and handles in the server's own normal form, search by them, the contact rule on every surface, the contactable check in the Add form, City missing by role"
