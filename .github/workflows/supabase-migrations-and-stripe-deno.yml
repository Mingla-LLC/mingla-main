            supabase/functions/notification-retry-sweeper/index.test.ts
            supabase/functions/termii-delivery-status/issue2218.ticket_ledger_parity.test.ts
            # Issue #2218 — `sent` stops being a resting state: the deadline
            # arithmetic, the "Message Sent is NOT a delivery" rule, the two
