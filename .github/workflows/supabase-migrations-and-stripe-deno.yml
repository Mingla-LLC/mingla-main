          # Inert defaults — the router test asserts dispatch was attempted; it
          # doesn't reach a real Supabase instance. These prevent the env-var
          # presence guards in `_shared/stripeEdgeAuth.ts` from throwing.
          SUPABASE_URL: "https://example-test.supabase.co"
          SUPABASE_SERVICE_ROLE_KEY: "test-service-role-key-not-real"
          STRIPE_WEBHOOK_SECRET: "whsec_test"
          STRIPE_WEBHOOK_SECRET_PLATFORM: "whsec_test_platform"
          STRIPE_WEBHOOK_SECRET_PREVIOUS: ""
        run: |
          set -euo pipefail
          DENO_TEST_FILES=(
            supabase/functions/_shared/__tests__/stripeIpAllowlist.test.ts
            supabase/functions/_shared/__tests__/stripeKycRemediation.test.ts
            supabase/functions/_shared/__tests__/stripeKycReminderSchedule.test.ts
            supabase/functions/_shared/__tests__/stripeWebhookRouter.test.ts
            supabase/functions/_shared/__tests__/stripeWebhookSignature.test.ts
            # ISSUE-865 WP-B — ad-conversion senders + fire helper (hermetic:
            # stubbed fetch + injected supabase; runs with the same flags).
            supabase/functions/_shared/__tests__/issue_865_wp_b_ad_conversion.test.ts
            # ISSUE-865 WP-B/C — mingla-tester adversarial battery (real timeout
            # path, end-to-end PII hashing on the wire, cross-side dedup contract).
            supabase/functions/_shared/__tests__/issue_865_wp_bc_adversarial.tester.test.ts
            # ISSUE-996 — implementor source guard: A5 keeps its local fetch
            # declaration + fireAdConversion injection (no network execution).
            supabase/functions/_shared/__tests__/issue_996_a5_hermetic_fetch.test.ts
            # ISSUE-996 — independent tester runtime guard: A1-A6 execute behind
            # a non-egressing global-fetch sentinel.
            supabase/functions/_shared/__tests__/issue_996_a5_no_global_fetch.tester.test.ts
            # ISSUE-1267 — Google Ads the 5th conversion lane: upload wire shape,
            # Enhanced-Conversions ids, two-tier value, validateOnly, fail-open, and
            # google_ads_status IN the redelivery-dedup gate (hermetic — injected
            # resolveClient/requestImpl seams, no global fetch).
            supabase/functions/_shared/__tests__/issue_1267_google_conversion_lane.test.ts
            # ISSUE-855 PR-0 — server-fire COALESCE backfill repairs the live #865
            # undercount: when the browser's EARLY ad_conversions row wins the race,
            # the server fire now fills the NULL brand_id/order_id/value_cents/
            # currency/mingla_event_id (only when NULL, never clobbering, never
            # touching the *_status dedup gate). Hermetic — spy senders + fake supabase.
            supabase/functions/_shared/__tests__/issue_855_pr0_conversion_brand_backfill.test.ts
            # ISSUE-1971 — the nine trip capabilities are registered, role-bound,
            # receipt-backed and routed through ari_execute_trip_operation, with
            # no direct trip-table mutation left in any executor.
            supabase/functions/_shared/__tests__/issue_1971_ari_trips.implementor.test.ts
            supabase/functions/_shared/__tests__/issue_1977_ari_rsvp_lifecycle.test.ts
            supabase/functions/_shared/__tests__/issue_1977_rsvp_task_state.implementor.test.ts
            # ISSUE-1984 — event order reconciliation aggregate (no buyer PII).
            supabase/functions/_shared/__tests__/issue_1984_ari_orders_reconciliation.implementor.test.ts
            supabase/functions/_shared/__tests__/issue_1984_ari_orders_reconciliation.tester_adversarial.test.ts
            # ISSUE-1976 — balances + partner links/splits reads.
            supabase/functions/_shared/__tests__/issue_1976_ari_payments_partner.implementor.test.ts
            # ISSUE-1981 — trip installment charge-now + reminder.
            supabase/functions/_shared/__tests__/issue_1981_ari_installments.implementor.test.ts
            # ISSUE-1982 — team list, scanner revoke, Brand People manage.
            supabase/functions/_shared/__tests__/issue_1982_ari_team_people.implementor.test.ts
            # ISSUE-1972 reopen — group chat, door sale, orders, waitlist, scanners.
            supabase/functions/_shared/__tests__/issue_1972_ari_event_ops.implementor.test.ts
            # ISSUE-1980 — marketing audiences, templates, campaign reports.
            supabase/functions/_shared/__tests__/issue_1980_ari_marketing.implementor.test.ts
            # ISSUE-1983 — profile avatar, Ari history, notifications, support inbox.
            supabase/functions/_shared/__tests__/issue_1983_ari_account_inbox.implementor.test.ts
            # ISSUE-1387 — JWT gate, canonical action envelope, and error hygiene.
            supabase/functions/manage-stay-inventory/index.test.ts
            # ISSUE-1388 — grouped Stay cart, Request actions, and error hygiene.
            supabase/functions/stay-reservations/index.test.ts
            # ISSUE-1390 — payment retry resumes one bound attempt across both apps.
            supabase/functions/stay-reservations/paymentResume.issue1390.test.ts
            supabase/functions/_shared/stayPaymentResume.issue1390.test.ts
            # ISSUE-1426 — staff queue, whole-group response, and reviewed cancellation routing.
            supabase/functions/stay-reservations/businessManagement.issue1426.test.ts
            # ISSUE-1426 TESTER — auth boundary, permission/version mapping, and DB-detail redaction.
            supabase/functions/stay-reservations/businessManagement.issue1426.tester.adversarial.test.ts
            # Issue #1790 — the venue-order money engine. Its T-M2 group walks
            # the SAME 600,006-point grid as the SQL twin
            # (supabase/migrations/__tests__/issue_1790_venue_order_money_rail.test.sql)
            # against the SAME exact-integer oracle, so the TypeScript
            # feeFromBps and the Postgres round() inside
            # venue_orders_fee_from_basis cannot drift without one of them going
            # red — and if they ever do, the CHECK finds it instead of a
            # customer. Also pins the P-29 error copy VERBATIM (every money-path
            # error must say nothing has been charged), the tip never entering
            # the fee basis, and the midnight-wrapping service window.
            supabase/functions/_shared/__tests__/issue_1790_venue_order_money.test.ts
            # Issue #1790 — the webhook branches, asserted on the WIRE. The
            # sharpest test here is that an UNEXPANDED Stripe balance
            # transaction yields a NULL provider fee rather than a zero: a zero
            # placeholder would over-release the venue by exactly the processing
            # cost, so the order must WAIT for the real number instead.
            supabase/functions/_shared/__tests__/issue_1790_venue_order_webhook.test.ts
            # Issue #1819 H-2 — the collision and the leak. Proves two counter-
            # pickup guests with identical carts no longer derive one key (the
            # second used to be handed the first's order), that the same guest
            # retrying still collapses to one, and that the replay read is
            # filtered on all three tenant columns — asserted against a fake
            # client that really applies the filters, so a foreign-brand row is
            # excluded by the QUERY rather than by a stub's say-so.
            supabase/functions/_shared/__tests__/issue_1819_order_idempotency_scope.test.ts
            # Issue #1919 — structural last-writer, transitional-wire, and ACL
            # contract for the provider-neutral readiness migration.
            supabase/migrations/__tests__/issue_1919_provider_neutral_paid_readiness.structural.test.ts
            # Issue #1792 — waiter mode's server hardening. The sharpest case is
            # the metadata MERGE: `update({ metadata: {...} })` replaces the
            # whole jsonb column through PostgREST, and one such line erased the
            # `tab_settlement` marker off the settlement order it had just been
            # written onto — which left the tab stuck at `settling` forever, its
            # rounds stuck at `pending`, the tab permanently unclosable, and a
            # Phase-6 revenue query counting the tab twice.
            supabase/functions/_shared/__tests__/issue_1792_waiter_mode.test.ts
            # Issue #1848 — the order rail's two refusals are two codes. Gate 2
            # (claim not verified) and gate 3 (`ordering_enabled` false) both
            # answered `venue_not_orderable`, whose staff sentence read "This
            # venue isn't verified for ordering." — so a VERIFIED venue whose
            # only problem was an unflipped switch was told it was unverified,
            # and its manager went off to re-do a verification that was already
            # correct while the switch sat one screen away in Orders. Driven
            # through `resolveOrderContext` against a client that really answers
            # both reads, so "gate 2 passed before gate 3 refused" is a fact
            # about the queries rather than a stub's say-so.
            supabase/functions/_shared/__tests__/issue_1848_order_gate_codes.test.ts
            # Issue #1793 (#1767 Phase 4) — the money proofs for the phase in
            # which a guest pays real money: the four lines a guest reads sum to
            # what they are charged, a tip is outside Mingla's fee while a
            # service charge is inside it, a price sent by a client is ignored
            # AND rejected, and the honest paused/off copy has one owner.
            supabase/functions/_shared/__tests__/issue_1793_guest_ordering.test.ts
            # Issue #1793 rework — cancellation resumes the same live provider
            # object and rejects terminal, mismatched, or hostile continuations.
            supabase/functions/_shared/__tests__/issue_1793_payment_continuation.test.ts
            supabase/functions/_shared/__tests__/issue_1793_payment_continuation_tester_adversarial.test.ts
          )
          for attempt in 1 2 3; do
            if deno test --allow-env --allow-net --allow-read --no-check "${DENO_TEST_FILES[@]}"; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Stripe Deno tests failed after 3 attempts (esm.sh flake?)"
              exit 1
            fi
            echo "Stripe Deno tests failed (attempt ${attempt}), retrying in 10s..."
            sleep 10
          done

  notification-deno-tests:
