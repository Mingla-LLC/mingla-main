            supabase/functions/__tests__/orch_1289_stop_footer_wire_preview_parity.tester.test.ts
            # Issue #2218 — A NIGERIAN BUYER'S CONFIRMATION NEVER ARRIVED AND WE
            # RECORDED IT AS `sent`. Nigerian operators refuse Termii's `generic`
            # route 20:00-08:00 WAT (https://developers.termii.com/campaign) and
