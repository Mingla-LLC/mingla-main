# ORCH-1383 — cancel a superseded PR run instead of letting it finish.
# Measured: 28 of 260 July strict-grep runs (10.8%) were superseded before finishing.
# The expression (not a bare `true`) is deliberate: cancelling a `push` to main would
# abandon the post-merge verification run for that commit. Guarding on pull_request
# recovers the PR-side waste while main runs always complete.
concurrency:
  group: ci-supabase-migrations-and-stripe-deno-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  # #2598 — the receipt ledger must stay usable as an answer to "what is
  # applied". A CHECK constraint merged 2026-04-25 never reached production and
  # hid for four months among clerical gaps because nothing distinguished a real
  # gap from an unstamped one, and six colliding version slots meant six
  # migrations could never be represented at all.
  migration-receipt-hygiene:
    name: "Migration receipt hygiene (#2598)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Audit self-test then filename and version hygiene
        run: |
          node scripts/ops/audit-migration-receipts.mjs --self-test
          node --test scripts/ops/__tests__/audit-migration-receipts.issue2598.test.mjs

  migrations:
    name: "Migrations apply cleanly from baseline"
    runs-on: ubuntu-latest
    services:
      postgres:
        # Supabase-flavored Postgres image — includes pg_cron, pgcrypto, pgsodium,
        # plv8, and other extensions the baseline migration requires.
        # Stock postgres:15 doesn't have pg_cron and fails immediately.
        #
        # Image-specific env contract: the supabase/postgres image's internal
        # migrate.sh creates `supabase_admin` (and aux roles) and uses
        # POSTGRES_PASSWORD as supabase_admin's password. We do NOT override
        # POSTGRES_USER (doing so causes `migrate.sh` to fail with
        # `role "supabase_admin" does not exist` per the historical CI runs).
        # We do NOT override POSTGRES_DB either — the supabase image restricts
        # extension creation to the default `postgres` database. The baseline
        # migration's `CREATE EXTENSION` calls fail with "can only create
        # extension in database postgres" otherwise. Run migrations in the
        # default `postgres` DB.
        #
        # Postgres MAJOR version pinning: production is on Postgres 17 (Supabase
        # default since mid-2026). Baseline `20260505000000_baseline_squash_orch_0729.sql`
        # uses PG 16+ syntax (`GRANT MAINTAIN ON …`). Earlier image tag
        # `supabase/postgres:15.8.1.060` rejected MAINTAIN with "unrecognized
        # privilege type". Pin to a 17.x image to match production.
        image: supabase/postgres:17.4.1.075
        env:
          # Issue #2587 — generated per run, never a literal. A secret scanner
          # cannot tell a throwaway CI credential from a real one, and it is not
          # its job to try; 33 sibling workflows already use this exact shape.
          # initdb applies this ONCE at container start, so every consumer below
          # must repeat the identical expression — a literal left behind in one
          # step fails authentication at test time, not at lint time.
          POSTGRES_PASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      # Issue #2587 — the share-capture gate proof runs the real edge-function
      # TypeScript against this job's postgres service, so this job needs a Node
      # that can strip types. 22, not the 20 the strict-grep jobs below pin:
      # `--experimental-strip-types` does not exist on 20.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: "Issue #2724 — Admin approval stays independent from call audit"
        working-directory: mingla-admin
        run: node --test src/__tests__/issue2724_admin_approve_without_call.happy.test.js
      - name: Wait for postgres
        env:
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: |
          for i in {1..90}; do
            if psql -h localhost -U postgres -d postgres -c "SELECT 1" >/dev/null 2>&1; then
              echo "postgres ready"
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not become ready in 90s"
          exit 1
      - name: Apply migrations in timestamp order
        env:
          PGPASSWORD: ${{ format('issue-2587-ci-{0}', github.run_id) }}
        run: |
          set -e
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "::group::Applying $f"
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done
          # Issue #2218 — a Nigerian buyer's confirmation was recorded `sent` and
          # never delivered. The schema half of the fix is `deferred` (a message
          # HELD because Nigerian operators refuse Termii's `generic` route
          # 20:00-08:00 WAT) plus `next_attempt_at`. If the CHECK does not admit
          # `deferred`, the edge function's honest new outcome becomes a runtime
          # constraint violation on a money path — a THROWN dispatch, not a
          # deferred text — so the constraint and the code must ship together and
          # this is what makes "together" checkable. G-1/G-2 EXECUTE the write
          # rather than grepping the constraint text, and G-2 pins that the
          # vocabulary did not become open. F-1/F-2 pin that the reconciliation
          # sweep is actually scheduled: #2168 found a permission with no caller,
          # and a truth-check with no cron entry is the same shape.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2218_ng_sms_embargo_and_delivery_truth.test.sql
          # Issue #1971 — the canonical trip command boundary. Behavioural, not
          # structural: it CREATES a draft through biz_create_trip_draft, patches
          # every graph group, publishes from persisted state, and drives the Ari
          # executor through a real confirmed pending action, because a gate that
          # only proved the functions EXIST would stay green if every caller
          # stopped using them.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1971_trip_lifecycle.implementor.happy.pg17.test.sql
          # Issue #1971 — INDEPENDENT TESTER guard, the opposite axis. The
          # implementor guard above proves the orders trigger does not
          # UNDER-reach (a door sale blocks the delete). This one proves it does
          # not OVER-reach: a BEFORE row trigger on the money table can silently
          # cancel a write by returning NULL, and can block orders belonging to
          # concerts, stays and venues that merely share the table. It also pins
          # the trigger's column scope and its BEFORE-trigger firing order.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1971_trip_order_guard_blast_radius.tester.adversarial.pg17.test.sql
          # Issue #1977 — canonical RSVP draft/guest/contribution owners and
          # the Ari receipt seam. Behavioural against the applied schema.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1977_ari_rsvp_guest_contribution.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1977_ari_rsvp_receipt.implementor.test.sql
          # Issue #1977 — independent tester: contribution refund prepare must
          # bind event_id and refuse cross-event splicing.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1977_rsvp_refund_event_binding.tester.adversarial.pg17.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1387_stay_inventory.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1387_stay_inventory.adversarial.test.sql
          # Issue #1649 — behavioural probe for the normalised place-name claim
          # search. Runs against the REAL applied schema because the whole point
          # is row-level behaviour: does typing "Cafe Kayte" find "Café Kayté".
          # On production the raw substring match split the directory three ways
          # (Cafe 2,157 vs Café 942; "Fish & Chips" 30 vs "Fish and Chips" 14;
          # "katye" -> 0 rows), so a venue could be unfindable to its own owner.
          # B-05/B-06 are the adversarial pair: fuzzy must not become a firehose,
          # and exact-prefix must still outrank fuzzy so pre-1649 results never
          # reorder. B-09 pins the 18-column shape — an earlier draft rebuilt the
          # function from a SUPERSEDED 12-column definition and would have
          # silently deleted the ORCH-1263 presence facts that drive the match
          # card's chips and the claimed/pending block.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1649_normalised_place_name_search.test.sql
          # Issue #1653 — publishing an event must KEEP the pin the wizard
          # collected. business_publish_event_draft promoted title/slug/city/
          # taxonomy and stopped; the theme write even stripped 'locationGeo' as
          # "cached client-side only". Production: 65 events, 16 with a pin, 0
