            # reached a provider FAILS instead of passing over an empty set.
            supabase/functions/_shared/adapters/smsAdapter.issue1529.tester.adversarial.test.ts
            # Issue #1537 — DELIVERY LEDGER PROVIDER TRUTH. notifyV2 stamped
            # `notification_deliveries.provider` from a per-channel constant
            # (`sms: "twilio"`) at every SMS call site regardless of who sent,
            # so every Nigerian text was recorded as Twilio and the table held
            # ZERO `termii` rows — including the #1529 SC-11 kill-switch probe,
            # whose +234 skip was attributed to the American provider. This
            # suite drives the real dispatchV2 against a ledger-capturing fake
            # client and asserts the ROW: an NG send lands `termii` (and only
            # Termii is called), a US send lands `twilio`, the SC-11 skip is
            # attributed to `termii` with zero HTTP, a no_contact skip records
            # the rejected contact and claims no provider, and the returned
            # provider always matches the host actually contacted — so a
            # miswired country→sender branch fails rather than passing on a
            # self-consistent label. Every lookup carries a vacuity guard.
            supabase/functions/__tests__/issue1537_delivery_provider_truth.test.ts
            # Issue #1537 — TESTER ADVERSARIAL. Attacks the three angles the
            # implementor's file explicitly did not cover. (1) REAL DDL: every
            # write is validated against the production schema of
            # notification_deliveries read read-only from gqnoajqerqhnvulmnyvv
            # (the 18-column set, both CHECK constraints, owner_chk, and the
            # partial UNIQUE guest index), so a row Postgres would reject fails
            # here instead of being recorded by a permissive fake. (2) RACE: two
            # guest dispatches are interleaved through a suspended provider call
            # and the audit order proves the competing claim landed INSIDE the
            # send window — one claim, one send, one correctly-labelled row.
            # (3) WEBHOOK: an NG send is driven through the real dispatchV2, and
            # the real handleTermiiStatus is then called with a genuine
            # HMAC-SHA512 callback for the message id the adapter returned —
            # the first time a Termii callback has ever met a `termii`-labelled
            # row, since all 31 production rows say twilio. Also sweeps
            # attribution across all 13 outcomes incl. fail-closed and
            # opted-out, re-proves #1518 (generic, read off the POSTed body)
            # and #1529 (a lying country_code moves neither route nor label),
            # and ADV-17 proves the vacuity guard itself fires on zero matches.
            supabase/functions/__tests__/issue1537_provider_truth.tester.adversarial.test.ts
            # Issue #1537 REWORK (tester P1-1) — the delivery ledger's ONLY live
            # reader. api-health-probe buckets notification_deliveries rows into
            # health tiles, and its provider ladder ended in a bare `: []`, so
            # the `termii` rows #1537 introduced were counted NOWHERE: Nigerian
            # SMS health went from wrong-but-visible to invisible. Registered in
            # THIS job, beside the ledger's writers, deliberately — a change to
            # the provider notifyV2 writes must re-run the test for the code
            # that reads it, which is exactly the coupling that broke here.
            # NOTE: no workflow runs api-health-probe's OTHER six test files at
            # all; they are dark. Raised as a Discovery, not fixed here.
            supabase/functions/api-health-probe/issue1537_delivery_provider_tiles.test.ts
            # Issue #1620 — the probe's verdict function. Five probes computed
            # `ok` from the RESPONSE BODY and then discarded it via
            # `ok ? "healthy" : httpToStatus(res.status)`, and httpToStatus(200)
            # returns "healthy" — so a provider answering HTTP 200 with the
            # failure inside the body was recorded GREEN. Proven in production:
            # google_places logged 500 consecutive status='healthy' rows each
            # carrying google_status='REQUEST_DENIED' (2026-06-22 → 2026-08-05).
            # Paystack is the severe case: {status:false} in a 200 is its ONLY
            # account-restriction signal, on a live NG money rail.
            # T-2 asserts each provider's REAL documented error body, not a
            # synthetic fixture — a `{error:true}` stand-in would pass against a
            # probe that only inspects HTTP and would not have caught this.
            # T-1 sweeps EVERY 2xx because the defect's home was the 2xx
            # fallback, and carries a vacuity guard so emptying the case list
            # fails rather than silently passing over nothing.
            # WIRED HERE DELIBERATELY: the note above records that six sibling
            # test files run in no workflow at all. A regression test for a
            # monitor that could not report failure must not itself be dark.
            supabase/functions/api-health-probe/issue1620_body_verdict.test.ts
            # Issue #1648 — the address-identity endpoint. T-05 is the critical
            # one and the same failure shape as #1620: if a Google outage were
            # reported as "no match", we would tell a venue we DO hold that we
            # have never heard of them, and they would duplicate themselves —
            # the precise harm this endpoint exists to prevent. It must throw.
            # T-06 pins the field mask at `places.id` ONLY: adding any Pro field
            # (displayName et al) silently moves every call off Google's free
            # Essentials tier for data we already hold in our own pool.
            # T-02 keeps junk — null island 0,0 above all — from ever reaching a
            # paid call, since a coordinate-less query degrades into discovery
            # and could match a same-named venue in another city.
            supabase/functions/venue-address-pool-match/index.test.ts
            # Issue #1622 — the thumbnail backfill's SECOND EXIT. Its only exit
            # was `thumbs_backfilled_at IS NOT NULL`, set only when EVERY photo
            # for a place succeeds, so a place holding one permanently dead photo
            # was re-claimed every ~10 minutes forever: 77 places pinned in
            # production against 40,031 completed, 84 wasted runs a day.
            # T-6 is the sharpest test and the reason this is wired: the CPU wall
            # guard abandons places mid-batch, so a CLEAN round must never advance
