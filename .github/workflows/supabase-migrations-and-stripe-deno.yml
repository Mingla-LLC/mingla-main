            supabase/functions/_shared/ngSmsEmbargo.issue2218.test.ts
            supabase/functions/_shared/adapters/smsAdapter.issue2218.test.ts
            supabase/functions/notification-retry-sweeper/issue2218.deferred.test.ts
            # issue #2695 — the sweeper's OWN contract suite, which ran in no lane
            # at all and had therefore been red on main since #2218 moved its
            # constants into `logic.ts`. Nothing was broken; the assertions were
            # reading the wrong file, and nobody was watching. Registered here
