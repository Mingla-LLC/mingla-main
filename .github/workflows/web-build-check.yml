name: Web Build Check

# ORCH-0964: catch web-build breaks BEFORE merge.
#
# mingla-business web is built on Vercel via `expo export -p web`, but that
# build was NOT a blocking PR check — so a parallel ORCH (#237) merged a
# duplicate `EventCoverMedia` import (broke the build) and a duplicate export
# (runtime white-screen), each green in isolation but broken once merged to
# main. The build then failed silently and froze production on a stale bundle.
#
# This job runs the real web export on the PR MERGE result (GitHub Actions
# pull_request checks out PR+base merged), so duplicate imports/exports,
# syntax errors, and merge-combination breaks fail the check instead of
# silently breaking main. Mark it a REQUIRED status check in branch protection.

on:
  pull_request:
    branches: [main]

# ORCH-1383 — cancel a superseded PR run instead of letting it finish.
# Measured: 28 of 260 July strict-grep runs (10.8%) were superseded before finishing.
# The expression (not a bare `true`) is deliberate: cancelling a `push` to main would
# abandon the post-merge verification run for that commit. Guarding on pull_request
# recovers the PR-side waste while main runs always complete.
concurrency:
  group: ci-web-build-check-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  mingla-business-web-build:
    name: "mingla-business: web build (expo export)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: mingla-business
        run: npm install
      - name: Build web bundle (fails on duplicate import/export + syntax errors)
        working-directory: mingla-business
        run: EXPO_PUBLIC_POSTHOG_KEY=phc_issue2771 EXPO_PUBLIC_GA4_MEASUREMENT_ID=G-ISSUE2771 EXPO_PUBLIC_META_PIXEL_ID=issue2771 npx expo export -p web --clear --output-dir dist
      # #2756 — RNW promotes aria-disabled role=button hosts to HTML disabled,
      # so renderer-only assertions cannot prove the busy retry keeps focus.
      # Mount the real production venue screen in Chromium and exercise the DOM.
      - name: Install Chromium for public-venue focus semantics
        working-directory: mingla-business
        run: npx playwright install --with-deps chromium-headless-shell
      - name: "#2756 public venue refresh retry focus semantics"
        working-directory: mingla-business
        run: npx playwright test -c playwright.issue2756.config.ts
      # ORCH-1083: initial-web-bundle budget guard (M-3 / I-PROPOSED-1083-A).
      # Fails if any deferred heavy dep (Stripe Connect web SDK, QR renderer, the
      # 14 theme fonts) reappears in the main entry chunk, the eager __common
      # grows past its cap, or the initial payload exceeds the ceiling.
      - name: ORCH-1083 initial-bundle budget guard
        working-directory: mingla-business
        run: ORCH_1083_WEB_BUILD=dist node scripts/ci/orch-1083-initial-bundle-budget.mjs
      # #1627 [keyboard-guard-vacuity]: the native keyboard library must not be
      # in the web bundle at all. T1 (KeyboardRoot.adversarial.test.tsx, inside
      # the required jest check) asserts the same contract on SOURCE; this is
      # the built-artefact half, and it catches what source cannot — a leak
      # arriving through a transitive node_modules path.
      #
      # It lives HERE, and not in the jest job, on purpose. The reason the
      # original guard was dark for its entire life is that it demanded an
      # artefact nothing produced: it read a gitignored `mingla-business/dist/`
      # while the required jest job runs no export. This job now creates that
      # exact project-contained artifact two steps up, so the assertion costs
      # ~0s and CANNOT
      # skip — if the export failed, the job is already red. There is no skip
      # branch to write. Same hosting choice as the ORCH-1137 proof below.
      - name: "#1627 no native keyboard library in the web bundle"
        run: |
          CHUNK_DIR=mingla-business/dist/_expo/static/js/web
          # Non-empty-input guard FIRST. A moved output path or a partial export
          # would otherwise leave the grep matching nothing and this step green
          # — the identical vacuity bug, relocated. 180 chunks today.
          if [ ! -d "$CHUNK_DIR" ]; then
            echo "#1627 FAIL: chunk directory $CHUNK_DIR does not exist. The export moved, or did not run. This step must never pass without inspecting a real bundle." >&2
            exit 1
          fi
          CHUNKS=$(find "$CHUNK_DIR" -name '*.js' -type f | wc -l | tr -d ' ')
          if [ "$CHUNKS" -lt 100 ]; then
            echo "#1627 FAIL: only $CHUNKS .js chunks under $CHUNK_DIR (expected >= 100; 180 at the time of writing). A partial export cannot be used to certify the bundle clean." >&2
            exit 1
          fi
          # The token list is deliberately LIBRARY-INTERNAL ONLY.
          #
          # `KeyboardProvider` and `KeyboardController` are EXCLUDED on purpose.
          # They are bare identifiers that a legitimate passthrough shim
          # re-exports: with the library completely gone (0 hits for every token
          # below) a build still shows 2 residual `KeyboardProvider` matches,
          # both from #1627's own web shim's export name. Including them would
          # leave a CORRECT fix red, and the obvious way out — renaming the
          # shim's export — buys greenness with no behaviour change and makes
          # this assertion depend on identifier choice rather than on the
          # library's absence. Both directions unfalsifiable. Every token below
          # can only be emitted by the library's own code.
          MATCHES=$(grep -rlE 'react-native-keyboard-controller|keyboardEventsMap|KeyboardControllerView|useReanimatedFocusedInput' "$CHUNK_DIR" || true)
          if [ -n "$MATCHES" ]; then
            echo "#1627 FAIL: react-native-keyboard-controller is present in the exported web bundle." >&2
            echo "Offending chunk(s):" >&2
            for f in $MATCHES; do
              N=$(grep -oE 'react-native-keyboard-controller|keyboardEventsMap|KeyboardControllerView|useReanimatedFocusedInput' "$f" | wc -l | tr -d ' ')
              echo "  $(basename "$f"): $N match(es)" >&2
            done
            echo "" >&2
            echo "This is a NATIVE keyboard library; web uses none of its twelve primitives." >&2
            echo "One named import from the package root drags the whole barrel into __common," >&2
            echo "the eager chunk every guest downloads before ANY route renders — 60,543 B raw /" >&2
            echo "12,751 B gzip / 10,172 B brotli. Import through a platform-resolved wrapper" >&2
            echo "(mingla-business: SmartKeyboardAvoidingView; phone-input: keyboardPrimitives)." >&2
            exit 1
          fi
          echo "#1627 PASS: 0 react-native-keyboard-controller markers across $CHUNKS exported web chunks."
      # ORCH-1137: render-proof (T-7 / I-PROPOSED-1137-BIZ-WEB-LUCIDE-REAL).
      # The biz-web lucide shim renders REAL lucide-react icons. Assert the lucide
      # Plus glyph path signature ("M5 12h14" + "M12 5v14") is present in the
      # exported web JS — it ships only when the real-icon shim is used and
      # VANISHES if the shim is reverted to the () => null null-stub (which blanked
      # every web glyph). This is the build-side fails-on-revert catcher. See
      # SPEC_ORCH-1137 §9.
      - name: ORCH-1137 lucide real-glyph render-proof
        run: |
          if grep -rqF "M5 12h14" mingla-business/dist && grep -rqF "M12 5v14" mingla-business/dist; then
            echo "ORCH-1137 render-proof PASS: lucide Plus glyph path signature present in the exported web bundle."
          else
            echo "ORCH-1137 render-proof FAIL: lucide Plus glyph path signature (M5 12h14 / M12 5v14) NOT found in the exported web bundle. The biz-web lucide shim must render REAL lucide-react icons (no null-stub)." >&2
            exit 1
          fi
      # issue #2729 — the public venue's persistent phone action must stay in
      # the sole native browser scroller's ancestry. The implementor and tester
      # own different real-touch angles; both files are required before merge.
      - name: "#2729 public venue real-touch scroll ownership"
        working-directory: mingla-business
        run: |
          test -f playwright/issue2729/public-venue-scroll-owner.happy.spec.ts
          test -f playwright/issue2729/public-venue-scroll-owner.adversarial.spec.ts
          npx playwright install chromium-headless-shell
          npx playwright test -c playwright.issue2729.config.ts
      # issue #2769 — buyer-web consent and the public venue reservation CTA
      # share one persistent-action edge below 1280 CSS px. The implementor and
      # independent tester own different real-source browser proofs; both files
      # are mandatory before merge, so a missing/reverted leg fails closed.
      - name: "#2769 public venue consent/reserve composition"
        working-directory: mingla-business
        run: |
          test -f playwright/issue2769/consent-reserve-composition.happy.spec.ts
          test -f playwright/issue2769/consent-reserve-composition.adversarial.spec.ts
          npx jest src/analytics/__tests__/issue2769ConsentReserveComposition.happy.test.ts --runInBand
          npx playwright test -c playwright.issue2769.config.ts
      # issue #2771 — the implementation-owned happy path and independent
      # tester-owned adversarial browser oracle must remain co-enforced.
      - name: Install mingla-marketing dependencies for #2771
        working-directory: mingla-marketing
        run: npm ci
      - name: "#2771 no web analytics before explicit grant"
        working-directory: mingla-business
        run: |
          test -f playwright/issue2771-preconsent-analytics.spec.ts
          test -f playwright/issue2771-preconsent-analytics.tester.adversarial.spec.ts
          test -f playwright/issue2795-posthog-alias-consent.spec.ts
          npx playwright test -c playwright.issue2771.config.ts
      # issue #2768 — complement #2729's isolated component proof with the real
      # app-shell consent owner. Fresh state is exclusively consent; visible
      # Reject reveals the CTA, whose named touch must hit-test to that CTA
      # immediately before dispatch.
      - name: "#2768 public venue hit-target fidelity"
        working-directory: mingla-business
        run: |
          test -f playwright/issue2768/public-venue-hit-target-fidelity.happy.spec.ts
          npx playwright test -c playwright.issue2768.config.ts
