name: issue-2160-multiday-multiselect
# issue #2160 [a guest can attend MORE THAN ONE day] + #2161 + #2162 — the
# dedicated PR + push lane.
#
# WHY THIS FILE EXISTS. The repository-wide
# `supabase-migrations-and-stripe-deno.yml` names its Deno test files explicitly
# (it never globs a directory), and no workflow applies the migration chain to a
# PostgreSQL service for the SCAN path — so without this lane the executable
# per-day admission proof would exist in the tree and gate NOTHING.
#
# Path filters err BROAD over the guarded SOURCE trees, not just the tests, so a
# revert of the product re-triggers the lane (the docs-only-CLOSE hazard). They
# deliberately include EVERY migration that has ever defined the four functions
# this issue re-emits: a re-emit silently replaces the function and can drop the
# day ladder, the capacity aggregation or the #2150 exemption while every other
# check stays green.

on:
  pull_request:
    paths: &issue_2160_paths
      - "supabase/migrations/20270420002160_issue_2160_multiday_multiselect.sql"
      - "supabase/migrations/__tests__/issue_2160_*.test.sql"
      # Every prior definer of the four re-emitted functions.
      - "supabase/migrations/20260821000000_orch_1051_scanner_invite_flow.sql"
      - "supabase/migrations/20260528000000_orch_0793_scan_time_window.sql"
      - "supabase/migrations/20261117000001_orch_1188_finalize_persist_event_date_id.sql"
      - "supabase/migrations/20270324001929_issue_1929_hidden_direct_checkout.sql"
      - "supabase/migrations/20270403001930_issue_1930_checkout_current_truth.sql"
      - "supabase/migrations/20270413001931_issue_1931_private_event_access.sql"
      - "supabase/migrations/20270414002101_issue_2101_named_buyer_checkout_access.sql"
      - "supabase/migrations/20270415002117_issue_2117_offering_visibility_gate.sql"
      - "supabase/migrations/20270417002136_issue_2136_free_checkout_finalize_contract.sql"
      - "supabase/migrations/20270419002150_issue_2150_free_resubmit_idempotent.sql"
      - "supabase/functions/ticket-checkout-create/**"
      - "supabase/functions/ticket-confirmation-dispatch/**"
      - "supabase/functions/_shared/ticketCheckout.ts"
      # The buyer-web chain the day set travels down.
      - "mingla-business/src/services/publicEventsService.ts"
      - "mingla-business/src/services/publicEventOccurrencesService.ts"
      - "mingla-business/src/services/ticketCheckoutService.ts"
      - "mingla-business/src/hooks/usePublicEvents.ts"
      - "mingla-business/src/constants/publicUrls.ts"
      - "mingla-business/src/components/event/MultiDateDayChooser.tsx"
      - "mingla-business/src/components/event/PublicEventPage.tsx"
      - "mingla-business/src/components/checkout/CartContext.tsx"
      - "mingla-business/app/checkout/**"
      # The organiser-facing half: the wizard control, the per-day roster and
      # its export. Without the control the pricing column is inert, so these
      # are as load-bearing as the model.
      - "mingla-business/src/components/event/CreatorStep2When.tsx"
      - "mingla-business/src/components/event/EventCreatorWizard.tsx"
      - "mingla-business/src/components/event/FoundationEventPreview.tsx"
      - "mingla-business/src/store/draftEventStore.ts"
      - "mingla-business/src/store/orderStore.ts"
      - "mingla-business/src/services/businessEvents.ts"
      - "mingla-business/src/services/eventOrdersService.ts"
      - "mingla-business/src/utils/guestCsvExport.ts"
      - "mingla-business/app/event/[id]/guests/**"
      - "packages/offering-rendering/EventOfferingBody.tsx"
      - "app-mobile/src/services/calendarService.ts"
      - ".github/scripts/strict-grep/issue-2160-*.mjs"
      - ".github/scripts/strict-grep/orch-0791-checkout-session-never-reused-post-terminal.mjs"
      - ".github/scripts/strict-grep/issue-2150-free-completed-session-returned-not-tombstoned.mjs"
      - ".github/workflows/issue-2160-multiday-multiselect-tests.yml"
      - "docs/INVARIANT_REGISTRY.md"
  push:
    branches: [main]
    paths: *issue_2160_paths
  workflow_dispatch:

concurrency:
  group: ci-issue-2160-multiday-multiselect-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-2160-postgres-admission:
    name: "#2160 PostgreSQL 17 — a pass admits BOTH chosen days and NEITHER other"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # The same Supabase-flavored image the #2101, #2136 and #2150 lanes pin.
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ format('issue-2160-ci-{0}', github.run_id) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      # Wait for the image's OWN bootstrap, not merely for the socket: accepting
      # connections before `vault` / `supabase_admin` exist lets the baseline
      # squash abort on a graphql schema-version race.
      - name: Wait for PostgreSQL 17 bootstrap to complete
        env:
          PGPASSWORD: ${{ format('issue-2160-ci-{0}', github.run_id) }}
        run: |
          for attempt in {1..90}; do
            if psql -h localhost -U postgres -d postgres -Atc \
              "SELECT to_regnamespace('vault') IS NOT NULL AND to_regrole('supabase_admin') IS NOT NULL" \
              2>/dev/null | grep -qx t; then
              exit 0
            fi
            sleep 1
          done
          echo "postgres did not finish bootstrapping in 90s"; exit 1
      - name: Apply migrations in timestamp order
        env:
          PGPASSWORD: ${{ format('issue-2160-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          for f in $(ls supabase/migrations/*.sql | sort); do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$f" >/dev/null
          done
      - name: Match hosted Supabase Auth user shape
        env:
          PGPASSWORD: ${{ format('issue-2160-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS deleted_at timestamptz" \
            -c "ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS is_anonymous boolean DEFAULT false" \
            -c "ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS banned_until timestamptz" \
            -c "ALTER TABLE auth.users ADD COLUMN IF NOT EXISTS confirmed_at timestamptz"
      # H-01..H-07, 46 checks. Runs the REAL create-session, finalize and
      # biz_ticket_scan RPCs and counts real orders, tickets, ticket_event_dates
      # and scan_events rows. Measured fails-on-revert by TRUE LINE DELETION:
      #   * delete the finalize base's entitlement mint (13 lines) -> RED at H-01c
      #   * delete the create-session day persist   ( 9 lines) -> RED at H-01c
      #   * restore the pre-#2160 biz_ticket_scan  (171 lines) -> RED at H-01h
      - name: "A pass admits the days it has rows for, and no others"
        env:
          PGPASSWORD: ${{ format('issue-2160-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_2160_multiday_admission.test.sql
      # U-1..U-6. Exercises the REAL reader against an UNLISTED event. A stubbed
      # transport CANNOT satisfy this, which is exactly why #2161 escaped #2135's
      # suite.
      - name: "#2161 — an UNLISTED event's occurrences travel with the event"
        env:
          PGPASSWORD: ${{ format('issue-2160-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_2160_unlisted_occurrences.test.sql
      # S-1..S-7. The organiser's control, executed. S-2b is the one that
      # matters: the SAME refusal through the RPC and through a direct UPDATE,
      # proving the lock has ONE enforcement site (the trigger) and the setter
      # did not re-implement it.
      - name: "#2160 — the organiser can set the mode, and cannot once a pass exists"
        env:
          PGPASSWORD: ${{ format('issue-2160-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_2160_pricing_mode_setter.test.sql
      # N-1..N-5. THE MONEY CASE: an organiser flipping the pricing mode WHILE A
      # GUEST IS IN CHECKOUT. The lock cannot cover this — it fires on an
      # existing ticket and an in-flight session has none — so the mode is
      # snapshotted onto the session at create and finalize mints under the
      # snapshot. Both directions executed through the shipped RPC, plus the
      # #2150 disclosure COALESCE case.
      - name: "#2160 — a guest is issued under the mode they were QUOTED under"
        env:
          PGPASSWORD: ${{ format('issue-2160-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_2160_pricing_mode_snapshot.test.sql
      # Every suite RE-RUN on the now non-virgin database. A suite that only
      # passes once is not a suite you can trust, and this lane caught exactly
      # that (a fixture seeding a fixed qr_code).
      - name: "Re-run every #2160 suite on a NON-VIRGIN database"
        env:
          PGPASSWORD: ${{ format('issue-2160-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          for f in issue_2160_multiday_admission issue_2160_unlisted_occurrences \
                   issue_2160_pricing_mode_setter issue_2160_pricing_mode_snapshot; do
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
              -f "supabase/migrations/__tests__/$f.test.sql" >/dev/null
          done
      # The neighbours this issue re-emits into must stay green under the change.
      - name: "#2150 suite stays green under the wrapper re-emit"
        env:
          PGPASSWORD: ${{ format('issue-2160-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_2150_free_resubmit_idempotent.test.sql
      - name: "#2136 tester-adversarial suite stays green under the change"
        env:
          PGPASSWORD: ${{ format('issue-2160-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_2136_free_checkout_no_value_arm.tester.adversarial.test.sql

  issue-2160-edge-contract:
    name: "#2160/#2162 Edge — day-aware key, server anchor, chosen-day confirmation"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # K-1 is the one that matters: a no-day cart's key is STRING-EQUAL to the
      # pre-#2160 key, spelled out literally rather than re-derived. Without it,
      # every session in flight at deploy silently re-keys and re-mints.
      - name: "#2160 idempotency-key day segment"
        run: >-
          deno test --allow-env --allow-read --no-check
          supabase/functions/ticket-checkout-create/__tests__/issue_2160_multiday_idempotency_key.test.ts
      # C-1/C-2 assert BOTH halves: the chosen day IS carried AND the master is
      # NOT. C-6 pins the precedence — `masterDate ?? chosenDate` would compile,
      # pass every "a date is present" assertion, and re-ship #2162 verbatim.
      - name: "#2162 the confirmation names the day the guest chose"
        run: >-
          deno test --allow-env --allow-read --no-check
          supabase/functions/ticket-confirmation-dispatch/__tests__/issue_2162_confirmation_names_chosen_day.test.ts
      - name: "sibling ticket-checkout-create suites stay green"
        run: >-
          deno test --allow-env --allow-read --no-check
          supabase/functions/ticket-checkout-create/__tests__/issue_2150_free_resubmit_idempotent.test.ts
          supabase/functions/ticket-checkout-create/__tests__/issue_2136_free_checkout_contract.test.ts
          supabase/functions/ticket-checkout-create/__tests__/issue_2101_named_buyer_access.test.ts
          supabase/functions/ticket-checkout-create/__tests__/orch1072_experience_occurrence_checkout.test.ts
      - run: deno check supabase/functions/ticket-checkout-create/index.ts
      - run: deno check supabase/functions/ticket-confirmation-dispatch/index.ts
      # C-1..C-5. A two-day guest gets TWO calendar entries. Same bug class as
      # #2162, and worse here: orders.event_date_id is the LATEST-ending day, so
      # the un-fixed code showed a both-days guest only day 2.
      - name: "#2160 consumer calendar — one entry per day attended"
        run: >-
          deno test --allow-read --no-check
          app-mobile/src/services/__tests__/issue_2160_calendar_per_day_entries.test.ts
          app-mobile/src/services/__tests__/orch_1188_calendar_url_and_date.test.ts

  issue-2160-client:
    name: "#2160 Client — multi-select, and single-date stays byte-identical"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
      # The #2135 suite is the single-date byte-identity guard and it must stay
      # green THROUGH this change: `router.push` string equality on a single-date
      # event, and `checkoutPublicPathWithSeed` byte-identical with no occurrence.
      - name: "#2135 single-date byte-identity survives multi-select"
        run: npx jest issue_2135 --runInBand
      - name: "#2150 + #2136 client guards stay green"
        run: npx jest issue_2150 issue_2136 --runInBand
      # 28 tests. The wizard control + its verbatim SPEC copy + the lock, the
      # per-day roster filter, the CSV Day column (appended LAST so nothing that
      # parses by position moves), and the guest-facing price qualifier on BOTH
      # phone and desktop.
      - name: "#2160 organiser surfaces — wizard, roster, CSV, price qualifier"
        run: npx jest issue_2160 --runInBand

  issue-2160-strict-grep:
    name: "#2160 Gates — day ladder, capacity aggregation, no direct occurrence read"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node .github/scripts/strict-grep/issue-2160-day-bound-scan.mjs --self-test
      - run: node .github/scripts/strict-grep/issue-2160-day-bound-scan.mjs
      - run: node .github/scripts/strict-grep/issue-2160-capacity-aggregated.mjs --self-test
      - run: node .github/scripts/strict-grep/issue-2160-capacity-aggregated.mjs
      - run: node .github/scripts/strict-grep/issue-2160-occurrences-not-read-directly.mjs --self-test
      - run: node .github/scripts/strict-grep/issue-2160-occurrences-not-read-directly.mjs
      # BOTH #2150 gates read the LATEST migration defining the create-session
      # wrapper, which after this change is #2160's. They are re-run here on the
      # paths that can break them so the failure is attributable.
      - run: node .github/scripts/strict-grep/orch-0791-checkout-session-never-reused-post-terminal.mjs --self-test
      - run: node .github/scripts/strict-grep/orch-0791-checkout-session-never-reused-post-terminal.mjs
      - run: node .github/scripts/strict-grep/issue-2150-free-completed-session-returned-not-tombstoned.mjs --self-test
      - run: node .github/scripts/strict-grep/issue-2150-free-completed-session-returned-not-tombstoned.mjs
      # The experience checkout is frozen: CartContext.eventDateId and the
      # top-level eventDateId body field were ADDED ALONGSIDE, never renamed.
      - run: node .github/scripts/strict-grep/orch-1138-experience-checkout-byte-identical.mjs
      # #2160 changes WHICH occurrence's end the consumer calendar reads, never
      # that it reads an end.
      - run: node .github/scripts/strict-grep/i-consumer-calendar-uses-end-not-start.mjs
