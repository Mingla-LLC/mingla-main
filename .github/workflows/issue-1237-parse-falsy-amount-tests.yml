name: "#1237 Paystack transfer-cost parse — falsy-amount fallback"

# Pre-flip fast-follow of #1013 / fold-in of #1218. Guards the #1237 fix in
# parsePaystackTransferCost (supabase/functions/payout-release-sweep/engine.ts):
# a fees_breakdown row whose amount is a falsy-but-absent value (null / "" /
# false / 0) must NOT be coerced by Number(...) into a real 0-cost line that
# flips the saw-numeric gate and returns a spurious {0,0}, masking the combined
# fee_charged. The parser must fall back to fee_charged instead.
#
# Fails-on-revert verified: deleting the presence/typeof gate (restoring
# `const amount = Number(row.amount); if (!Number.isInteger(amount) ||
# amount < 0) continue;`) makes the null/""/false/0 cases coerce to a real 0
# line and return {0,0} → the first test in the suite fails.
#
# House pattern: pinned Deno, EXPLICIT file (never a glob), path-triggered on the
# guarded SOURCE + the test + this workflow. Pure-TS parser test — no database.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/payout-release-sweep/engine.ts"
      - "supabase/functions/payout-release-sweep/__tests__/issue_1237_parse_falsy_amount_fallback.test.ts"
      - ".github/workflows/issue-1237-parse-falsy-amount-tests.yml"
  pull_request:
    paths:
      - "supabase/functions/payout-release-sweep/engine.ts"
      - "supabase/functions/payout-release-sweep/__tests__/issue_1237_parse_falsy_amount_fallback.test.ts"
      - ".github/workflows/issue-1237-parse-falsy-amount-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-1237-parse-falsy-amount:
    name: "#1237 parse falsy-amount fallback (never spurious {0,0})"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - name: Run the #1237 falsy-amount fallback regression suite
        run: |
          deno test --allow-read --allow-env --allow-net --no-check \
            supabase/functions/payout-release-sweep/__tests__/issue_1237_parse_falsy_amount_fallback.test.ts
