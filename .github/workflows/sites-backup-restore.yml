name: "Mingla Sites · Backup and restore"

# #2893 activates #2830's production recovery boundary. Production credentials
# exist only in the protected environment and are never available to pull requests.
#
# [WORKFLOW-MOD-APPROVED #3606] Recovery freshness is no longer refilled by one
# drifting daily dispatch, and lateness is no longer invisible.
#
# Measured before #3606: the nominal 07:23Z schedule was dispatched between
# 11:56Z and 13:06Z over ten consecutive days — 4.5 to 5.7 hours late and
# trending later — while the public runtime resolver re-checks recovery evidence
# on EVERY page request against a 26-hour budget. On 2026-09-28 the live pilot
# host came within 47 minutes of returning 404 on every route and nothing fired,
# because `deactivate` and `alert` below only trigger when a run FAILS. A run
# that is hours late, or that never starts, produces no failure.
#
# Two structural changes, both deliberately in the fail-closed direction:
#   1. A second daily backup cron, 12 hours from the first, so no single
#      dispatch is load-bearing for public availability.
#   2. An hourly `recovery_freshness` watchdog that reports remaining headroom
#      and pages BEFORE the budget runs out.
#
# The watchdog shares this workflow because `.github/workflows/` additions are
# gated by I-PROPOSED-2148-CI-TOPOLOGY-BOUNDED; it is routed by cron identity.
# The routing polarity is EXCLUSION, never inclusion: every job with a
# production side effect asks "is this NOT the watchdog cron?", so a routing
# expression that stops matching re-arms the side effect instead of silently
# disabling it. `issue_3606_recovery_freshness.*.test.mjs` pins the cron literal
# and every exclusion to the same string, so changing one without the other is
# a red contract run, not a live surprise.
on:
  schedule:
    - cron: "23 7 * * *"
    - cron: "23 19 * * *"
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "backup = take and verify a snapshot; freshness-check = watchdog only"
        type: choice
        default: backup
        options:
          - backup
          - freshness-check
  pull_request:
    paths:
      - ".github/workflows/sites-backup-restore.yml"
      - "scripts/sites/**"

permissions:
  contents: read

# [WORKFLOW-MOD-APPROVED #2241] PR contract runs cancel only an obsolete
# generation of the same PR; schedule/dispatch production runs stay unique
# and non-cancellable so backup/restore work cannot pending-displace.
concurrency:
  group: ci-sites-backup-restore-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  contracts:
    name: "Sites recovery contracts"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: >-
          node --test
          scripts/sites/__tests__/issue_2893_sites_ops.implementor.test.mjs
          scripts/sites/__tests__/issue_2893_gogi_activation.test.mjs
          scripts/sites/__tests__/issue_2893_sites_ops.tester.adversarial.test.mjs
          scripts/sites/__tests__/issue_3154_abandoned_upload_grants.tester.adversarial.test.mjs
          scripts/sites/__tests__/issue_2948_backup_window_absent.test.mjs
          scripts/sites/__tests__/issue_2948_readback_wiring.test.mjs
          scripts/sites/__tests__/issue_3606_recovery_freshness.implementor.test.mjs
          scripts/sites/__tests__/issue_3606_recovery_freshness.tester.adversarial.test.mjs

  backup_restore:
    name: "Private backup and isolated restore"
    needs: contracts
    # #3606 — the hourly watchdog cron must never take a snapshot. Exclusion, not
    # inclusion: an expression that stops matching runs the backup anyway.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.event.schedule != '37 * * * *' &&
      github.event.inputs.mode != 'freshness-check'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mingla-sites-production
    services:
      restore-postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_PASSWORD: sites-restore-ephemeral-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Expose pinned PostgreSQL 17 clients
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/sites-pg17-bin" "$RUNNER_TEMP/sites-backup"
          for client in pg_dump pg_restore psql; do
            ln -s "$GITHUB_WORKSPACE/scripts/sites/pg17-client.sh" \
              "$RUNNER_TEMP/sites-pg17-bin/$client"
          done
          echo "$RUNNER_TEMP/sites-pg17-bin" >> "$GITHUB_PATH"

      - name: Create encrypted database and four-bucket snapshot
        env:
          SITES_CMS_DATABASE_URL: ${{ secrets.SITES_CMS_MIGRATOR_DATABASE_URL }}
          SITES_CMS_PROJECT_REF: ${{ vars.SITES_CMS_PROJECT_REF }}
          SUPABASE_MANAGEMENT_TOKEN: ${{ secrets.SUPABASE_MANAGEMENT_TOKEN }}
          SITES_PILOT_SITE_ID: ${{ vars.SITES_PILOT_SITE_ID }}
          SUPABASE_S3_ENDPOINT: ${{ vars.SUPABASE_S3_ENDPOINT }}
          SUPABASE_S3_REGION: ${{ vars.SUPABASE_S3_REGION }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
          SITES_BACKUP_ENCRYPTION_KEY_B64: ${{ secrets.SITES_BACKUP_ENCRYPTION_KEY_B64 }}
          SITES_CORE_BASE_URL: ${{ vars.SITES_CORE_BASE_URL }}
          MINGLA_CMS_TO_CORE_CURRENT_KID: ${{ vars.MINGLA_CMS_TO_CORE_CURRENT_KID }}
          MINGLA_CMS_TO_CORE_CURRENT_KEY_B64: ${{ secrets.MINGLA_CMS_TO_CORE_CURRENT_KEY_B64 }}
          SITES_BACKUP_OUTPUT_DIR: ${{ runner.temp }}/sites-backup
          SITES_BACKUP_RESULT_PATH: ${{ runner.temp }}/sites-backup/result.json
          SITES_PG17_MOUNT_ROOT: ${{ runner.temp }}
        run: node scripts/sites/backup-sites-cms.mjs create

      - name: Read safe immutable bundle coordinates
        id: bundle
        env:
          SITES_BACKUP_RESULT_PATH: ${{ runner.temp }}/sites-backup/result.json
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from "node:fs";
          const value = JSON.parse(readFileSync(process.env.SITES_BACKUP_RESULT_PATH, "utf8"));
          if (!/^mingla-sites-[0-9a-f-]{36}-[0-9TZ]+-[0-9a-f]{64}\.msbk$/.test(value.bundle_name)) process.exit(1);
          if (!/^[0-9a-f]{64}$/.test(value.bundle_sha256)) process.exit(1);
          appendFileSync(process.env.GITHUB_OUTPUT, `name=${value.bundle_name}\nsha256=${value.bundle_sha256}\n`);
          NODE

      - name: Upload immutable encrypted bundle to private Blob
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.SITES_BACKUP_BLOB_READ_WRITE_TOKEN }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          # HTTP parity contract: vercel@53.2.0 --access private --allow-overwrite false
          node scripts/sites/vercel-blob-http-transport.mjs put \
            "$RUNNER_TEMP/sites-backup/$BUNDLE_NAME" \
            "recovery/sites/$BUNDLE_NAME" \
            "$RUNNER_TEMP/sites-backup/blob-upload.json"

      - name: Download and verify latest private bundle
        id: readback
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.SITES_BACKUP_BLOB_READ_WRITE_TOKEN }}
          BUNDLE_NAME: ${{ steps.bundle.outputs.name }}
          EXPECTED_SHA256: ${{ steps.bundle.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          readback="$RUNNER_TEMP/sites-backup/private-readback.msbk"
          # HTTP parity contract: vercel@53.2.0 --access private
          node scripts/sites/vercel-blob-http-transport.mjs get \
            "recovery/sites/$BUNDLE_NAME" \
            "$readback" \
            "$RUNNER_TEMP/sites-backup/blob-upload.json"
          actual_sha256="$(sha256sum "$readback" | cut -d ' ' -f 1)"
          if [ "$actual_sha256" != "$EXPECTED_SHA256" ]; then
            echo "SITES_BLOB_ERROR code=PRIVATE_READBACK_DIGEST_MISMATCH" >&2
            exit 1
          fi
          echo "verified_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Restore latest bundle into isolated PostgreSQL 17
        env:
          SITES_BACKUP_BUNDLE_PATH: ${{ runner.temp }}/sites-backup/private-readback.msbk
          SITES_BACKUP_RESTORE_RESULT_PATH: ${{ runner.temp }}/sites-backup/restore-result.json
          SITES_RESTORE_DATABASE_URL: postgresql://postgres:sites-restore-ephemeral-only@127.0.0.1:5432/postgres?sslmode=disable
          SITES_PILOT_SITE_ID: ${{ vars.SITES_PILOT_SITE_ID }}
          SITES_BACKUP_ENCRYPTION_KEY_B64: ${{ secrets.SITES_BACKUP_ENCRYPTION_KEY_B64 }}
          SITES_CORE_BASE_URL: ${{ vars.SITES_CORE_BASE_URL }}
          MINGLA_CMS_TO_CORE_CURRENT_KID: ${{ vars.MINGLA_CMS_TO_CORE_CURRENT_KID }}
          MINGLA_CMS_TO_CORE_CURRENT_KEY_B64: ${{ secrets.MINGLA_CMS_TO_CORE_CURRENT_KEY_B64 }}
          SITES_PG17_MOUNT_ROOT: ${{ runner.temp }}
        run: node scripts/sites/restore-sites-cms.mjs

      - name: Commit readiness only after private readback and restore
        env:
          SITES_BACKUP_RESULT_PATH: ${{ runner.temp }}/sites-backup/result.json
          SITES_BACKUP_RESTORE_RESULT_PATH: ${{ runner.temp }}/sites-backup/restore-result.json
          SITES_BACKUP_BLOB_PATHNAME: recovery/sites/${{ steps.bundle.outputs.name }}
          SITES_BACKUP_INDEPENDENT_READBACK_SHA256: ${{ steps.bundle.outputs.sha256 }}
          SITES_BACKUP_UPLOAD_VERIFIED_AT: ${{ steps.readback.outputs.verified_at }}
          SITES_PILOT_SITE_ID: ${{ vars.SITES_PILOT_SITE_ID }}
          SITES_CORE_BASE_URL: ${{ vars.SITES_CORE_BASE_URL }}
          MINGLA_CMS_TO_CORE_CURRENT_KID: ${{ vars.MINGLA_CMS_TO_CORE_CURRENT_KID }}
          MINGLA_CMS_TO_CORE_CURRENT_KEY_B64: ${{ secrets.MINGLA_CMS_TO_CORE_CURRENT_KEY_B64 }}
        run: node scripts/sites/backup-sites-cms.mjs record-evidence

      - name: Run signed tenant-scoped retention after the verified snapshot
        env:
          SITES_PILOT_SITE_ID: ${{ vars.SITES_PILOT_SITE_ID }}
          SITES_CMS_ORIGIN: https://studio.sites.usemingla.com
          MINGLA_CORE_TO_CMS_CURRENT_KID: ${{ vars.MINGLA_CORE_TO_CMS_CURRENT_KID }}
          MINGLA_CORE_TO_CMS_CURRENT_KEY_B64: ${{ secrets.MINGLA_CORE_TO_CMS_CURRENT_KEY_B64 }}
        run: node scripts/sites/run-sites-retention.mjs

  deactivate:
    name: "Fail-closed pilot deactivation"
    needs: [contracts, backup_restore]
    # Any scheduled/main run that does not finish the production backup and
    # restore successfully is signed-deactivated before the safe alert. This
    # includes a skipped backup_restore job caused by a contract failure.
    #
    # #3606 — the watchdog cron deliberately skips backup_restore, which would
    # otherwise read as "did not finish successfully" and deactivate the pilot
    # every hour. Only that exact routing is excused; every other skip still
    # deactivates, so a contract failure is unchanged.
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.event.schedule != '37 * * * *' &&
      github.event.inputs.mode != 'freshness-check' &&
      needs.backup_restore.result != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: mingla-sites-production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Signed idempotent service-only deactivation
        env:
          SITES_PILOT_SITE_ID: ${{ vars.SITES_PILOT_SITE_ID }}
          SITES_CORE_BASE_URL: ${{ vars.SITES_CORE_BASE_URL }}
          MINGLA_CMS_TO_CORE_CURRENT_KID: ${{ vars.MINGLA_CMS_TO_CORE_CURRENT_KID }}
          MINGLA_CMS_TO_CORE_CURRENT_KEY_B64: ${{ secrets.MINGLA_CMS_TO_CORE_CURRENT_KEY_B64 }}
        run: node scripts/sites/backup-sites-cms.mjs deactivate

  alert:
    name: "Safe recovery failure alert"
    needs: [contracts, backup_restore, deactivate]
    # #3606 — same watchdog-cron exclusion as `deactivate`, for the same reason.
    if: >-
      always() &&
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.event.schedule != '37 * * * *' &&
      github.event.inputs.mode != 'freshness-check' &&
      (needs.contracts.result != 'success' ||
      needs.backup_restore.result != 'success' ||
      needs.deactivate.result == 'failure')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Comment safe code and run URL on #2830
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          body="SITES_BACKUP_ALERT error_code=SITES_BACKUP_OR_RESTORE_FAILED run_url=${run_url}"
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/2830/comments" \
            -f body="$body" >/dev/null

  recovery_freshness:
    name: "Recovery freshness watchdog"
    # #3606 criterion 3 — alert on LATENESS, not only on failure. This job asks
    # how much of the resolver's 26-hour budget is left and pages before it runs
    # out, so a run that never starts can no longer take the public site down in
    # silence. It reads only this repository's own Actions history: no production
    # credentials, no database, no signing keys, so it is safe to run hourly.
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      (github.event.schedule == '37 * * * *' ||
      github.event.inputs.mode == 'freshness-check')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Report remaining recovery headroom and page on lateness
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sites/check-recovery-freshness.mjs
