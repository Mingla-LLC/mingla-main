name: "Issue #2399 Multi-day picker ticket box"

on:
  pull_request:
    paths:
      - "mingla-business/app/e/[brandSlug]/[eventSlug].tsx"
      - "mingla-business/src/components/event/PublicEventPage.tsx"
      - "mingla-business/src/components/event/FoundationEventPreview.tsx"
      - "mingla-business/src/components/event/MultiDateDayChooser.tsx"
      - "mingla-business/src/components/event/__tests__/issue_2399_multiday_picker_ticket_box.happy.test.tsx"
      - "mingla-business/src/services/publicEventsService.ts"
      - "mingla-business/src/utils/publicEventOccurrenceTruth.ts"
      - "packages/offering-rendering/EventOfferingBody.tsx"
      - "docs/INVARIANT_REGISTRY.md"
      - ".github/scripts/strict-grep/issue-2399-multiday-picker-ticket-box.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-2399-multiday-picker-ticket-box.yml"
  push:
    branches: [main]
    paths:
      - "mingla-business/app/e/[brandSlug]/[eventSlug].tsx"
      - "mingla-business/src/components/event/PublicEventPage.tsx"
      - "mingla-business/src/components/event/FoundationEventPreview.tsx"
      - "mingla-business/src/components/event/MultiDateDayChooser.tsx"
      - "mingla-business/src/components/event/__tests__/issue_2399_multiday_picker_ticket_box.happy.test.tsx"
      - "mingla-business/src/services/publicEventsService.ts"
      - "mingla-business/src/utils/publicEventOccurrenceTruth.ts"
      - "packages/offering-rendering/EventOfferingBody.tsx"
      - "docs/INVARIANT_REGISTRY.md"
      - ".github/scripts/strict-grep/issue-2399-multiday-picker-ticket-box.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-2399-multiday-picker-ticket-box.yml"

permissions:
  contents: read

jobs:
  buyer-web-multiday-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci
        working-directory: mingla-business
      - name: Buyer web desktop, mobile, preview, totals, and single-day preservation
        working-directory: mingla-business
        run: >-
          npx jest --runInBand
          src/components/event/__tests__/issue_2399_multiday_picker_ticket_box.happy.test.tsx
          src/components/event/__tests__/issue_2209_public_page_shows_the_days.test.tsx
          src/components/event/__tests__/issue_2135_multidate_public_day_picker.test.tsx
          src/components/event/__tests__/PublicEventPage.issue2101.test.tsx
          src/utils/__tests__/issue_2160_roster_and_wizard.test.tsx
      - run: node .github/scripts/strict-grep/issue-2399-multiday-picker-ticket-box.mjs --self-test
      - run: node .github/scripts/strict-grep/issue-2399-multiday-picker-ticket-box.mjs
