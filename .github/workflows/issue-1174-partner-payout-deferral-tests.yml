name: "#1174 Partner Payout Deferral Tests"

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/_shared/partnerSplits.ts"
      - "supabase/functions/_shared/paystackPartnerSplits.ts"
      - "supabase/functions/payout-release-sweep/**"
      - ".github/workflows/issue-1174-partner-payout-deferral-tests.yml"
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/_shared/partnerSplits.ts"
      - "supabase/functions/_shared/paystackPartnerSplits.ts"
      - "supabase/functions/payout-release-sweep/**"
      - ".github/workflows/issue-1174-partner-payout-deferral-tests.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-1174-partner-payout-deferral:
    name: "#1174 partner payout deferral"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - name: Apply every migration to clean PostgreSQL 17
        run: |
          database_password="issue-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --name issue1174-postgres \
            -e POSTGRES_PASSWORD="$database_password" \
            -d supabase/postgres:17.4.1.075
          for attempt in {1..90}; do
            state="$(docker inspect --format \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' \
              issue1174-postgres)"
            if [ "$state" = "healthy" ]; then
              break
            fi
            sleep 1
          done
          for migration_file in supabase/migrations/*.sql; do
            docker exec -i issue1174-postgres \
              psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
              < "$migration_file"
          done
      - name: Run partner deferral behavior regression
        run: |
          deno test --allow-read --allow-env --no-check \
            supabase/functions/payout-release-sweep/__tests__/issue_1174_partner_deferral.test.ts \
            supabase/functions/payout-release-sweep/__tests__/issue_1174_atomic_ledger_commit_boundary.test.ts \
            supabase/functions/_shared/__tests__/orch_1054_partner_splits_happy.test.ts
      - name: Run tester late-partner-ledger adversarial regression
        run: |
          docker exec -i issue1174-postgres \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/functions/payout-release-sweep/__tests__/issue_1174_partner_late_ledger_adversarial.sql
      - name: Run atomic provider-sale outcome regression
        run: |
          docker exec -i issue1174-postgres \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/functions/payout-release-sweep/__tests__/issue_1174_atomic_partner_outcome.sql
      - name: Run atomic ledger-commit boundary regression
        run: |
          docker exec -i issue1174-postgres \
            psql -v ON_ERROR_STOP=1 -U postgres -d postgres \
            < supabase/functions/payout-release-sweep/__tests__/issue_1174_atomic_ledger_commit_boundary.sql
      - name: Run tester two-session atomic visibility regression
        run: |
          bash \
            supabase/functions/payout-release-sweep/__tests__/issue_1174_atomic_visibility_race_adversarial.sh \
            issue1174-postgres
      - name: Remove disposable database
        if: always()
        run: docker rm -f issue1174-postgres || true
