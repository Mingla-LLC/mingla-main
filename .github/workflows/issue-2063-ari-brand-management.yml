  push:
    branches: [main]
    paths:
      - "supabase/migrations/20270507002063_issue_2063_ari_brand_management.sql"
      - "supabase/migrations/__tests__/issue_2063_ari_brand_management.pg17.test.sql"
      # issue #2592 — the repaired #1975 reservation version contract and the
      # #1978 certification denominator both need the FULL migration replay this
      # job already performs, so they run here rather than in a new lane
      # (I-PROPOSED-2148-CI-TOPOLOGY-BOUNDED).
      - "supabase/migrations/20270512001975_issue_1975_ari_stays_reservations.sql"
      - "supabase/migrations/20270521001978_issue_1978_ari_venue_listings_certification.sql"
