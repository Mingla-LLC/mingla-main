      - "supabase/functions/_shared/agentTools.ts"
      - "supabase/functions/_shared/agentSystemPrompt.ts"
      - "supabase/functions/agent-chat/index.ts"
      - "supabase/functions/agent-confirm-action/index.ts"
      - "supabase/functions/_shared/__tests__/issue_2063_ari_brand_management.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2063_ari_brand_management.tester-adversarial.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2063_ari_brand_receipt_binding.tester-adversarial.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2063_brand_hours_proposal_canonicalization.implementor.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2019_agent_authorization.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2019_agent_authorization.tester-adversarial.test.ts"
      - "mingla-business/src/components/ari/ToolProposalCard.tsx"
      - "mingla-business/src/components/ari/ToolEditForm.tsx"
      - "mingla-business/src/components/ari/toolProposalTypes.ts"
      - "mingla-business/src/hooks/useConfirmPendingAction.ts"
      - "mingla-business/src/screens/ari/AriChatScreen.tsx"
      - "mingla-business/src/components/ari/__tests__/issue_2063_brand_confirmation_recovery.test.ts"
      - "docs/contracts/ari-capability-ledger.json"
      - "docs/INVARIANT_REGISTRY.md"
      - ".github/scripts/strict-grep/issue-2063-ari-brand-management.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-2063-ari-brand-management.yml"

permissions:
  contents: read

concurrency:
  group: ci-issue-2063-ari-brand-management-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-2063-contracts:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: "1.46.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Brand executors and inherited authorization contracts
        run: >-
          deno test --allow-read
          supabase/functions/_shared/__tests__/issue_2063_ari_brand_management.test.ts
          supabase/functions/_shared/__tests__/issue_2063_ari_brand_management.tester-adversarial.test.ts
          supabase/functions/_shared/__tests__/issue_2063_ari_brand_receipt_binding.tester-adversarial.test.ts
          supabase/functions/_shared/__tests__/issue_2063_brand_hours_proposal_canonicalization.implementor.test.ts
          supabase/functions/_shared/__tests__/issue_2019_agent_authorization.test.ts
          supabase/functions/_shared/__tests__/issue_2019_agent_authorization.tester-adversarial.test.ts
      # issue #2592 — the shipped status mapping, executed. Follows the #2009
      # precedent: importing the handler needs net/env, and the ToolError code is
      # taken off the real executor rather than typed by hand.
      - name: "#2592 a stale reservation version is a 409 conflict, not a 500"
        run: >-
          deno test --no-check --allow-env --allow-net --allow-read
          supabase/functions/agent-confirm-action/__tests__/issue_2592_version_conflict_status.test.ts
      - name: Shared chat and confirmation typecheck
        run: >-
          deno check
          supabase/functions/_shared/agentTools.ts
          supabase/functions/agent-chat/index.ts
          supabase/functions/agent-confirm-action/index.ts
      - name: Capability ledger and fail-on-revert gate
        run: |
          node .github/scripts/strict-grep/issue-2000-ari-capability-ledger.mjs
          node .github/scripts/strict-grep/issue-2063-ari-brand-management.mjs --self-test
          node .github/scripts/strict-grep/issue-2063-ari-brand-management.mjs

  issue-2063-business-parity:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
        working-directory: mingla-business
      - name: Shared web, iOS, and Android brand proposal contract
        working-directory: mingla-business
        run: >-
          npx jest --runInBand
          src/components/ari/__tests__/issue_2063_brand_confirmation_recovery.test.ts
          src/components/ari/__tests__/orch_1103_ari_brand_crud_ui.test.ts
          src/components/ari/__tests__/orch_1103_rework3_create_attach_lifecycle.test.ts

  issue-2063-postgres:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ github.run_id }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10 --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Full migration replay and executable brand matrix
        env:
          PGPASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            if pg_isready -h localhost -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 \
            | sort -z \
            | while IFS= read -r -d '' migration; do
                psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
              done
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2063_ari_brand_management.pg17.test.sql
      # issue #2592. Runs LAST: the reservation contract deliberately drops and
      # re-adds `reservations_version_positive` through a real re-application of
      # the #1975 migration, so it must not precede another suite's assertions.
      - name: "#2592/#2060 Ari certification set-digest and reservation version contract"
        env:
          PGPASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2592_ari_cert_denominator.implementor.pg17.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2592_ari_cert_begin_run_digest.implementor.pg17.test.sql
          # issue #2060 Pass-5 — set-digest contract (same full-replay lane; I-PROPOSED-2148).
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2060_ari_cert_requirements_set_digest.implementor.pg17.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2060_ari_cert_requirements_set_digest.tester.adversarial.pg17.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2592_reservation_version_contract.test.sql
          # issue #2592 TESTER adversarial. Runs LAST: it plants a decoy relation named
          # `reservations` in the `private` schema and re-applies the #1975 migration, so
          # it must not precede another suite's assertions. It drops the decoy itself.
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2592_reservation_version_race.tester.adversarial.pg17.test.sql
