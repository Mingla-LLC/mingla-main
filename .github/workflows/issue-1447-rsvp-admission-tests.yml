name: Issue 1447 RSVP admission tests

on:
  push:
    branches: [main]
    paths:
      - "packages/offering-rendering/**"
      - "app-mobile/src/components/activity/RsvpPassSheet.tsx"
      - "app-mobile/src/screens/Event/ConsumerEventDetailScreen.tsx"
      - "app-mobile/src/services/rsvpDeckService.ts"
      - "mingla-business/app/rsvp/**"
      - "mingla-business/app/(tabs)/home.tsx"
      - "mingla-business/src/components/home/LiveOfferingCard.tsx"
      - "mingla-business/src/components/rsvp/RsvpGuestConsole.tsx"
      - "mingla-business/src/components/rsvp/RsvpAdmissionScanner*.tsx"
      - "mingla-business/src/components/scanners/ScannerHome.tsx"
      - "mingla-business/src/services/rsvpApprovals.ts"
      - "mingla-business/src/services/rsvpEvents.ts"
      - "mingla-business/src/services/rsvpPassRecoveryService.ts"
      - "mingla-business/src/services/homeRsvpSummaryService.ts"
      - "mingla-business/src/services/scanRsvpService.ts"
      - "supabase/functions/public-submit-rsvp/**"
      - "supabase/functions/rsvp-notify/**"
      - "supabase/functions/scan-rsvp/**"
      - "supabase/functions/rsvp-pass-fetch/**"
      - "supabase/functions/_shared/notifyV2.ts"
      - "supabase/functions/_shared/push-utils.ts"
      - "supabase/functions/_shared/adapters/pushAdapter.ts"
      - "supabase/functions/_shared/rsvpPass.ts"
      - "supabase/migrations/*1447*rsvp*admission*.sql"
      - "supabase/migrations/__tests__/issue_1447_rsvp_admission.test.ts"
      - "supabase/migrations/__tests__/issue_1447_rsvp_admission.pg17.test.sql"
      - ".github/scripts/strict-grep/issue-1447-rsvp-admission.mjs"
      - ".github/workflows/issue-1447-rsvp-admission-tests.yml"
  pull_request:
    paths:
      - "packages/offering-rendering/**"
      - "app-mobile/src/components/activity/RsvpPassSheet.tsx"
      - "app-mobile/src/screens/Event/ConsumerEventDetailScreen.tsx"
      - "app-mobile/src/services/rsvpDeckService.ts"
      - "mingla-business/app/rsvp/**"
      - "mingla-business/app/(tabs)/home.tsx"
      - "mingla-business/src/components/home/LiveOfferingCard.tsx"
      - "mingla-business/src/components/rsvp/RsvpGuestConsole.tsx"
      - "mingla-business/src/components/rsvp/RsvpAdmissionScanner*.tsx"
      - "mingla-business/src/components/scanners/ScannerHome.tsx"
      - "mingla-business/src/services/rsvpApprovals.ts"
      - "mingla-business/src/services/rsvpEvents.ts"
      - "mingla-business/src/services/rsvpPassRecoveryService.ts"
      - "mingla-business/src/services/homeRsvpSummaryService.ts"
      - "mingla-business/src/services/scanRsvpService.ts"
      - "supabase/functions/public-submit-rsvp/**"
      - "supabase/functions/rsvp-notify/**"
      - "supabase/functions/scan-rsvp/**"
      - "supabase/functions/rsvp-pass-fetch/**"
      - "supabase/functions/_shared/notifyV2.ts"
      - "supabase/functions/_shared/push-utils.ts"
      - "supabase/functions/_shared/adapters/pushAdapter.ts"
      - "supabase/functions/_shared/rsvpPass.ts"
      - "supabase/migrations/*1447*rsvp*admission*.sql"
      - "supabase/migrations/__tests__/issue_1447_rsvp_admission.test.ts"
      - "supabase/migrations/__tests__/issue_1447_rsvp_admission.pg17.test.sql"
      - ".github/scripts/strict-grep/issue-1447-rsvp-admission.mjs"
      - ".github/workflows/issue-1447-rsvp-admission-tests.yml"

permissions:
  contents: read

concurrency:
  group: ci-issue-1447-rsvp-admission-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-1447-rsvp-admission:
    name: "#1447 RSVP admission, recovery, and delivery"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - name: Prove the guard fails on source reversion
        run: node .github/scripts/strict-grep/issue-1447-rsvp-admission.mjs --self-test
      - name: Enforce the complete RSVP admission surface
        run: node .github/scripts/strict-grep/issue-1447-rsvp-admission.mjs
      - name: Run the implementor happy-path regression
        run: deno test --allow-read supabase/migrations/__tests__/issue_1447_rsvp_admission.test.ts
      - name: Run the independent pass-boundary adversarial regression
        run: deno test --allow-read supabase/functions/rsvp-pass-fetch/__tests__/issue_1447_pass_boundary.tester_adversarial.test.ts
      - name: Prove SMS and push crash-window safety
        run: deno test --allow-read supabase/functions/rsvp-notify/__tests__/issue_1447_delivery_crash_window.test.ts
      - name: Type-check issue Edge Functions
        run: >-
          deno check
          supabase/functions/scan-rsvp/index.ts
          supabase/functions/rsvp-pass-fetch/index.ts
          supabase/functions/rsvp-notify/index.ts
          supabase/functions/public-submit-rsvp/index.ts

  issue-1447-pg17:
    name: "#1447 fresh PostgreSQL 17 RSVP state machine"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ format('issue-1447-ci-{0}', github.run_id) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PostgreSQL 17
        env:
          PGPASSWORD: ${{ format('issue-1447-ci-{0}', github.run_id) }}
        run: |
          for attempt in {1..90}; do
            if psql -h localhost -U postgres -d postgres -Atc \
              "SELECT to_regnamespace('vault') IS NOT NULL AND to_regrole('supabase_admin') IS NOT NULL" \
              2>/dev/null | grep -qx t; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Apply every migration in timestamp order
        env:
          PGPASSWORD: ${{ format('issue-1447-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 \
            | sort -z \
            | while IFS= read -r -d '' migration; do
                psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
              done
      - name: Execute RSVP RLS, grant, duplicate, recovery, and state-machine probes
        env:
          PGPASSWORD: ${{ format('issue-1447-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -v issue1447_db_password="$PGPASSWORD"
          -f supabase/migrations/__tests__/issue_1447_rsvp_admission.pg17.test.sql
