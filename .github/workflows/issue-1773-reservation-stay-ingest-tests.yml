name: Issue 1773 reservation and Stay person ingest

on:
  push:
    branches: [main]
    paths: &paths
      - "supabase/migrations/20270327001773_issue_1773_reservation_stay_ingest.sql"
      - "supabase/migrations/__tests__/issue_1773_reservation_stay_ingest.test.sql"
      - "supabase/migrations/__tests__/issue_1773_preserves_1857_phone_authority.pg17.test.sql"
      - "supabase/functions/brand-person-ingest-worker/**"
      - "packages/card-identity/phone.mjs"
      - "packages/card-identity/phone.d.mts"
      - ".github/scripts/strict-grep/issue-1773-reservation-stay-ingest.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-1773-reservation-stay-ingest-tests.yml"
      - "docs/INVARIANT_REGISTRY.md"
  pull_request:
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ci-issue-1773-reservation-stay-ingest-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-1773-reservation-stay-ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ format('issue-1773-ci-{0}', github.run_id) }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 10 --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - name: Record pinned packaging tools
        run: |
          deno --version
          supabase --version
      - name: Run strict contract and true-mutation proof
        run: |
          node .github/scripts/strict-grep/issue-1773-reservation-stay-ingest.mjs --self-test
          node .github/scripts/strict-grep/issue-1773-reservation-stay-ingest.mjs
      - name: Prove hosted-compatible ESM owner in worker graph
        run: |
          deno check supabase/functions/brand-person-ingest-worker/index.ts
          deno bundle supabase/functions/brand-person-ingest-worker/index.ts >/tmp/issue-1773-worker.js
          deno bundle supabase/functions/brand-person-ingest-worker/issue_1773_reservation_stay.happy.test.ts >/tmp/issue-1773-worker-happy.test.js
          deno bundle supabase/functions/brand-person-ingest-worker/issue_1773_reservation_stay.tester.adversarial.test.ts >/tmp/issue-1773-worker-adversarial.test.js
          deno test --allow-read \
            supabase/functions/brand-person-ingest-worker/issue_1770_ingest_worker.happy.test.ts
          deno test /tmp/issue-1773-worker-happy.test.js /tmp/issue-1773-worker-adversarial.test.js
          deno test --allow-env --allow-net --allow-read --allow-run --allow-write \
            supabase/functions/brand-person-ingest-worker/issue_1773_worker_cjs_artifact.test.ts
          node --test \
            packages/card-identity/__tests__/issue_1703_dialable_phone.test.mjs \
            packages/card-identity/__tests__/issue_1773_hosted_esm_phone_owner.adversarial.test.mjs \
            packages/card-identity/__tests__/issue_1857_phone_country_authority.happy.test.mjs \
            packages/card-identity/__tests__/issue_1857_phone_country_authority.tester.adversarial.test.mjs
      - name: Wait for PostgreSQL 17 and apply every migration
        env:
          PGPASSWORD: ${{ format('issue-1773-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          ready=false
          for attempt in {1..90}; do
            if psql -h localhost -U postgres -d postgres -Atc "SELECT to_regnamespace('vault') IS NOT NULL" 2>/dev/null | grep -qx t; then ready=true; break; fi
            sleep 1
          done
          "$ready"
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z |
            while IFS= read -r -d '' migration; do
              psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
            done
      - name: Prove reservation and confirmed-Stay ingestion
        env:
          PGPASSWORD: ${{ format('issue-1773-ci-{0}', github.run_id) }}
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/__tests__/issue_1773_reservation_stay_ingest.test.sql
      - name: Prove current writers preserve RSVP phone authority
        env:
          PGPASSWORD: ${{ format('issue-1773-ci-{0}', github.run_id) }}
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/__tests__/issue_1773_preserves_1857_phone_authority.pg17.test.sql
