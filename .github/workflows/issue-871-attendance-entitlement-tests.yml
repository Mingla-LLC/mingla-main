name: Issue 871 attendance entitlement

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app-mobile/**"
      - "mingla-business/**"
      - "supabase/functions/claim-attendance/**"
      - "supabase/functions/attendance-claim-link/**"
      - "supabase/functions/attendance-claim-backfill/**"
      - "supabase/functions/_shared/attendanceClaim.ts"
      - "supabase/functions/_shared/governedAdSecret.ts"
      - "supabase/functions/rsvp-notify/**"
      - "supabase/functions/ticket-confirmation-dispatch/**"
      - "supabase/migrations/20270302000871_issue_0871_attendance_claim_foundation.sql"
      - "supabase/migrations/20270302000872_issue_0871_entitled_guest_roster.sql"
      - "supabase/migrations/20270614002987_issue_2979_attendance_claim_secret_continuity.sql"
      - "supabase/migrations/20270614003060_issue_3060_attendance_noncustomer_closure.sql"
      - "supabase/migrations/__tests__/issue_0871*"
      - "supabase/migrations/__tests__/issue_2979*"
      - "supabase/migrations/__tests__/issue_3060*"
      - "docs/INVARIANT_REGISTRY.md"
      - ".github/scripts/strict-grep/issue-871-attendance-entitlement.mjs"
      - ".github/scripts/strict-grep/issue-2979-attendance-claim-continuity.mjs"
      - ".github/scripts/strict-grep/issue-2979-attendance-claim-continuity.tester.mjs"
      - ".github/scripts/strict-grep/issue-3060-attendance-noncustomer-closure.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/ci-batch/MANIFEST.json"
      - ".github/workflows/issue-871-attendance-entitlement-tests.yml"
      # #2885 AC-4 — the machine-written baseline sits under a broad pattern
      # above, so a one-file recording PR matched this filter and ran the whole
      # suite. LAST on purpose: any other changed file still matches a positive
      # pattern above, so this only skips a baseline-ONLY change.
      - "!mingla-business/scripts/ci/bundle-baseline.json"

concurrency:
  group: ci-issue-871-attendance-entitlement-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-871-contract:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Issue 871 edge/mobile/web contract"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge handlers
        run: >-
          deno check
          supabase/functions/claim-attendance/index.ts
          supabase/functions/attendance-claim-link/index.ts
          supabase/functions/attendance-claim-backfill/index.ts
          supabase/functions/ticket-confirmation-dispatch/index.ts
      - name: Execute edge, mobile, web and source contracts
        run: >-
          deno test --allow-read
          supabase/functions/claim-attendance/__tests__/issue_0871_attendance_claim_contract.test.ts
          supabase/functions/claim-attendance/__tests__/issue_0871_claim_fragment_pollution.tester.adversarial.test.ts
          supabase/migrations/__tests__/issue_0871_attendance_claim_and_roster.test.ts
      - name: Execute issue 2979 implementor and independent tester contracts
        run: |
          deno test --allow-read --allow-env \
            supabase/functions/_shared/__tests__/issue_2979_attendance_pepper_ring.implementor.happy.test.ts \
            supabase/functions/claim-attendance/__tests__/issue_2979_attendance_claim_continuity.implementor.happy.test.ts \
            supabase/functions/attendance-claim-backfill/__tests__/issue_2979_recovery_delivery.implementor.happy.test.ts \
            supabase/functions/ticket-confirmation-dispatch/__tests__/issue_2979_ticket_confirmation_claim.implementor.happy.test.ts
          for test_file in \
            supabase/functions/claim-attendance/__tests__/issue_2979_attendance_claim_continuity.tester.adversarial.test.ts \
            supabase/functions/attendance-claim-backfill/__tests__/issue_2979_recovery_delivery.tester.adversarial.test.ts \
            supabase/functions/ticket-confirmation-dispatch/__tests__/issue_2979_ticket_confirmation_claim.tester.adversarial.test.ts; do
            if [[ -f "$test_file" ]]; then deno test --allow-read --allow-env "$test_file"; fi
          done
      - name: Execute Android attendance CTA reachability contract
        run: >-
          node
          app-mobile/src/components/__tests__/issue_2979_attendance_claim_android_cta.implementor.happy.test.tsx
      - name: Execute invariant guard and its revert self-test
        run: |
          node .github/scripts/strict-grep/issue-871-attendance-entitlement.mjs --self-test
          node .github/scripts/strict-grep/issue-871-attendance-entitlement.mjs
      - name: Execute issue 2979 invariant guard and independent tester guard
        run: |
          node .github/scripts/strict-grep/issue-2979-attendance-claim-continuity.mjs --self-test
          node .github/scripts/strict-grep/issue-2979-attendance-claim-continuity.mjs
          node .github/scripts/strict-grep/issue-2979-attendance-claim-continuity.tester.mjs --self-test
          node .github/scripts/strict-grep/issue-2979-attendance-claim-continuity.tester.mjs
      - name: Execute issue 3060 no-current-buyer closure guard
        run: |
          node .github/scripts/strict-grep/issue-3060-attendance-noncustomer-closure.mjs --self-test
          node .github/scripts/strict-grep/issue-3060-attendance-noncustomer-closure.mjs
      - name: Install buyer-web dependencies
        working-directory: mingla-business
        run: npm ci
      - name: Prove the signed-out attendance handoff stays public
        working-directory: mingla-business
        run: >-
          npx jest
          src/utils/__tests__/issue_0871_attendance_claim_public_route.implementor.happy.test.ts
          src/utils/__tests__/issue_0871_attendance_claim_auth_boundary.tester.adversarial.test.ts
          --runInBand

  issue-871-pg17:
    if: ${{ github.event.pull_request.draft != true }}
    name: "Issue 871 atomic authorization proof (PG17)"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ format('issue-871-ci-{0}', github.run_id) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PostgreSQL 17
        env:
          PGPASSWORD: ${{ format('issue-871-ci-{0}', github.run_id) }}
        run: |
          for i in {1..90}; do
            if psql -h localhost -U postgres -d postgres -Atc "SELECT 1" 2>/dev/null | grep -qx 1; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Apply full migration history
        env:
          PGPASSWORD: ${{ format('issue-871-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 | sort -z |
            while IFS= read -r -d '' migration; do
              psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration" >/dev/null
            done
      - name: Execute authorization, pagination, delivery and concurrency proof
        env:
          PGPASSWORD: ${{ format('issue-871-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_0871_attendance_roster_pg17.test.sql
      - name: Execute issue 2979 migration contracts
        env:
          PGPASSWORD: ${{ format('issue-871-ci-{0}', github.run_id) }}
        run: |
          psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2979_legacy_active_proof_generation.implementor.happy.test.sql
          psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_2979_attendance_claim_secret_continuity.implementor.happy.test.sql
          tester_sql=supabase/migrations/__tests__/issue_2979_attendance_claim_secret_continuity.tester.adversarial.test.sql
          if [[ -f "$tester_sql" ]]; then
            psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -f "$tester_sql"
          fi
      - name: Execute issue 3060 exact-set closure contracts
        env:
          PGPASSWORD: ${{ format('issue-871-ci-{0}', github.run_id) }}
        run: |
          psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_3060_attendance_noncustomer_closure.implementor.happy.test.sql
          psql -h localhost -U supabase_admin -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_3060_attendance_noncustomer_closure.tester.adversarial.test.sql
