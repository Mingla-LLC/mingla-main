name: Issue 948 Wave 2 Bank Route Web Tests

# #948 W2 — focused CI registry for the implementor and independent tester
# bank-route guards. The required full business Jest suite discovers both too.
# No strict-grep .mjs is added, so MANIFEST.json totality is unaffected.

on:
  pull_request:
    branches: [main]
    paths:
      - "mingla-business/app/brand/**/connect.tsx"
      - "mingla-business/app/brand/**/connect.web.tsx"
      - "mingla-business/src/components/brand/BrandOnboardView.tsx"
      - "mingla-business/src/components/brand/BrandStripeCountryPicker.tsx"
      - "mingla-business/src/utils/bankConnectFunnel.ts"
      - "mingla-business/src/utils/__tests__/issue_948_w2_bank_route.implementor.test.ts"
      - "mingla-business/src/utils/__tests__/issue_948_w2_bank_route.tester.test.ts"
      - ".github/workflows/issue-948-w2-bank-route-web-tests.yml"
  push:
    branches: [main]
    paths:
      - "mingla-business/app/brand/**/connect.tsx"
      - "mingla-business/app/brand/**/connect.web.tsx"
      - "mingla-business/src/components/brand/BrandOnboardView.tsx"
      - "mingla-business/src/components/brand/BrandStripeCountryPicker.tsx"
      - "mingla-business/src/utils/bankConnectFunnel.ts"
      - "mingla-business/src/utils/__tests__/issue_948_w2_bank_route.implementor.test.ts"
      - "mingla-business/src/utils/__tests__/issue_948_w2_bank_route.tester.test.ts"
      - ".github/workflows/issue-948-w2-bank-route-web-tests.yml"

concurrency:
  group: issue-948-w2-bank-route-web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-948-w2-bank-route-web:
    name: "#948 W2: one-hop bank route + web handoff"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json

      - name: Install business dependencies
        working-directory: mingla-business
        run: npm ci

      - name: Run W2 bank-route contracts
        working-directory: mingla-business
        run: >
          npx jest
          src/utils/__tests__/issue_948_w2_bank_route.implementor.test.ts
          src/utils/__tests__/issue_948_w2_bank_route.tester.test.ts
          --runInBand
