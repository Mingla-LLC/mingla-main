  push:
    branches: ["**"]
    paths:
      - "supabase/functions/_shared/agentReliability.ts"
      - "supabase/functions/_shared/agentReliabilityHttp.ts"
      - "supabase/functions/_shared/__tests__/issue_2060_ari_reliability_foundation.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2060_ari_reliability_foundation.tester_adversarial.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2060_ari_reliability_typed_success.tester.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2060_ari_envelope_wire.implementor.test.ts"
      - "supabase/functions/_shared/__tests__/issue_2060_ari_envelope_wire.tester.adversarial.test.ts"
      - "supabase/functions/agent-chat/index.ts"
      - "supabase/functions/agent-confirm-action/index.ts"
