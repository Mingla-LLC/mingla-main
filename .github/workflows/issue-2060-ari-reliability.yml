      - "supabase/migrations/20270529002060_issue_2060_ari_cert_requirements_set_digest.sql"
      - "supabase/migrations/20270610002060_issue_2060_ari_cert_requirements_set_digest_post_2830.sql"
      - "supabase/migrations/__tests__/issue_2060_ari_cert_requirements_set_digest.implementor.pg17.test.sql"
      - "supabase/migrations/__tests__/issue_2060_ari_cert_requirements_set_digest.tester.adversarial.pg17.test.sql"
