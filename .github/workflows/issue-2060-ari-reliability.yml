      - "supabase/migrations/__tests__/issue_2060_ari_certification_foundation.tester_adversarial.pg17.test.sql"
      - "supabase/migrations/__tests__/issue_2060_ari_certification_foundation.implementor.pg17.test.sql"
      - "supabase/migrations/__tests__/issue_2060_ari_certification_provenance.tester.pg17.test.sql"
      - "supabase/migrations/__tests__/issue_2060_ari_certification_cross_runtime.tester.pg17.test.sql"
      - "supabase/migrations/__tests__/issue_2060_ari_certification_independent_verdict.tester.pg17.test.sql"
      - "supabase/migrations/__tests__/issue_2060_ari_certification_canonical_digest.implementor.pg17.test.sql"
      - "supabase/migrations/__tests__/issue_2060_ari_certification_unicode_boundary.tester.pg17.test.sql"
