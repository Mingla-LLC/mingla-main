      - "supabase/migrations/__tests__/issue_2060_ari_certification_unicode_boundary.tester.pg17.test.sql"
      - "mingla-business/src/services/agentReliability.ts"
      - "mingla-business/src/services/agentChatService.ts"
      - "mingla-business/src/hooks/useAgentChat.ts"
      - "mingla-business/src/hooks/useConfirmPendingAction.ts"
      - "mingla-business/src/services/__tests__/agentReliability.issue2060.test.ts"
      - "mingla-business/src/services/__tests__/agentReliability.issue2060.tester.adversarial.test.ts"
      - "mingla-business/src/services/__tests__/agentChatService.issue2060.wire.test.ts"
      - "docs/contracts/ari-capability-ledger.json"
      - "docs/contracts/ari-certification-*.json"
      - "docs/contracts/ari-observability.json"
      - "docs/contracts/ari-pass5-integration-seams.json"
