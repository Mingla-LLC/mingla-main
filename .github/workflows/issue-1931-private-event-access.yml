              *20271219003872_issue_3872_r2_referrals_foundation.sql) continue ;;
              *20271220003872_issue_3872_r2_attribution_resolution.sql) continue ;;
              *20271221003872_issue_3872_r2_payee_reversal_and_payout.sql) continue ;;
              *20271222003872_issue_3872_r2_host_referrals.sql) continue ;;
              *20271223003872_issue_3872_r2_buyer_referrals.sql) continue ;;
              *20271224003872_issue_3872_r3_foundation.sql) continue ;;
              *20271225003872_issue_3872_r3_creator_identity.sql) continue ;;
              *20271226003872_issue_3872_r3_gig_contracts.sql) continue ;;
              *20271227003872_issue_3872_r3_workflow.sql) continue ;;
              *20271228003872_issue_3872_r4_locals.sql) continue ;;
              # #3872 Ari certification census — SKIPPED because it asserts the
              # complete 152-row requirement registry and upgrades the R1
              # finalizer's 148 denominator; both are seeded ONLY by the skipped
              # 20271216043872 host-operations migration above, so on this lane
              # the census correctly refuses (149 rows). The canonical full
              # replay applies it and proves 152. Matched by EXACT filename.
              *20271229003872_issue_3872_ari_cert_capability_census.sql) continue ;;
              # #3872 walkthrough, round 2, gig pay, shoot-window, and due-change
              # migrations — SKIPPED because each re-emits Creator, gig, payee,
              # referral, or Local readers over tables created only by the
              # skipped #3872 chain above (the shoot-window reader declares a
              # public.gig_contracts row variable, so it aborts at CREATE time).
              # Each is matched by exact filename; the canonical full replay
              # applies the complete chain in order.
              *20271230003872_issue_3872_walkthrough_creator_gigs.sql) continue ;;
              *20271231003872_issue_3872_walkthrough_money_and_locals.sql) continue ;;
              *20280101003872_issue_3872_walkthrough_explorer_gaps.sql) continue ;;
              *20280102003872_issue_3872_round2.sql) continue ;;
              *20280103003872_issue_3872_gig_pay.sql) continue ;;
              *20280104003872_issue_3872_workspace_shoot_window.sql) continue ;;
              *20280105003872_issue_3872_due_change.sql) continue ;;
              # #4073 Discover V2 — SKIPPED because its public feed re-emits
              # readers that retain the #1931 and #2489 privacy helpers this
              # deliberately filtered lane omits. The unfiltered canonical
              # replay covers the migration in true filename order.
              # Matched by EXACT filename, never an issue-number infix.
              *20271218004073_issue_4073_discover_feed_v2.sql) continue ;;
              # #4063 claim links/contacts — SKIPPED because it reads checkout
              # consumed_at state introduced only by migrations this deliberately
              # filtered pre-#1931 chain omits. The unfiltered canonical replay
              # covers it in true filename order.
              # Matched by EXACT filename, never an issue-number infix.
              *20271218034063_issue_4063_claim_links_and_contacts.sql) continue ;;
              # #4063 durable door sales — SKIPPED because the migration
              # re-emits #3872 money readers that reference discount columns
              # created only by migrations this filtered lane omits. The
              # unfiltered canonical replay covers it in true filename order.
              # Matched by EXACT filename, never an issue-number infix.
              *20271219004063_issue_4063_door_sale_orders.sql) continue ;;
              # #4063 ticket send-to-friend — SKIPPED because its claim RPCs
              # read ticket_event_dates, created only by a migration this
              # deliberately filtered pre-#1931 chain omits. The unfiltered
              # canonical replay covers it in true filename order.
              # Matched by EXACT filename, never an issue-number infix.
              *20271219014063_issue_4063_ticket_send_to_friend.sql) continue ;;
            esac
            psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -q -f "$f" >/dev/null
          done
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1931_reader_equality.test.sql > /tmp/eq_baseline.txt 2>&1

      # P2-1 / P2-2 — seed DURABLE rows BEFORE the migration applies, so the
      # "columns stay NULL" and "#1770 rows unchanged" assertions have a real subject.
      # On a clean CI replay both target tables are empty, which made them vacuous.
      - name: "Seed the migration-time write probe (pre-#1931)"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1931_migration_time_probe.seed.sql

      - name: "Apply #1931 and re-capture"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          set -euo pipefail
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/20270413001931_issue_1931_private_event_access.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1931_reader_equality.test.sql > /tmp/eq_post.txt 2>&1

      - name: "SC-47 — re-emitted objects are behaviorally identical"
        run: diff /tmp/eq_baseline.txt /tmp/eq_post.txt

      - name: "Migration-time write probe (P2-1 / P2-2) — #1931 wrote nothing it must not"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1931_migration_time_probe.verify.sql

      - name: "Read-cost probe (P2-3) — measured and recorded, catastrophe ceiling only"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1931_read_cost_probe.sql

      - name: "#1931 behavioral suite (SC-45/46/48/53/54/55c)"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1931_private_event_access.test.sql

      - name: "Anonymous SECURITY DEFINER allowlist"
        env:
          PGPASSWORD: ${{ github.sha }}
        run: bash scripts/ci/security_definer_anon_gate.sh

  gates-and-edge:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - run: node .github/scripts/strict-grep/issue-1931-private-event-access.mjs --self-test
      - run: node .github/scripts/strict-grep/issue-1931-private-event-access.mjs

      # SC-47 / SC-49(e) / SC-50 — the two landed gates #1931 must NOT weaken still pass
      # unchanged, including their own self-test mutation sets.
      - run: node .github/scripts/strict-grep/issue-1930-checkout-current-truth.mjs --self-test
      - run: node .github/scripts/strict-grep/issue-2050-host-route-ownership.mjs --self-test

      - run: deno check supabase/functions/private-event-access/index.ts supabase/functions/private-event-read/index.ts supabase/functions/private-event-media/index.ts
      - run: deno test --allow-env --allow-read --allow-net supabase/functions/private-event-access/__tests__/issue_1931_private_event_access_edge.test.ts

