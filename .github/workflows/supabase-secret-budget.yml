name: Supabase Secret Budget

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "supabase/secrets.manifest.json"
      - "supabase/function-env.contract.json"
      - "scripts/secrets/**"
      - "scripts/deploy-supabase-functions.sh"
      - "scripts/ci/issue1456-edge-deploy-idempotency.test.mjs"
      - "scripts/ops/__tests__/issue_2016_production_authority.implementor.happy.test.mjs"
      - "scripts/ops/__tests__/issue_2016_production_authority.tester.adversarial.test.mjs"
      - "supabase/functions/**"
      - "mingla-business/src/components/checkout/DownloadMinglaCta.tsx"
      - "mingla-business/src/components/checkout/__tests__/issue2241*.test.tsx"
      - "mingla-business/src/components/ui/Icon.tsx"
      - "mingla-business/src/hooks/useAttendanceClaimArm.ts"
      - "mingla-business/src/hooks/__tests__/issue2241*.test.tsx"
      - "mingla-business/src/services/attendanceClaimLinkService.ts"
      - "mingla-business/src/services/__tests__/issue2241*.test.ts"
      - ".github/scripts/strict-grep/issue-1203-secret-capacity.mjs"
      - ".github/scripts/strict-grep/issue-1436-secret-capacity-exit.mjs"
      - ".github/scripts/strict-grep/issue-2241-secret-readiness.mjs"
      - ".github/workflows/supabase-secret-budget.yml"
      - "docs/contracts/production-supabase-authority.json"
      # #2241 — the capacity runbook is the operator's only authority for the
      # order and arithmetic of the production unset sequence, and
      # issue_2241_runbook_unset_sequence.test.mjs is the only reader that
      # compares it to the contract. A gate that cannot run on the file class
      # its bug lives in is theatre (#994), so a runbook edit re-runs it.
      - "docs/runbooks/SUPABASE_SECRET_CAPACITY.md"
      - "scripts/ops/verify-production-supabase-authority.mjs"
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-supabase-secret-budget-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  offline-audit:
    if: ${{ github.event.pull_request.draft != true }}
    name: Offline manifest and capacity audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.14
      - name: Audit target manifest
        run: node scripts/secrets/audit-supabase-secret-budget.mjs --manifest-only
      - name: Audit every production function environment read
        run: node scripts/secrets/audit-function-secret-contract.mjs
      - name: Run capacity regression tests
        run: >-
          node --test
          scripts/secrets/issue_1203_*.test.mjs
          scripts/secrets/issue_1436_*.test.mjs
          scripts/secrets/issue_2241_*.test.mjs
      - name: Run bundle resolver regression tests
        run: >-
          deno test --allow-env --allow-read --allow-net=deno.land,esm.sh
          supabase/functions/_shared/issue_1203_*.test.ts
          supabase/functions/_shared/issue_1437_*.test.ts
          supabase/functions/_shared/issue_2241_*.test.ts
          supabase/functions/_shared/__tests__/issue_2830_sites_foundation_happy.test.ts
          supabase/functions/_shared/__tests__/issue_2893_sites_live_readiness.test.ts
          supabase/functions/_shared/__tests__/issue_3016_brand_site_control_cors_adversarial.test.ts
      - name: Run explicit deploy and production-authority regressions
        run: |
          node scripts/ci/issue1456-edge-deploy-idempotency.test.mjs
          node --test scripts/ops/__tests__/issue_2016_production_authority.implementor.happy.test.mjs scripts/ops/__tests__/issue_2016_production_authority.tester.adversarial.test.mjs
      - name: Install Host test dependencies
        working-directory: mingla-business
        run: npm ci
      - name: Run Host Web, Business iOS, and Business Android behavior proof
        working-directory: mingla-business
        run: >-
           npx jest --config jest.issue2323.render.cjs --runInBand
           --testMatch '**/__tests__/issue2241*.test.ts?(x)'
      - name: Guard the final 88-name bundled-authority state
        run: |
          node .github/scripts/strict-grep/issue-1436-secret-capacity-exit.mjs --self-test
          node .github/scripts/strict-grep/issue-1436-secret-capacity-exit.mjs
          node .github/scripts/strict-grep/issue-2241-secret-readiness.mjs --self-test
          node .github/scripts/strict-grep/issue-2241-secret-readiness.mjs

  live-names-only-audit:
    name: Live names-only capacity audit
    if: ${{ (github.event.pull_request.draft != true) && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_SECRET_AUDIT_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: gqnoajqerqhnvulmnyvv
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - name: Check whether the separately provisioned audit credential exists
        id: credential
        shell: bash
        run: |
          if [[ -n "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "available=true" >> "${GITHUB_OUTPUT}"
          else
            echo "available=false" >> "${GITHUB_OUTPUT}"
            echo "::error title=Supabase secret budget::required live-audit credential is missing"
            exit 1
          fi
      - name: Audit live secret names without emitting raw CLI output
        run: node scripts/secrets/audit-supabase-secret-budget.mjs
