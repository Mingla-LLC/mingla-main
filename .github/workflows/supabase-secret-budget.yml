name: Supabase Secret Budget

on:
  pull_request:
    paths:
      - "supabase/secrets.manifest.json"
      - "scripts/secrets/**"
      - "supabase/functions/_shared/secretBundle.ts"
      - "supabase/functions/_shared/runtimeConfig.ts"
      - ".github/scripts/strict-grep/issue-1203-secret-capacity.mjs"
      - ".github/workflows/supabase-secret-budget.yml"
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-audit:
    name: Offline manifest and capacity audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Audit target manifest
        run: node scripts/secrets/audit-supabase-secret-budget.mjs --manifest-only
      - name: Run capacity regression tests
        run: node --test scripts/secrets/issue_1203_audit_supabase_secret_budget.test.mjs

  live-names-only-audit:
    name: Live names-only capacity audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_SECRET_AUDIT_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: gqnoajqerqhnvulmnyvv
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.98.2
      - name: Audit live secret names without emitting raw CLI output
        run: node scripts/secrets/audit-supabase-secret-budget.mjs
