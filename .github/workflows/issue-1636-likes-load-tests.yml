# #2437 SHADOW-PARITY-TRIGGER — remove before cutover
name: Issue 1636 Likes Load Tests

# Issue #1636 — "Likes takes a long time to load once you have a lot of liked
# places." Guards the three fixes (thumbnail URLs, list virtualisation, bounded
# entrance stagger) AND the ORCH-1189 floating-nav clearance contract, which was
# previously wired into NO workflow at all despite being the layout contract most
# exposed by moving the Likes list from a ScrollView to a FlatList.
#
# `paths:` must cover EVERY file these suites read, or the gate goes dark exactly
# the way issue #1584 describes.

on:
  push:
    branches: [main]
    paths:
      - "app-mobile/src/components/activity/SavedTab.tsx"
      - "app-mobile/src/components/activity/CalendarTab.tsx"
      - "app-mobile/src/components/activity/savedTabEntrance.ts"
      - "app-mobile/src/components/LikesPage.tsx"
      - "app-mobile/src/components/figma/ImageWithFallback.tsx"
      - "app-mobile/src/utils/placePhotoThumb.ts"
      - "app-mobile/src/components/activity/__tests__/issue_1636_likes_load.test.ts"
      - "app-mobile/src/components/activity/__tests__/issue_1636_likes_thumb_contract.adversarial.test.ts"
      - "supabase/functions/backfill-place-photo-thumbs/index.ts"
      - "app-mobile/src/components/activity/__tests__/orch_1189_likes_floating_nav_clearance.test.mjs"
      - "app-mobile/package.json"
      - ".github/workflows/issue-1636-likes-load-tests.yml"
  pull_request:
    paths:
      - "app-mobile/src/components/activity/SavedTab.tsx"
      - "app-mobile/src/components/activity/CalendarTab.tsx"
      - "app-mobile/src/components/activity/savedTabEntrance.ts"
      - "app-mobile/src/components/LikesPage.tsx"
      - "app-mobile/src/components/figma/ImageWithFallback.tsx"
      - "app-mobile/src/utils/placePhotoThumb.ts"
      - "app-mobile/src/components/activity/__tests__/issue_1636_likes_load.test.ts"
      - "app-mobile/src/components/activity/__tests__/issue_1636_likes_thumb_contract.adversarial.test.ts"
      - "supabase/functions/backfill-place-photo-thumbs/index.ts"
      - "app-mobile/src/components/activity/__tests__/orch_1189_likes_floating_nav_clearance.test.mjs"
      - "app-mobile/package.json"
      - ".github/workflows/issue-1636-likes-load-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-1636-likes-load:
    name: "Issue 1636: bounded Likes load + ORCH-1189 nav clearance"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Fail loudly if a suite is renamed or deleted rather than silently
      # running nothing — the #1584 failure class.
      - name: Require all three regression suites and their inputs to exist
        run: |
          test -f app-mobile/src/components/activity/__tests__/issue_1636_likes_load.test.ts
          test -f app-mobile/src/components/activity/__tests__/issue_1636_likes_thumb_contract.adversarial.test.ts
          test -f supabase/functions/backfill-place-photo-thumbs/index.ts
          test -f app-mobile/src/components/activity/__tests__/orch_1189_likes_floating_nav_clearance.test.mjs
          test -f app-mobile/src/utils/placePhotoThumb.ts
          test -f app-mobile/src/components/activity/savedTabEntrance.ts

      # Thumbnail URL derivation (incl. foreign hosts passing through
      # byte-identical), bounded entrance stagger, and the virtualisation
      # contract. Run via the npm script so the script itself is exercised.
      - name: Issue 1636 regression suite
        working-directory: app-mobile
        run: npm run test:issue-1636

      # TESTER adversarial suite (#1636). Different angles from the suite above:
      # a reader/writer differential against REAL production object names, the
      # retry being armed only where a second request could succeed, the 384 px
      # thumb staying off full-bleed surfaces, removeClippedSubviews staying off
      # (it swallows touches on Android and every row here is interactive), and
      # the unbounded stagger staying gone from the CALL SITE.
      - name: Issue 1636 tester adversarial suite
        working-directory: app-mobile
        run: npm run test:issue-1636-adversarial

      # ORCH-1189 floating-nav clearance. Virtualisation moved this contract from
      # the ScrollView's contentContainerStyle to the FlatList's, so it is the
      # contract most at risk from #1636 and must run on the same trigger.
      - name: ORCH-1189 Likes floating-nav clearance contract
        working-directory: app-mobile
        run: npm run test:orch-1189
