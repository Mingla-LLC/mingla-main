name: Issue 1638 Tab Switch Quick Wins Tests

# #1638 [tab switch quick wins] — "Switching tabs acknowledges the tap before the screen
# is ready". Three independent quick wins, all in app-mobile:
#
#   C1  ANDROID GOT NO TACTILE ACKNOWLEDGEMENT AT ALL. GlassBottomNav.tsx gated
#       `Haptics.impactAsync(Medium)` behind `Platform.OS === 'ios'`, so on the platform
#       where the destination-screen wait is LONGEST the app was completely silent to the
#       touch and only the spotlight pill moved. Android now fires
#       `performAndroidHapticsAsync(Clock_Tick)` — NOT impactAsync, which on Android is
#       `Vibrator.vibrate(...)`, needs a VIBRATE permission this app does not declare, and
#       is explicitly discouraged by expo's own JSDoc.
#
#   C2  EVERY SWITCH TO PROFILE FIRED A GPS FIX AND A DATABASE WRITE. ProfilePage.tsx ran
#       `useEffect(() => { updateLocation(); }, [])` with no cache check — and because
#       Wave 2.8 Path B (`I-ONLY-ACTIVE-TAB-MOUNTED`) unmounts the tab on every switch
#       away, `[]` meant every single tap: permission request → real getCurrentPositionAsync
#       fix → reverse geocode → AsyncStorage write → Supabase `profiles` UPDATE. Now gated
#       on a 30-minute staleness window, with the cached city hydrating the UI immediately.
#
#   C3  "FETCH" FUNCTIONS THAT WERE ACTUALLY CACHE INVALIDATIONS. useFriends.ts's
#       fetchFriends / loadFriendRequests are `queryClient.invalidateQueries(...)`, and
#       calling them from ProfilePage's and ConnectionsPage's mount effects forcibly
#       defeated the 30s useFriendsList staleTime on every Profile/Friends switch. The
#       MOUNT call sites are gone; every ACTION-driven invalidation is untouched.
#
# WITHOUT THIS WORKFLOW THE SUITE WOULD BE DARK (the #1584 dark-test-surface trap):
# app-mobile has NO jest, its tests run under plain `node --test`, and no workflow sweeps
# src/components/__tests__/. Same shape and rationale as
# issue-1516-coach-mark-tests.yml.
#
# Found while wiring this gate and reported to the orchestrator: the ORCH-0995 suites
# (orch-0995-*.test.tsx), including the T-18 fails-on-revert gate that protects the
# `React.startTransition` scheduling, are themselves DARK — no npm script, no workflow.
# This suite therefore carries its own S1 tripwire asserting that scheduling is unchanged.
#
# EXPLICIT registry (never a glob) — add a suite by appending its path below.
# Invokes no .mjs under .github/scripts/strict-grep/ and adds no file under a registered
# externalGateDirs path (`app-mobile/scripts/ci`), so MANIFEST.json totality, parity and
# the ratchet counters are untouched.

on:
  push:
    branches: [main]
    paths:
      - "app-mobile/src/components/__tests__/issue-1638-tab-switch-quickwins.test.mjs"
      - "app-mobile/src/utils/navTabHaptics.ts"
      - "app-mobile/src/utils/profileLocationFreshness.ts"
      - "app-mobile/src/components/GlassBottomNav.tsx"
      - "app-mobile/src/components/ProfilePage.tsx"
      - "app-mobile/src/components/ConnectionsPage.tsx"
      - "app-mobile/src/components/FriendRequestsModal.tsx"
      - "app-mobile/src/hooks/useFriends.ts"
      - "app-mobile/src/hooks/useFriendsQuery.ts"
      - "app-mobile/src/config/queryClient.ts"
      - "app-mobile/app/index.tsx"
      - "app-mobile/package.json"
      - ".github/workflows/issue-1638-tab-switch-quickwins-tests.yml"
  pull_request:
    paths:
      - "app-mobile/src/components/__tests__/issue-1638-tab-switch-quickwins.test.mjs"
      - "app-mobile/src/utils/navTabHaptics.ts"
      - "app-mobile/src/utils/profileLocationFreshness.ts"
      - "app-mobile/src/components/GlassBottomNav.tsx"
      - "app-mobile/src/components/ProfilePage.tsx"
      - "app-mobile/src/components/ConnectionsPage.tsx"
      - "app-mobile/src/components/FriendRequestsModal.tsx"
      - "app-mobile/src/hooks/useFriends.ts"
      - "app-mobile/src/hooks/useFriendsQuery.ts"
      - "app-mobile/src/config/queryClient.ts"
      - "app-mobile/app/index.tsx"
      - "app-mobile/package.json"
      - ".github/workflows/issue-1638-tab-switch-quickwins-tests.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-1638-tab-switch-quickwins:
    name: "#1638 CONS: a tab tap acknowledges on both platforms and stops paying for GPS + forced refetches (fails-on-revert)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 22 — the app-mobile convention (there is no jest in this app).
          node-version: "22"
          cache: npm
          cache-dependency-path: app-mobile/package-lock.json
      # npm ci is required for THREE reasons, not one:
      #   - the suite sucrase-transpiles and EXECUTES the real navTabHaptics.ts and
      #     profileLocationFreshness.ts, so `sucrase` must be installed;
      #   - C3 drives a REAL @tanstack/react-query QueryClient/QueryObserver, so the
      #     staleTime/refetchOnMount behaviour it asserts is the shipped library's, not a
      #     replica;
      #   - C1.4 reads the VENDORED expo-haptics Kotlin source to prove the Android haptic
      #     constant survives below API 34 (the Samsung SM-A725F is API 33).
      - name: Install deps (the suite executes real modules + the real react-query)
        run: npm ci
      - name: Run issue-1638 suite (implementor happy-path)
        run: npm run test:issue-1638
