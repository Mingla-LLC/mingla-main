name: Issue #1403 Listing Insights

on:
  pull_request:
    # issue #2881 — ready_for_review is required wherever the draft gate is set.
    types: [opened, synchronize, reopened, ready_for_review]
    # #2885 AC-4 — a pull request whose ONLY changed file is the machine-written
    # boot-payload baseline cannot affect this suite. Those recording PRs were
    # starting 53 jobs each, ~15/day (~51,000 job-min/month). `paths-ignore`
    # skips ONLY when nothing else changed: touch this file alongside anything
    # and this workflow runs exactly as it always did.
    paths-ignore:
      - "mingla-business/scripts/ci/bundle-baseline.json"
  workflow_dispatch:

concurrency:
  group: ci-issue-1403-listing-insights-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-1403-venue-rollup-pg17:
    if: ${{ github.event.pull_request.draft != true }}
    name: Issue 1403 venue rollup proof (PG17)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    # #2148 — the `services:` block that used to live here is gone. A service
    # container is started by the runner BEFORE any step runs, so nothing can
    # place a pre-migrated data directory into it; owning the container from a
    # step is what makes the cached snapshot possible. It still listens on
    # localhost:5432 with the same password, so every step below is unchanged.
    steps:
      - uses: actions/checkout@v4
      # #2148 — replaces this job's postgres bring-up: a service container plus a
      # full replay of every migration (MEASURED ~75s boot + ~105s replay). The
      # shared action restores a cached snapshot of the already-migrated cluster
      # and applies only what landed since, falling back to a full replay on any
      # doubt. It verifies policy/trigger/index/RLS counts against the snapshot's
      # build-time manifest before any test runs.
      - name: PostgreSQL 17 with every migration applied
        uses: ./.github/actions/migrated-postgres
        with:
          # Pinned at the call site, not inherited from the action default, so this
          # workflow still states the database it certifies against.
          image: supabase/postgres:17.4.1.075
          password: ${{ format('issue-1403-ci-{0}', github.run_id) }}
      - name: Execute issue 1403 venue rollup proof
        env:
          PGPASSWORD: ${{ format('issue-1403-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1403_venue_reservation_rollup.test.sql
      - name: Execute issue 1403 implementor adversarial proof
        env:
          PGPASSWORD: ${{ format('issue-1403-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1403_venue_reservation_rollup.adversarial.test.sql
      - name: Execute issue 1403 tester adversarial proof
        env:
          PGPASSWORD: ${{ format('issue-1403-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1403_venue_reservation_rollup.tester.adversarial.test.sql

  issue-1403-listing-insights:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: mingla-business
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare typecheck comparison evidence
        run: |
          mkdir -p "$RUNNER_TEMP/issue1403-typecheck"
          printf '%s\n' \
            'Typecheck comparison did not complete; inspect the preceding failed step.' \
            > "$RUNNER_TEMP/issue1403-typecheck/INCOMPLETE.txt"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - run: npm ci
      # `@testing-library/react-native` joined this step in #1834. It is not a
      # package.json dependency, so before that "Typecheck full graph against
      # exact PR base" below compiled every `*.render.test.tsx` in the repo with
      # the module unresolvable — 29 files carrying
      # `TS2307: Cannot find module '@testing-library/react-native'` were baked
      # into the ratcheted baseline. That made the gate fail on the ADDITION of
      # any new render test, for a reason having nothing to do with the test:
      # #1834's suite tripped it at exactly +1. Installing the module removes
      # the diagnostic at its source instead of suppressing it, and resolving
      # the real types surfaced no new errors in the 29 files (794/795 -> 765/765,
      # added 0). Pinned to the same version as
      # issue-1486-dormant-render-suites.yml so both jobs compile and run these
      # suites against one renderer — see that file for why an unpinned install
      # of this package is not deterministic across npm versions.
      - name: Install render-only test dependencies
        run: npm install --no-save react-test-renderer@19.1.0 @testing-library/react-native@13.3.3
      - name: Pure contracts
        run: >-
          npm test -- --runInBand
          listingInsightsService.issue1403
          reservationMetricsService.issue1403
          useListingInsights.issue1403
          useVenueReservationMetrics.issue1403
          businessAnalyticsEvents.issue1403
          listingInsightsRoleGate.issue1403
      - name: Native render contracts
        run: npx jest --config jest.issue1403.render.cjs --runInBand
      - name: Web render contracts
        run: npx jest --config jest.issue1403.web.render.cjs --runInBand
      - name: Listing and venue wiring gate self-test
        run: node ../.github/scripts/strict-grep/issue-1403-listing-insights-wiring.mjs --self-test
      - name: Listing and venue wiring gate
        run: node ../.github/scripts/strict-grep/issue-1403-listing-insights-wiring.mjs
      - name: Auth-ready query gate self-test
        run: node ../.github/scripts/strict-grep/orch-1004-auth-scoped-query-readiness.mjs --self-test
      - name: Auth-ready query gate
        run: node ../.github/scripts/strict-grep/orch-1004-auth-scoped-query-readiness.mjs
      - name: Source-pin partition audit
        run: node scripts/ci/select-source-text-pins.mjs --check
      - name: Quarantine policy audit
        run: node ../.github/scripts/strict-grep/orch-1047-quarantine-list-is-source-pins-only.mjs
      - name: Install manifest parser dependency
        working-directory: .
        run: npm install --no-save yaml
      - name: Manifest totality/parity
        run: node ../.github/scripts/strict-grep/meta-1383-manifest-parity.mjs
      - name: Manifest ratchet frontier
        run: node --test ../.github/scripts/strict-grep/__tests__/orch-1400-ratchet-frontier.adversarial.test.mjs
      - name: Typecheck comparator self-test
        run: node scripts/ci/issue-1403-typecheck-delta.mjs --self-test
      - name: Typecheck full graph against exact PR base
        env:
          ISSUE_1403_BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: >-
          node scripts/ci/issue-1403-typecheck-delta.mjs
          --base "$ISSUE_1403_BASE_REF"
          --output-dir "$RUNNER_TEMP/issue1403-typecheck"
      - name: Upload typecheck comparison evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-1403-typecheck-comparison
          path: ${{ runner.temp }}/issue1403-typecheck
          if-no-files-found: error
      - name: Scoped issue lint
        run: |
          npx eslint \
            app/insights/'[id].tsx' \
            app/event/'[id]'/index.tsx \
            app/trip/'[id]'/index.tsx \
            app/experience/'[id]'/index.tsx \
            app/rsvp/'[id]'/index.tsx \
            src/components/analytics/ListingInsightsScreen.tsx \
            src/components/venue/VenueReservationsCard.tsx \
            src/components/venue/VenueIntelligenceModule.tsx \
            src/services/listingInsightsService.ts \
            src/services/reservationMetricsService.ts \
            src/hooks/useListingInsights.ts \
            src/hooks/useVenueReservationMetrics.ts \
            src/analytics/businessAnalyticsEvents.ts
      # ======================================================================
      # #2148 [ci-runtime] — two steps REMOVED here, deliberately. Neither was
      # dropped for speed alone: each duplicated a workflow that already runs on
      # EVERY pull request, so this job was the slowest in CI (11.4 min, and the
      # only thing standing between a 13.2-min CI and an 8.7-min one) while
      # adding no coverage the repo did not already have.
      #
      # 1. `Full Business Jest` (`npx jest --runInBand`, MEASURED 434 s).
      #    Superseded by `mingla-business-jest-suite.yml`, which is a REQUIRED
      #    status check (ruleset 19583754, "mingla-business jest (full suite)"),
      #    runs on every PR to main with NO paths filter, and executes the same
      #    file set: both resolve `mingla-business/jest.config.cjs` (this step
      #    passed no `--config`; that workflow runs `npm test` = `jest --ci`), so
      #    testMatch and testPathIgnorePatterns are identical. That workflow is
      #    also STRICTER — `--ci` fails on unwritten snapshots, which this step
      #    did not. It runs the suite in 179 s; `--runInBand` made this copy 2.4x
      #    slower for the same assertions.
      #
      #    On the lost `--runInBand` signal: serial ordering is not a gate any
      #    test here depends on. Both orderings are green today, and the files
      #    that ARE order-sensitive are handled explicitly and by name in the
      #    required workflow's "#1487 deterministic venue-first worker
      #    restoration" step, which pins its own sequencer. If a future test
      #    needs serial execution, it belongs in that step, not in a blanket
      #    second run of the whole suite from an unrelated issue's workflow.
      #
      # 2. `Expo web export` (MEASURED 69 s). Superseded by `web-build-check.yml`
      #    ("mingla-business: web build (expo export)"), which runs the same
      #    export on every PR to main with no paths filter and then does strictly
      #    MORE with the output: the ORCH-1083 initial-bundle budget guard and
      #    the ORCH-1137 lucide real-glyph render-proof. Both this job and that
      #    one are advisory, so deleting this copy removes nothing from the
      #    required-gate surface.
      #
      # What REMAINS in this job is what is actually about #1403: the pure
      # contracts, the native and web render contracts, the wiring gates, and
      # the typecheck delta. Those totalled 24 s of the 686 s this job used to
      # take. See issue #2148 for the full per-step measurement and for Stages 2
      # and 3 (the Postgres container consolidation and the per-issue batch).
      # ======================================================================
