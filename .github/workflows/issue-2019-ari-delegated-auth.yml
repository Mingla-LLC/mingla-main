name: Issue 2019 Ari delegated authorization

on:
  push:
    paths:
      - "supabase/functions/_shared/agentToolAuthorization.ts"
      - "supabase/functions/_shared/agentToolHelpers.ts"
      - "supabase/functions/_shared/agentTools.ts"
      - "supabase/functions/_shared/agentDomainTools.ts"
      - "supabase/functions/agent-chat/**"
      - "supabase/functions/agent-confirm-action/**"
      - "supabase/functions/_shared/__tests__/issue_2019_agent_authorization*"
      - ".github/scripts/strict-grep/issue-2019-ari-delegated-auth.mjs"
  pull_request:
    paths:
      - "supabase/functions/_shared/agentToolAuthorization.ts"
      - "supabase/functions/_shared/agentToolHelpers.ts"
      - "supabase/functions/_shared/agentTools.ts"
      - "supabase/functions/_shared/agentDomainTools.ts"
      - "supabase/functions/agent-chat/**"
      - "supabase/functions/agent-confirm-action/**"
      - "supabase/functions/_shared/__tests__/issue_2019_agent_authorization*"
      - ".github/scripts/strict-grep/issue-2019-ari-delegated-auth.mjs"

permissions:
  contents: read

jobs:
  delegated-authorization:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v1
        with:
          deno-version: "1.46.x"
      - run: deno test --allow-read supabase/functions/_shared/__tests__/issue_2019_agent_authorization.test.ts supabase/functions/_shared/__tests__/issue_2019_agent_authorization.tester-adversarial.test.ts
      - run: deno check supabase/functions/agent-chat/index.ts supabase/functions/agent-confirm-action/index.ts
      - run: node .github/scripts/strict-grep/issue-2019-ari-delegated-auth.mjs --self-test
      - run: node .github/scripts/strict-grep/issue-2019-ari-delegated-auth.mjs
