name: Issue 1857 phone-country authority

on:
  pull_request:
    paths:
      - "packages/card-identity/**"
      - "packages/phone-input/**"
      - "packages/offering-rendering/**"
      - "packages/brand-rendering/**"
      - "app-mobile/src/components/onboarding/PhoneInput.tsx"
      - "app-mobile/src/components/stay/ConsumerStayGuestExperience.tsx"
      - "app-mobile/src/components/expandedCard/VenueReserveSheet.tsx"
      - "app-mobile/src/screens/Event/ConsumerEventDetailScreen.tsx"
      - "app-mobile/src/services/rsvpDeckService.ts"
      - "app-mobile/src/services/venueReservationService.ts"
      - "mingla-business/src/components/event/**"
      - "mingla-business/src/components/stay/BuyerStayGuestExperience.tsx"
      - "mingla-business/src/components/venue/GuestVenueReservation.tsx"
      - "mingla-business/src/services/**"
      - "supabase/functions/public-submit-rsvp/**"
      - "supabase/functions/stay-reservations/**"
      - "supabase/functions/venue-reservation-create/**"
      - "supabase/migrations/20270325001857_issue_1857_phone_country_authority.sql"
      - "supabase/migrations/__tests__/issue_1857_phone_country_authority.pg17.test.sql"
      - "supabase/migrations/__tests__/issue_1773_preserves_1857_phone_authority.pg17.test.sql"
      - "docs/INVARIANT_REGISTRY.md"
      - ".github/scripts/strict-grep/issue-1857-phone-country-authority.mjs"
      - ".github/scripts/strict-grep/MANIFEST.json"
      - ".github/workflows/issue-1857-phone-country-authority-tests.yml"
  push:
    branches: [main]
    # #2885 AC-4 — the baseline recording auto-merges now (~15/day), so this
    # suite would re-run on main for a one-number JSON measurement. Same waste,
    # other side of the merge. Any other file in the push and this runs.
    paths-ignore:
      - "mingla-business/scripts/ci/bundle-baseline.json"

concurrency:
  group: ci-issue-1857-phone-country-authority-tests-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  issue-1857-phone-country-authority:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mingla-business/package-lock.json
      - name: Install pinned Business test dependencies
        working-directory: mingla-business
        run: npm ci
      - name: Strict structural gate and mutation self-test
        run: |
          node .github/scripts/strict-grep/issue-1857-phone-country-authority.mjs --self-test
          node .github/scripts/strict-grep/issue-1857-phone-country-authority.mjs
      - name: Canonical phone adapter
        run: |
          node --test packages/card-identity/__tests__/issue_1857_phone_country_authority.happy.test.mjs
          node --test packages/card-identity/__tests__/issue_1857_phone_country_authority.tester.adversarial.test.mjs
      - name: Shared, service, and Edge contracts
        run: |
          deno test --allow-read packages/offering-rendering/__tests__/issue_1857_rsvp_phone_country.happy.test.tsx
          deno test --allow-read packages/brand-rendering/__tests__/issue_1857_stay_phone_country.happy.test.tsx
          deno test --allow-read app-mobile/src/services/__tests__/issue_1857_phone_country_transport.happy.test.ts
          (cd mingla-business && npx --no-install jest src/services/__tests__/issue_1857_phone_country_transport.happy.test.ts src/components/event/__tests__/issue_1857_business_rsvp_preview_phone.happy.test.ts --runInBand)
          deno test --allow-read supabase/functions/public-submit-rsvp/issue_1857_phone_country.happy.test.ts
          deno test --allow-read supabase/functions/stay-reservations/issue_1857_phone_country.happy.test.ts
          deno test --allow-read supabase/functions/venue-reservation-create/issue_1857_phone_country.happy.test.ts
          deno test --allow-read supabase/functions/venue-reservation-create/issue_1857_phone_country.tester.adversarial.test.ts
      - name: PostgreSQL 17 migration contract is registered
        run: test -s supabase/migrations/__tests__/issue_1857_phone_country_authority.pg17.test.sql

  issue-1857-pg17:
    name: "#1857 fresh PostgreSQL 17 combined RSVP boundary"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: supabase/postgres:17.4.1.075
        env:
          POSTGRES_PASSWORD: ${{ format('issue-1857-ci-{0}', github.run_id) }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 30s
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PostgreSQL 17
        env:
          PGPASSWORD: ${{ format('issue-1857-ci-{0}', github.run_id) }}
        run: |
          for attempt in {1..90}; do
            if psql -h localhost -U postgres -d postgres -Atc \
              "SELECT to_regnamespace('vault') IS NOT NULL AND to_regrole('supabase_admin') IS NOT NULL" \
              2>/dev/null | grep -qx t; then
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Apply every migration in timestamp order
        env:
          PGPASSWORD: ${{ format('issue-1857-ci-{0}', github.run_id) }}
        run: |
          set -euo pipefail
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print0 \
            | sort -z \
            | while IFS= read -r -d '' migration; do
                if [[ "$(basename "$migration")" == "20270325001857_issue_1857_phone_country_authority.sql" ]]; then
                  psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c \
                    "DO \$\$ BEGIN IF to_regprocedure('public.pg_create_guest_reservation(uuid,timestamptz,integer,text,text,uuid,text,text,text,integer,character,text,text,text,text,text,text)') IS NULL THEN RAISE EXCEPTION 'issue_1857_old_guest_reservation_signature_missing_before_migration'; END IF; IF to_regprocedure('public.pg_create_guest_reservation(uuid,timestamptz,integer,text,text,uuid,text,text,text,integer,character,text,text,text,text,text,text,text)') IS NOT NULL THEN RAISE EXCEPTION 'issue_1857_new_guest_reservation_signature_exists_before_migration'; END IF; END \$\$;"
                fi
                psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f "$migration"
              done
      - name: Run #1857 PG17 postconditions and deliberate-drift proof
        env:
          PGPASSWORD: ${{ format('issue-1857-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1857_phone_country_authority.pg17.test.sql
      - name: Prove #1773 current writers preserve #1857 phone authority
        env:
          PGPASSWORD: ${{ format('issue-1857-ci-{0}', github.run_id) }}
        run: >-
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1
          -f supabase/migrations/__tests__/issue_1773_preserves_1857_phone_authority.pg17.test.sql
      - name: Re-run #1902 PG17 lifecycle proofs against the #1857 last writer
        env:
          PGPASSWORD: ${{ format('issue-1857-ci-{0}', github.run_id) }}
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1902_public_event_lifecycle.pg17.test.sql
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -f supabase/migrations/__tests__/issue_1902_public_event_lifecycle.pg17.tester_adversarial.test.sql
