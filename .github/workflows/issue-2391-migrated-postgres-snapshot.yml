name: Issue #2391 migrated PostgreSQL snapshot integrity

on:
  pull_request:
    paths:
      - ".github/actions/migrated-postgres/**"
      - ".github/workflows/issue-2391-migrated-postgres-snapshot.yml"
  workflow_dispatch:

concurrency:
  group: ci-issue-2391-migrated-postgres-snapshot-${{ (github.event_name == 'pull_request' || github.event_name == 'pull_request_target') && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}

jobs:
  snapshot-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Valid removal and corrupt restore regression proof
        run: >-
          node --test
          .github/actions/migrated-postgres/__tests__/issue_2391_policy_removal_snapshot.implementor.test.mjs
