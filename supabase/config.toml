[functions.ticketmaster-events]
verify_jwt = false

# ORCH-0824: server-side fan-out for consumer Discover (business events +
# Ticketmaster). Anon-callable; reads via service-role with explicit
# public-visibility WHERE clause as defense-in-depth.
[functions.discover-merged-events]
verify_jwt = false

# ORCH-0824: Google Places autocomplete + place-details proxy. Keeps the
# GOOGLE_MAPS_API_KEY server-side (not in the client bundle). Auth-gated
# because the wizard flow that calls this is already authenticated;
# anonymous traffic is not a legitimate use case.
[functions.places-autocomplete]
verify_jwt = true

# ORCH-0770: Cloudinary is a third-party webhook sender and cannot provide
# Supabase user JWTs. The gateway is public; the function authenticates
# requests with Cloudinary's signed notification headers.
[functions.event-cover-video-webhook]
verify_jwt = false

[functions.event-cover-pexels-search]
verify_jwt = true

# ORCH-0737 v2 patch (post-smoke 2026-05-06): wall-clock limit bump to 200s
# DEFERRED — `max_request_duration_seconds` is not recognised by the local
# supabase CLI version; removed 2026-05-06 to unblock ORCH-0734 deploy.
# Re-evaluate at ORCH-0737 CLOSE cycle: either upgrade CLI to a version that
# supports this key, OR set the timeout via the Deno function code, OR via
# request headers. Default 150s applies in the interim.
[functions.run-place-intelligence-trial]
verify_jwt = true

# ORCH-0777 live-fire 2026-05-11: Stripe webhooks have no Supabase JWT.
# Signature is verified inside the function via STRIPE_WEBHOOK_SECRET.
[functions.stripe-webhook]
verify_jwt = false

# Twilio status callback also third-party — function authenticates via
# TWILIO_STATUS_CALLBACK_SECRET query param.
[functions.twilio-message-status]
verify_jwt = false

# Buyer status endpoint serves anonymous buyers reading their own checkout
# session by buyerStatusToken; no Supabase JWT involved.
[functions.ticket-checkout-status]
verify_jwt = false

# ORCH-0852 — synchronous buyer-owned confirmation path. Anon-tolerant;
# access gated by buyerStatusToken hash match (NOT Supabase JWT). Verifies
# Stripe PaymentIntent status directly and idempotently invokes
# biz_ticket_checkout_finalize so the buyer never depends on Stripe
# webhook timing to see their order.
[functions.ticket-checkout-confirm]
verify_jwt = false
