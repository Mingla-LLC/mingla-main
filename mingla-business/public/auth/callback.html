<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <title>Signing in | Mingla Business</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f7f1ea;
        color: #201814;
      }

      * {
        box-sizing: border-box;
      }

      body {
        align-items: center;
        display: flex;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
        padding: 24px;
      }

      main {
        max-width: 360px;
        text-align: center;
      }

      img {
        height: 56px;
        margin-bottom: 28px;
        width: auto;
      }

      h1 {
        font-size: 22px;
        line-height: 1.2;
        margin: 0 0 10px;
      }

      p {
        color: #695e57;
        font-size: 15px;
        line-height: 1.45;
        margin: 0;
      }

      a {
        color: #b4542d;
        font-weight: 700;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          background: #130f0c;
          color: #f7f1ea;
        }

        p {
          color: #c7bbb2;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/mingla-business-logo.png" alt="Mingla Business" />
      <h1 id="title">Signing you in</h1>
      <p id="message">Finishing the secure handoff.</p>
      <!-- ORCH-1102 — no dead-ends: on the error / empty-session path this link
           is revealed so the user always has a one-tap way back to the real
           sign-in screen (in addition to the automatic redirect below). -->
      <p id="action" style="display: none; margin-top: 18px">
        <a id="retry" href="/">Back to sign in</a>
      </p>
    </main>
    <script>
      (function () {
        "use strict";

        var SUPABASE_URL = "https://gqnoajqerqhnvulmnyvv.supabase.co";
        var SUPABASE_ANON_KEY =
          "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdxbm9hanFlcnFobnZ1bG1ueXZ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc1MDUyNzIsImV4cCI6MjA3MzA4MTI3Mn0.p4yi9yD2RWfJ2HN4DD-dgrvXnyzhJi3g2YCouSK-hbo";
        var STORAGE_KEY = "sb-gqnoajqerqhnvulmnyvv-auth-token";

        var title = document.getElementById("title");
        var message = document.getElementById("message");
        var action = document.getElementById("action");

        function setStatus(nextTitle, nextMessage) {
          if (title) title.textContent = nextTitle;
          if (message) message.textContent = nextMessage;
        }

        // ORCH-1102 — never leave the user hanging on the callback page. When the
        // OAuth handoff errors or returns no session (e.g. the user cancelled in
        // the provider screen), reveal a "Back to sign in" link AND auto-redirect
        // to "/" (the real BusinessWelcomeScreen) after a brief moment so the
        // message is readable but no manual action is required.
        var REDIRECT_AFTER_ERROR_MS = 2500;
        function recoverToSignIn() {
          if (action) action.style.display = "block";
          window.setTimeout(function () {
            window.location.replace("/");
          }, REDIRECT_AFTER_ERROR_MS);
        }

        function parseParams(value) {
          var trimmed = value.replace(/^[?#]/, "");
          var params = new URLSearchParams(trimmed);
          var out = {};
          params.forEach(function (paramValue, key) {
            out[key] = paramValue;
          });
          return out;
        }

        function readCallbackParams() {
          return Object.assign(
            {},
            parseParams(window.location.search),
            parseParams(window.location.hash),
          );
        }

        function secondsNow() {
          return Math.round(Date.now() / 1000);
        }

        function buildUserFromJwt(accessToken) {
          try {
            var payload = accessToken.split(".")[1];
            var normalized = payload.replace(/-/g, "+").replace(/_/g, "/");
            var padded = normalized.padEnd(
              normalized.length + ((4 - (normalized.length % 4)) % 4),
              "=",
            );
            var decoded = JSON.parse(
              decodeURIComponent(
                Array.prototype.map
                  .call(atob(padded), function (char) {
                    return "%" + ("00" + char.charCodeAt(0).toString(16)).slice(-2);
                  })
                  .join(""),
              ),
            );

            return {
              id: decoded.sub,
              aud: decoded.aud,
              role: decoded.role,
              email: decoded.email,
              app_metadata: decoded.app_metadata || {},
              user_metadata: decoded.user_metadata || {},
              created_at: decoded.created_at || new Date().toISOString(),
            };
          } catch (_error) {
            return null;
          }
        }

        async function fetchSupabaseUser(accessToken) {
          var response = await fetch(SUPABASE_URL + "/auth/v1/user", {
            headers: {
              apikey: SUPABASE_ANON_KEY,
              Authorization: "Bearer " + accessToken,
            },
          });

          if (!response.ok) {
            throw new Error("Supabase user lookup failed: " + response.status);
          }

          return await response.json();
        }

        function persistSession(session) {
          window.localStorage.setItem(STORAGE_KEY, JSON.stringify(session));
          window.localStorage.removeItem(STORAGE_KEY + "-code-verifier");

          try {
            var channel = new BroadcastChannel(STORAGE_KEY);
            channel.postMessage({ event: "SIGNED_IN", session: session });
            channel.close();
          } catch (_error) {
            // BroadcastChannel is optional; the redirect reloads the app.
          }
        }

        async function run() {
          var params = readCallbackParams();

          if (params.error || params.error_description || params.error_code) {
            throw new Error(
              params.error_description || params.error || "The sign-in was cancelled.",
            );
          }

          var accessToken = params.access_token;
          var refreshToken = params.refresh_token;
          var tokenType = params.token_type || "bearer";
          var expiresIn = Number(params.expires_in || 3600);
          var expiresAt = Number(params.expires_at || secondsNow() + expiresIn);

          if (!accessToken || !refreshToken) {
            throw new Error("No sign-in session was returned.");
          }

          var user;
          try {
            user = await fetchSupabaseUser(accessToken);
          } catch (_error) {
            user = buildUserFromJwt(accessToken);
          }

          if (!user || !user.id) {
            throw new Error("The sign-in session could not be verified.");
          }

          persistSession({
            provider_token: params.provider_token,
            provider_refresh_token: params.provider_refresh_token,
            access_token: accessToken,
            refresh_token: refreshToken,
            expires_in: expiresIn,
            expires_at: expiresAt,
            token_type: tokenType,
            user: user,
          });

          window.history.replaceState(null, "", "/auth/callback");
          // ORCH-1098 Stage 3: the static /home safety page is gone — phones now
          // boot the real Expo app exactly like desktop (the BottomNav OOM is
          // fixed). After persisting the session, send EVERY device to "/" (the
          // real app), which client-side routes a signed-in user to the real
          // home. This static callback page solves a real OAuth/App-Links token
          // handoff issue, so it stays — only its post-handoff target simplifies.
          window.location.replace("/");
        }

        run().catch(function (error) {
          window.history.replaceState(null, "", "/auth/callback");
          setStatus(
            "Sign-in needs another try",
            (error && error.message ? error.message : "Something went wrong.") +
              " Taking you back to sign in…",
          );
          // ORCH-1102 — actionable recovery instead of a dead end.
          recoverToSignIn();
        });
      })();
    </script>
  </body>
</html>
