<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="robots" content="noindex,nofollow" />
    <title>Home | Mingla Business</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #0c0e12;
        color: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% -10%, rgba(235, 120, 37, 0.18), transparent 42%),
          #0c0e12;
      }

      main {
        margin: 0 auto;
        max-width: 520px;
        min-height: 100vh;
        padding: max(40px, env(safe-area-inset-top) + 24px) 20px
          max(96px, env(safe-area-inset-bottom) + 40px);
      }

      .brand-mark {
        display: block;
        height: 44px;
        margin-bottom: 28px;
        width: auto;
      }

      .eyebrow {
        color: #eb7825;
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
        margin: 0 0 8px;
        text-transform: uppercase;
      }

      h1 {
        font-size: 36px;
        line-height: 1.08;
        margin: 0;
      }

      .subhead {
        color: rgba(255, 255, 255, 0.66);
        font-size: 15px;
        font-weight: 600;
        line-height: 1.45;
        margin: 10px 0 0;
      }

      .panel {
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.11);
        border-radius: 18px;
        margin-top: 22px;
        padding: 18px;
      }

      .label {
        color: rgba(255, 255, 255, 0.52);
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0;
        margin: 0 0 6px;
        text-transform: uppercase;
      }

      .value {
        font-size: 20px;
        font-weight: 800;
        line-height: 1.25;
        margin: 0;
        overflow-wrap: anywhere;
      }

      .actions {
        display: grid;
        gap: 12px;
        margin-top: 18px;
      }

      a.action {
        align-items: center;
        border-radius: 16px;
        display: flex;
        justify-content: space-between;
        min-height: 76px;
        padding: 14px 18px;
        text-decoration: none;
      }

      .action.primary {
        background: #eb7825;
        border: 1px solid #f2a86c;
        color: #101014;
      }

      .action.secondary {
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.11);
        color: #ffffff;
      }

      .action strong,
      .action span {
        display: block;
      }

      .action strong {
        font-size: 17px;
        line-height: 1.25;
      }

      .action span {
        color: rgba(255, 255, 255, 0.58);
        font-size: 13px;
        font-weight: 700;
        line-height: 1.35;
        margin-top: 4px;
      }

      .action.primary span {
        color: rgba(16, 16, 20, 0.68);
      }

      .arrow {
        font-size: 32px;
        line-height: 1;
        padding-left: 16px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="brand-mark" src="/brand/mingla-business-logo.png" alt="Mingla Business" />
      <p class="eyebrow">Mingla Business</p>
      <h1>Home</h1>
      <p class="subhead" id="session-label">Signed in and ready.</p>

      <section class="panel" aria-label="Current status">
        <p class="label">Browser mode</p>
        <p class="value">Fast mobile home</p>
      </section>

      <nav class="actions" aria-label="Business actions">
        <a class="action primary" href="/event/create">
          <span>
            <strong>Create event</strong>
            <span>Start a new listing</span>
          </span>
          <span class="arrow">›</span>
        </a>
        <a class="action secondary" href="/hub/events">
          <span>
            <strong>Open Hub</strong>
            <span>Events, trips, and experiences</span>
          </span>
          <span class="arrow">›</span>
        </a>
        <a class="action secondary" href="/account">
          <span>
            <strong>Account</strong>
            <span>Brand and payment settings</span>
          </span>
          <span class="arrow">›</span>
        </a>
      </nav>
    </main>
    <script>
      (function () {
        "use strict";
        try {
          var raw = localStorage.getItem("sb-gqnoajqerqhnvulmnyvv-auth-token");
          if (!raw) return;
          var session = JSON.parse(raw);
          var email = session && session.user && session.user.email;
          if (email) {
            document.getElementById("session-label").textContent = email;
          }
        } catch (_error) {}
      })();
    </script>
  </body>
</html>
