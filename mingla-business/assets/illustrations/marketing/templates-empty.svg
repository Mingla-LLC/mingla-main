<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" role="img" aria-labelledby="templates-empty-title">
  <title id="templates-empty-title">A stack of three template cards with the top one slightly askew — couldn't load templates</title>

  <!-- ORCH-0891 §8 — Templates empty-state.
       Concept: stack of three template cards, top one tilted slightly to
       suggest a recoverable / soft error state. Primary stroke (top tilted
       card) in accent.warm to draw the eye; supporting strokes (lower two
       cards + faint content lines) in text.quaternary tint.
       Viewport 160x160 with 24pt internal padding. -->

  <!-- Bottom card (most subdued, deepest in stack) -->
  <rect x="40" y="92" width="80" height="40" rx="6"
        stroke="rgba(255,255,255,0.32)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Middle card (slightly less subdued, offset up + right) -->
  <rect x="36" y="76" width="80" height="40" rx="6"
        stroke="rgba(255,255,255,0.32)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Top card (tilted -6 degrees, primary stroke — accent.warm) -->
  <g transform="translate(32, 56) rotate(-6 40 20)">
    <rect x="0" y="0" width="80" height="40" rx="6"
          stroke="#eb7825" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Content lines inside top card: subject line + 2 body lines -->
    <line x1="10" y1="12" x2="44" y2="12" stroke="#eb7825" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="22" x2="60" y2="22" stroke="rgba(255,255,255,0.32)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="10" y1="28" x2="50" y2="28" stroke="rgba(255,255,255,0.32)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Subtle horizon / surface line under the stack -->
  <line x1="24" y1="138" x2="136" y2="138" stroke="rgba(255,255,255,0.32)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Small accent.warm sparkle indicating "soft / recoverable" rather than hard error -->
  <path d="M 124 28 L 124 38 M 119 33 L 129 33"
        stroke="#eb7825" stroke-width="1.5" stroke-linecap="round"/>
</svg>
