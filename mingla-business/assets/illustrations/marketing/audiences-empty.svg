<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" role="img" aria-labelledby="audiences-empty-title">
  <title id="audiences-empty-title">An empty mailbox with an envelope falling in — no buyers yet</title>

  <!-- ORCH-0891 §8 — Audiences empty-state.
       Concept: mailbox body + open lid + falling envelope. Primary strokes
       (mailbox + envelope outline) in accent.warm; supporting strokes (post
       + horizon line + envelope inner lines) in text.quaternary tint.
       All strokes use stroke-linecap=round + stroke-linejoin=round per
       Mingla illustration convention.
       Viewport 160x160 with 24pt internal padding (drawable area 24,24 → 136,136). -->

  <!-- Ground / horizon line (subdued) -->
  <line x1="24" y1="124" x2="136" y2="124" stroke="rgba(255,255,255,0.32)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Mailbox post (subdued) -->
  <line x1="80" y1="124" x2="80" y2="96" stroke="rgba(255,255,255,0.32)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Mailbox body — curved-top box; primary stroke -->
  <path d="M 48 96 L 48 76 Q 48 56 64 56 L 96 56 Q 112 56 112 76 L 112 96 Z"
        stroke="#eb7825" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Mailbox door hinge line — front-face vertical divider showing the door -->
  <line x1="64" y1="74" x2="64" y2="96" stroke="#eb7825" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Mailbox flag (raised — signals "delivery coming") -->
  <line x1="112" y1="72" x2="120" y2="72" stroke="#eb7825" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 120 72 L 120 64 L 128 64 L 128 80 L 120 80 Z"
        stroke="#eb7825" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Falling envelope (mid-flight above the mailbox) — primary stroke -->
  <g transform="translate(64, 24) rotate(-12 16 12)">
    <rect x="0" y="0" width="32" height="22" rx="2"
          stroke="#eb7825" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Envelope flap fold lines -->
    <path d="M 0 0 L 16 12 L 32 0" stroke="rgba(255,255,255,0.32)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
  </g>

  <!-- Motion trails behind the envelope (subdued) -->
  <line x1="62" y1="14" x2="58" y2="10" stroke="rgba(255,255,255,0.32)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="98" y1="14" x2="104" y2="10" stroke="rgba(255,255,255,0.32)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="6" x2="80" y2="2" stroke="rgba(255,255,255,0.32)" stroke-width="1.5" stroke-linecap="round"/>
</svg>
