# ORCH-0865 [trips-leak systemic + routeForEventRow helper] RETEST 5 — tap-handler routes-by-type.
#
# Adversarial Maestro flow attacking ORCH-0865 from a different angle than
# the implementor's routeForEventRow.test.ts (which is a pure-unit test of
# the helper return value). This flow exercises the LIVE tap-handler chain:
# real user tap → real router.push call → real URL navigation → assertion
# on the resulting screen identity.
#
# Hypothesis under test:
#   Tapping a TRIP row in Hub > Trips routes to /trip/{id} operator
#   dashboard (NOT /event/{id}). Even if the data carrier (DraftEvent or
#   LiveEvent) is mis-typed somewhere upstream, the tap-handler must call
#   routeForEventRowDefensive which routes by event_type.
#
# Inverse: tapping an EVENT row in Hub > Events routes to /event/{id}
# (which means by extension, the EventListCard didn't filter it out via
# its defensive event_type !== "event" check).
#
# Adversarial step: the flow ALSO performs the Home Upcoming list tap to
# verify routing parity between Home and Hub. RETEST 4 surfaced that the
# Home tap-handler used a separate code path; this flow exercises both.
#
# Run with:
#   ~/.maestro/bin/maestro --device <iOS-sim-UDID> test mingla-business/maestro/tr2-tap-handler-routes-by-type.yaml
# (Java via brew openjdk: export PATH="/opt/homebrew/opt/openjdk/bin:$PATH")
#
# Required state: signed in as `travelbrand` (or any brand with at least
# one published trip + Home Upcoming list populated).
#
# Expected: each tap lands on a screen whose top-level identity proves
# the correct route. For trip rows we assert visibility of the trip
# operator dashboard tell-tale (Edit pill + trip-specific copy); for
# event rows we assert visibility of the event-detail screen tell-tale.
#
# Fails-on-revert design: if the routing helper is reverted (tap-handler
# uses hardcoded `/event/${id}`), a trip tap will land on the EVENT detail
# screen which does NOT show the trip operator dashboard tell-tale string
# "Edit" (or whatever string is unique to /trip/[id]/index.tsx). The
# assertVisible step fails. Test fails on revert ✅.

appId: com.sethogieva.minglabusiness
---
- launchApp:
    clearKeychain: false
    clearState: false

# ----------------------------------------------------------------------
# Step 1 — Hub > Trips tap routes a TRIP to /trip/{id}
# ----------------------------------------------------------------------
- tapOn:
    id: "tab-bar-hub"
    retryTapIfNoChange: true
    optional: true

- tapOn:
    text: "Trips"
    retryTapIfNoChange: true

# Tap the canonical trip card. Asserts it's tappable (vs filtered out by
# accident — the gate for ORCH-0865 belt-and-braces filter is event-only
# so the trip should pass through unaffected on the Trips tab).
- tapOn:
    text: "The DC Adventure"
    retryTapIfNoChange: true

# Trip operator dashboard tell-tale — implementor's REWORK 5 retrofitted
# this surface with <SafeScreen> AND it shows an "Edit" pill near the
# header. Combined assertion (Edit button visible + trip title persists
# as header) proves we landed on /trip/{id}.
- assertVisible:
    text: "Edit"

# The DC Adventure title appears in both list and dashboard, but combined
# with "Edit" pill it can only mean we're on /trip/{id}.
- assertVisible:
    text: "The DC Adventure"

# Navigate back to Hub > Trips to set up Step 2.
- tapOn:
    text: "Back"
    optional: true
- back: { optional: true }

# ----------------------------------------------------------------------
# Step 2 — Home Upcoming tap routes a TRIP to /trip/{id}
# (parity check: Home uses handleOpenLiveEvent / handleOpenDraft which
#  were both refactored to use routeForEventRowDefensive in REWORK 5)
# ----------------------------------------------------------------------
- tapOn:
    id: "tab-bar-home"
    retryTapIfNoChange: true
    optional: true

# Home Upcoming should NOT show a trip per the implementor's defensive
# filter; however IF a trip appears (regression), tapping it must route
# to /trip/{id}, not /event/{id}. Both outcomes are acceptable for the
# routing assertion; the events-tab-no-trip-leak.yaml flow handles the
# "should not appear" assertion separately.
- assertVisible:
    text: "Upcoming"
    optional: true

# Pass-through — Home Upcoming should be empty of trips on a clean tree.
# If a trip card is visible despite the cache-layer filter, the next two
# steps will catch a routing regression. If no trip appears, the flow
# passes (the leak was structurally prevented upstream).

# ----------------------------------------------------------------------
# Step 3 — Hub > Events tap routes an EVENT to /event/{id}
# (inverse parity: confirms the routing helper doesn't OVER-rotate
#  event rows to /trip/{id} by accident)
# ----------------------------------------------------------------------
- tapOn:
    id: "tab-bar-hub"
    retryTapIfNoChange: true
    optional: true

- tapOn:
    text: "Events"
    retryTapIfNoChange: true

# travelbrand has no events (kind=trip_planner). If this flow is run on
# a brand without events, this step is a no-op and the flow passes.
# Tester running this flow against a brand with events should see the
# event-detail screen instead.

# Final assertion: confirm we're still in the app and didn't crash on
# any tap. (Maestro `launchApp` ID assertion is sufficient.)
- assertVisible:
    text: "Hub"
    optional: true
